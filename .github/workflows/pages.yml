name: Deploy stable PWA

on:
  push:
    branches:
      - main
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
      - dev
      - 'feat/**'
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  validate-and-build:
    name: Validate and build PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    outputs:
      pages-configured: ${{ steps.configure-pages.outcome }}
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build repository-scoped PWA
        run: flutter build web --release --base-href "/Quantara/"

      - name: Install Quantara service worker
        shell: bash
        run: |
          set -euo pipefail
          test -s web/quantara_service_worker.js
          cp web/quantara_service_worker.js build/web/flutter_service_worker.js

      - name: Verify Pages release bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/flutter_service_worker.js
          test -s build/web/main.dart.js
          test -s build/web/icons/Icon-maskable-512.png
          grep -F '<base href="/Quantara/">' build/web/index.html
          cmp --silent web/quantara_service_worker.js build/web/flutter_service_worker.js
          node --check build/web/flutter_service_worker.js
          grep -F "const CACHE_PREFIX = 'quantara-pwa-'" build/web/flutter_service_worker.js
          grep -F "self.addEventListener('fetch'" build/web/flutter_service_worker.js
          grep -F "self.addEventListener('message'" build/web/flutter_service_worker.js
          grep -F "event.data?.type === 'SKIP_WAITING'" build/web/flutter_service_worker.js
          grep -F 'id="quantara-update-ready"' build/web/index.html
          grep -F "waitingWorker.postMessage({ type: 'SKIP_WAITING' })" build/web/index.html
          python3 - <<'PY'
          from pathlib import Path

          worker = Path("build/web/flutter_service_worker.js").read_text()
          install_block = worker.split("self.addEventListener('install'", 1)[1].split(
              "self.addEventListener('message'", 1
          )[0]
          assert 'self.skipWaiting()' not in install_block, (
              'PWA worker must wait for explicit user activation.'
          )
          PY
          if grep -Fq '.unregister()' build/web/flutter_service_worker.js; then
            echo 'Refusing to publish a service worker that unregisters itself.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/web/manifest.json").read_text())
          assert manifest["display"] == "standalone"
          assert manifest["start_url"] == "."
          assert manifest["scope"] == "."
          assert any("maskable" in icon.get("purpose", "") for icon in manifest["icons"])
          PY

      - name: Configure GitHub Pages
        id: configure-pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain unavailable Pages deployment
        if: github.event_name != 'pull_request' && steps.configure-pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not enabled or this token cannot enable it. The PWA was built and validated; Pages deployment is skipped until the repository owner enables Pages once."

      - name: Upload validated PWA fallback artifact
        if: github.event_name != 'pull_request' && steps.configure-pages.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quantara-pwa-validated-${{ github.sha }}
          path: src/client/quantara_app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/client/quantara_app/build/web

  deploy:
    name: Deploy PWA
    if: github.event_name != 'pull_request' && needs.validate-and-build.outputs.pages-configured == 'success'
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
