name: Temporary issue 169 UI patch

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-issue-169-ui.yml
      - .github/scripts/apply_issue_169_ui.py
      - src/client/quantara_app/lib/features/auto_trade/application/local_live_diagnostic_bundle.dart
      - src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Apply deterministic UI patch
        run: python3 .github/scripts/apply_issue_169_ui.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_diagnostic_bundle.dart lib/features/auto_trade/application/local_live_trade_controller.dart lib/features/owner_alpha/presentation/owner_alpha_page.dart lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart test/local_live_diagnostic_bundle_test.dart test/local_live_issue_169_ui_source_test.dart

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze

      - name: Run issue 169 focused tests
        working-directory: src/client/quantara_app
        run: flutter test test/local_live_diagnostic_bundle_test.dart test/local_live_issue_169_ui_source_test.dart test/local_live_issue_169_core_test.dart test/local_live_multi_position_service_source_test.dart test/local_live_trade_models_test.dart

      - name: Commit UI implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/pubspec.yaml \
                  src/client/quantara_app/pubspec.lock \
                  src/client/quantara_app/lib/features/auto_trade/application/local_live_diagnostic_bundle.dart \
                  src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_controller.dart \
                  src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
                  src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
                  src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart \
                  src/client/quantara_app/test/local_live_diagnostic_bundle_test.dart \
                  src/client/quantara_app/test/local_live_issue_169_ui_source_test.dart
          git commit -m "feat: simplify Local Live settings and export diagnostics (#169)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
