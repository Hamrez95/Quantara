name: Trading Lab development check

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format and commit the final ZIP source
        shell: bash
        run: |
          set -euo pipefail
          dart format src/client/quantara_app/lib/features/trading_lab/application/trading_lab_zip_bundle.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            exit 0
          fi
          git add src/client/quantara_app/lib/features/trading_lab/application/trading_lab_zip_bundle.dart
          git commit -m 'style(lab): format bundle guard fix'
          git push origin HEAD:feat/176-bot-trading-lab
