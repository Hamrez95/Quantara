name: Trading Lab post-run source hardening

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: write

concurrency:
  group: trading-lab-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply and validate audited post-run patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD~3:.github/workflows/trading-lab-dev-check.yml > /tmp/post-run-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/post-run-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = []
          for line in source[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(code) + '\n'
          fragile = """if old not in broker:\n    raise SystemExit('candidate gate ordering anchor missing')\nbroker = broker.replace(old, new, 1)\nbroker_path.write_text(broker)\n"""
          resilient = """if old not in broker:\n    gate_start = broker.index(\"        if (idea.confidencePercent < run.manifest.minimumConfidencePercent) {\")\n    gate_end = broker.index(\"        final pending = TradingLabPendingCandidate(\", gate_start)\n    broker = broker[:gate_start] + new + \"\\n\" + broker[gate_end:]\nelse:\n    broker = broker.replace(old, new, 1)\nbroker_path.write_text(broker)\n"""
          if fragile not in script:
              raise SystemExit('candidate patch fallback anchor missing')
          script = script.replace(fragile, resilient, 1)
          Path('/tmp/apply_post_run.py').write_text(script)
          PY
          python3 /tmp/apply_post_run.py
          pushd src/client/quantara_app
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test test/trading_lab_paper_broker_test.dart --reporter compact
          flutter test test/trading_lab_zip_bundle_test.dart --reporter compact
          flutter test test/trading_lab_post_run_hardening_test.dart --reporter compact
          flutter test test/trading_lab_no_real_order_source_test.dart --reporter compact
          popd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          if git diff --cached --quiet; then
            echo 'No source changes generated.'
            exit 0
          fi
          git commit -m 'feat(lab): harden forward tests and export sanitized live evidence'
          git push origin HEAD:feat/176-bot-trading-lab
