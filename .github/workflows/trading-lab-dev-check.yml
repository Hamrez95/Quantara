name: Trading Lab development check

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keep Bot Lab out of top-level desktop navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          text = path.read_text()
          old = 'const _desktopDestinationIndexes = [0, 1, 2, 3, 4, 5, 6, 7];'
          new = 'const _desktopDestinationIndexes = [0, 1, 2, 3, 5, 6, 7];'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('desktop navigation anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart
          git commit -m 'fix(lab): keep Bot Lab as a secondary Home tool'
          git push origin HEAD:feat/176-bot-trading-lab
