name: Trading Lab final validation

# Final read-only validation for the RC3 Trading Lab candidate.
on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: read

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/client/quantara_app

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos

  test-shards:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Run test shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*_test.dart' | sort)
          selected=()
          for i in "${!tests[@]}"; do
            if (( i % 8 == ${{ matrix.shard }} )); then
              selected+=("${tests[$i]}")
            fi
          done
          if (( ${#selected[@]} == 0 )); then
            echo 'No tests assigned to this shard.'
            exit 0
          fi
          for test_file in "${selected[@]}"; do
            echo "=== $test_file ==="
            flutter test "$test_file" --reporter compact
          done

  build-debug-apk:
    needs: [static-checks, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantara-rc3-trading-lab-debug
          path: src/client/quantara_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
