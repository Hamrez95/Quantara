name: Trading Lab rc3 formatter

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: write

concurrency:
  group: trading-lab-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format exact rc3 files and commit
        shell: bash
        run: |
          set -euo pipefail
          cd src/client/quantara_app
          dart format \
            lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart \
            test/local_live_v1_0_1_source_test.dart \
            test/realtime_production_runtime_test.dart
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/client/quantara_app/lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart \
            src/client/quantara_app/test/local_live_v1_0_1_source_test.dart \
            src/client/quantara_app/test/realtime_production_runtime_test.dart
          if git diff --cached --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git commit -m 'style: format rc3 30m regression fixes'
          git push origin HEAD:feat/176-bot-trading-lab
