name: Trading Lab source upgrade

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Upgrade Trading Lab schema and controller contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          models = Path('src/client/quantara_app/lib/features/trading_lab/domain/trading_lab_models.dart')
          text = models.read_text()

          text = text.replace('const tradingLabSchemaVersion = 1;', 'const tradingLabSchemaVersion = 2;', 1)
          marker = 'enum TradingLabRunStatus { running, stopped }\n\n'
          addition = '''enum TradingLabRunStatus { running, stopped }\n\nenum TradingLabMarginMode { isolated }\n\nenum TradingLabExecutionModel { touch, conservativeCandlePath }\n\n'''
          if 'enum TradingLabExecutionModel' not in text:
              if marker not in text: raise SystemExit('run status marker missing')
              text = text.replace(marker, addition, 1)

          old = '''    this.feeRateBps = 6,\n    this.slippageBps = 2,\n    this.fundingRatePerEightHours = 0,\n    this.notes = '',\n'''
          new = '''    this.feeRateBps = 6,\n    this.slippageBps = 2,\n    this.fundingRatePerEightHours = 0,\n    this.spreadBps = 1,\n    this.portfolioRiskPercent = 3,\n    this.symbolHeatPercent = 1,\n    this.scannerIntervalSeconds = 15,\n    this.minimumConfidencePercent = 65,\n    this.minimumRiskReward = 1.5,\n    this.marginMode = TradingLabMarginMode.isolated,\n    this.executionModel = TradingLabExecutionModel.conservativeCandlePath,\n    this.experimentTag = '',\n    this.engineVersion = 'trading-lab-v2',\n    this.notes = '',\n'''
          if 'this.portfolioRiskPercent = 3' not in text:
              if old not in text: raise SystemExit('manifest constructor cost anchor missing')
              text = text.replace(old, new, 1)

          old = '''  final double feeRateBps;\n  final double slippageBps;\n  final double fundingRatePerEightHours;\n  final String notes;\n'''
          new = '''  final double feeRateBps;\n  final double slippageBps;\n  final double fundingRatePerEightHours;\n  final double spreadBps;\n  final double portfolioRiskPercent;\n  final double symbolHeatPercent;\n  final int scannerIntervalSeconds;\n  final int minimumConfidencePercent;\n  final double minimumRiskReward;\n  final TradingLabMarginMode marginMode;\n  final TradingLabExecutionModel executionModel;\n  final String experimentTag;\n  final String engineVersion;\n  final String notes;\n'''
          if 'final double portfolioRiskPercent;' not in text:
              if old not in text: raise SystemExit('manifest fields anchor missing')
              text = text.replace(old, new, 1)

          old = '''    if (!fundingRatePerEightHours.isFinite ||\n        fundingRatePerEightHours.abs() > 0.05) {\n      throw const FormatException(\n        'Trading Lab funding model is outside the supported range.',\n      );\n    }\n'''
          new = '''    if (!fundingRatePerEightHours.isFinite ||\n        fundingRatePerEightHours.abs() > 0.05) {\n      throw const FormatException(\n        'Trading Lab funding model is outside the supported range.',\n      );\n    }\n    if (!spreadBps.isFinite || spreadBps < 0 || spreadBps > 200) {\n      throw const FormatException('Trading Lab spread must be between 0 and 200 bps.');\n    }\n    if (!portfolioRiskPercent.isFinite ||\n        portfolioRiskPercent < 0.1 ||\n        portfolioRiskPercent > 10) {\n      throw const FormatException(\n        'Trading Lab portfolio risk budget must be between 0.1% and 10%.',\n      );\n    }\n    if (!symbolHeatPercent.isFinite ||\n        symbolHeatPercent < 0.05 ||\n        symbolHeatPercent > portfolioRiskPercent) {\n      throw const FormatException(\n        'Trading Lab symbol heat must be positive and not exceed portfolio risk.',\n      );\n    }\n    if (scannerIntervalSeconds < 5 || scannerIntervalSeconds > 300) {\n      throw const FormatException(\n        'Trading Lab scanner interval must be between 5 and 300 seconds.',\n      );\n    }\n    if (minimumConfidencePercent < 0 || minimumConfidencePercent > 100) {\n      throw const FormatException('Trading Lab confidence gate is invalid.');\n    }\n    if (!minimumRiskReward.isFinite ||\n        minimumRiskReward < 0 ||\n        minimumRiskReward > 20) {\n      throw const FormatException('Trading Lab RR gate is invalid.');\n    }\n    if (experimentTag.length > 80 || engineVersion.trim().isEmpty) {\n      throw const FormatException('Trading Lab experiment identity is invalid.');\n    }\n'''
          if 'Trading Lab symbol heat must be positive' not in text:
              if old not in text: raise SystemExit('manifest validation anchor missing')
              text = text.replace(old, new, 1)

          old = '''    'feeRateBps': feeRateBps,\n    'slippageBps': slippageBps,\n    'fundingRatePerEightHours': fundingRatePerEightHours,\n    'notes': notes,\n'''
          new = '''    'feeRateBps': feeRateBps,\n    'slippageBps': slippageBps,\n    'fundingRatePerEightHours': fundingRatePerEightHours,\n    'spreadBps': spreadBps,\n    'portfolioRiskPercent': portfolioRiskPercent,\n    'symbolHeatPercent': symbolHeatPercent,\n    'scannerIntervalSeconds': scannerIntervalSeconds,\n    'minimumConfidencePercent': minimumConfidencePercent,\n    'minimumRiskReward': minimumRiskReward,\n    'marginMode': marginMode.name,\n    'executionModel': executionModel.name,\n    'experimentTag': experimentTag,\n    'engineVersion': engineVersion,\n    'notes': notes,\n'''
          if "'portfolioRiskPercent': portfolioRiskPercent" not in text:
              if old not in text: raise SystemExit('manifest json anchor missing')
              text = text.replace(old, new, 1)

          old = '''        feeRateBps: _double(json['feeRateBps'], fallback: 6),\n        slippageBps: _double(json['slippageBps'], fallback: 2),\n        fundingRatePerEightHours: _double(json['fundingRatePerEightHours']),\n        notes: json['notes']?.toString() ?? '',\n'''
          new = '''        feeRateBps: _double(json['feeRateBps'], fallback: 6),\n        slippageBps: _double(json['slippageBps'], fallback: 2),\n        fundingRatePerEightHours: _double(json['fundingRatePerEightHours']),\n        spreadBps: _double(json['spreadBps'], fallback: 1),\n        portfolioRiskPercent: _double(json['portfolioRiskPercent'], fallback: 3),\n        symbolHeatPercent: _double(json['symbolHeatPercent'], fallback: 1),\n        scannerIntervalSeconds: _int(json['scannerIntervalSeconds'], fallback: 15),\n        minimumConfidencePercent: _int(json['minimumConfidencePercent'], fallback: 65),\n        minimumRiskReward: _double(json['minimumRiskReward'], fallback: 1.5),\n        marginMode: TradingLabMarginMode.values.firstWhere(\n          (item) => item.name == json['marginMode'],\n          orElse: () => TradingLabMarginMode.isolated,\n        ),\n        executionModel: TradingLabExecutionModel.values.firstWhere(\n          (item) => item.name == json['executionModel'],\n          orElse: () => TradingLabExecutionModel.conservativeCandlePath,\n        ),\n        experimentTag: json['experimentTag']?.toString() ?? '',\n        engineVersion: json['engineVersion']?.toString() ?? 'trading-lab-v2',\n        notes: json['notes']?.toString() ?? '',\n'''
          if 'scannerIntervalSeconds: _int' not in text:
              if old not in text: raise SystemExit('manifest decode anchor missing')
              text = text.replace(old, new, 1)

          old = '''    this.funding = 0,\n    this.slippageCost = 0,\n    this.maximumFavorablePrice,\n'''
          new = '''    this.funding = 0,\n    this.slippageCost = 0,\n    this.spreadCost = 0,\n    DateTime? lastFundingAccrualAtUtc,\n    this.maximumFavorablePrice,\n'''
          if 'this.spreadCost = 0' not in text:
              if old not in text: raise SystemExit('position constructor anchor missing')
              text = text.replace(old, new, 1)

          old = '''  }) : targets = List.unmodifiable(targets),\n       targetFractions = List.unmodifiable(targetFractions),\n       filledTargetIndexes = Set.of(filledTargetIndexes) {\n'''
          new = '''  }) : targets = List.unmodifiable(targets),\n       targetFractions = List.unmodifiable(targetFractions),\n       filledTargetIndexes = Set.of(filledTargetIndexes),\n       lastFundingAccrualAtUtc = lastFundingAccrualAtUtc ?? openedAtUtc {\n'''
          if 'lastFundingAccrualAtUtc = lastFundingAccrualAtUtc ?? openedAtUtc' not in text:
              if old not in text: raise SystemExit('position initializer anchor missing')
              text = text.replace(old, new, 1)

          old = '''    if (!openedAtUtc.isUtc ||\n        !lastEvaluatedCandleAtUtc.isUtc ||\n        (closedAtUtc != null && !closedAtUtc!.isUtc)) {\n'''
          new = '''    if (!openedAtUtc.isUtc ||\n        !lastEvaluatedCandleAtUtc.isUtc ||\n        !lastFundingAccrualAtUtc.isUtc ||\n        (closedAtUtc != null && !closedAtUtc!.isUtc)) {\n'''
          if '!lastFundingAccrualAtUtc.isUtc' not in text:
              if old not in text: raise SystemExit('position timestamp validation anchor missing')
              text = text.replace(old, new, 1)

          old = '''  double funding;\n  double slippageCost;\n  double? maximumFavorablePrice;\n'''
          new = '''  double funding;\n  double slippageCost;\n  double spreadCost;\n  DateTime lastFundingAccrualAtUtc;\n  double? maximumFavorablePrice;\n'''
          if 'double spreadCost;' not in text:
              if old not in text: raise SystemExit('position fields anchor missing')
              text = text.replace(old, new, 1)

          old = '''    'funding': funding,\n    'slippageCost': slippageCost,\n    'maximumFavorablePrice': maximumFavorablePrice,\n'''
          new = '''    'funding': funding,\n    'slippageCost': slippageCost,\n    'spreadCost': spreadCost,\n    'lastFundingAccrualAtUtc': lastFundingAccrualAtUtc.toIso8601String(),\n    'maximumFavorablePrice': maximumFavorablePrice,\n'''
          if "'spreadCost': spreadCost" not in text:
              if old not in text: raise SystemExit('position json anchor missing')
              text = text.replace(old, new, 1)

          old = '''        funding: _double(json['funding']),\n        slippageCost: _double(json['slippageCost']),\n        maximumFavorablePrice: _nullableDouble(json['maximumFavorablePrice']),\n'''
          new = '''        funding: _double(json['funding']),\n        slippageCost: _double(json['slippageCost']),\n        spreadCost: _double(json['spreadCost']),\n        lastFundingAccrualAtUtc:\n            _nullableDate(json['lastFundingAccrualAtUtc']) ??\n            _date(json['openedAtUtc']),\n        maximumFavorablePrice: _nullableDouble(json['maximumFavorablePrice']),\n'''
          if 'lastFundingAccrualAtUtc:' not in text.split('factory TradingLabPosition.fromJson', 1)[1]:
              if old not in text: raise SystemExit('position decode anchor missing')
              text = text.replace(old, new, 1)

          models.write_text(text)

          controller = Path('src/client/quantara_app/lib/features/trading_lab/application/trading_lab_controller.dart')
          text = controller.read_text()
          old = '''    double feeRateBps = 6,\n    double slippageBps = 2,\n    double fundingRatePerEightHours = 0,\n    String notes = '',\n'''
          new = '''    double feeRateBps = 6,\n    double slippageBps = 2,\n    double fundingRatePerEightHours = 0,\n    double spreadBps = 1,\n    double portfolioRiskPercent = 3,\n    double symbolHeatPercent = 1,\n    int scannerIntervalSeconds = 15,\n    int minimumConfidencePercent = 65,\n    double minimumRiskReward = 1.5,\n    TradingLabMarginMode marginMode = TradingLabMarginMode.isolated,\n    TradingLabExecutionModel executionModel =\n        TradingLabExecutionModel.conservativeCandlePath,\n    String experimentTag = '',\n    String notes = '',\n'''
          if 'double portfolioRiskPercent = 3' not in text:
              if old not in text: raise SystemExit('controller start args anchor missing')
              text = text.replace(old, new, 1)

          old = '''        feeRateBps: feeRateBps,\n        slippageBps: slippageBps,\n        fundingRatePerEightHours: fundingRatePerEightHours,\n        notes: notes,\n'''
          new = '''        feeRateBps: feeRateBps,\n        slippageBps: slippageBps,\n        fundingRatePerEightHours: fundingRatePerEightHours,\n        spreadBps: spreadBps,\n        portfolioRiskPercent: portfolioRiskPercent,\n        symbolHeatPercent: symbolHeatPercent,\n        scannerIntervalSeconds: scannerIntervalSeconds,\n        minimumConfidencePercent: minimumConfidencePercent,\n        minimumRiskReward: minimumRiskReward,\n        marginMode: marginMode,\n        executionModel: executionModel,\n        experimentTag: experimentTag,\n        notes: notes,\n'''
          if 'portfolioRiskPercent: portfolioRiskPercent' not in text:
              if old not in text: raise SystemExit('controller manifest anchor missing')
              text = text.replace(old, new, 1)
          controller.write_text(text)
          PY

          dart format src/client/quantara_app/lib/features/trading_lab/domain/trading_lab_models.dart \
            src/client/quantara_app/lib/features/trading_lab/application/trading_lab_controller.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/trading_lab/domain/trading_lab_models.dart \
            src/client/quantara_app/lib/features/trading_lab/application/trading_lab_controller.dart
          git commit -m 'feat(lab): add reproducible advanced experiment manifest'
          git push origin HEAD:feat/176-bot-trading-lab
