name: Trading Lab development check

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: read

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Diagnose first failing test file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "::group::TEST_FILE ${test_file}"
            if ! flutter test "${test_file}" --reporter compact; then
              echo "FIRST_FAILING_TEST_FILE=${test_file}"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done < <(find test -type f -name '*_test.dart' | sort)

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantara-bot-trading-lab-debug
          path: src/client/quantara_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
