name: Trading Lab final validation

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: read

concurrency:
  group: trading-lab-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos

  test-shards:
    needs: static-checks
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Run test shard ${{ matrix.shard }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          set -euo pipefail
          index=0
          selected=0
          while IFS= read -r test_file; do
            if (( index % SHARD_COUNT == SHARD )); then
              selected=$((selected + 1))
              echo "::group::TEST_FILE ${test_file}"
              if ! flutter test "${test_file}" --reporter compact; then
                echo "FIRST_FAILING_TEST_FILE=${test_file}"
                echo "FAILED_SHARD=${SHARD}"
                echo "::endgroup::"
                exit 1
              fi
              echo "::endgroup::"
            fi
            index=$((index + 1))
          done < <(find test -type f -name '*_test.dart' | sort)
          echo "SHARD_${SHARD}_FILES_PASSED=${selected}"

  build-debug-apk:
    needs: [static-checks, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantara-bot-trading-lab-final-debug
          path: src/client/quantara_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
