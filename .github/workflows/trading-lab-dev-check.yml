name: Trading Lab development check

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix non-const StateError guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/trading_lab/application/trading_lab_zip_bundle.dart')
          text = path.read_text()
          old = """      throw const StateError(\n        'Trading Lab evidence bundle contract is incomplete.',\n      );\n"""
          new = """      throw StateError(\n        'Trading Lab evidence bundle contract is incomplete.',\n      );\n"""
          if old not in text:
              raise SystemExit('StateError guard anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/trading_lab/application/trading_lab_zip_bundle.dart
          git commit -m 'fix(lab): use non-const StateError for bundle guard'
          git push origin HEAD:feat/176-bot-trading-lab
