name: Trading Lab development check

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: read

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run widget and safety tests
        run: flutter test --reporter expanded
