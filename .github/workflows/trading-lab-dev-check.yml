name: Trading Lab rc3 source repair

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: write

concurrency:
  group: trading-lab-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore intact files and apply minimal 30m delta
        shell: bash
        run: |
          set -euo pipefail
          GOOD=bb67a32ecc6a6e6ef9359c641702d6c086bccb02
          git cat-file -e "$GOOD^{commit}"
          git show "$GOOD":src/client/quantara_app/lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart > /tmp/repository.dart
          git show "$GOOD":src/client/quantara_app/test/realtime_production_runtime_test.dart > /tmp/runtime_test.dart
          cp /tmp/repository.dart src/client/quantara_app/lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart
          cp /tmp/runtime_test.dart src/client/quantara_app/test/realtime_production_runtime_test.dart
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('src/client/quantara_app/lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart')
          text = repo.read_text()
          old = "      '15m' => const Duration(minutes: 15),\n      '1h' => const Duration(hours: 1),"
          new = "      '15m' => const Duration(minutes: 15),\n      '30m' => const Duration(minutes: 30),\n      '1h' => const Duration(hours: 1),"
          if old not in text:
              raise SystemExit('repository duration anchor missing')
          repo.write_text(text.replace(old, new, 1))

          test = Path('src/client/quantara_app/test/realtime_production_runtime_test.dart')
          text = test.read_text()
          replacements = [
              ("settings produce a bounded four-timeframe public universe", "settings produce a bounded five-timeframe public universe"),
              ("expect(universe.streams, hasLength(8));", "expect(universe.streams, hasLength(10));"),
              ("{'5m', '15m', '1h', '4h'}", "{'5m', '15m', '30m', '1h', '4h'}"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'runtime test anchor missing: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          cd src/client/quantara_app
          flutter pub get
          dart format \
            lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart \
            test/realtime_production_runtime_test.dart
          flutter analyze --fatal-infos
          flutter test test/owner_alpha_repository_test.dart --reporter compact
          flutter test test/realtime_production_runtime_test.dart --reporter compact
          flutter test test/local_live_v1_0_1_source_test.dart --reporter compact
          flutter test test/release_1_2_0_rc_3_source_test.dart --reporter compact
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/client/quantara_app/lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart \
            src/client/quantara_app/test/realtime_production_runtime_test.dart
          git commit -m 'fix(rc3): restore intact market runtime with 30m support'
          git push origin HEAD:feat/176-bot-trading-lab
