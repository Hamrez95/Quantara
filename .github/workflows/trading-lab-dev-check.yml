name: Trading Lab final source fix

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          metrics = Path('src/client/quantara_app/lib/features/trading_lab/application/trading_lab_metrics.dart')
          text = metrics.read_text()
          old = """    if ((position.closeReason ?? '').toLowerCase().contains('stop'))\n      stopOuts += 1;\n"""
          new = """    if ((position.closeReason ?? '').toLowerCase().contains('stop')) {\n      stopOuts += 1;\n    }\n"""
          if old not in text:
              raise SystemExit('metrics analyzer anchor missing')
          metrics.write_text(text.replace(old, new, 1))

          models = Path('src/client/quantara_app/lib/features/trading_lab/domain/trading_lab_models.dart')
          text = models.read_text()
          old = """        !lastEvaluatedCandleAtUtc.isUtc ||\n        !lastFundingAccrualAtUtc.isUtc ||\n"""
          new = """        !lastEvaluatedCandleAtUtc.isUtc ||\n        !this.lastFundingAccrualAtUtc.isUtc ||\n"""
          if old not in text:
              raise SystemExit('funding timestamp analyzer anchor missing')
          models.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/trading_lab/application/trading_lab_metrics.dart \
            src/client/quantara_app/lib/features/trading_lab/domain/trading_lab_models.dart
          git commit -m 'fix(lab): resolve final analyzer issues'
          git push origin HEAD:feat/176-bot-trading-lab
