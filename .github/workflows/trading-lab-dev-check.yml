name: Trading Lab post-run hardening

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: write

concurrency:
  group: trading-lab-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply audited post-run patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('src/client/quantara_app')

          def replace(path, old, new, count=1):
              p = ROOT / path
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'anchor missing in {path}: expected {count}, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # ------------------------------------------------------------------
          # 30m is a first-class production market timeframe.
          # ------------------------------------------------------------------
          replace(
              'lib/features/owner_alpha/domain/bitunix_public_stream_models.dart',
              "  fifteenMinutes('15m', 'market_kline_15min', Duration(minutes: 15)),\n  oneHour('1h', 'market_kline_60min', Duration(hours: 1)),",
              "  fifteenMinutes('15m', 'market_kline_15min', Duration(minutes: 15)),\n  thirtyMinutes('30m', 'market_kline_30min', Duration(minutes: 30)),\n  oneHour('1h', 'market_kline_60min', Duration(hours: 1)),",
          )
          replace(
              'lib/features/owner_alpha/application/owner_alpha_controller.dart',
              "static const timeframes = ['5m', '15m', '1h', '4h', '1D'];",
              "static const timeframes = ['5m', '15m', '30m', '1h', '4h', '1D'];",
          )
          replace(
              'lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart',
              "static const supportedTimeframes = ['5m', '15m', '1h', '4h', '1D'];\n  static const opportunityTimeframes = ['5m', '15m', '1h', '4h'];",
              "static const supportedTimeframes = ['5m', '15m', '30m', '1h', '4h', '1D'];\n  static const opportunityTimeframes = ['5m', '15m', '30m', '1h', '4h'];",
          )
          replace(
              'lib/features/owner_alpha/data/bitunix_owner_alpha_repository.dart',
              "            analyses['1h'] ??\n            analyses['15m'] ??\n            analyses['5m'] ??",
              "            analyses['1h'] ??\n            analyses['30m'] ??\n            analyses['15m'] ??\n            analyses['5m'] ??",
          )
          replace(
              'lib/features/owner_alpha/data/realtime_production_runtime.dart',
              "    BitunixKlineInterval.fifteenMinutes,\n    BitunixKlineInterval.oneHour,",
              "    BitunixKlineInterval.fifteenMinutes,\n    BitunixKlineInterval.thirtyMinutes,\n    BitunixKlineInterval.oneHour,",
          )

          # ------------------------------------------------------------------
          # Trading Lab manifest v3 adds a configurable execution-cost/risk gate.
          # ------------------------------------------------------------------
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              'const tradingLabSchemaVersion = 2;',
              'const tradingLabSchemaVersion = 3;',
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "    this.minimumRiskReward = 1.5,\n    this.marginMode = TradingLabMarginMode.isolated,",
              "    this.minimumRiskReward = 1.5,\n    this.maxEstimatedCostToRiskPercent = 25,\n    this.marginMode = TradingLabMarginMode.isolated,",
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "    this.engineVersion = 'trading-lab-v2',",
              "    this.engineVersion = 'trading-lab-v3',",
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "  final double minimumRiskReward;\n  final TradingLabMarginMode marginMode;",
              "  final double minimumRiskReward;\n  final double maxEstimatedCostToRiskPercent;\n  final TradingLabMarginMode marginMode;",
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "    if (!minimumRiskReward.isFinite ||\n        minimumRiskReward < 0 ||\n        minimumRiskReward > 20) {\n      throw const FormatException('Trading Lab RR gate is invalid.');\n    }",
              "    if (!minimumRiskReward.isFinite ||\n        minimumRiskReward < 0 ||\n        minimumRiskReward > 20) {\n      throw const FormatException('Trading Lab RR gate is invalid.');\n    }\n    if (!maxEstimatedCostToRiskPercent.isFinite ||\n        maxEstimatedCostToRiskPercent < 0 ||\n        maxEstimatedCostToRiskPercent > 200) {\n      throw const FormatException(\n        'Trading Lab execution cost/risk gate must be between 0% and 200%.',\n      );\n    }",
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "    'minimumRiskReward': minimumRiskReward,\n    'marginMode': marginMode.name,",
              "    'minimumRiskReward': minimumRiskReward,\n    'maxEstimatedCostToRiskPercent': maxEstimatedCostToRiskPercent,\n    'marginMode': marginMode.name,",
          )
          replace(
              'lib/features/trading_lab/domain/trading_lab_models.dart',
              "    minimumRiskReward: _double(json['minimumRiskReward'], fallback: 1.5),\n    marginMode:",
              "    minimumRiskReward: _double(json['minimumRiskReward'], fallback: 1.5),\n    maxEstimatedCostToRiskPercent: _double(\n      json['maxEstimatedCostToRiskPercent'],\n      fallback: 25,\n    ),\n    marginMode:",
          )

          # ------------------------------------------------------------------
          # Sanitized real-account evidence: never persist exchange identifiers.
          # ------------------------------------------------------------------
          real_evidence = r'''final class TradingLabRealAccountTradeEvidence {
            TradingLabRealAccountTradeEvidence({
              required this.symbol,
              required this.side,
              required this.state,
              required this.quantity,
              required this.averageEntryPrice,
              required this.averageExitPrice,
              required this.realizedGrossPnl,
              required this.fees,
              required this.funding,
              required this.netRealizedPnl,
              required this.unrealizedPnl,
              required this.openedAtUtc,
              required this.closedAtUtc,
              required this.asOfUtc,
              required this.verified,
            }) {
              if (symbol.trim().isEmpty || !asOfUtc.isUtc) {
                throw const FormatException('Invalid sanitized real-account trade evidence.');
              }
              if (openedAtUtc != null && !openedAtUtc!.isUtc ||
                  closedAtUtc != null && !closedAtUtc!.isUtc ||
                  openedAtUtc != null &&
                      closedAtUtc != null &&
                      closedAtUtc!.isBefore(openedAtUtc!)) {
                throw const FormatException('Invalid sanitized real-account trade chronology.');
              }
            }

            final String symbol;
            final String side;
            final String state;
            final double quantity;
            final double? averageEntryPrice;
            final double? averageExitPrice;
            final double? realizedGrossPnl;
            final double? fees;
            final double? funding;
            final double? netRealizedPnl;
            final double? unrealizedPnl;
            final DateTime? openedAtUtc;
            final DateTime? closedAtUtc;
            final DateTime asOfUtc;
            final bool verified;

            Map<String, Object?> toJson() => {
              'symbol': symbol,
              'side': side,
              'state': state,
              'quantity': quantity,
              'averageEntryPrice': averageEntryPrice,
              'averageExitPrice': averageExitPrice,
              'realizedGrossPnl': realizedGrossPnl,
              'fees': fees,
              'funding': funding,
              'netRealizedPnl': netRealizedPnl,
              'unrealizedPnl': unrealizedPnl,
              'openedAtUtc': openedAtUtc?.toIso8601String(),
              'closedAtUtc': closedAtUtc?.toIso8601String(),
              'asOfUtc': asOfUtc.toIso8601String(),
              'verified': verified,
            };
          }

          final class TradingLabRealAccountEvidence {
            TradingLabRealAccountEvidence({
              required this.currency,
              required this.asOfUtc,
              required this.verified,
              required this.fillsAvailable,
              required this.settlementsAvailable,
              required this.accountUnrealizedPnl,
              required this.accountRealizedGrossPnl,
              required this.accountFees,
              required this.accountFunding,
              required this.accountNetRealizedPnl,
              required this.sourceWarningPresent,
              Iterable<TradingLabRealAccountTradeEvidence> trades = const [],
            }) : trades = List.unmodifiable(trades) {
              if (currency.trim().isEmpty || !asOfUtc.isUtc) {
                throw const FormatException('Invalid sanitized real-account evidence.');
              }
            }

            factory TradingLabRealAccountEvidence.unavailable({DateTime? asOfUtc}) =>
                TradingLabRealAccountEvidence(
                  currency: 'USDT',
                  asOfUtc: (asOfUtc ?? DateTime.now()).toUtc(),
                  verified: false,
                  fillsAvailable: false,
                  settlementsAvailable: false,
                  accountUnrealizedPnl: null,
                  accountRealizedGrossPnl: null,
                  accountFees: null,
                  accountFunding: null,
                  accountNetRealizedPnl: null,
                  sourceWarningPresent: false,
                );

            final String currency;
            final DateTime asOfUtc;
            final bool verified;
            final bool fillsAvailable;
            final bool settlementsAvailable;
            final double? accountUnrealizedPnl;
            final double? accountRealizedGrossPnl;
            final double? accountFees;
            final double? accountFunding;
            final double? accountNetRealizedPnl;
            final bool sourceWarningPresent;
            final List<TradingLabRealAccountTradeEvidence> trades;

            Map<String, Object?> toJson() => {
              'schema': 'quantara.trading_lab.real_account_evidence.v1',
              'sanitized': true,
              'containsExchangeIdentifiers': false,
              'currency': currency,
              'asOfUtc': asOfUtc.toIso8601String(),
              'verified': verified,
              'fillsAvailable': fillsAvailable,
              'settlementsAvailable': settlementsAvailable,
              'accountUnrealizedPnl': accountUnrealizedPnl,
              'accountRealizedGrossPnl': accountRealizedGrossPnl,
              'accountFees': accountFees,
              'accountFunding': accountFunding,
              'accountNetRealizedPnl': accountNetRealizedPnl,
              'sourceWarningPresent': sourceWarningPresent,
              'tradeCount': trades.length,
            };
          }
          '''
          (ROOT / 'lib/features/trading_lab/domain/trading_lab_real_account_evidence.dart').write_text(real_evidence)

          benchmark = r'''import 'trading_lab_metrics.dart';
          import '../domain/trading_lab_models.dart';

          Map<String, Object?> buildTradingLabBenchmarkMatrix(
            Iterable<TradingLabRun> sourceRuns, {
            DateTime? generatedAtUtc,
          }) {
            final byId = <String, TradingLabRun>{
              for (final run in sourceRuns) run.manifest.runId: run,
            };
            final runs = byId.values.toList(growable: false)
              ..sort((a, b) => a.manifest.startedAtUtc.compareTo(b.manifest.startedAtUtc));
            final groups = <String, List<TradingLabPosition>>{};
            final groupRuns = <String, Set<String>>{};
            for (final run in runs) {
              for (final position in run.closedPositions) {
                final key = '${position.strategy}@${position.strategyVersion}|${position.timeframe}';
                (groups[key] ??= <TradingLabPosition>[]).add(position);
                (groupRuns[key] ??= <String>{}).add(run.manifest.runId);
              }
            }

            final strategyTimeframe = <Map<String, Object?>>[];
            for (final entry in groups.entries) {
              final parts = entry.key.split('|');
              final trades = entry.value;
              final pnls = trades.map((item) => item.netRealizedPnl).toList(growable: false);
              final rs = trades.map((item) => item.realizedR).toList(growable: false);
              final wins = pnls.where((value) => value > 1e-9).length;
              final losses = pnls.where((value) => value < -1e-9).length;
              final grossProfit = pnls
                  .where((value) => value > 0)
                  .fold<double>(0, (sum, value) => sum + value);
              final grossLoss = pnls
                  .where((value) => value < 0)
                  .fold<double>(0, (sum, value) => sum + value.abs());
              final averageR = rs.isEmpty
                  ? 0.0
                  : rs.fold<double>(0, (sum, value) => sum + value) / rs.length;
              strategyTimeframe.add({
                'strategyVersion': parts[0],
                'timeframe': parts[1],
                'sampleSize': trades.length,
                'wins': wins,
                'losses': losses,
                'breakevens': trades.length - wins - losses,
                'winRatePercent': trades.isEmpty ? 0 : wins / trades.length * 100,
                'netPnl': pnls.fold<double>(0, (sum, value) => sum + value),
                'averageR': averageR,
                'profitFactor': grossLoss <= 1e-9
                    ? (grossProfit > 1e-9 ? null : null)
                    : grossProfit / grossLoss,
                'runCount': groupRuns[entry.key]?.length ?? 0,
                'evidenceTier': trades.length >= 30 ? 'decision_eligible' : 'insufficient_sample',
              });
            }
            strategyTimeframe.sort((a, b) {
              final sample = (b['sampleSize'] as int).compareTo(a['sampleSize'] as int);
              if (sample != 0) return sample;
              return (b['averageR'] as double).compareTo(a['averageR'] as double);
            });

            final runConfigurations = <Map<String, Object?>>[
              for (final run in runs)
                {
                  'runId': run.manifest.runId,
                  'experimentTag': run.manifest.experimentTag,
                  'startedAtUtc': run.manifest.startedAtUtc.toIso8601String(),
                  'startingEquity': run.manifest.startingEquity,
                  'riskPercent': run.manifest.riskPercent,
                  'maximumConcurrentPositions': run.manifest.maximumConcurrentPositions,
                  'leverage': run.manifest.leverage,
                  'timeframes': run.manifest.timeframes,
                  'strategies': run.manifest.strategies,
                  'minimumConfidencePercent': run.manifest.minimumConfidencePercent,
                  'minimumRiskReward': run.manifest.minimumRiskReward,
                  'maxEstimatedCostToRiskPercent': run.manifest.maxEstimatedCostToRiskPercent,
                  'feeRateBps': run.manifest.feeRateBps,
                  'slippageBps': run.manifest.slippageBps,
                  'spreadBps': run.manifest.spreadBps,
                  'metrics': calculateTradingLabMetrics(run).toJson(),
                },
            ];
            final eligible = strategyTimeframe
                .where((row) => row['evidenceTier'] == 'decision_eligible')
                .toList(growable: false)
              ..sort((a, b) => (b['averageR'] as double).compareTo(a['averageR'] as double));

            return {
              'schema': 'quantara.trading_lab.benchmark.v1',
              'generatedAtUtc': (generatedAtUtc ?? DateTime.now()).toUtc().toIso8601String(),
              'targetTimeframes': const ['5m', '15m', '30m', '1h'],
              'runCount': runs.length,
              'runConfigurations': runConfigurations,
              'strategyTimeframeMatrix': strategyTimeframe,
              'rankingStatus': eligible.isEmpty ? 'insufficient_evidence' : 'decision_eligible',
              'rankedEligibleStrategyTimeframes': eligible,
              'minimumClosedTradesForRanking': 30,
            };
          }
          '''
          (ROOT / 'lib/features/trading_lab/application/trading_lab_benchmark.dart').write_text(benchmark)

          # ------------------------------------------------------------------
          # Controller: fixed benchmark universe and sanitized account provider.
          # ------------------------------------------------------------------
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "import '../domain/trading_lab_account_context.dart';\nimport '../domain/trading_lab_models.dart';",
              "import '../domain/trading_lab_account_context.dart';\nimport '../domain/trading_lab_models.dart';\nimport '../domain/trading_lab_real_account_evidence.dart';\nimport 'trading_lab_benchmark.dart';",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "    TradingLabAccountContext Function()? accountContextProvider,\n  }) => TradingLabController._(\n    marketController,\n    store,\n    broker,\n    accountContextProvider,\n  );",
              "    TradingLabAccountContext Function()? accountContextProvider,\n    TradingLabRealAccountEvidence Function()? realAccountEvidenceProvider,\n  }) => TradingLabController._(\n    marketController,\n    store,\n    broker,\n    accountContextProvider,\n    realAccountEvidenceProvider,\n  );",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "    this._broker,\n    this._accountContextProvider,\n  );",
              "    this._broker,\n    this._accountContextProvider,\n    this._realAccountEvidenceProvider,\n  );",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "  final TradingLabAccountContext Function()? _accountContextProvider;",
              "  final TradingLabAccountContext Function()? _accountContextProvider;\n  final TradingLabRealAccountEvidence Function()? _realAccountEvidenceProvider;",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "  TradingLabAccountContext get accountContext =>\n      _accountContextProvider?.call() ??\n      TradingLabAccountContext.disconnected();",
              "  TradingLabAccountContext get accountContext =>\n      _accountContextProvider?.call() ??\n      TradingLabAccountContext.disconnected();\n  TradingLabRealAccountEvidence get realAccountEvidence =>\n      _realAccountEvidenceProvider?.call() ??\n      TradingLabRealAccountEvidence.unavailable();",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "    double minimumRiskReward = 1.5,\n    TradingLabMarginMode marginMode =",
              "    double minimumRiskReward = 1.5,\n    double maxEstimatedCostToRiskPercent = 25,\n    TradingLabMarginMode marginMode =",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "        timeframes: OwnerAlphaController.timeframes.where(\n          (item) => item != '1D',\n        ),",
              "        timeframes: const ['5m', '15m', '30m', '1h'],",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "        minimumRiskReward: minimumRiskReward,\n        marginMode: marginMode,",
              "        minimumRiskReward: minimumRiskReward,\n        maxEstimatedCostToRiskPercent: maxEstimatedCostToRiskPercent,\n        marginMode: marginMode,",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_controller.dart',
              "      accountContext: context,\n    );",
              "      accountContext: context,\n      realAccountEvidence: realAccountEvidence,\n      benchmarkMatrix: buildTradingLabBenchmarkMatrix(<TradingLabRun>[\n        ..._history,\n        current,\n      ]),\n    );",
          )

          # ------------------------------------------------------------------
          # Owner page maps authoritative PnL to a sanitized identifier-free seam.
          # ------------------------------------------------------------------
          replace(
              'lib/features/owner_alpha/presentation/owner_alpha_page.dart',
              "import '../../trading_lab/domain/trading_lab_models.dart';",
              "import '../../trading_lab/domain/trading_lab_models.dart';\nimport '../../trading_lab/domain/trading_lab_real_account_evidence.dart';",
          )
          helper = r'''
          double? _tradingLabWeightedFillPrice(Iterable<ExchangePnlFill> fills) {
            var quantity = 0.0;
            var notional = 0.0;
            for (final fill in fills) {
              final weight = fill.quantity.abs();
              quantity += weight;
              notional += fill.price * weight;
            }
            return quantity <= 1e-12 ? null : notional / quantity;
          }

          TradingLabRealAccountEvidence _buildTradingLabRealAccountEvidence(
            AutoTradeController controller,
          ) {
            final snapshot = controller.snapshot;
            final projection = snapshot?.authoritativePnl;
            if (projection == null) {
              return TradingLabRealAccountEvidence.unavailable(
                asOfUtc: snapshot?.syncedAt,
              );
            }
            final trades = <TradingLabRealAccountTradeEvidence>[];
            for (final position in projection.positions) {
              final entryFills = position.fills
                  .where((fill) => !fill.reduceOnly)
                  .toList(growable: false);
              final exitFills = position.exitFills.toList(growable: false);
              DateTime? openedAt = position.settlement?.openedAt;
              if (openedAt == null && entryFills.isNotEmpty) {
                openedAt = entryFills
                    .map((fill) => fill.occurredAt.toUtc())
                    .reduce((a, b) => a.isBefore(b) ? a : b);
              }
              final closedAt = position.settlement?.closedAt.toUtc();
              final side = entryFills.isEmpty ? '' : entryFills.first.side.trim().toLowerCase();
              final quantity = entryFills.fold<double>(
                0,
                (sum, fill) => sum + fill.quantity.abs(),
              );
              trades.add(
                TradingLabRealAccountTradeEvidence(
                  symbol: position.symbol.trim().toUpperCase(),
                  side: side,
                  state: closedAt != null ? 'closed' : 'open_or_observed',
                  quantity: quantity,
                  averageEntryPrice: _tradingLabWeightedFillPrice(entryFills),
                  averageExitPrice: _tradingLabWeightedFillPrice(exitFills),
                  realizedGrossPnl: position.realizedGross.value,
                  fees: position.fees.value,
                  funding: position.funding.value,
                  netRealizedPnl: position.netRealized.value,
                  unrealizedPnl: position.unrealized.value,
                  openedAtUtc: openedAt?.toUtc(),
                  closedAtUtc: closedAt,
                  asOfUtc: position.asOf.toUtc(),
                  verified: position.isVerified,
                ),
              );
            }
            return TradingLabRealAccountEvidence(
              currency: projection.currency,
              asOfUtc: projection.asOf.toUtc(),
              verified: projection.isVerified,
              fillsAvailable: projection.fillsAvailable,
              settlementsAvailable: projection.settlementsAvailable,
              accountUnrealizedPnl: projection.accountUnrealized.value,
              accountRealizedGrossPnl: projection.accountRealizedGross.value,
              accountFees: projection.accountFees.value,
              accountFunding: projection.accountFunding.value,
              accountNetRealizedPnl: projection.accountNetRealized.value,
              sourceWarningPresent: projection.warning != null,
              trades: trades,
            );
          }
          '''
          replace(
              'lib/features/owner_alpha/presentation/owner_alpha_page.dart',
              "void _noopOpenPortfolioRisk() {}\n",
              "void _noopOpenPortfolioRisk() {}\n" + helper,
          )
          replace(
              'lib/features/owner_alpha/presentation/owner_alpha_page.dart',
              "      );\n    },\n  );\n  final GlobalKey<_AutoTradeViewState>",
              "      );\n    },\n    realAccountEvidenceProvider: () =>\n        _buildTradingLabRealAccountEvidence(_autoTradeController),\n  );\n  final GlobalKey<_AutoTradeViewState>",
          )

          # ------------------------------------------------------------------
          # Paper Broker fixes discovered from the 20h physical evidence run.
          # ------------------------------------------------------------------
          replace(
              'lib/features/trading_lab/application/trading_lab_paper_broker.dart',
              "    final cycle = run.cycleId;\n    final openedBefore = run.openPositions.length;",
              "    final cycle = run.cycleId;\n    final snapshotGapSeconds = previous == null\n        ? 0\n        : snapshot.generatedAt.difference(previous).inSeconds;\n    if (previous != null &&\n        snapshotGapSeconds > run.manifest.scannerIntervalSeconds * 3) {\n      _event(\n        run,\n        TradingLabEventKind.anomaly,\n        snapshot.generatedAt,\n        'Trading Lab market snapshot cadence exceeded the configured scanner interval.',\n        metrics: {\n          'gapSeconds': snapshotGapSeconds.toDouble(),\n          'configuredScannerIntervalSeconds':\n              run.manifest.scannerIntervalSeconds.toDouble(),\n        },\n        attributes: {'anomalyCode': 'scanner_gap'},\n      );\n    }\n    final openedBefore = run.openPositions.length;",
          )
          replace(
              'lib/features/trading_lab/application/trading_lab_paper_broker.dart',
              "        'realAccountAvailable': accountContext?.available ?? 0,\n        'realAccountAgeSeconds':",
              "        'realAccountAvailable': accountContext?.available ?? 0,\n        'realAccountOpenPositionCount':\n            (accountContext?.openPositionCount ?? 0).toDouble(),\n        'realAccountPendingOrderCount':\n            (accountContext?.pendingOrderCount ?? 0).toDouble(),\n        'snapshotGapSeconds': snapshotGapSeconds.toDouble(),\n        'realAccountAgeSeconds':",
          )

          broker_path = ROOT / 'lib/features/trading_lab/application/trading_lab_paper_broker.dart'
          broker = broker_path.read_text()
          old = """        if (idea.confidencePercent < run.manifest.minimumConfidencePercent) {
          _event(
            run,
            TradingLabEventKind.candidateRejected,
            snapshot.generatedAt,
            'Candidate rejected by experiment confidence gate.',
            idea: idea,
            metrics: commonMetrics,
            attributes: {'rejectionReason': 'confidence_below_gate'},
          );
          continue;
        }
        if ((idea.riskReward ?? 0) < run.manifest.minimumRiskReward) {
          _event(
            run,
            TradingLabEventKind.candidateRejected,
            snapshot.generatedAt,
            'Candidate rejected by experiment minimum RR gate.',
            idea: idea,
            metrics: commonMetrics,
            attributes: {'rejectionReason': 'risk_reward_below_gate'},
          );
          continue;
        }

        if (!_isValidActionablePlan(idea)) {
          _event(
            run,
            TradingLabEventKind.candidateRejected,
            snapshot.generatedAt,
            idea.direction == TradeDirection.wait
                ? 'Strategy rejected candidate: ${idea.rejectionReason.name}.'
                : 'Candidate plan is incomplete or has a wrong-side stop.',
            idea: idea,
            metrics: commonMetrics,
            attributes: {'rejectionReason': idea.rejectionReason.name},
          );
          continue;
        }
"""
          new = """        if (!_isValidActionablePlan(idea)) {
          _event(
            run,
