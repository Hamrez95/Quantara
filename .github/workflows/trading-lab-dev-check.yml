name: Trading Lab UI completion retry

on:
  push:
    branches:
      - feat/176-bot-trading-lab

permissions:
  contents: write

concurrency:
  group: trading-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Reuse the audited UI patch and commit from Flutter app root
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/trading-lab-dev-check.yml > /tmp/previous-lab-ui.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/previous-lab-ui.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = []
          for line in source[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_lab_ui.py').write_text('\n'.join(code) + '\n')
          PY
          python3 /tmp/apply_lab_ui.py
          pushd src/client/quantara_app
          flutter pub get
          dart format lib test
          popd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib src/client/quantara_app/test \
            src/client/quantara_app/pubspec.lock
          if git diff --cached --quiet; then
            echo 'UI patch already present.'
            exit 0
          fi
          git commit -m 'feat(lab): complete advanced config import and comparison UI'
          git push origin HEAD:feat/176-bot-trading-lab
