name: Trading Lab post-run source hardening

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/trading-lab-dev-check.yml'

permissions:
  contents: write

concurrency:
  group: trading-lab-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 14
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply and validate audited post-run patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_COMMIT="$(git log --format='%H %s' -14 | grep 'ci(lab): apply post-run hardening and evidence upgrade' | head -1 | cut -d' ' -f1)"
          test -n "$PATCH_COMMIT"
          git show "$PATCH_COMMIT":.github/workflows/trading-lab-dev-check.yml > /tmp/post-run-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/post-run-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = []
          for line in source[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(code) + '\n'
          fragile = """if old not in broker:\n    raise SystemExit('candidate gate ordering anchor missing')\nbroker = broker.replace(old, new, 1)\nbroker_path.write_text(broker)\n"""
          resilient = """if old not in broker:\n    gate_start = broker.index(\"        if (idea.confidencePercent < run.manifest.minimumConfidencePercent) {\")\n    gate_end = broker.index(\"        final pending = TradingLabPendingCandidate(\", gate_start)\n    broker = broker[:gate_start] + new + \"\\n\" + broker[gate_end:]\nelse:\n    broker = broker.replace(old, new, 1)\nbroker_path.write_text(broker)\n"""
          if fragile not in script:
              raise SystemExit('candidate patch fallback anchor missing')
          Path('/tmp/apply_post_run.py').write_text(script.replace(fragile, resilient, 1))
          PY
          python3 /tmp/apply_post_run.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/client/quantara_app')

          # The generic anchor in the original patch added ZIP-only arguments to
          # the immediately preceding AI-review call. Keep AI review read-only
          # and move the new evidence arguments to the ZIP encoder itself.
          controller = root / 'lib/features/trading_lab/application/trading_lab_controller.dart'
          text = controller.read_text()
          ai_start = text.index('    final aiReviewJson = buildTradingLabAiReviewJsonWithShadows(')
          zip_start = text.index('    return const TradingLabZipBundleCodec().encode(', ai_start)
          ai_segment = text[ai_start:zip_start]
          accidental = ai_segment.find('      realAccountEvidence: realAccountEvidence,')
          if accidental >= 0:
              close = ai_segment.index('    );', accidental)
              prefix = ai_segment[:accidental]
              if not prefix.endswith('      accountContext: context,\n'):
                  raise SystemExit('unexpected AI review evidence placement')
              ai_segment = prefix + ai_segment[close:]
              text = text[:ai_start] + ai_segment + text[zip_start:]
              zip_start = text.index('    return const TradingLabZipBundleCodec().encode(', ai_start)
          zip_end = text.index('    );', zip_start)
          zip_segment = text[zip_start:zip_end]
          if 'realAccountEvidence:' not in zip_segment:
              anchor = '      accountContext: context,\n'
              if anchor not in zip_segment:
                  raise SystemExit('ZIP account context anchor missing')
              addition = (
                  anchor
                  + '      realAccountEvidence: realAccountEvidence,\n'
                  + '      benchmarkMatrix: buildTradingLabBenchmarkMatrix(<TradingLabRun>[\n'
                  + '        ..._history,\n'
                  + '        current,\n'
                  + '      ]),\n'
              )
              zip_segment = zip_segment.replace(anchor, addition, 1)
              text = text[:zip_start] + zip_segment + text[zip_end:]
          controller.write_text(text)

          # v3 JSONL list contains runtime collection-if entries.
          zip_file = root / 'lib/features/trading_lab/application/trading_lab_zip_bundle.dart'
          text = zip_file.read_text()
          runtime_list = "for (final name in const <String>["
          if runtime_list in text and "if (bundleSchema >= 3) 'real_account_trades.jsonl'" in text:
              text = text.replace(runtime_list, "for (final name in <String>[", 1)
          zip_file.write_text(text)

          # 30m must be included in every exhaustive test switch over the enum.
          e2e = root / 'test/realtime_market_application_e2e_test.dart'
          text = e2e.read_text()
          anchor = '  BitunixKlineInterval.fifteenMinutes ||\n  BitunixKlineInterval.oneHour ||'
          if anchor in text:
              text = text.replace(
                  anchor,
                  '  BitunixKlineInterval.fifteenMinutes ||\n'
                  '  BitunixKlineInterval.thirtyMinutes ||\n'
                  '  BitunixKlineInterval.oneHour ||',
                  1,
              )
          e2e.write_text(text)

          # Ensure every test ZIP encode call uses the v3 evidence contract.
          ztest = root / 'test/trading_lab_zip_bundle_test.dart'
          text = ztest.read_text()
          pattern = re.compile(
              r'(?P<indent>[ \t]*)accountContext: accountContext,\n(?P<close>[ \t]*)\);'
          )
          def add_v3(match):
              indent = match.group('indent')
              close = match.group('close')
              return (
                  f'{indent}accountContext: accountContext,\n'
                  f'{indent}realAccountEvidence: realAccountEvidence,\n'
                  f'{indent}benchmarkMatrix: benchmarkMatrix,\n'
                  f'{close});'
              )
          text = pattern.sub(add_v3, text)
          ztest.write_text(text)
          PY
          pushd src/client/quantara_app
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test test/trading_lab_paper_broker_test.dart --reporter compact
          flutter test test/trading_lab_zip_bundle_test.dart --reporter compact
          flutter test test/trading_lab_post_run_hardening_test.dart --reporter compact
          flutter test test/trading_lab_no_real_order_source_test.dart --reporter compact
          popd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          if git diff --cached --quiet; then
            echo 'No source changes generated.'
            exit 0
          fi
          git commit -m 'feat(lab): harden forward tests and export sanitized live evidence'
          git push origin HEAD:feat/176-bot-trading-lab
