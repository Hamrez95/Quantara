name: Temporary format issue 154 safety tests

on:
  push:
    branches:
      - fix/154-reenable-guarded-local-live

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/154-reenable-guarded-local-live
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Format safety tests
        working-directory: src/client/quantara_app
        run: dart format test/portfolio_risk_source_safety_test.dart test/professional_strategy_source_safety_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/test/portfolio_risk_source_safety_test.dart src/client/quantara_app/test/professional_strategy_source_safety_test.dart
          git commit -m "style: format canary safety tests"
          git push origin HEAD:fix/154-reenable-guarded-local-live
