name: Release Quantara

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      channel:
        description: Release channel
        type: choice
        required: true
        default: beta
        options: [beta, stable]
      rollout_percent:
        description: Percentage of installations eligible for this update
        type: choice
        required: true
        default: '100'
        options: ['10', '25', '50', '100']
      release_notes:
        description: Optional notes
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: quantara-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'
  APP_DIR: src/client/quantara_app
  PRODUCT: Quantara
  TAG_PREFIX: quantara-v

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Guard canonical source branch
        run: test "${{ github.ref_name }}" = dev

      - name: Require current dev Android upgrade certification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          certification_run="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/flutter-ci.yml/runs?branch=dev&event=push&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\") | .id" \
              | sed -n '1p'
          )"
          if [ -z "$certification_run" ]; then
            echo "No successful Flutter client CI run certifies current dev commit $GITHUB_SHA." >&2
            echo "Release is blocked until the exact dev commit passes format/analyze/full tests, builds and the API 34/35/36 Android cold-start + in-place-upgrade matrix." >&2
            exit 1
          fi
          echo "Certified by Flutter client CI run $certification_run for $GITHUB_SHA."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate immutable product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          previous="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$APP_DIR/pubspec.yaml")"
          test -n "$previous"
          output="$(python scripts/release/release_version.py --previous "$previous" --release-type '${{ inputs.release_type }}' --channel '${{ inputs.channel }}' --prefix "$TAG_PREFIX")"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          version="$(printf '%s\n' "$output" | sed -n 's/^version=//p')"
          tag="$(printf '%s\n' "$output" | sed -n 's/^tag=//p')"
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          echo "previous_version=$previous" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard Android build number against published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].name' \
            | python scripts/release/release_manifest.py guard-build \
                --candidate '${{ steps.version.outputs.build_number }}'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Quality gates
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Decode permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quantara.jks"
          chmod 600 "$RUNNER_TEMP/quantara.jks"
      - name: Build signed Android and PWA artifacts
        working-directory: ${{ env.APP_DIR }}
        env:
          QUANTARA_STABLE_RELEASE: 'true'
          QUANTARA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quantara.jks
          QUANTARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_PASSWORD }}
          QUANTARA_ANDROID_KEY_ALIAS: ${{ secrets.QUANTARA_ANDROID_KEY_ALIAS }}
          QUANTARA_ANDROID_KEY_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name='${{ steps.version.outputs.version }}' --build-number='${{ steps.version.outputs.build_number }}'
          flutter build appbundle --release --build-name='${{ steps.version.outputs.version }}' --build-number='${{ steps.version.outputs.build_number }}'
          flutter build web --release --base-href '/Quantara/' --dart-define=APP_VERSION='${{ steps.version.outputs.version }}' --dart-define=APP_COMMIT='${{ github.sha }}'
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.aab"
          (cd build/web && zip -qr "../../release/Quantara-${{ steps.version.outputs.version }}-pwa.zip" .)

      - name: Verify Android identity, signature and artifacts
        id: integrity
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk="release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.apk"
          pwa="release/Quantara-${{ steps.version.outputs.version }}-pwa.zip"
          apkanalyzer="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apkanalyzer" manifest application-id "$apk" | grep -Fxq com.quantara.quantara_app
          "$apksigner" verify --verbose "$apk"
          signer="$($apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$signer"
          test -s "$pwa"
          echo "android_sha256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "pwa_sha256=$(sha256sum "$pwa" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "android_signing_identity=$signer" >> "$GITHUB_OUTPUT"
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Guard Android identity against previous published release
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.channel }}' = beta ]; then
            manifest_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'map(select(.draft == false and .prerelease == true and any(.assets[]?; .name == "release-manifest.json")))[0].assets | map(select(.name == "release-manifest.json"))[0].browser_download_url // ""')"
          else
            manifest_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'map(select(.draft == false and .prerelease == false and any(.assets[]?; .name == "release-manifest.json")))[0].assets | map(select(.name == "release-manifest.json"))[0].browser_download_url // ""')"
          fi
          if [ -n "$manifest_url" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 "$manifest_url" \
              --output "$RUNNER_TEMP/previous-release-manifest.json"
            python ../../../scripts/release/release_manifest.py guard-identity \
              --previous-manifest "$RUNNER_TEMP/previous-release-manifest.json" \
              --android-package-id com.quantara.quantara_app \
              --android-signing-identity '${{ steps.integrity.outputs.android_signing_identity }}'
          else
            echo 'No prior channel release-manifest.json exists; signer continuity starts with this managed release.'
          fi

      - name: Generate machine-readable update manifest
        working-directory: ${{ env.APP_DIR }}
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_channel=stable
          if [ '${{ inputs.channel }}' = beta ]; then manifest_channel=canary; fi
          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.version }}'
          build='${{ steps.version.outputs.build_number }}'
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python ../../../scripts/release/release_manifest.py manifest \
            --channel "$manifest_channel" \
            --version "$version" \
            --build-number "$build" \
            --published-at "$published_at" \
            --minimum-supported-version '${{ steps.version.outputs.previous_version }}' \
            --release-notes "$RELEASE_NOTES" \
            --rollout-percent '${{ inputs.rollout_percent }}' \
            --android-url "$base_url/Quantara-$version+$build-android.apk" \
            --android-sha256 '${{ steps.integrity.outputs.android_sha256 }}' \
            --android-package-id com.quantara.quantara_app \
            --android-signing-identity '${{ steps.integrity.outputs.android_signing_identity }}' \
            --pwa-url "$base_url/Quantara-$version-pwa.zip" \
            --pwa-sha256 '${{ steps.integrity.outputs.pwa_sha256 }}' \
            --output release/release-manifest.json
          python -m json.tool release/release-manifest.json >/dev/null

      - name: Release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Quantara release candidate
          - Source: `dev` @ `${{ github.sha }}`
          - Version: `${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}`
          - Tag: `${{ steps.version.outputs.tag }}`
          - Platforms: Android (signed APK/AAB), PWA archive
          - Android upgrade compatibility: same canonical package/signer required; minimum supported version `${{ steps.version.outputs.previous_version }}`
          - Current-dev certification: exact commit must have passed Flutter client CI including API 34/35/36 upgrade matrix
          - Update manifest: `release-manifest.json` published atomically with release artifacts
          - Staged rollout eligibility: `${{ inputs.rollout_percent }}%`
          - Windows/iOS: not built or verified
          EOF
      - name: Publish immutable GitHub release
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=''
          if [ '${{ inputs.channel }}' = beta ]; then prerelease='--prerelease'; fi
          gh release create '${{ steps.version.outputs.tag }}' release/* \
            --target '${{ github.sha }}' --title "Quantara ${{ steps.version.outputs.version }}" $prerelease \
            --notes "${{ inputs.release_notes }}\n\nProduct: Quantara\nBuild: ${{ steps.version.outputs.build_number }}\nCommit: ${{ github.sha }}\nAndroid upgrade-compatible: yes, only over the same canonical package/signing lineage. Minimum supported version: ${{ steps.version.outputs.previous_version }}.\nStaged rollout eligibility: ${{ inputs.rollout_percent }}%.\nPlatforms: signed Android APK/AAB, PWA archive."
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/quantara.jks"
