name: Release Quantara

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: SemVer action
        type: choice
        required: true
        default: patch
        options: [promote, patch, minor, major]
      channel:
        description: Release channel
        type: choice
        required: true
        default: beta
        options: [beta, stable]
      release_notes:
        description: Short release notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: quantara-release
  cancel-in-progress: false

env:
  APP_DIR: src/client/quantara_app
  FLUTTER_VERSION: '3.44.8'

jobs:
  release:
    name: Build and publish immutable Android/PWA release
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate product version and immutable tag
        id: version
        working-directory: ${{ env.APP_DIR }}
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          previous="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          python - "$previous" "$RELEASE_TYPE" "$CHANNEL" <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys
          value, action, channel = sys.argv[1:]
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-(?:beta|rc)\.(\d+))?", value)
          if not m: raise SystemExit(f"Unsupported pubspec version: {value}")
          major, minor, patch, sequence = map(lambda x: int(x) if x else None, m.groups())
          if action == "promote":
              if channel != "stable" or sequence is None: raise SystemExit("promote requires an rc/beta source and stable channel")
              version = f"{major}.{minor}.{patch}"
          else:
              if action == "major": major, minor, patch = major + 1, 0, 0
              elif action == "minor": minor, patch = minor + 1, 0
              elif action == "patch": patch += 1
              else: raise SystemExit("Unsupported release action")
              version = f"{major}.{minor}.{patch}" + ("-beta.1" if channel == "beta" else "")
          print(f"version={version}")
          print(f"tag=quantara-v{version}")
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")"
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Test source
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Decode permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quantara.jks"
          chmod 600 "$RUNNER_TEMP/quantara.jks"

      - name: Build signed Android and PWA artifacts
        working-directory: ${{ env.APP_DIR }}
        env:
          QUANTARA_STABLE_RELEASE: 'true'
          QUANTARA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quantara.jks
          QUANTARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_PASSWORD }}
          QUANTARA_ANDROID_KEY_ALIAS: ${{ secrets.QUANTARA_ANDROID_KEY_ALIAS }}
          QUANTARA_ANDROID_KEY_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name='${{ steps.version.outputs.version }}' --build-number='${{ steps.version.outputs.build_number }}'
          flutter build appbundle --release --build-name='${{ steps.version.outputs.version }}' --build-number='${{ steps.version.outputs.build_number }}'
          flutter build web --release --base-href '/Quantara/' --dart-define=APP_VERSION='${{ steps.version.outputs.version }}' --dart-define=APP_COMMIT="$GITHUB_SHA"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.aab"
          (cd build/web && zip -qr "../../release/Quantara-${{ steps.version.outputs.version }}-pwa.zip" .)

      - name: Verify Android package and signature
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          apk="release/Quantara-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-android.apk"
          apkanalyzer="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apkanalyzer" manifest application-id "$apk" | grep -Fxq com.quantara.quantara_app
          "$apksigner" verify --verbose "$apk"
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [ '${{ inputs.channel }}' = beta ]; then args+=(--prerelease); fi
          gh release create '${{ steps.version.outputs.tag }}' release/* "${args[@]}" \
            --target "$GITHUB_SHA" \
            --title "Quantara ${{ steps.version.outputs.version }}" \
            --notes "${{ inputs.release_notes }}\n\nVersion: ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}\nCommit: $GITHUB_SHA\nArtifacts: signed Android APK/AAB and PWA archive."
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/quantara.jks"
