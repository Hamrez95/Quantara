name: Temporary issue 165 journal authority fix

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: feat-165-journal-authority-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply database-authoritative foreground merge
        run: python3 .github/scripts/feat165_journal_authority_fix.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format patch
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze patch
        working-directory: src/client/quantara_app
        run: flutter analyze
      - name: Run journal authority and physical regression tests
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/database_trading_journal_store_test.dart
          test/trading_journal_source_safety_test.dart
          test/trading_journal_foreground_merge_test.dart
          test/physical_canary_regression_source_test.dart
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'fix: keep database journal authoritative while importing new foreground facts (#165)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
