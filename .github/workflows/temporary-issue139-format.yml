name: Temporary Issue 139 format

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  format-and-push:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format review regression
        working-directory: src/client/quantara_app
        run: dart format test/bitunix_pnl_position_identity_test.dart
      - name: Remove workflow and push formatted test
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-issue139-format.yml
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'test: format PnL position identity regression'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
