name: Apply PR27 source hotfix

on:
  push:
    branches:
      - fix/26-report-cadence-slippage-integrity
    paths:
      - scripts/apply-pr27-source-hotfix.py

permissions:
  contents: write

jobs:
  apply-source-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/26-report-cadence-slippage-integrity

      - name: Apply deterministic source replacements
        run: python3 scripts/apply-pr27-source-hotfix.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/backend/Quantara.Domain/Backtesting/BacktestPerformanceReportBuilder.cs \
            src/backend/Quantara.Domain/Backtesting/DeterministicBacktestRunner.cs
          if git diff --cached --quiet; then
            echo "Expected source replacements were not produced." >&2
            exit 1
          fi
          git commit -m "fix(backtesting): enforce report cadence and slippage integrity"
          git push origin HEAD:fix/26-report-cadence-slippage-integrity
