name: Remove unnecessary Dart library name once

on:
  push:
    branches:
      - fix/33-mobile-stability-and-simplification
    paths:
      - .github/workflows/remove-library-name-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/33-mobile-stability-and-simplification
      - name: Remove unnecessary named library directive
        run: sed -i '1{/^library stable_cockpit_page;$/d;}' src/client/quantara_app/lib/features/cockpit/presentation/stable_cockpit_page.dart
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-library-name-once.yml
          git add src/client/quantara_app/lib/features/cockpit/presentation/stable_cockpit_page.dart
          git commit -m "fix: remove unnecessary Dart library name"
          git push origin HEAD:fix/33-mobile-stability-and-simplification
