name: Temporary Supervisor formatter

on:
  push:
    branches:
      - fix/compact-supervisor-connection-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/compact-supervisor-connection-ui
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            src/client/quantara_app/lib/features/ai_supervisor/presentation/supervisor_connection_launcher.dart \
            src/client/quantara_app/test/ai_supervisor_connection_launcher_test.dart
          git rm .github/workflows/temp-format-supervisor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client/quantara_app/lib/features/ai_supervisor/presentation/supervisor_connection_launcher.dart \
                  src/client/quantara_app/test/ai_supervisor_connection_launcher_test.dart
          git commit -m 'style: apply canonical Dart formatting'
          git push origin HEAD:fix/compact-supervisor-connection-ui
