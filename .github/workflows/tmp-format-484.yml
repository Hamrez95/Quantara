name: tmp format 484
on:
  push:
    branches:
      - feat/484-evaluation-archive
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - run: |
          dart format lib/features/owner_alpha/data/durable_strategy_evaluation_archive.dart test/durable_strategy_evaluation_archive_test.dart
          git diff -- lib/features/owner_alpha/data/durable_strategy_evaluation_archive.dart test/durable_strategy_evaluation_archive_test.dart
