name: Temporary format issue 154

on:
  push:
    branches:
      - fix/154-reenable-guarded-local-live

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/154-reenable-guarded-local-live
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Format changed Dart sources
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/domain/private_account_reconciliation.dart test/auto_trade_account_reconciliation_controller_test.dart test/private_account_reconciliation_safety_source_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/domain/private_account_reconciliation.dart src/client/quantara_app/test/auto_trade_account_reconciliation_controller_test.dart src/client/quantara_app/test/private_account_reconciliation_safety_source_test.dart
          git commit -m "style: format Local Live hotfix"
          git push origin HEAD:fix/154-reenable-guarded-local-live
