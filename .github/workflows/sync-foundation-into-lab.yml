name: Remove one-shot Trading Lab sync

on:
  push:
    branches:
      - feat/176-bot-trading-lab
    paths:
      - '.github/workflows/sync-foundation-into-lab.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Trading Lab branch
        uses: actions/checkout@v4
        with:
          ref: feat/176-bot-trading-lab

      - name: Remove one-shot workflow from the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quantara-ci'
          git config user.email 'quantara-ci@users.noreply.github.com'
          git rm .github/workflows/sync-foundation-into-lab.yml
          git commit -m 'ci: remove one-shot Trading Lab foundation sync'
          git push origin HEAD:feat/176-bot-trading-lab
