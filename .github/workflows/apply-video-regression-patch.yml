name: Apply 0.11.2 video regression patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-video-regression-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/63-64-video-regressions
          fetch-depth: 0

      - name: Apply source and test changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          models = 'src/client/quantara_app/lib/features/owner_alpha/domain/owner_alpha_models.dart'
          replace(models, "    required this.summary,\n    required this.invalidation,\n    this.outcome = SignalOutcome.pendingEntry,", "    required this.summary,\n    required this.invalidation,\n    this.sizingCapital = 0,\n    this.outcome = SignalOutcome.pendingEntry,")
          replace(models, "  factory SignalJournalEntry.fromIdea(TradeIdea idea) => SignalJournalEntry(\n", "  factory SignalJournalEntry.fromIdea(\n    TradeIdea idea, {\n    double sizingCapital = 0,\n  }) => SignalJournalEntry(\n")
          replace(models, "    summary: idea.summary,\n    invalidation: idea.invalidation,\n  );", "    summary: idea.summary,\n    invalidation: idea.invalidation,\n    sizingCapital: sizingCapital,\n  );")
          replace(models, "  final String summary;\n  final String invalidation;\n  final SignalOutcome outcome;", "  final String summary;\n  final String invalidation;\n  final double sizingCapital;\n  final SignalOutcome outcome;")
          replace(models, "  double get selectedMargin => notionalValue / selectedLeverage;\n\n  bool get hasTerminalOutcome =>", "  double get selectedMargin => notionalValue / selectedLeverage;\n\n  double get sizingRiskPercent =>\n      sizingCapital <= 0 ? 0 : maximumLoss / sizingCapital * 100;\n\n  bool get canRefreshSizing =>\n      outcome == SignalOutcome.pendingEntry &&\n      activatedAt == null &&\n      !closed;\n\n  bool get hasTerminalOutcome =>")
          replace(models, "    summary: summary,\n    invalidation: invalidation,\n    outcome: outcome ?? this.outcome,", "    summary: summary,\n    invalidation: invalidation,\n    sizingCapital: sizingCapital,\n    outcome: outcome ?? this.outcome,")
          replace(models, "    'summary': summary,\n    'invalidation': invalidation,\n    'outcome': outcome.name,", "    'summary': summary,\n    'invalidation': invalidation,\n    'sizingCapital': sizingCapital,\n    'outcome': outcome.name,")
          replace(models, "        recommendedLeverage: recommendedLeverage.clamp(1, 100).toInt(),\n        maximumSafeLeverage: maximumSafeLeverage.clamp(1, 100).toInt(),\n        selectedLeverage: selectedLeverage\n            .clamp(1, maximumSafeLeverage.clamp(1, 100))\n            .toInt(),\n        summary: value['summary'] as String,\n        invalidation: value['invalidation'] as String,", "        recommendedLeverage: recommendedLeverage\n            .clamp(1, TradeIdea.maximumManualLeverage)\n            .toInt(),\n        maximumSafeLeverage: maximumSafeLeverage\n            .clamp(1, TradeIdea.maximumManualLeverage)\n            .toInt(),\n        selectedLeverage: selectedLeverage\n            .clamp(1, TradeIdea.maximumManualLeverage)\n            .toInt(),\n        summary: value['summary'] as String,\n        invalidation: value['invalidation'] as String,\n        sizingCapital: (value['sizingCapital'] as num?)?.toDouble() ?? 0,")

          Path('src/client/quantara_app/lib/features/owner_alpha/data/signal_sizing_reconciler.dart').write_text("""import '../domain/owner_alpha_models.dart';

/// Reconciles a fresh deterministic idea with a durable journal entry.
/// Pending entries may be re-sized after capital/risk changes; active history is immutable.
abstract final class SignalSizingReconciler {
  static SignalJournalEntry merge({
    required TradeIdea idea,
    required double sizingCapital,
    required double riskPercent,
    SignalJournalEntry? existing,
  }) {
    final fresh = SignalJournalEntry.fromIdea(idea, sizingCapital: sizingCapital);
    if (existing == null) return fresh;
    final sizingChanged =
        (existing.sizingCapital - sizingCapital).abs() > 0.0001 ||
        (existing.maximumLoss - idea.maximumLoss).abs() > 0.0001 ||
        existing.positionSize <= 0 ||
        existing.notionalValue <= 0 ||
        (existing.sizingCapital > 0 &&
            (existing.sizingRiskPercent - riskPercent).abs() > 0.0001);
    if (!existing.canRefreshSizing || !sizingChanged) return existing;
    return fresh.copyWith(
      note: existing.note,
      closed: existing.closed,
      selectedLeverage: existing.selectedLeverage.clamp(
        1,
        TradeIdea.maximumManualLeverage,
      ),
    );
  }
}
""")

          controller = 'src/client/quantara_app/lib/features/owner_alpha/application/owner_alpha_controller.dart'
          replace(controller, "import '../data/signal_outcome_evaluator.dart';\nimport '../data/trade_idea_factory.dart';", "import '../data/signal_outcome_evaluator.dart';\nimport '../data/signal_sizing_reconciler.dart';\nimport '../data/trade_idea_factory.dart';")
          replace(controller, "        generatedAt: current.generatedAt,\n      );\n    }\n    notifyListeners();\n  }\n\n  static String? _normalizeSymbol", "        generatedAt: current.generatedAt,\n      );\n      await _captureOpportunities(_snapshot!.opportunities);\n    }\n    notifyListeners();\n  }\n\n  static String? _normalizeSymbol")
          replace(controller, "    for (final idea in ideas) {\n      final existing = byId[idea.setupId];\n      if (existing == null) {\n        byId[idea.setupId] = SignalJournalEntry.fromIdea(idea);\n      } else if (existing.positionSize <= 0 || existing.notionalValue <= 0) {\n        byId[idea.setupId] = SignalJournalEntry.fromIdea(\n          idea,\n        ).copyWith(note: existing.note, closed: existing.closed);\n      }\n    }", "    for (final idea in ideas) {\n      byId[idea.setupId] = SignalSizingReconciler.merge(\n        idea: idea,\n        sizingCapital: _capital,\n        riskPercent: _riskPercent,\n        existing: byId[idea.setupId],\n      );\n    }")

          background = 'src/client/quantara_app/lib/features/owner_alpha/data/background_opportunity_scanner.dart'
          replace(background, "import 'signal_outcome_evaluator.dart';\nimport 'trade_idea_factory.dart';", "import 'signal_outcome_evaluator.dart';\nimport 'signal_sizing_reconciler.dart';\nimport 'trade_idea_factory.dart';")
          replace(background, "      for (final idea in ideas) {\n        final existing = journalById[idea.setupId];\n        if (existing == null) {\n          journalById[idea.setupId] = SignalJournalEntry.fromIdea(idea);\n        } else if (existing.positionSize <= 0 || existing.notionalValue <= 0) {\n          journalById[idea.setupId] = SignalJournalEntry.fromIdea(\n            idea,\n          ).copyWith(note: existing.note, closed: existing.closed);\n        }\n      }", "      for (final idea in ideas) {\n        journalById[idea.setupId] = SignalSizingReconciler.merge(\n          idea: idea,\n          sizingCapital: capital,\n          riskPercent: risk,\n          existing: journalById[idea.setupId],\n        );\n      }")

          signals = 'src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart'
          replace(signals, "            _LeverageControl(\n              selected: entry.selectedLeverage,", "            _LeverageControl(\n              key: ValueKey('leverage-${entry.setupId}'),\n              selected: entry.selectedLeverage,")
          replace(signals, "                MetricTile(\n                  label: _t(context, 'ارزش پوزیشن', 'Position notional'),", "                if (entry.sizingCapital > 0)\n                  MetricTile(\n                    label: _t(context, 'سرمایه مبنای محاسبه', 'Sizing capital'),\n                    value: QuantaraNumberFormat.marketValue(\n                      entry.sizingCapital,\n                      unit: 'USDT',\n                    ),\n                  ),\n                MetricTile(\n                  label: _t(\n                    context,\n                    'بودجه ریسک (${entry.sizingRiskPercent.toStringAsFixed(2)}٪)',\n                    'Risk budget (${entry.sizingRiskPercent.toStringAsFixed(2)}%)',\n                  ),\n                  value: QuantaraNumberFormat.marketValue(\n                    entry.maximumLoss,\n                    unit: 'USDT',\n                  ),\n                  valueColor: QuantaraColors.warning,\n                ),\n                MetricTile(\n                  label: _t(context, 'ارزش پوزیشن', 'Position notional'),")
          replace(signals, "class _LeverageControl extends StatefulWidget {\n  const _LeverageControl({\n    required this.selected,", "class _LeverageControl extends StatefulWidget {\n  const _LeverageControl({\n    super.key,\n    required this.selected,")
          replace(signals, "  bool get _persian => Directionality.of(context) == TextDirection.rtl;\n\n  @override", "  bool get _persian => Directionality.of(context) == TextDirection.rtl;\n\n  void _commit(int value) {\n    final normalized = value\n        .clamp(1, TradeIdea.maximumManualLeverage)\n        .toInt();\n    setState(() => _draft = normalized.toDouble());\n    widget.onChanged(normalized);\n  }\n\n  @override")
          replace(signals, "    return DecoratedBox(\n      decoration: BoxDecoration(", "    return Container(\n      clipBehavior: Clip.hardEdge,\n      decoration: BoxDecoration(")
          replace(signals, "                      onSelected: (_) {\n                        setState(() => _draft = leverage.toDouble());\n                        widget.onChanged(leverage);\n                      },", "                      onSelected: (_) => _commit(leverage),")
          replace(signals, "            const SizedBox(height: 8),\n            Row(\n              children: [\n                const Text('1x', textDirection: TextDirection.ltr),\n                Expanded(\n                  child: Slider(\n                    value: selected.toDouble(),\n                    min: 1,\n                    max: TradeIdea.maximumManualLeverage.toDouble(),\n                    divisions: TradeIdea.maximumManualLeverage - 1,\n                    label: '${selected}x',\n                    onChanged: (value) => setState(() => _draft = value),\n                    onChangeEnd: (value) => widget.onChanged(value.round()),\n                  ),\n                ),\n                Text(\n                  '${TradeIdea.maximumManualLeverage}x',\n                  textDirection: TextDirection.ltr,\n                ),\n              ],\n            ),", "            const SizedBox(height: 10),\n            Row(\n              children: [\n                IconButton.filledTonal(\n                  key: ValueKey('leverage-decrease-$selected'),\n                  tooltip: _persian ? 'یک واحد کمتر' : 'Decrease by one',\n                  onPressed: selected > 1 ? () => _commit(selected - 1) : null,\n                  icon: const Icon(Icons.remove_rounded),\n                ),\n                Expanded(\n                  child: Column(\n                    children: [\n                      Text(\n                        '${selected}x',\n                        textDirection: TextDirection.ltr,\n                        style: Theme.of(context).textTheme.titleLarge?.copyWith(\n                          fontWeight: FontWeight.w900,\n                        ),\n                      ),\n                      Text(\n                        _persian\n                            ? 'برای مقدار دقیق از دکمه‌های کم و زیاد استفاده کن.'\n                            : 'Use the step buttons for an exact value.',\n                        textAlign: TextAlign.center,\n                        style: Theme.of(context).textTheme.bodySmall,\n                      ),\n                    ],\n                  ),\n                ),\n                IconButton.filledTonal(\n                  key: ValueKey('leverage-increase-$selected'),\n                  tooltip: _persian ? 'یک واحد بیشتر' : 'Increase by one',\n                  onPressed: selected < TradeIdea.maximumManualLeverage\n                      ? () => _commit(selected + 1)\n                      : null,\n                  icon: const Icon(Icons.add_rounded),\n                ),\n              ],\n            ),")

          source_test = Path('src/client/quantara_app/test/signal_leverage_ui_source_test.dart')
          source_text = source_test.read_text().replace(
              "      expect(signals, isNot(contains('DropdownButtonFormField<int>')));",
              "      expect(signals, isNot(contains('DropdownButtonFormField<int>')));\n      expect(signals, isNot(contains('Slider(')));\n      expect(signals, contains(\"ValueKey('leverage-${entry.setupId}')\"));\n      expect(signals, contains('IconButton.filledTonal'));",
          )
          source_test.write_text(source_text)

          Path('src/client/quantara_app/test/signal_sizing_reconciler_test.dart').write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:quantara_app/features/owner_alpha/data/signal_sizing_reconciler.dart';
import 'package:quantara_app/features/owner_alpha/domain/owner_alpha_models.dart';

void main() {
  test('pending setup is re-sized when capital changes from 10000 to 800', () {
    final old = SignalJournalEntry.fromIdea(
      _idea(maximumLoss: 100, positionSize: 10, notionalValue: 10000),
      sizingCapital: 10000,
    ).copyWith(selectedLeverage: 20, note: 'keep me');
    final resized = SignalSizingReconciler.merge(
      idea: _idea(maximumLoss: 8, positionSize: 0.8, notionalValue: 800),
      sizingCapital: 800,
      riskPercent: 1,
      existing: old,
    );
    expect(resized.sizingCapital, 800);
    expect(resized.maximumLoss, 8);
    expect(resized.sizingRiskPercent, closeTo(1, 0.0001));
    expect(resized.positionSize, 0.8);
    expect(resized.notionalValue, 800);
    expect(resized.selectedLeverage, 20);
    expect(resized.note, 'keep me');
  });

  test('active setup keeps its original historical sizing', () {
    final active = SignalJournalEntry.fromIdea(
      _idea(maximumLoss: 100, positionSize: 10, notionalValue: 10000),
      sizingCapital: 10000,
    ).copyWith(
      outcome: SignalOutcome.active,
      activatedAt: DateTime.utc(2026, 7, 30, 10),
    );
    final result = SignalSizingReconciler.merge(
      idea: _idea(maximumLoss: 8, positionSize: 0.8, notionalValue: 800),
      sizingCapital: 800,
      riskPercent: 1,
      existing: active,
    );
    expect(identical(result, active), isTrue);
    expect(result.sizingCapital, 10000);
    expect(result.maximumLoss, 100);
  });

  test('manual 125x leverage survives journal persistence', () {
    final entry = SignalJournalEntry.fromIdea(
      _idea(maximumLoss: 8, positionSize: 0.8, notionalValue: 800),
      sizingCapital: 800,
    ).copyWith(selectedLeverage: 125);
    final decoded = SignalJournalEntry.tryFromJson(entry.toJson());
    expect(decoded, isNotNull);
    expect(decoded!.selectedLeverage, 125);
    expect(decoded.sizingCapital, 800);
  });
}

TradeIdea _idea({
  required double maximumLoss,
  required double positionSize,
  required double notionalValue,
}) => TradeIdea(
  symbol: 'BTCUSDT',
  timeframe: '1h',
  direction: TradeDirection.long,
  confidencePercent: 75,
  entryLower: 100,
  entryUpper: 101,
  stopLoss: 90,
  targets: const [110, 120, 130],
  riskReward: 2,
  maximumLoss: maximumLoss,
  positionSize: positionSize,
  notionalValue: notionalValue,
  recommendedLeverage: 4,
  maximumSafeLeverage: 8,
  requiredMargin: notionalValue / 4,
  estimatedRoundTripCosts: 1,
  setupId: 'BTCUSDT|1h|long|video-regression',
  candleClosedAt: DateTime.utc(2026, 7, 30, 9),
  summary: 'test',
  invalidation: 'test',
  reasons: const ['test'],
);
""")

