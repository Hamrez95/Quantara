          release.write_text("""# Quantara 0.11.2 video regression gate

This candidate fixes the Samsung Android 16 setup-screen grey surface and stale
capital sizing reported in the user screen recording.

- leverage uses bounded preset and step controls; no Slider or dropdown overlay;
- pending, untriggered setups are re-sized after capital/risk changes;
- active and resolved setups keep immutable historical sizing;
- foreground and background scans share the same sizing reconciler;
- setup cards display sizing capital and risk budget separately from notional;
- manual leverage up to 125x persists across restart.

Do not call this Stable until all CI, Android 14/15/16 and physical Samsung gates pass.
""")
