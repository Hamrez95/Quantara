name: Align touch saturation once

on:
  push:
    branches:
      - feat/36-multitimeframe-chart-analysis
    paths:
      - .github/workflows/align-touch-saturation-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/36-multitimeframe-chart-analysis
      - name: Align evidence saturation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/backend/Quantara.Domain/Analysis/DeterministicPriceStructureAnalyzer.cs')
          text = path.read_text().replace(
              'cluster.Candidates.Count / 5m',
              'cluster.Candidates.Count / 12m')
          path.write_text(text)

          path = Path('src/client/quantara_app/lib/features/market_analysis/data/chart_structure_analyzer.dart')
          text = path.read_text().replace(
              'cluster.items.length / 5',
              'cluster.items.length / 12')
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-touch-saturation-once.yml
          git add src/backend/Quantara.Domain/Analysis/DeterministicPriceStructureAnalyzer.cs
          git add src/client/quantara_app/lib/features/market_analysis/data/chart_structure_analyzer.dart
          git commit -m "refactor: align reaction evidence saturation"
          git push origin HEAD:feat/36-multitimeframe-chart-analysis
