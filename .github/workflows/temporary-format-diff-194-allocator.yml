name: Temporary format diff issue 194 allocator

on:
  push:
    branches:
      - feat/issue-194-capital-allocator-foundation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Print formatter diff
        working-directory: src/client/quantara_app
        run: |
          dart format lib/features/capital_allocator/domain/portfolio_capital_allocator.dart test/portfolio_capital_allocator_test.dart
          git diff -- lib/features/capital_allocator/domain/portfolio_capital_allocator.dart test/portfolio_capital_allocator_test.dart
