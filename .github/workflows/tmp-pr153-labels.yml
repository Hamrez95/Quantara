name: Temporary PR153 strategy labels

on:
  push:
    branches:
      - feat/152-professional-strategy-pack

permissions:
  contents: write

jobs:
  labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/152-professional-strategy-pack
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Align labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/core/localization/app_strings.dart')
          text = path.read_text()
          old = """  String strategyName(String name) => switch (name) {
    'trendCandle' => t('کندل‌ستاپ ادامه‌روند', 'Trend candle continuation'),
    'dowContinuation' => t('ادامه سوئینگ داو', 'Dow swing continuation'),
    'kbsmResearch' => t('KBSM شدو هفتگی', 'KBSM weekly shadow'),
    _ => t('زون ساختاری', 'Structure zones'),
  };"""
          new = """  String strategyName(String name) => switch (name) {
    'trendCandle' => t('ستاپ کندلی ارشیا', 'Arshia Candle Setup'),
    'dowContinuation' => t('پولبک روند', 'Trend Pullback'),
    'kbsmResearch' => t('شکست و Retest', 'Breakout + Retest'),
    _ => t('برگشت از رنج', 'Range Reversal'),
  };"""
          if old not in text:
              raise SystemExit('strategy label block not found')
          path.write_text(text.replace(old, new))
          PY
          cd src/client/quantara_app
          dart format lib test
      - name: Commit labels
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib
          git commit -m "fix: align strategy lab labels with professional pack"
          git push origin HEAD:feat/152-professional-strategy-pack
