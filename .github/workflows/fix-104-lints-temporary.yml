name: Temporary #104 lint fix

on:
  push:
    branches:
      - feat/104-regime-playbook-portfolio
    paths:
      - '.github/workflows/fix-104-lints-temporary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/104-regime-playbook-portfolio
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply exact analyzer cleanup
        shell: bash
        run: |
          set -euo pipefail
          cd src/client/quantara_app
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/owner_alpha/data/regime_playbook_portfolio_engine.dart')
          text = path.read_text()
          old = """    final confluence = <String, ChartDirection>{\n      analysis.timeframe: analysis.direction,\n      if (_parentTimeframe(analysis.timeframe) case final parent?)\n        if (runtime.higherTimeframeDirection case final direction?)\n          parent: direction,\n    };\n"""
          new = """    final confluence = <String, ChartDirection>{\n      analysis.timeframe: analysis.direction,\n    };\n    final parent = _parentTimeframe(analysis.timeframe);\n    final higherDirection = runtime.higherTimeframeDirection;\n    if (parent != null && higherDirection != null) {\n      confluence[parent] = higherDirection;\n    }\n"""
          if old not in text:
              raise SystemExit('confluence block not found')
          text = text.replace(old, new, 1)
          text = text.replace('idea!', 'idea')
          text = text.replace(
              '    for (final bonus in bonuses) value += bonus;\n    for (final penalty in penalties) value -= penalty;\n',
              '    for (final bonus in bonuses) {\n      value += bonus;\n    }\n    for (final penalty in penalties) {\n      value -= penalty;\n    }\n',
              1,
          )
          path.write_text(text)
          PY
          dart format lib/features/owner_alpha/data/regime_playbook_portfolio_engine.dart
          flutter pub get
          flutter analyze --fatal-infos
          flutter test test/regime_playbook_portfolio_test.dart test/regime_playbook_discovery_source_test.dart
      - name: Commit validated lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client/quantara_app/lib/features/owner_alpha/data/regime_playbook_portfolio_engine.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(playbooks): satisfy strict analyzer"
          git push origin HEAD:feat/104-regime-playbook-portfolio
