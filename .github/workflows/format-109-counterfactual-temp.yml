name: Temporary format 109 counterfactual

on:
  push:
    branches:
      - feat/109-counterfactual-performance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/109-counterfactual-performance
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Format exact changed files
        run: |
          dart format src/client/quantara_app/lib/features/trading_journal/domain/trading_counterfactual_performance.dart src/client/quantara_app/test/trading_counterfactual_performance_test.dart
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-109-counterfactual-temp.yml
          git add src/client/quantara_app/lib/features/trading_journal/domain/trading_counterfactual_performance.dart src/client/quantara_app/test/trading_counterfactual_performance_test.dart
          git commit -m 'style(analytics): apply Dart formatter'
          git push origin HEAD:feat/109-counterfactual-performance
