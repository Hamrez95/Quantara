name: Temporary Issue 139 patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify and apply complete implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/temporary/issue139.patch.gz.b64 \
            .github/temporary/issue139.patch.part01.b64 \
            .github/temporary/issue139.patch.part02.b64 \
            .github/temporary/issue139.patch.part03.b64 \
            .github/temporary/issue139.patch.part04.b64 \
            .github/temporary/issue139.patch.part05.b64 \
            .github/temporary/issue139.patch.part06.b64 \
            .github/temporary/issue139.patch.part07.b64 \
            .github/temporary/issue139.patch.part08.b64 \
            > /tmp/issue139.patch.gz.b64
          test "$(wc -c < /tmp/issue139.patch.gz.b64)" -eq 19976
          echo '766338acceb2483069772d13aa3cc2b20f63d94e01d89092f56dd8be11a0493f  /tmp/issue139.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/issue139.patch.gz.b64 | gzip --decompress > /tmp/issue139.patch
          echo '6325e5f9f627b9fa8dd3c730e337b2ce7569ec23f46a08f752396806b39119b6  /tmp/issue139.patch' | sha256sum --check
          git apply --check /tmp/issue139.patch
          git apply /tmp/issue139.patch
          rm .github/workflows/temporary-issue139-patch.yml
          rm .github/workflows/temporary-issue139-source-export.yml
          rm -rf .github/temporary

      - name: Format, analyze, and run focused reconciliation tests
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded \
            test/trading_pnl_projection_test.dart \
            test/bitunix_pnl_reconciliation_test.dart \
            test/bitunix_position_protection_reconciliation_test.dart \
            test/auto_trade_account_reconciliation_controller_test.dart \
            test/local_live_trade_models_test.dart \
            test/private_account_reconciliation_test.dart \
            test/auto_trade_readonly_source_test.dart

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile authoritative exchange PnL projection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
