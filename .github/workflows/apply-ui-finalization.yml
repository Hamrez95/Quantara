name: Apply UI finalization patch

on:
  push:
    branches:
      - feat/95-ui-finalization
    paths:
      - scripts/apply_ui_finalization_patch.py
      - .github/workflows/apply-ui-finalization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/95-ui-finalization
          fetch-depth: 0

      - name: Apply deterministic implementation patch
        run: python3 scripts/apply_ui_finalization_patch.py

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Format changed Dart sources
        run: |
          dart format \
            src/client/quantara_app/lib/core/theme/quantara_theme.dart \
            src/client/quantara_app/lib/core/widgets/quantara_ui.dart \
            src/client/quantara_app/lib/core/localization/local_live_message_localizer.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_analysis.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/lib/features/market_analysis/presentation/tradingview_lightweight_chart.dart \
            src/client/quantara_app/test/chart_signal_overlay_policy_test.dart \
            src/client/quantara_app/test/local_live_message_localizer_test.dart \
            src/client/quantara_app/test/quantara_symbol_avatar_test.dart

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize branded market UI and instant setup overlay"
          git push origin HEAD:feat/95-ui-finalization
