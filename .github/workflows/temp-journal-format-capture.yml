name: TEMP journal format capture

on:
  push:
    branches:
      - 'feat/108-journal-replay-redaction'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture canonical formatter diff
        shell: bash
        run: |
          dart format lib test tool
          git diff -- lib test tool
          exit 1
