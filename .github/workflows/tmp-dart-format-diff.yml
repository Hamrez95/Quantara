name: Temporary Dart format diff

on:
  push:
    branches:
      - feat/360-windows-tighten-stop-flutter

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Print canonical formatter diff
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          dart format lib/features/windows_desktop/application/windows_service_management_client.dart \
            lib/features/windows_desktop/data/platform_windows_service_management_command.dart \
            lib/features/windows_desktop/presentation/windows_service_status_pill.dart \
            test/features/windows_desktop/windows_service_tighten_stop_ui_test.dart
          git diff -- \
            lib/features/windows_desktop/application/windows_service_management_client.dart \
            lib/features/windows_desktop/data/platform_windows_service_management_command.dart \
            lib/features/windows_desktop/presentation/windows_service_status_pill.dart \
            test/features/windows_desktop/windows_service_tighten_stop_ui_test.dart
