name: Validate 110 final temporary

on:
  push:
    branches:
      - feat/110-walk-forward-validation-v2
    paths:
      - .github/workflows/validate-110-final-temporary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/110-walk-forward-validation-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format #110 product changes
        working-directory: src/client/quantara_app
        run: dart format lib/features/strategy_lab lib/features/trading_lab/domain/trading_lab_models.dart lib/features/trading_lab/application/trading_lab_canonical_decision.dart lib/features/trading_lab/application/trading_lab_paper_broker.dart test/strategy_lab_runner_test.dart test/strategy_validation_engine_test.dart test/strategy_validation_stress_engine_test.dart test/strategy_promotion_packet_test.dart test/strategy_validation_stage_policy_test.dart test/strategy_validation_safety_source_test.dart test/trading_lab_model_roundtrip_test.dart test/trading_lab_execution_realism_source_test.dart
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Strict analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos
      - name: Full targeted validation gate
        working-directory: src/client/quantara_app
        run: flutter test test/strategy_validation_engine_test.dart test/strategy_validation_stress_engine_test.dart test/strategy_promotion_packet_test.dart test/strategy_validation_stage_policy_test.dart test/strategy_validation_safety_source_test.dart test/strategy_lab_runner_test.dart test/trading_lab_model_roundtrip_test.dart test/trading_lab_execution_realism_source_test.dart test/trading_lab_paper_broker_test.dart test/canonical_decision_pipeline_parity_test.dart test/canonical_decision_runtime_integration_source_test.dart test/trading_lab_shadow_evidence_test.dart test/canonical_decision_shadow_replay_test.dart test/portfolio_risk_atomic_concurrency_test.dart test/portfolio_risk_atomic_rollback_test.dart
      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+Hamrez95@users.noreply.github.com
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git diff --cached --quiet && exit 0
          git commit -m "style(validation): format final promotion gate"
          git push origin HEAD:feat/110-walk-forward-validation-v2
