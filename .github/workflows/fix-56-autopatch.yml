name: Fix signal UX and leverage sizing

on:
  push:
    branches:
      - fix/56-signal-ux-risk-sizing
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/56-signal-ux-risk-sizing

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Apply patch and format
        run: |
          python scripts/fix_56_patch.py
          cd src/client/quantara_app
          dart format lib test

      - name: Commit deterministic patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          if ! git diff --cached --quiet; then
            git commit -m "Fix signal leverage UX and compact analysis selectors"
            git push origin HEAD:fix/56-signal-ux-risk-sizing
          fi
