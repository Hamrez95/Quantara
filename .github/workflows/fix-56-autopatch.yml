name: Fix signal UX and leverage sizing

on:
  push:
    branches:
      - fix/56-signal-ux-risk-sizing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/56-signal-ux-risk-sizing

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Apply bounded inline leverage control and compact selectors
        working-directory: src/client/quantara_app
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path('lib/features/owner_alpha/domain/owner_alpha_models.dart')
          text = models.read_text()
          text = text.replace(
              "final class TradeIdea {\n  const TradeIdea({",
              "final class TradeIdea {\n  static const int maximumManualLeverage = 125;\n\n  const TradeIdea({",
          )
          old = '''  double? marginAt(int leverage) {
              if (!isActionable ||
                  notionalValue == null ||
                  leverage < 1 ||
                  leverage > (maximumSafeLeverage ?? 1)) {
                return null;
              }
              return notionalValue! / leverage;
            }'''
          new = '''  double? marginAt(int leverage) {
              if (!isActionable ||
                  notionalValue == null ||
                  leverage < 1 ||
                  leverage > maximumManualLeverage) {
                return null;
              }
              return notionalValue! / leverage;
            }'''
          if old not in text:
              raise SystemExit('TradeIdea.marginAt block not found')
          models.write_text(text.replace(old, new))

          controller = Path('lib/features/owner_alpha/application/owner_alpha_controller.dart')
          text = controller.read_text()
          old = '''    if (entry == null || leverage < 1 || leverage > entry.maximumSafeLeverage) {
              return;
            }'''
          new = '''    if (entry == null ||
                leverage < 1 ||
                leverage > TradeIdea.maximumManualLeverage) {
              return;
            }'''
          if old not in text:
              raise SystemExit('controller leverage guard not found')
          controller.write_text(text.replace(old, new))

          signals = Path('lib/features/owner_alpha/presentation/owner_alpha_signals.dart')
          text = signals.read_text()
          old = '''            DropdownButtonFormField<int>(
              key: ValueKey(
                'journal-leverage-${entry.setupId}-${entry.selectedLeverage}',
              ),
              initialValue: entry.selectedLeverage,
              decoration: InputDecoration(
                labelText: _t(context, 'اهرم این پوزیشن', 'Position leverage'),
                helperText: _t(
                  context,
                  'پیشنهاد ${entry.recommendedLeverage}x · سقف امن ${entry.maximumSafeLeverage}x',
                  'Suggested ${entry.recommendedLeverage}x · safe cap ${entry.maximumSafeLeverage}x',
                ),
              ),
              items: [
                for (
                  var leverage = 1;
                  leverage <= entry.maximumSafeLeverage;
                  leverage++
                )
                  DropdownMenuItem(
                    value: leverage,
                    child: Text('${leverage}x'),
                  ),
              ],
              onChanged: (value) {
                if (value != null) onLeverageChanged(value);
              },
            ),'''
          new = '''            _LeverageControl(
              selected: entry.selectedLeverage,
              recommended: entry.recommendedLeverage,
              safeCap: entry.maximumSafeLeverage,
              onChanged: onLeverageChanged,
            ),'''
          if old not in text:
              raise SystemExit('signal dropdown block not found')
          text = text.replace(old, new)
          widget = r'''

class _LeverageControl extends StatefulWidget {
  const _LeverageControl({
    required this.selected,
    required this.recommended,
    required this.safeCap,
    required this.onChanged,
  });

  final int selected;
  final int recommended;
  final int safeCap;
  final ValueChanged<int> onChanged;

  @override
  State<_LeverageControl> createState() => _LeverageControlState();
}

class _LeverageControlState extends State<_LeverageControl> {
  late double _draft = widget.selected.toDouble();

  @override
  void didUpdateWidget(covariant _LeverageControl oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (oldWidget.selected != widget.selected) {
      _draft = widget.selected.toDouble();
    }
  }

  bool get _persian => Directionality.of(context) == TextDirection.rtl;

  @override
  Widget build(BuildContext context) {
    final selected = _draft.round().clamp(
      1,
      TradeIdea.maximumManualLeverage,
    );
    final presets = <int>{
      1,
      2,
      3,
      5,
      10,
      20,
      50,
      100,
      widget.recommended,
      widget.safeCap,
      selected,
    }.where((value) => value >= 1 && value <= TradeIdea.maximumManualLeverage)
        .toList(growable: false)
      ..sort();
    final aboveSafe = selected > widget.safeCap;
    final scheme = Theme.of(context).colorScheme;

    return DecoratedBox(
      decoration: BoxDecoration(
        color: scheme.surfaceContainerHighest.withValues(alpha: 0.38),
        borderRadius: BorderRadius.circular(18),
        border: Border.all(
          color: aboveSafe
              ? QuantaraColors.warning.withValues(alpha: 0.65)
              : scheme.outlineVariant,
        ),
      ),
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              children: [
                Expanded(
                  child: Text(
                    _persian ? 'اهرم انتخابی' : 'Selected leverage',
                    style: Theme.of(context).textTheme.titleSmall?.copyWith(
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ),
                StatusPill(
                  label: '${selected}x',
                  color: aboveSafe
                      ? QuantaraColors.warning
                      : QuantaraColors.cyan,
                ),
              ],
            ),
            const SizedBox(height: 6),
            Text(
              _persian
                  ? 'پیشنهاد ${widget.recommended}x · مرز محافظه‌کارانه ${widget.safeCap}x · انتخاب دستی تا ${TradeIdea.maximumManualLeverage}x'
                  : 'Suggested ${widget.recommended}x · conservative boundary ${widget.safeCap}x · manual selection up to ${TradeIdea.maximumManualLeverage}x',
              style: Theme.of(context).textTheme.bodySmall,
            ),
            const SizedBox(height: 12),
            SingleChildScrollView(
              scrollDirection: Axis.horizontal,
              child: Row(
                children: [
                  for (final leverage in presets) ...[
                    ChoiceChip(
                      showCheckmark: false,
                      selected: leverage == selected,
                      label: Text('${leverage}x'),
                      onSelected: (_) {
                        setState(() => _draft = leverage.toDouble());
                        widget.onChanged(leverage);
                      },
                    ),
                    const SizedBox(width: 8),
                  ],
                ],
              ),
            ),
            const SizedBox(height: 8),
            Row(
              children: [
                const Text('1x', textDirection: TextDirection.ltr),
                Expanded(
                  child: Slider(
                    value: selected.toDouble(),
                    min: 1,
                    max: TradeIdea.maximumManualLeverage.toDouble(),
                    divisions: TradeIdea.maximumManualLeverage - 1,
                    label: '${selected}x',
                    onChanged: (value) => setState(() => _draft = value),
                    onChangeEnd: (value) => widget.onChanged(value.round()),
                  ),
                ),
                Text(
                  '${TradeIdea.maximumManualLeverage}x',
                  textDirection: TextDirection.ltr,
                ),
              ],
            ),
            if (aboveSafe) ...[
              const SizedBox(height: 6),
              Row(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Icon(
                    Icons.warning_amber_rounded,
                    size: 20,
                    color: QuantaraColors.warning,
                  ),
                  const SizedBox(width: 8),
                  Expanded(
                    child: Text(
                      _persian
                          ? 'بالاتر از مرز امن مدل انتخاب شده است. اندازه پوزیشن و زیان برنامه‌ریزی‌شده ثابت می‌ماند، اما مارجین کمتر و فاصله تا لیکویید کوتاه‌تر می‌شود.'
                          : 'This is above the model safe boundary. Position notional and planned stop loss stay fixed, but margin is lower and liquidation distance becomes tighter.',
                      style: Theme.of(context).textTheme.bodySmall?.copyWith(
                        color: QuantaraColors.warning,
                        fontWeight: FontWeight.w700,
                      ),
                    ),
                  ),
                ],
              ),
            ],
          ],
        ),
      ),
    );
  }
}
'''
          if 'class _LeverageControl extends StatefulWidget' not in text:
              text += widget
          signals.write_text(text)

          analysis = Path('lib/features/owner_alpha/presentation/owner_alpha_analysis.dart')
          text = analysis.read_text()
          old_symbols = '''              Wrap(
                spacing: 8,
                runSpacing: 8,
                children: [
                  for (final symbol in controller.symbols)
                    ChoiceChip(
                      label: Text(symbol, textDirection: TextDirection.ltr),
                      selected: symbol == controller.selectedSymbol,
                      onSelected: controller.isLoading
                          ? null
                          : (_) => controller.selectSymbol(symbol),
                    ),
                ],
              ),'''
          new_symbols = '''              SingleChildScrollView(
                scrollDirection: Axis.horizontal,
                child: Row(
                  children: [
                    for (final symbol in controller.symbols) ...[
                      ChoiceChip(
                        showCheckmark: false,
                        avatar: Icon(
                          symbol == controller.selectedSymbol
                              ? Icons.bolt_rounded
                              : Icons.show_chart_rounded,
                          size: 18,
                        ),
                        label: Text(
                          symbol,
                          textDirection: TextDirection.ltr,
                          style: const TextStyle(fontWeight: FontWeight.w800),
                        ),
                        selected: symbol == controller.selectedSymbol,
                        onSelected: controller.isLoading
                            ? null
                            : (_) => controller.selectSymbol(symbol),
                      ),
                      const SizedBox(width: 8),
                    ],
                  ],
                ),
              ),'''
          if old_symbols not in text:
              raise SystemExit('symbol selector block not found')
          text = text.replace(old_symbols, new_symbols)

          old_timeframes = '''              Wrap(
                spacing: 8,
                children: [
                  for (final timeframe in OwnerAlphaController.timeframes)
                    ChoiceChip(
                      key: ValueKey('alpha-timeframe-$timeframe'),
                      label: Text(timeframe),
                      selected: timeframe == controller.selectedTimeframe,
                      onSelected: controller.isLoading
                          ? null
                          : (_) => controller.selectTimeframe(timeframe),
                    ),
                ],
              ),'''
          new_timeframes = '''              SingleChildScrollView(
                scrollDirection: Axis.horizontal,
                child: SegmentedButton<String>(
                  showSelectedIcon: false,
                  segments: [
                    for (final timeframe in OwnerAlphaController.timeframes)
                      ButtonSegment(
                        value: timeframe,
                        label: Text(timeframe),
                      ),
                  ],
                  selected: {controller.selectedTimeframe},
                  onSelectionChanged: controller.isLoading
                      ? null
                      : (value) => controller.selectTimeframe(value.single),
                ),
              ),'''
          if old_timeframes not in text:
              raise SystemExit('timeframe selector block not found')
          text = text.replace(old_timeframes, new_timeframes)

          old_dropdown = '''                    DropdownButtonFormField<int>(
                      key: ValueKey(
                        'leverage-${idea.setupId}-$selectedLeverage',
                      ),
                      initialValue: selectedLeverage,
                      decoration: InputDecoration(
                        labelText: persian
                            ? 'اهرم انتخابی'
                            : 'Selected leverage',
                        helperText: persian
                            ? 'پیشنهاد اپ ${idea.recommendedLeverage}x · سقف امن ${idea.maximumSafeLeverage}x'
                            : 'Suggested ${idea.recommendedLeverage}x · safe cap ${idea.maximumSafeLeverage}x',
                      ),
                      items: [
                        for (
                          var leverage = 1;
                          leverage <= idea.maximumSafeLeverage!;
                          leverage++
                        )
                          DropdownMenuItem(
                            value: leverage,
                            child: Text('${leverage}x'),
                          ),
                      ],
                      onChanged: (leverage) {
                        if (leverage != null) {
                          controller.setSignalLeverage(idea.setupId, leverage);
                        }
                      },
                    ),'''
          new_dropdown = '''                    _LeverageControl(
                      selected: selectedLeverage,
                      recommended: idea.recommendedLeverage!,
                      safeCap: idea.maximumSafeLeverage!,
                      onChanged: (leverage) =>
                          controller.setSignalLeverage(idea.setupId, leverage),
                    ),'''
          if old_dropdown not in text:
              raise SystemExit('analysis leverage dropdown block not found')
          analysis.write_text(text.replace(old_dropdown, new_dropdown))

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text().replace('version: 0.11.0+12', 'version: 0.11.1+13')
          pubspec.write_text(text)

          test = Path('test/leverage_selection_test.dart')
          test.write_text(r'''import 'package:flutter_test/flutter_test.dart';
import 'package:quantara_app/features/owner_alpha/domain/owner_alpha_models.dart';

void main() {
  test('manual leverage changes margin without changing planned risk', () {
    final idea = TradeIdea(
      symbol: 'BTCUSDT',
      timeframe: '1h',
      direction: TradeDirection.long,
      confidencePercent: 80,
      entryLower: 99,
      entryUpper: 100,
      stopLoss: 95,
      targets: const [105, 110, 115],
      riskReward: 1.5,
      maximumLoss: 100,
      positionSize: 10,
      notionalValue: 10000,
      recommendedLeverage: 5,
      maximumSafeLeverage: 8,
      requiredMargin: 2000,
      estimatedRoundTripCosts: 5,
      setupId: 'manual-leverage-test',
      candleClosedAt: DateTime.utc(2026, 1, 1),
      summary: 'test',
      invalidation: 'test',
      reasons: const ['test'],
    );

    expect(idea.marginAt(5), 2000);
    expect(idea.marginAt(50), 200);
    expect(idea.marginAt(125), 80);
    expect(idea.marginAt(126), isNull);
    expect(idea.notionalValue, 10000);
    expect(idea.maximumLoss, 100);
  });
}
''')

          source_test = Path('test/signal_leverage_ui_source_test.dart')
          source_test.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('signal leverage uses bounded inline controls instead of dropdown menus', () {
    final signals = File(
      'lib/features/owner_alpha/presentation/owner_alpha_signals.dart',
    ).readAsStringSync();
    final analysis = File(
      'lib/features/owner_alpha/presentation/owner_alpha_analysis.dart',
    ).readAsStringSync();

    expect(signals, contains('class _LeverageControl extends StatefulWidget'));
    expect(signals, isNot(contains('DropdownButtonFormField<int>')));
    expect(analysis, isNot(contains('DropdownButtonFormField<int>')));
    expect(analysis, contains('SegmentedButton<String>'));
  });
}
''')
          PY

          dart format lib test

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          if ! git diff --cached --quiet; then
            git commit -m "Fix signal leverage UX and compact analysis selectors"
            git push origin HEAD:fix/56-signal-ux-risk-sizing
          fi
