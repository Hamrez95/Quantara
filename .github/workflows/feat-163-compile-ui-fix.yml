name: Temporary feature 163 compile and UI fix

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/feat-163-compile-ui-fix.yml'
      - '.github/scripts/feat163_compile_ui_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply compile and UI patch
        run: |
          if grep -q "Maximum concurrent positions" \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart; then
            echo "Compile and UI patch is already applied."
            exit 0
          fi
          python3 .github/scripts/feat163_compile_ui_fix.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format changed files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart
          lib/features/auto_trade/application/local_live_trade_service.dart
          lib/features/auto_trade/data/local_live_preferences_store.dart
          lib/features/auto_trade/domain/local_live_trade_models.dart
          lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No compile or UI changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "feat(local-live): expose portfolio-budgeted position slots [feat163-compile-ui]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
