name: Format 488 exact

on:
  push:
    branches:
      - feat/488-guarded-auto-operational-state

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format and print exact test
        run: |
          dart format test/guarded_auto_operational_controller_test.dart
          echo '---EXACT-FILE-BEGIN---'
          cat test/guarded_auto_operational_controller_test.dart
          echo '---EXACT-FILE-END---'
