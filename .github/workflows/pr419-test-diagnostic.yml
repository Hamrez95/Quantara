name: PR 419 widget test diagnostic

on:
  push:
    branches:
      - feat/360-windows-management-control-ui

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: explicit close confirmation
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter test test/features/windows_desktop/windows_service_status_pill_test.dart --plain-name 'management-only state requires explicit close confirmation'
      - name: invalid position id
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter test test/features/windows_desktop/windows_service_status_pill_test.dart --plain-name 'management UI does not call helper for invalid position id'
      - name: canonical failed close
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter test test/features/windows_desktop/windows_service_status_pill_test.dart --plain-name 'canonical failed close is not retried or presented as success'
      - name: non-management mutation control
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter test test/features/windows_desktop/windows_service_status_pill_test.dart --plain-name 'non-management state cannot open mutation control'
      - name: remaining status tests
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter test test/features/windows_desktop/windows_service_status_pill_test.dart --plain-name 'surfaces management-only state without entry authority'
