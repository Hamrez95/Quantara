name: Apply issue 129 fix once

on:
  pull_request:
    branches:
      - release/1.2.0-rc.1
    paths:
      - 'scripts/apply-129-fix.py'
      - '.github/workflows/apply-129-fix-once.yml'
      - 'docs/v1.2/issue-129-fix-trigger.md'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply guarded malformed-OHLC isolation
        run: python scripts/apply-129-fix.py

      - name: Format changed Dart sources
        working-directory: src/client/quantara_app
        run: dart format lib test

      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-129-fix.py
          rm .github/workflows/apply-129-fix-once.yml
          rm docs/v1.2/issue-129-fix-trigger.md

      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: isolate malformed Bitunix bootstrap streams'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
