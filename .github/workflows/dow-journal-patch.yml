name: Dow journal patch

on:
  push:
    branches:
      - feat/534-dow-journal-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/534-dow-journal-parity
          fetch-depth: 0
      - name: Patch canonical reason-code propagation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/decision_core/domain/canonical_decision_models.dart')
          text = path.read_text()
          old = """        reasonCodes: [
          'strategy:${idea.strategy.name}',
          'regime:${idea.marketRegime.name}',
          'rejection:${idea.rejectionReason.name}',
        ],
"""
          new = """        reasonCodes: [
          'strategy:${idea.strategy.name}',
          'regime:${idea.marketRegime.name}',
          'rejection:${idea.rejectionReason.name}',
          ...idea.reasons.where((reason) => reason.startsWith('dow:')),
          if (idea.contextVersion.contains('dow-'))
            'dow:context:${idea.contextVersion}',
        ],
"""
          if old not in text:
              raise SystemExit('canonical reason-code anchor not found')
          path.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/dow-journal-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(dow): preserve structural provenance in canonical plan'
          git push origin HEAD:feat/534-dow-journal-parity
