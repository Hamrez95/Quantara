name: Patch 107 entry stop coverage

on:
  push:
    branches:
      - fix/107-entry-stop-coverage
    paths:
      - .github/workflows/patch-107-entry-stop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/107-entry-stop-coverage
      - name: Apply exact fail-closed source transform
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../domain/exchange_position_ownership.dart';\n",
              "import '../domain/exchange_position_ownership.dart';\nimport '../domain/full_position_stop_policy.dart';\n",
          )

          replace_once(
              "          var protections = await exchange.fetchPendingProtection(\n",
              "          final quantityTolerance = math\n              .pow(10, -rules.quantityPrecision)\n              .toDouble();\n          bool fullStopConfirmedBy(List<BitunixPendingProtection> evidence) =>\n              evidence.any(\n                (item) => FullPositionStopPolicy.isConfirmed(\n                  evidencePositionId: item.positionId,\n                  expectedPositionId: position.positionId,\n                  stopLossPrice: item.stopLossPrice,\n                  stopLossQuantity: item.stopLossQuantity,\n                  remainingQuantity: quantity,\n                  quantityTolerance: quantityTolerance,\n                ),\n              );\n          var protections = await exchange.fetchPendingProtection(\n",
          )

          replace_once(
              "          var stopOrderId = protections\n              .where((item) => item.stopLossPrice > 0)\n              .map((item) => item.orderId)\n              .firstOrNull;\n",
              "          var stopOrderId = protections\n              .where(\n                (item) => FullPositionStopPolicy.isConfirmed(\n                  evidencePositionId: item.positionId,\n                  expectedPositionId: position.positionId,\n                  stopLossPrice: item.stopLossPrice,\n                  stopLossQuantity: item.stopLossQuantity,\n                  remainingQuantity: quantity,\n                  quantityTolerance: quantityTolerance,\n                ),\n              )\n              .map((item) => item.orderId)\n              .firstOrNull;\n",
          )

          replace_once(
              "          if (!protections.any((item) => item.stopLossPrice > 0)) {\n",
              "          if (!fullStopConfirmedBy(protections)) {\n",
          )

          old_loop = """              final fullStopConfirmed = confirmedProtection.any(\n                (item) => item.stopLossPrice > 0,\n              );\n"""
          if text.count(old_loop) != 1:
              raise SystemExit(f'expected one loop stop confirmation, found {text.count(old_loop)}')
          text = text.replace(
              old_loop,
              "              final fullStopConfirmed = fullStopConfirmedBy(confirmedProtection);\n",
              1,
          )

          replace_once(
              "            final fullStopConfirmed = confirmedProtection.any(\n              (item) => item.stopLossPrice > 0,\n            );\n",
              "            final fullStopConfirmed = fullStopConfirmedBy(confirmedProtection);\n",
          )

          replace_once(
              "              item.positionId == managed.positionId &&\n              item.stopLossPrice > 0 &&\n              (item.stopLossQuantity <= 0 ||\n                  item.stopLossQuantity + quantityTolerance >=\n                      remainingQuantity),\n",
              "              FullPositionStopPolicy.isConfirmed(\n                evidencePositionId: item.positionId,\n                expectedPositionId: managed.positionId,\n                stopLossPrice: item.stopLossPrice,\n                stopLossQuantity: item.stopLossQuantity,\n                remainingQuantity: remainingQuantity,\n                quantityTolerance: quantityTolerance,\n              ),\n",
          )

          path.write_text(text)
      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-107-entry-stop.yml
          git config user.name "quantara-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart .github/workflows/patch-107-entry-stop.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "fix(auto-trade): require full-position stop evidence"
          git push origin HEAD:fix/107-entry-stop-coverage
