name: Patch 193 hot path temporary
on:
  push:
    branches: [feat/193-private-ws-hot-path-v2]
    paths: [.github/workflows/patch-193-hot-path-temporary.yml]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/193-private-ws-hot-path-v2
      - name: Apply hot-path integration
        run: python3 .github/scripts/patch_193_hot_path.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/data/bitunix_local_live_api_client.dart lib/features/auto_trade/application/local_live_trade_service.dart lib/features/auto_trade/application/private_truth_account_snapshot.dart test/private_truth_account_snapshot_test.dart
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Strict analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos
      - name: Private truth Hot Path tests
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/bitunix_private_ws_protocol_test.dart
          test/bitunix_private_websocket_client_test.dart
          test/private_truth_reducer_test.dart
          test/private_truth_reconciler_test.dart
          test/private_truth_coordinator_test.dart
          test/private_truth_account_snapshot_test.dart
      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+Hamrez95@users.noreply.github.com
          git add src/client/quantara_app/lib/features/auto_trade/data/bitunix_local_live_api_client.dart src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart src/client/quantara_app/lib/features/auto_trade/application/private_truth_account_snapshot.dart src/client/quantara_app/test/private_truth_account_snapshot_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(auto-trade): route Local Live through private WS hot truth (#193)"
          git push origin HEAD:feat/193-private-ws-hot-path-v2
