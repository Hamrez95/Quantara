name: Temporary feature 163 service phase two

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[feat163-service-phase2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply atomic entry lifecycle patches
        run: |
          python3 .github/scripts/feat163_runtime_live_gate.py
          python3 .github/scripts/feat163_service_phase2.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format phase two
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/auto_trade/application/local_live_trade_service.dart
          lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart
          lib/features/auto_trade/application/local_live_portfolio_execution_guard.dart
      - name: Commit phase two
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "feat(local-live): reserve risk before concurrent live orders [feat163-service-phase2]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
