name: Temporary issue 165 physical canary fix

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: feat-165-physical-canary-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply core fix
        run: python3 .github/scripts/feat165_patch_core.py
      - name: Apply UI and regression fix
        run: python3 .github/scripts/feat165_patch_ui_tests.py
      - name: Normalize lint-sensitive output
        run: python3 .github/scripts/feat165_patch_lints.py
      - name: Correct ambiguity fixture
        run: python3 .github/scripts/feat165_patch_test_fixture.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format patch
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze patch
        working-directory: src/client/quantara_app
        run: flutter analyze
      - name: Run physical canary regressions
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/bitunix_pnl_mapper_physical_canary_test.dart
          test/trading_journal_foreground_merge_test.dart
          test/physical_canary_regression_source_test.dart
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'fix: reconcile physical stop closures and journal truth (#165)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
