name: Temporary format fix 109

on:
  push:
    branches:
      - feat/109-journal-performance-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/109-journal-performance-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format journal view
        working-directory: src/client/quantara_app
        run: dart format lib/features/trading_journal/presentation/trading_journal_view.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_view.dart
          git commit -m "style(journal): apply dart formatter"
          git push origin HEAD:feat/109-journal-performance-ui
