name: Temporary format 109

on:
  push:
    branches:
      - feat/issue-109-lightweight-analytics

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-109-lightweight-analytics
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: |
          dart format src/client/quantara_app/lib/features/trading_journal/domain/trading_journal_performance_summary.dart src/client/quantara_app/test/trading_journal_performance_summary_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_journal/domain/trading_journal_performance_summary.dart src/client/quantara_app/test/trading_journal_performance_summary_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(analytics): apply canonical Dart formatting"
          git push origin HEAD:feat/issue-109-lightweight-analytics
