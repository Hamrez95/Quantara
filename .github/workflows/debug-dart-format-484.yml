name: Debug Dart Format 484
on:
  push:
    branches:
      - feat/484-evaluation-observability-contract
jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - run: dart format test/strategy_evaluation_observability_test.dart
      - name: Print canonical diff
        run: git diff -- test/strategy_evaluation_observability_test.dart
