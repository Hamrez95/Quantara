name: Fix 107 nullable position capture

on:
  push:
    branches:
      - fix/107-entry-stop-coverage
    paths:
      - .github/workflows/fix-107-nullability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/107-entry-stop-coverage
      - name: Pin confirmed position id before local closure
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          text = path.read_text()
          marker = """          final quantityTolerance = math\n              .pow(10, -rules.quantityPrecision)\n              .toDouble();\n          bool fullStopConfirmedBy"""
          replacement = """          final quantityTolerance = math\n              .pow(10, -rules.quantityPrecision)\n              .toDouble();\n          final protectedPositionId = position.positionId;\n          bool fullStopConfirmedBy"""
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one quantity-tolerance marker, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          needle = 'expectedPositionId: position.positionId'
          if text.count(needle) != 2:
              raise SystemExit(f'Expected two nullable position references, found {text.count(needle)}')
          text = text.replace(needle, 'expectedPositionId: protectedPositionId')
          path.write_text(text)
      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-107-nullability.yml
          git config user.name "quantara-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart .github/workflows/fix-107-nullability.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No nullability fix produced"; exit 1; }
          git commit -m "fix(auto-trade): pin protected position identity"
          git push origin HEAD:fix/107-entry-stop-coverage
