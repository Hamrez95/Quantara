name: Temporary issue 107 runtime patch

on:
  push:
    branches:
      - fix/107-bind-entry-stop-price

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-stop-price-runtime]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/107-bind-entry-stop-price

      - name: Bind entry stop confirmation to canonical price
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          text = source.read_text(encoding='utf-8')

          anchor = (
              '          final quantityTolerance = math\n'
              '              .pow(10, -rules.quantityPrecision)\n'
              '              .toDouble();\n'
              '          final protectedPositionId = position.positionId;\n'
          )
          replacement = (
              '          final quantityTolerance = math\n'
              '              .pow(10, -rules.quantityPrecision)\n'
              '              .toDouble();\n'
              '          final priceTolerance =\n'
              '              math.pow(10, -rules.pricePrecision).toDouble() / 2;\n'
              '          final protectedPositionId = position.positionId;\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one entry tolerance anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          call = (
              '                  expectedPositionId: protectedPositionId,\n'
              '                  stopLossPrice: item.stopLossPrice,\n'
              '                  stopLossQuantity: item.stopLossQuantity,\n'
              '                  remainingQuantity: quantity,\n'
              '                  quantityTolerance: quantityTolerance,\n'
              '                ),\n'
          )
          bound_call = (
              '                  expectedPositionId: protectedPositionId,\n'
              '                  stopLossPrice: item.stopLossPrice,\n'
              '                  stopLossQuantity: item.stopLossQuantity,\n'
              '                  remainingQuantity: quantity,\n'
              '                  quantityTolerance: quantityTolerance,\n'
              '                  expectedStopLossPrice: stopLoss,\n'
              '                  priceTolerance: priceTolerance,\n'
              '                ),\n'
          )
          if text.count(call) != 2:
              raise SystemExit(f'expected exactly two entry stop confirmation calls, found {text.count(call)}')
          text = text.replace(call, bound_call)
          source.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart
          git commit -m "fix(auto-trade): verify intended entry stop price"
          git push origin HEAD:fix/107-bind-entry-stop-price
