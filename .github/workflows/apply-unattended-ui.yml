name: Apply unattended UI integration

on:
  push:
    branches:
      - feat/72-unattended-live-engine
    paths:
      - .github/workflows/apply-unattended-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/72-unattended-live-engine
      - name: Patch owner UI integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          page_path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          page = page_path.read_text()
          page = replace_once(
              page,
              "import '../../auto_trade/application/auto_trade_controller.dart';\n",
              "import '../../auto_trade/application/auto_trade_controller.dart';\nimport '../../auto_trade/application/unattended_auto_trade_controller.dart';\n",
              'controller import',
          )
          page = replace_once(
              page,
              "import '../../auto_trade/data/secure_auto_trade_credentials_store.dart';\n",
              "import '../../auto_trade/data/secure_auto_trade_credentials_store.dart';\nimport '../../auto_trade/data/secure_auto_trade_server_config_store.dart';\nimport '../../auto_trade/data/unattended_auto_trade_api_client.dart';\n",
              'data imports',
          )
          page = replace_once(
              page,
              "import '../../auto_trade/domain/auto_trade_models.dart';\n",
              "import '../../auto_trade/domain/auto_trade_models.dart';\nimport '../../auto_trade/domain/unattended_auto_trade_models.dart';\n",
              'model import',
          )
          page = replace_once(
              page,
              "part 'owner_alpha_auto_trade.dart';\n",
              "part 'owner_alpha_auto_trade.dart';\npart 'owner_alpha_auto_trade_unattended.dart';\n",
              'part file',
          )
          page = replace_once(
              page,
              "  late final OwnerAlphaController _controller = OwnerAlphaController(\n",
              "  late final UnattendedAutoTradeController\n      _unattendedAutoTradeController = UnattendedAutoTradeController(\n        apiClient: UnattendedAutoTradeApiClient(client: _autoTradeHttpClient),\n        configStore: const SecureAutoTradeServerConfigStore(),\n      );\n  late final OwnerAlphaController _controller = OwnerAlphaController(\n",
              'controller instance',
          )
          page = replace_once(
              page,
              "    unawaited(_autoTradeController.initialize());\n",
              "    unawaited(_autoTradeController.initialize());\n    unawaited(_unattendedAutoTradeController.initialize());\n",
              'initialize controller',
          )
          page = replace_once(
              page,
              "    _autoTradeController.dispose();\n",
              "    _autoTradeController.dispose();\n    _unattendedAutoTradeController.dispose();\n",
              'dispose controller',
          )
          page = replace_once(
              page,
              "            autoTradeController: _autoTradeController,\n",
              "            autoTradeController: _autoTradeController,\n            unattendedAutoTradeController: _unattendedAutoTradeController,\n",
              'pass body controller',
          )
          page = replace_once(
              page,
              "    required this.autoTradeController,\n",
              "    required this.autoTradeController,\n    required this.unattendedAutoTradeController,\n",
              'body constructor',
          )
          page = replace_once(
              page,
              "  final AutoTradeController autoTradeController;\n",
              "  final AutoTradeController autoTradeController;\n  final UnattendedAutoTradeController unattendedAutoTradeController;\n",
              'body field',
          )
          page = replace_once(
              page,
              "                      controller: autoTradeController,\n                      analysisController: controller,\n",
              "                      controller: autoTradeController,\n                      unattendedController: unattendedAutoTradeController,\n                      analysisController: controller,\n",
              'pass view controller',
          )
          page_path.write_text(page)

          auto_path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          auto = auto_path.read_text()
          auto = replace_once(
              auto,
              "    required this.controller,\n    required this.analysisController,\n",
              "    required this.controller,\n    required this.unattendedController,\n    required this.analysisController,\n",
              'view constructor',
          )
          auto = replace_once(
              auto,
              "  final AutoTradeController controller;\n  final OwnerAlphaController analysisController;\n",
              "  final AutoTradeController controller;\n  final UnattendedAutoTradeController unattendedController;\n  final OwnerAlphaController analysisController;\n",
              'view field',
          )
          auto = replace_once(
              auto,
              "          children: [\n            SectionCard(\n",
              "          children: [\n            _UnattendedAutoTradeControlCard(\n              controller: unattendedController,\n              accountController: controller,\n              analysisController: analysisController,\n            ),\n            const SizedBox(height: 16),\n            SectionCard(\n",
              'control card insertion',
          )
          auto_path.write_text(auto)

          workflow = Path('.github/workflows/apply-unattended-ui.yml')
          workflow.unlink()
          PY
          dart format src/client/quantara_app/lib/features/auto_trade src/client/quantara_app/lib/features/owner_alpha/presentation
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "quantara-release-bot"
          git config user.email "quantara-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate unattended Start and Stop controls"
          git push origin HEAD:feat/72-unattended-live-engine
