name: Normalize cockpit API slice once

on:
  push:
    branches:
      - feat/31-readonly-cockpit-api
    paths:
      - .github/workflows/normalize-cockpit-api-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/31-readonly-cockpit-api
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Normalize .NET files
        run: |
          dotnet restore Quantara.sln
          dotnet format whitespace Quantara.sln --no-restore
      - name: Normalize Flutter files and lock dependencies
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib test
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-cockpit-api-once.yml
          git add src tests scripts Quantara.sln .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize cockpit API and Flutter adapter"
          git push origin HEAD:feat/31-readonly-cockpit-api
