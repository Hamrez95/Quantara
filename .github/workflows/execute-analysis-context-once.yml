name: Execute realtime analysis context once

on:
  push:
    branches:
      - feat/101-realtime-analysis-context

permissions:
  contents: write

jobs:
  execute-format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-analysis-context
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Execute migration, format, and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/add-realtime-analysis-context-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'analysis_context_migration.py', 'exec'))
          PY

          cd src/client/quantara_app
          dart format lib/features/owner_alpha/domain/realtime_market_runtime_models.dart lib/features/owner_alpha/data/realtime_market_application.dart test/realtime_market_application_test.dart test/realtime_market_application_e2e_test.dart test/realtime_market_analysis_context_test.dart
          cd ../../..
          git rm .github/workflows/add-realtime-analysis-context-once.yml
          git rm .github/workflows/execute-analysis-context-once.yml
          git add src/client/quantara_app/lib/features/owner_alpha/domain/realtime_market_runtime_models.dart
          git add src/client/quantara_app/lib/features/owner_alpha/data/realtime_market_application.dart
          git add src/client/quantara_app/test/realtime_market_application_test.dart
          git add src/client/quantara_app/test/realtime_market_application_e2e_test.dart
          git add src/client/quantara_app/test/realtime_market_analysis_context_test.dart
          git diff --cached --check

      - name: Commit clean analysis context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantara-ci"
          git config user.email "quantara-ci@users.noreply.github.com"
          git commit -m "feat: provide full realtime analysis snapshots"
          git push origin HEAD:feat/101-realtime-analysis-context
