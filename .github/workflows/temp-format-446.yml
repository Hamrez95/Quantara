name: Temporary Dart formatter for #446

on:
  push:
    branches:
      - feat/446-supervisor-session-surface
    paths:
      - '.github/workflows/temp-format-446.yml'
      - 'src/client/quantara_app/lib/features/ai_supervisor/presentation/supervisor_connection_panel.dart'
      - 'src/client/quantara_app/test/ai_supervisor_connection_panel_test.dart'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/446-supervisor-session-surface
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply canonical formatter
        working-directory: src/client/quantara_app
        run: dart format lib/features/ai_supervisor/presentation/supervisor_connection_panel.dart test/ai_supervisor_connection_panel_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client/quantara_app/lib/features/ai_supervisor/presentation/supervisor_connection_panel.dart src/client/quantara_app/test/ai_supervisor_connection_panel_test.dart
          git commit -m "style(AI): apply canonical Dart formatter"
          git push origin HEAD:feat/446-supervisor-session-surface
