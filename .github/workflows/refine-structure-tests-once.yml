name: Refine structure tests once

on:
  push:
    branches:
      - feat/36-multitimeframe-chart-analysis
    paths:
      - .github/workflows/refine-structure-tests-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/36-multitimeframe-chart-analysis
      - name: Refine deterministic assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/backend/Quantara.Domain.Tests/DeterministicPriceStructureAnalyzerTests.cs')
          text = path.read_text()
          text = text.replace(
              'public void MoreConfirmedTouchesIncreaseZoneStrength()\n',
              'public void MoreConfirmedTouchesIncreaseZoneStrengthBeforeSaturation()\n')
          old = '''var shorter = Analyzer.Analyze(
              PriceStructureTestData.CreateWaveCandles(48),
              specification);
          var longer = Analyzer.Analyze(
              PriceStructureTestData.CreateWaveCandles(120),
              specification);'''
          new = '''var shorter = Analyzer.Analyze(
              PriceStructureTestData.CreateWaveCandles(24),
              specification);
          var longer = Analyzer.Analyze(
              PriceStructureTestData.CreateWaveCandles(48),
              specification);'''
          text = text.replace(old, new)
          path.write_text(text)

          path = Path('tests/backend/Quantara.Domain.Tests/MultiTimeframePriceStructureAnalyzerTests.cs')
          text = path.read_text()
          old = '        Assert.Equal(first.Analysis.Zones, second.Analysis.Zones);\n'
          new = '''        Assert.Equal(first.Analysis.Zones.Count, second.Analysis.Zones.Count);
          for (var index = 0; index < first.Analysis.Zones.Count; index++)
          {
              var expected = first.Analysis.Zones[index];
              var actual = second.Analysis.Zones[index];
              Assert.Equal(expected.Lower, actual.Lower);
              Assert.Equal(expected.Upper, actual.Upper);
              Assert.Equal(expected.Center, actual.Center);
              Assert.Equal(expected.Role, actual.Role);
              Assert.Equal(expected.TimeframeCount, actual.TimeframeCount);
              Assert.Equal(expected.Timeframes, actual.Timeframes);
              Assert.Equal(expected.Strength, actual.Strength);
              Assert.Equal(expected.DistancePercent, actual.DistancePercent);
              Assert.Equal(expected.Explanation, actual.Explanation);
          }
'''
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-structure-tests-once.yml
          git add tests/backend/Quantara.Domain.Tests
          git commit -m "test: refine price structure assertions"
          git push origin HEAD:feat/36-multitimeframe-chart-analysis
