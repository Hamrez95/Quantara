name: Temporary patch issue 104

on:
  push:
    branches:
      - feat/104-regime-playbook-portfolio

concurrency:
  group: issue-104-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/104-regime-playbook-portfolio
      - name: Apply playbook integration
        run: python3 .github/scripts/patch_104.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format and run targeted tests
        run: |
          cd src/client/quantara_app
          dart format lib/features/owner_alpha/domain/owner_alpha_models.dart lib/features/owner_alpha/domain/regime_playbook_models.dart lib/features/owner_alpha/domain/realtime_candidate_models.dart lib/features/owner_alpha/data/regime_playbook_portfolio_engine.dart lib/features/owner_alpha/data/regime_playbook_conflict_resolver.dart lib/features/owner_alpha/data/opportunity_discovery_universe.dart test/regime_playbook_portfolio_test.dart test/regime_playbook_discovery_source_test.dart
          set +e
          flutter test test/regime_playbook_portfolio_test.dart test/regime_playbook_discovery_source_test.dart 2>&1 | tee /tmp/issue-104-tests.log
          echo "${PIPESTATUS[0]}" > /tmp/issue-104-tests.status
          exit 0
      - name: Upload issue 104 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-104-targeted-${{ github.sha }}
          path: |
            /tmp/issue-104-tests.log
            /tmp/issue-104-tests.status
      - name: Commit integrated playbooks
        run: |
          if [ "$(cat /tmp/issue-104-tests.status)" != "0" ]; then
            echo "Targeted playbook tests failed; refusing to commit."
            exit 1
          fi
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "feat(playbooks): integrate regime portfolio into discovery"
          git push origin HEAD:feat/104-regime-playbook-portfolio
