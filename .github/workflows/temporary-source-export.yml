name: Temporary Issue 134 patch applicator

on:
  push:
    branches:
      - fix/134-authoritative-account-reconciliation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: fix/134-authoritative-account-reconciliation
          fetch-depth: 0

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply implementation, format, and remove temporary tooling
        shell: bash
        env:
          ISSUE_134_PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_134_PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/issue-134.patch
          git apply --check /tmp/issue-134.patch
          git apply /tmp/issue-134.patch
          git fetch origin dev --depth=1
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          rm .github/workflows/temporary-source-export.yml
          cd src/client/quantara_app
          flutter pub get
          dart format lib test
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add authoritative private-account reconciliation'
          git push origin HEAD:fix/134-authoritative-account-reconciliation
