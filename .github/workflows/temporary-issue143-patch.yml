name: Temporary Issue 143 patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify and apply Issue 143 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/temporary/issue143.patch.part00.b64 \
            .github/temporary/issue143.patch.part01.b64 \
            .github/temporary/issue143.patch.part02.b64 \
            .github/temporary/issue143.patch.part03.b64 \
            > /tmp/issue143.patch.gz.b64
          test "$(wc -c < /tmp/issue143.patch.gz.b64)" -eq 21720
          echo 'd7e7e691b8dd08bdb7436bb5cf37747ee6ecff5a8f8500df350bdd810e171a6d  /tmp/issue143.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/issue143.patch.gz.b64 | gzip --decompress > /tmp/issue143.patch
          echo '2e2c84800485abb7e0f613ff753315c8ce87442618a3c6f8fe25a23743e2b508  /tmp/issue143.patch' | sha256sum --check
          git apply --check /tmp/issue143.patch
          git apply /tmp/issue143.patch
          rm .github/workflows/temporary-issue143-patch.yml
          rm .github/workflows/temporary-issue143-source-export.yml
          rm -rf .github/temporary

      - name: Format, analyze, and run focused safety tests
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded \
            test/configurable_tp_allocation_test.dart \
            test/exchange_confirmed_profit_lock_test.dart \
            test/tp_allocation_editor_test.dart \
            test/profit_lock_source_safety_test.dart \
            test/profit_protection_policy_test.dart \
            test/local_live_preferences_store_test.dart \
            test/local_live_trade_models_test.dart \
            test/trading_pnl_projection_test.dart \
            test/bitunix_position_protection_reconciliation_test.dart \
            test/auto_trade_readonly_source_test.dart

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: configure TP allocation and confirm profit-lock stop promotion'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
