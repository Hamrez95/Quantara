name: Release strategy autofix

on:
  push:
    branches:
      - release/0.11.0-strategy-engine

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.11.0-strategy-engine

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Apply analyzer fixes and format
        working-directory: src/client/quantara_app
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/owner_alpha/data/advanced_strategy_engine.dart')
          text = path.read_text()
          text = text.replace('final longZone = support!;', 'final longZone = support;')
          text = text.replace('final shortZone = resistance!;', 'final shortZone = resistance;')
          text = text.replace('zone = support!;', 'zone = support;')
          path.write_text(text)
          PY
          dart format lib/features/owner_alpha/data/advanced_strategy_engine.dart

      - name: Commit deterministic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/owner_alpha/data/advanced_strategy_engine.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix strategy engine nullability warnings"
            git push origin HEAD:release/0.11.0-strategy-engine
          fi
