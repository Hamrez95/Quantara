name: Temporary Issue 172 unsigned Android payload

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-issue-172-unsigned-android.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_VERSION: '3.44.8'
      SOURCE_SHA: 8ddd490bd8908ab6a0ac36492b12ce47dfe1ec4f
      ANDROID_PACKAGE: com.quantara.quantara_app.alpha
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare isolated unsigned Preview build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/quantara_app/android/app/build.gradle.kts')
          s = p.read_text()
          marker = "                else -> {\n                    throw GradleException("
          start = s.find(marker)
          if start < 0:
              raise SystemExit('fail-closed release marker not found')
          end_marker = "\n                }\n"
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('fail-closed release block end not found')
          end += len(end_marker)
          i16 = ' ' * 16
          i20 = ' ' * 20
          replacement = (
              f'{i16}else -> {{\n'
              f'{i20}// One-shot CI transport only; never committed to product code.\n'
              f'{i20}applicationIdSuffix = ".alpha"\n'
              f'{i20}versionNameSuffix = "-preview"\n'
              f'{i20}signingConfig = null\n'
              f'{i16}}}\n'
          )
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check
          grep -Fq 'signingConfig = null' src/client/quantara_app/android/app/build.gradle.kts
          git diff -- src/client/quantara_app/android/app/build.gradle.kts
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Build unsigned universal Preview payload
        working-directory: src/client/quantara_app
        run: flutter build apk --release
      - name: Build unsigned ABI Preview payloads
        working-directory: src/client/quantara_app
        run: flutter build apk --release --split-per-abi
      - name: Collect and verify unsigned payloads and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/tools/lib
          universal="$(find src/client/quantara_app/build/app/outputs/flutter-apk -maxdepth 1 -type f \( -name 'app-release.apk' -o -name 'app-release-unsigned.apk' \) -print -quit)"
          arm64="$(find src/client/quantara_app/build/app/outputs/flutter-apk -maxdepth 1 -type f \( -name 'app-arm64-v8a-release.apk' -o -name 'app-arm64-v8a-release-unsigned.apk' \) -print -quit)"
          test -n "$universal" && test -f "$universal"
          test -n "$arm64" && test -f "$arm64"
          cp "$universal" transport/quantara-issue172-universal-unsigned.apk
          cp "$arm64" transport/quantara-issue172-arm64-v8a-unsigned.apk
          apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$apkanalyzer_path" && test -x "$apksigner_path" && test -x "$zipalign_path"
          "$apkanalyzer_path" manifest application-id "$universal" | grep -Fxq "$ANDROID_PACKAGE"
          "$apkanalyzer_path" manifest application-id "$arm64" | grep -Fxq "$ANDROID_PACKAGE"
          "$zipalign_path" -c -P 16 -v 4 "$universal" >/dev/null
          "$zipalign_path" -c -P 16 -v 4 "$arm64" >/dev/null
          if "$apksigner_path" verify "$universal" >/dev/null 2>&1; then
            echo 'Universal payload unexpectedly has a valid signer' >&2
            exit 1
          fi
          if "$apksigner_path" verify "$arm64" >/dev/null 2>&1; then
            echo 'arm64 payload unexpectedly has a valid signer' >&2
            exit 1
          fi
          cp "$apksigner_path" transport/tools/apksigner
          cp "$(dirname "$apksigner_path")/lib/apksigner.jar" transport/tools/lib/apksigner.jar
          cp "$zipalign_path" transport/tools/zipalign
          chmod +x transport/tools/apksigner transport/tools/zipalign
          printf '%s\n' "$SOURCE_SHA" > transport/SOURCE_SHA.txt
          sha256sum transport/*-unsigned.apk > transport/UNSIGNED-SHA256SUMS.txt
      - name: Upload one-shot offline-signing payload
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue172-offline-signing-payload
          path: transport
          if-no-files-found: error
          retention-days: 2
