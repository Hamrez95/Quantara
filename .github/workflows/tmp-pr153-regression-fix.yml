name: Temporary PR153 regression fixes

on:
  push:
    branches:
      - feat/152-professional-strategy-pack

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/152-professional-strategy-pack
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Apply narrow regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('src/client/quantara_app/lib/features/strategy_lab/data/strategy_lab_runner.dart')
          text = runner.read_text()
          if 'if (aggregated.length < 20)' not in text:
              raise SystemExit('parent threshold block not found')
          runner.write_text(text.replace('if (aggregated.length < 20)', 'if (aggregated.length < 24)'))

          pack = Path('src/client/quantara_app/test/professional_strategy_pack_test.dart')
          text = pack.read_text()
          text = text.replace('if (index < 74)', 'if (index < 75)')
          text = text.replace('close = open + 0.3;', 'close = open + 0.15;', 1)
          text = text.replace('close = open - 0.5;', 'close = open - 0.35;', 1)
          text = text.replace('close = open + 0.8;', 'close = open + 0.45;', 1)
          pack.write_text(text)

          safety = Path('src/client/quantara_app/test/professional_strategy_source_safety_test.dart')
          text = safety.read_text()
          text = text.replace(
              "expect(engine, contains('ExternalContextState.stale'));",
              "expect(engine, contains('ExternalContextState.fresh'));\n    expect(engine, contains('requireExternalContext'));",
          )
          safety.write_text(text)

          controller = Path('src/client/quantara_app/test/owner_alpha_controller_test.dart')
          text = controller.read_text()
          text = text.replace(
              'final analysis = _actionableAnalysis();',
              'final analysis = _actionableAnalysis(base.generatedAt);',
          )
          text = text.replace(
              'candleClosedAt: DateTime.utc(2026, 7, 26, 9),',
              'candleClosedAt: base.generatedAt,',
          )
          text = text.replace(
              'TimeframeChartAnalysis _actionableAnalysis() {',
              'TimeframeChartAnalysis _actionableAnalysis(DateTime generatedAt) {',
          )
          text = text.replace(
              "openTime: DateTime.utc(2026, 7, 26).add(Duration(hours: index)),",
              "openTime: generatedAt.subtract(Duration(hours: 60 - index)),",
          )
          text = text.replace(
              'generatedAt: DateTime.utc(2026, 7, 29),',
              'generatedAt: generatedAt,',
          )
          controller.write_text(text)
          PY
          cd src/client/quantara_app
          dart format lib test
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "fix: align strategy regression fixtures and parent freshness"
          git push origin HEAD:feat/152-professional-strategy-pack
