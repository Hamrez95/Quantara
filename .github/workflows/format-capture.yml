name: Temporary formatter capture

on:
  push:
    branches:
      - 'feat/263-support-session-diagnostic-correlation'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib/features/auto_trade/application/read_only_support_session.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-read-only-support-session
          path: src/client/quantara_app/lib/features/auto_trade/application/read_only_support_session.dart
          if-no-files-found: error
          retention-days: 1
