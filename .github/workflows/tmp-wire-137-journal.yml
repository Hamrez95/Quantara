name: Temporary wire PR 149 journal

on:
  push:
    branches:
      - feat/137-encrypted-recovery-database
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  wire-journal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/137-encrypted-recovery-database
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Wire database-first runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          owner = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          text = owner.read_text()
          old_import = "import '../../trading_journal/data/trading_journal_store.dart';"
          new_import = "import '../../trading_journal/data/database_trading_journal_store.dart';"
          old_runtime = "TradingJournalController(store: SharedPreferencesTradingJournalStore());"
          new_runtime = "TradingJournalController(store: DatabaseTradingJournalStore());"
          if old_import in text:
              text = text.replace(old_import, new_import)
          if old_runtime in text:
              text = text.replace(old_runtime, new_runtime)
          if new_import not in text or new_runtime not in text:
              raise SystemExit('Database-first journal wiring was not established.')
          owner.write_text(text)
          PY
      - name: Verify lockfile and format reviewed files
        working-directory: src/client/quantara_app
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            lib/features/trading_journal/data/database_trading_journal_store.dart \
            test/database_trading_journal_store_test.dart \
            test/trading_journal_source_safety_test.dart
      - name: Commit reviewed journal wiring
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            src/client/quantara_app/lib/features/trading_journal/data/database_trading_journal_store.dart \
            src/client/quantara_app/test/database_trading_journal_store_test.dart \
            src/client/quantara_app/test/trading_journal_source_safety_test.dart
          if git diff --cached --quiet; then
            echo 'Journal wiring is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(journal): wire database-first durable runtime'
          git push origin HEAD:feat/137-encrypted-recovery-database
