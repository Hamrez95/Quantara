name: Temporary #107 formatter

on:
  push:
    branches:
      - fix/107-rest-fill-side-binding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/107-rest-fill-side-binding
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format regression test
        run: dart format src/client/quantara_app/test/local_live_orphan_recovery_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/test/local_live_orphan_recovery_test.dart
          git commit -m "style: format REST side regression tests"
          git push origin HEAD:fix/107-rest-fill-side-binding
