name: Apply signal continuity patch

on:
  push:
    branches:
      - feat/89-91-signal-continuity
    paths:
      - scripts/apply_signal_continuity_patch.py
      - .github/workflows/apply-signal-continuity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: feat/89-91-signal-continuity
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/apply_signal_continuity_patch.py

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: preserve signal outcomes and exact chart context"
          git push origin HEAD:feat/89-91-signal-continuity
