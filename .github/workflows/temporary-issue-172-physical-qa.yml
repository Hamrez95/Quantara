name: Temporary Issue 172 Physical QA

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/scripts/issue_172_physical_qa.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - name: Apply root-cause patch
        working-directory: .
        run: python3 .github/scripts/issue_172_physical_qa.py
      - name: Restore packages
        run: flutter pub get
      - name: Normalize format
        run: dart format lib test
      - name: Verify diff whitespace
        working-directory: .
        run: git diff --check
      - name: Analyze
        run: flutter analyze
      - name: Targeted physical QA regressions
        run: >-
          flutter test
          test/issue_172_physical_qa_regression_test.dart
          test/auto_trade_account_reconciliation_controller_test.dart
          test/bitunix_pnl_mapper_physical_canary_test.dart
          test/decision_indicator_snapshot_test.dart
          test/issue_170_pending_close_reconciliation_test.dart
          test/local_live_status_exchange_truth_test.dart
      - name: Commit verified fix
        working-directory: .
        run: |
          git config user.name "Quantara CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: physical QA attribution sync and loading regressions (#172)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
