name: Temporary format 106

on:
  push:
    branches:
      - fix/106-live-drawdown-dashboard-clean

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/106-live-drawdown-dashboard-clean
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Format exact changed files
        run: |
          dart format src/client/quantara_app/lib/features/auto_trade/application/local_live_capital_guardian_monitor.dart src/client/quantara_app/test/local_live_capital_guardian_monitor_test.dart
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-106-temp.yml
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_capital_guardian_monitor.dart src/client/quantara_app/test/local_live_capital_guardian_monitor_test.dart
          git commit -m 'style(risk): apply Dart formatter'
          git push origin HEAD:fix/106-live-drawdown-dashboard-clean
