name: Temporary Issue 173 verified commit

on:
  push:
    branches:
      - fix/173-journal-live-context
    paths:
      - .github/workflows/temporary-issue-173-commit.yml

permissions:
  contents: write

jobs:
  commit-verified-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/173-journal-live-context
          fetch-depth: 0
      - name: Apply already-verified source changes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_view.dart
          python3 - <<'PY'
          from pathlib import Path
          live = Path('src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_live_positions.dart')
          text = live.read_text()
          text = text.replace("import 'package:flutter/foundation.dart';\n", '')
          text = text.replace('builder: (context, _, __) => Column(', 'builder: (context, liveContexts, child) => Column(')
          text = text.replace('entry: plan.plannedEntry,', 'entry: entryPrice,')
          live.write_text(text)

          release_test = Path('src/client/quantara_app/test/release_1_2_0_rc_2_source_test.dart')
          release_test.write_text(release_test.read_text().replace('version: 1.2.0-rc.2+121', 'version: 1.2.0-rc.2+123'))

          observer = Path('src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart')
          observer.write_text(observer.read_text().replace('1.2.0-rc.2+121', '1.2.0-rc.2+123'))

          service = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          service_text = service.read_text()
          anchor = "import '../domain/local_live_portfolio_admission.dart';\n"
          wanted = "import '../domain/local_live_protection_gate.dart';\n"
          if wanted not in service_text:
              service_text = service_text.replace(anchor, anchor + wanted)
          old1 = "final allOpenPositionsProtected =\n              _managed.length ==\n                  positions.where((item) => item.quantity > 0).length &&\n              _managed.every((item) => item.profitLockProgress.warning == null);"
          new1 = "final allOpenPositionsProtected =\n              LocalLiveProtectionGate.allManagedPositionsFullyProtected(\n                account: account,\n                managed: _managed,\n              );"
          old2 = "final existingExposureProtected =\n            _managed.length ==\n                exchangePositions.where((item) => item.quantity > 0).length &&\n            _managed.every((item) => item.profitLockProgress.warning == null);"
          new2 = "final existingExposureProtected =\n            LocalLiveProtectionGate.allManagedPositionsFullyProtected(\n              account: account,\n              managed: _managed,\n            );"
          if old1 not in service_text or old2 not in service_text:
              raise SystemExit('protection gate anchor not found')
          service_text = service_text.replace(old1, new1, 1).replace(old2, new2, 1)
          service.write_text(service_text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format and analyze
        working-directory: src/client/quantara_app
        run: |
          dart format lib test
          flutter pub get
          flutter analyze --no-pub
      - name: Targeted issue 172 and 173 regressions
        working-directory: src/client/quantara_app
        run: |
          flutter test --no-pub test/issue_172_physical_qa_regression_test.dart test/issue_173_journal_live_context_test.dart test/issue_173_local_live_protection_gate_test.dart test/trading_journal_view_test.dart test/release_1_2_0_rc_2_source_test.dart
      - name: Commit verified source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/temporary-issue-173-flutter-check.yml .github/workflows/temporary-issue-173-commit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Hamrez95@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'fix: complete issue 173 live journal and protection gate'
          git push origin HEAD:fix/173-journal-live-context
