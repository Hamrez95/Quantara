name: Apply PR28 registry freshness fix

on:
  push:
    branches:
      - feat/18-source-governance-registry
    paths:
      - scripts/apply-pr28-registry-freshness-fix.py

permissions:
  contents: write

jobs:
  apply-registry-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/18-source-governance-registry

      - name: Apply deterministic validator patch
        run: python3 scripts/apply-pr28-registry-freshness-fix.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_source_registry.py
          git diff --check

      - name: Commit validator freshness enforcement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_source_registry.py
          if git diff --cached --quiet; then
            echo "Expected validator freshness patch was not produced." >&2
            exit 1
          fi
          git commit -m "fix(research): reject overdue source registries"
          git push origin HEAD:feat/18-source-governance-registry
