name: Temporary format 488

on:
  push:
    branches:
      - feat/488-global-pause-runtime-coordinator
    paths:
      - .github/workflows/temp-format-488.yml
      - src/client/quantara_app/lib/features/owner_alpha/application/global_pause_runtime_coordinator.dart
      - src/client/quantara_app/test/global_pause_runtime_coordinator_test.dart

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/488-global-pause-runtime-coordinator
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/application/global_pause_runtime_coordinator.dart test/global_pause_runtime_coordinator_test.dart
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client/quantara_app/lib/features/owner_alpha/application/global_pause_runtime_coordinator.dart src/client/quantara_app/test/global_pause_runtime_coordinator_test.dart
          git commit -m "style(owner-alpha): apply canonical Dart formatting"
          git push
