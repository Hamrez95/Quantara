name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore Quantara.sln

      - name: Verify whitespace formatting
        run: dotnet format whitespace Quantara.sln --verify-no-changes --no-restore

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build Quantara.sln --configuration Release --no-restore --verbosity minimal > build.log 2>&1
          status=$?
          tail -n 120 build.log
          exit $status

      - name: Test
        run: >-
          dotnet test Quantara.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=quantara-tests.trx"
          --results-directory TestResults

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-diagnostics
          path: |
            build.log
            TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Milestone 1 foundation
        run: python3 scripts/validate-milestone1.py

      - name: Validate research source registry
        run: python3 scripts/validate_source_registry.py

      - name: Test research source registry validator
        run: >-
          python3 -m unittest discover
          -s tests/scripts
          -p 'test_*.py'
          -v

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
