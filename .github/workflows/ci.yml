name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore Quantara.sln

      - name: Verify formatting
        run: dotnet format Quantara.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Quantara.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Quantara.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=quantara-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Milestone 1 foundation
        run: python3 scripts/validate-milestone1.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
