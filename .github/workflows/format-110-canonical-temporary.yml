name: Format 110 canonical temporary

on:
  push:
    branches:
      - feat/110-walk-forward-validation-v2
    paths:
      - .github/workflows/format-110-canonical-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/110-walk-forward-validation-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format canonical economics
        working-directory: src/client/quantara_app
        run: dart format lib/features/trading_lab/application/trading_lab_canonical_decision.dart
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hamrez95@users.noreply.github.com
          git add src/client/quantara_app/lib/features/trading_lab/application/trading_lab_canonical_decision.dart
          git diff --cached --quiet && exit 0
          git commit -m "style(validation): format canonical execution economics"
          git push origin HEAD:feat/110-walk-forward-validation-v2
