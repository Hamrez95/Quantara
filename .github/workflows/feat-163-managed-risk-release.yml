name: Temporary feature 163 managed risk release

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/feat-163-managed-risk-release.yml'
      - '.github/scripts/feat163_managed_risk_release.py'
      - '.github/feat-163-risk-release-trigger.txt'
      - 'src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply TP and stop risk release patch
        run: |
          if grep -q "portfolioGuard.confirmReduction(" \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart; then
            echo "Managed risk release is already integrated."
            exit 0
          fi
          python3 .github/scripts/feat163_managed_risk_release.py
          rm -f .github/feat-163-risk-release-diagnostic.log
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format managed lifecycle
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_trade_service.dart
      - name: Commit managed risk release
        run: |
          if git diff --quiet; then
            echo "No managed risk release changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart
          git commit -m "feat(local-live): release risk after confirmed TP and stop moves [feat163-risk-release]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
