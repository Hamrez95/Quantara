name: Diagnose 192 web temporary
on:
  push:
    branches: [feat/192-economic-opportunity-ranking]
    paths: [.github/workflows/diagnose-192-web-temporary.yml]
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/192-economic-opportunity-ranking
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Make deterministic random score JavaScript-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/quantara_app/lib/features/decision_core/application/economic_opportunity_ranker.dart')
          s = p.read_text()
          old = """    for (final byte in digest.take(7)) {
      value = (value << 8) | byte;
    }
    return value / 0x00ffffffffffffff;"""
          new = """    for (final byte in digest.take(6)) {
      value = (value << 8) | byte;
    }
    return value / 0x0000ffffffffffff;"""
          if old not in s:
              raise SystemExit('stable random hash anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib/features/decision_core/application/economic_opportunity_ranker.dart
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Ranker tests
        working-directory: src/client/quantara_app
        run: flutter test test/economic_opportunity_ranker_test.dart test/local_live_economic_ranking_test.dart test/trading_lab_opportunity_ranking_test.dart
      - name: API-configured web build
        working-directory: src/client/quantara_app
        run: flutter build web --release --dart-define=QUANTARA_API_BASE_URL=https://api.example.com
      - name: Commit web-safe hash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hamrez95@users.noreply.github.com
          git add src/client/quantara_app/lib/features/decision_core/application/economic_opportunity_ranker.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ranking): keep deterministic policy hash web-safe"
          git push origin HEAD:feat/192-economic-opportunity-ranking
