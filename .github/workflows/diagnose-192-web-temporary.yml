name: Diagnose 192 web temporary
on:
  push:
    branches: [feat/192-economic-opportunity-ranking]
    paths: [.github/workflows/diagnose-192-web-temporary.yml]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/192-economic-opportunity-ranking
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Reproduce API-configured web build
        id: build
        continue-on-error: true
        shell: bash
        working-directory: src/client/quantara_app
        run: |
          set -o pipefail
          flutter build web --release --dart-define=QUANTARA_API_BASE_URL=https://api.example.com 2>&1 | tee /tmp/web-192.log
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-192-${{ github.run_id }}
          path: /tmp/web-192.log
          if-no-files-found: error
      - name: Enforce build result
        if: steps.build.outcome != 'success'
        run: exit 1
