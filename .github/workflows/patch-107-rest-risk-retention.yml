name: Apply #107 REST ambiguity hardening

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/107-rest-ambiguous-risk-retention'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply narrow fail-closed patch and regression test
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          text = service.read_text()
          old = '''  Future<({BitunixOrderDetail detail, BitunixLivePosition? position})>
          _fetchEntryRestState({'''
          new = '''  Future<({
    BitunixOrderDetail detail,
    BitunixLivePosition? position,
    bool positionTruthAmbiguous,
  })>
  _fetchEntryRestState({'''
          if old not in text:
              raise SystemExit('service return signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''    final detail = values[0] as BitunixOrderDetail;
    final positions = values[1] as List<BitunixLivePosition>;
    return (detail: detail, position: positions.firstOrNull);'''
          new = '''    final detail = values[0] as BitunixOrderDetail;
    final positions = values[1] as List<BitunixLivePosition>;
    final selection = EntryRestPositionSelection.select(positions);
    return (
      detail: detail,
      position: selection.position,
      positionTruthAmbiguous: selection.ambiguous,
    );'''
          if old not in text:
              raise SystemExit('service selection anchor not found')
          text = text.replace(old, new, 1)

          old = """              if (position == null && detail.status == 'CANCELED') {"""
          new = """              if (position == null &&
                  detail.status == 'CANCELED' &&
                  !cleanupState.positionTruthAmbiguous) {"""
          if old not in text:
              raise SystemExit('no-exposure release anchor not found')
          text = text.replace(old, new, 1)
          service.write_text(text)

          policy = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_orphan_recovery.dart')
          text = policy.read_text()
          old = '''/// The entry REST fallback has already proved the symbol was flat before submit.
/// It may therefore adopt exchange position truth only when Bitunix returns one
/// and only one live position for that symbol. Multiple positions are ambiguous
/// and must remain unresolved instead of binding to an arbitrary `first` item.
extension UniqueBitunixLivePositionListSelection on List<BitunixLivePosition> {
  BitunixLivePosition? get firstOrNull {
    if (length != 1) return null;
    final candidate = first;
    if (candidate.positionId.trim().isEmpty ||
        !candidate.quantity.isFinite ||
        candidate.quantity <= 0) {
      return null;
    }
    return candidate;
  }
}'''
          new = '''final class EntryRestPositionSelection {
  const EntryRestPositionSelection._({
    required this.position,
    required this.ambiguous,
  });

  final BitunixLivePosition? position;
  final bool ambiguous;

  static EntryRestPositionSelection select(List<BitunixLivePosition> positions) {
    if (positions.isEmpty) {
      return const EntryRestPositionSelection._(
        position: null,
        ambiguous: false,
      );
    }
    if (positions.length != 1) {
      return const EntryRestPositionSelection._(
        position: null,
        ambiguous: true,
      );
    }
    final candidate = positions.single;
    if (candidate.positionId.trim().isEmpty ||
        !candidate.quantity.isFinite ||
        candidate.quantity <= 0) {
      return const EntryRestPositionSelection._(
        position: null,
        ambiguous: true,
      );
    }
    return EntryRestPositionSelection._(
      position: candidate,
      ambiguous: false,
    );
  }
}

/// The entry REST fallback has already proved the symbol was flat before submit.
/// It may therefore adopt exchange position truth only when Bitunix returns one
/// and only one valid live position for that symbol. Callers that must distinguish
/// no exposure from ambiguous truth should use [EntryRestPositionSelection].
extension UniqueBitunixLivePositionListSelection on List<BitunixLivePosition> {
  BitunixLivePosition? get firstOrNull =>
      EntryRestPositionSelection.select(this).position;
}'''
          if old not in text:
              raise SystemExit('REST selection policy anchor not found')
          policy.write_text(text.replace(old, new, 1))

          test = Path('src/client/quantara_app/test/entry_rest_position_selection_test.dart')
          test.write_text('''import 'package:flutter_test/flutter_test.dart';
import 'package:quantara_app/features/auto_trade/application/local_live_orphan_recovery.dart';
import 'package:quantara_app/features/auto_trade/data/bitunix_local_live_api_client.dart';

void main() {
  const valid = BitunixLivePosition(
    positionId: 'position-1',
    symbol: 'BTCUSDT',
    quantity: 0.01,
    side: 'LONG',
    marginMode: 'ISOLATION',
    positionMode: 'ONE_WAY',
    leverage: 3,
    averageOpenPrice: 100000,
    realizedPnl: 0,
    unrealizedPnl: 0,
    fee: 0,
    funding: 0,
  );

  test('empty REST position truth proves no current exposure candidate', () {
    final selection = EntryRestPositionSelection.select(const []);

    expect(selection.position, isNull);
    expect(selection.ambiguous, isFalse);
  });

  test('one valid REST position is unambiguous', () {
    final selection = EntryRestPositionSelection.select([valid]);

    expect(selection.position?.positionId, 'position-1');
    expect(selection.ambiguous, isFalse);
  });

  test('multiple REST positions retain ambiguous risk', () {
    final selection = EntryRestPositionSelection.select([
      valid,
      const BitunixLivePosition(
        positionId: 'position-2',
        symbol: 'BTCUSDT',
        quantity: 0.02,
        side: 'SHORT',
        marginMode: 'ISOLATION',
        positionMode: 'HEDGE',
        leverage: 3,
        averageOpenPrice: 100100,
        realizedPnl: 0,
        unrealizedPnl: 0,
        fee: 0,
        funding: 0,
      ),
    ]);

    expect(selection.position, isNull);
    expect(selection.ambiguous, isTrue);
  });

  test('invalid singleton REST position remains ambiguous, not no exposure', () {
    const invalid = BitunixLivePosition(
      positionId: '',
      symbol: 'BTCUSDT',
      quantity: 0.01,
      side: 'LONG',
      marginMode: 'ISOLATION',
      positionMode: 'ONE_WAY',
      leverage: 3,
      averageOpenPrice: 100000,
      realizedPnl: 0,
      unrealizedPnl: 0,
      fee: 0,
      funding: 0,
    );
    final selection = EntryRestPositionSelection.select([invalid]);

    expect(selection.position, isNull);
    expect(selection.ambiguous, isTrue);
  });
}
''')
      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_trade_service.dart lib/features/auto_trade/application/local_live_orphan_recovery.dart test/entry_rest_position_selection_test.dart
      - name: Commit final patch and remove temporary workflow
        run: |
          git rm .github/workflows/patch-107-rest-risk-retention.yml
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
                  src/client/quantara_app/lib/features/auto_trade/application/local_live_orphan_recovery.dart \
                  src/client/quantara_app/test/entry_rest_position_selection_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auto-trade): retain ambiguous REST exposure risk'
          git push origin HEAD:${{ github.head_ref }}
