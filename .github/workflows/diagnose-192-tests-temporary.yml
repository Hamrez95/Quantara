name: Diagnose 192 tests temporary
on:
  push:
    branches: [feat/192-economic-opportunity-ranking]
    paths: [.github/workflows/diagnose-192-tests-temporary.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/192-economic-opportunity-ranking
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply Local Live integration in workspace
        run: python3 .github/scripts/patch_192_local_live.py
      - name: Format workspace
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_trade_service.dart lib/features/decision_core/domain/economic_opportunity_models.dart lib/features/decision_core/application/economic_opportunity_ranker.dart lib/features/auto_trade/application/local_live_economic_ranking.dart lib/features/trading_lab/application/trading_lab_opportunity_ranking.dart lib/features/trading_lab/domain/trading_lab_models.dart lib/features/trading_lab/application/trading_lab_paper_broker.dart test/economic_opportunity_ranker_test.dart test/local_live_economic_ranking_test.dart test/trading_lab_opportunity_ranking_test.dart
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos
      - name: Run ranking and safety tests
        id: tests
        continue-on-error: true
        shell: bash
        working-directory: src/client/quantara_app
        run: |
          set -o pipefail
          flutter test test/economic_opportunity_ranker_test.dart test/local_live_economic_ranking_test.dart test/trading_lab_opportunity_ranking_test.dart test/local_live_trade_service_test.dart test/canonical_decision_pipeline_test.dart test/canonical_runtime_integration_test.dart test/local_live_portfolio_atomic_concurrency_test.dart test/local_live_portfolio_atomic_rollback_test.dart test/trading_lab_model_roundtrip_test.dart 2>&1 | tee /tmp/tests-192.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-192-${{ github.run_id }}
          path: /tmp/tests-192.log
          if-no-files-found: error
      - name: Enforce test result
        if: steps.tests.outcome != 'success'
        run: exit 1
