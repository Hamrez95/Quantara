name: Temporary patch issue 103

on:
  push:
    branches:
      - feat/103-contextual-price-action-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/103-contextual-price-action-v3
      - name: Persist contextual evidence in journal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/owner_alpha/domain/owner_alpha_models.dart')
          text = path.read_text()

          ctor_anchor = "    required this.invalidation,\n    this.confidencePercent = 0,\n"
          if "this.contextVersion = ''" not in text[text.index('final class SignalJournalEntry'):]:
              assert ctor_anchor in text
              text = text.replace(ctor_anchor, "    required this.invalidation,\n    this.setupQualityScore,\n    this.expectation = '',\n    this.trigger = '',\n    this.contextVersion = '',\n    this.evidenceBreakdown = const {},\n    this.confidencePercent = 0,\n", 1)

          from_idea_anchor = "    invalidation: idea.invalidation,\n    confidencePercent: idea.confidencePercent,\n"
          if 'setupQualityScore: idea.setupQualityScore' not in text:
              assert from_idea_anchor in text
              text = text.replace(from_idea_anchor, "    invalidation: idea.invalidation,\n    setupQualityScore: idea.setupQualityScore,\n    expectation: idea.expectation,\n    trigger: idea.trigger,\n    contextVersion: idea.contextVersion,\n    evidenceBreakdown: idea.evidenceBreakdown,\n    confidencePercent: idea.confidencePercent,\n", 1)

          fields_anchor = "  final String invalidation;\n  final int confidencePercent;\n"
          journal_start = text.index('final class SignalJournalEntry')
          journal_tail = text[journal_start:]
          if 'final int? setupQualityScore;' not in journal_tail:
              assert fields_anchor in text
              text = text.replace(fields_anchor, "  final String invalidation;\n  final int? setupQualityScore;\n  final String expectation;\n  final String trigger;\n  final String contextVersion;\n  final Map<String, double> evidenceBreakdown;\n  final int confidencePercent;\n", 1)

          copy_anchor = "    invalidation: invalidation,\n    confidencePercent: confidencePercent,\n"
          if 'setupQualityScore: setupQualityScore' not in text[text.index('SignalJournalEntry copyWith'):]:
              assert copy_anchor in text
              text = text.replace(copy_anchor, "    invalidation: invalidation,\n    setupQualityScore: setupQualityScore,\n    expectation: expectation,\n    trigger: trigger,\n    contextVersion: contextVersion,\n    evidenceBreakdown: evidenceBreakdown,\n    confidencePercent: confidencePercent,\n", 1)

          json_anchor = "    'invalidation': invalidation,\n    'confidencePercent': confidencePercent,\n"
          if "'evidenceBreakdown': evidenceBreakdown" not in text:
              assert json_anchor in text
              text = text.replace(json_anchor, "    'invalidation': invalidation,\n    'setupQualityScore': setupQualityScore,\n    'expectation': expectation,\n    'trigger': trigger,\n    'contextVersion': contextVersion,\n    'evidenceBreakdown': evidenceBreakdown,\n    'confidencePercent': confidencePercent,\n", 1)

          restore_anchor = "        invalidation: value['invalidation'] as String,\n        confidencePercent: ((value['confidencePercent'] as num?)?.toInt() ?? 0)\n"
          if 'setupQualityScore: _tryBoundedQuality' not in text:
              assert restore_anchor in text
              text = text.replace(restore_anchor, "        invalidation: value['invalidation'] as String,\n        setupQualityScore: _tryBoundedQuality(value['setupQualityScore']),\n        expectation: (value['expectation'] as String?) ?? '',\n        trigger: (value['trigger'] as String?) ?? '',\n        contextVersion: (value['contextVersion'] as String?) ?? '',\n        evidenceBreakdown: _tryEvidenceBreakdown(value['evidenceBreakdown']),\n        confidencePercent: ((value['confidencePercent'] as num?)?.toInt() ?? 0)\n", 1)

          helper_anchor = "  static DateTime? _tryDate(Object? value) {\n"
          if 'static int? _tryBoundedQuality' not in text:
              assert helper_anchor in text
              helpers = "  static int? _tryBoundedQuality(Object? value) {\n    if (value is! num) return null;\n    final quality = value.toInt();\n    return quality < 0 || quality > 100 ? null : quality;\n  }\n\n  static Map<String, double> _tryEvidenceBreakdown(Object? value) {\n    if (value is! Map<Object?, Object?>) return const {};\n    final result = <String, double>{};\n    for (final entry in value.entries) {\n      if (entry.key is! String || entry.value is! num) continue;\n      final number = (entry.value as num).toDouble();\n      if (!number.isFinite || number < 0 || number > 20) continue;\n      result[entry.key as String] = number;\n    }\n    return Map.unmodifiable(result);\n  }\n\n"
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          path.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format changed sources and tests
        run: |
          cd src/client/quantara_app
          dart format lib test
      - name: Commit journal evidence
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "feat(price-action): persist contextual evidence in journal"
          git push origin HEAD:feat/103-contextual-price-action-v3
