name: Temporary patch issue 103

on:
  push:
    branches:
      - feat/103-contextual-price-action-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/103-contextual-price-action-v3
      - name: Surface Setup Quality instead of uncalibrated confidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart')
          text = path.read_text()
          old = """              if (entry.confidencePercent > 0)\n                StatusPill(\n                  label: _t(\n                    context,\n                    'امتیاز ${entry.confidencePercent}',\n                    'Score ${entry.confidencePercent}',\n                  ),\n                  color: QuantaraColors.cyan,\n                ),\n"""
          new = """              if ((entry.setupQualityScore ?? entry.confidencePercent) > 0)\n                StatusPill(\n                  label: _t(\n                    context,\n                    'کیفیت ستاپ ${entry.setupQualityScore ?? entry.confidencePercent}',\n                    'Setup Quality ${entry.setupQualityScore ?? entry.confidencePercent}',\n                  ),\n                  color: QuantaraColors.cyan,\n                ),\n"""
          if new not in text:
              assert old in text
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Flutter sources
        run: |
          cd src/client/quantara_app
          dart format lib test
      - name: Commit UI semantics
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "feat(price-action): show Setup Quality instead of probability"
          git push origin HEAD:feat/103-contextual-price-action-v3
