name: Temporary format recovery

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - '.github/workflows/temporary-format-recovery.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format recovery files
        working-directory: src/client/quantara_app
        run: dart format lib/features/trading_journal/application/trading_journal_controller.dart lib/features/trading_journal/application/trading_journal_exchange_history_recovery.dart test/trading_journal_exchange_history_recovery_test.dart
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/trading_journal/application/trading_journal_controller.dart \
                  src/client/quantara_app/lib/features/trading_journal/application/trading_journal_exchange_history_recovery.dart \
                  src/client/quantara_app/test/trading_journal_exchange_history_recovery_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format exchange history recovery (#171)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
