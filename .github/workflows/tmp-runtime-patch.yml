name: Temporary runtime submit patch

on:
  push:
    branches:
      - codex/issue-199-runtime-submit-timing
    paths:
      - .github/workflows/tmp-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-199-runtime-submit-timing
      - name: Apply exact Local Live submit-timing patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          source = path.read_text()
          old = """          orderRequestStarted = true;\n          final placed = await exchange.placeMarketEntry(\n"""
          new = """          orderRequestStarted = true;\n          privateTruth.recordOrderSubmission(correlationId: clientId);\n          final placed = await exchange.placeMarketEntry(\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one submit site, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart
          git commit -m "feat(execution): record submit before local live entry"
          git push origin HEAD:codex/issue-199-runtime-submit-timing
