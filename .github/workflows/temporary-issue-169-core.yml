name: Temporary issue 169 core patch

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-issue-169-core.yml
      - .github/scripts/apply_issue_169_core.py
      - .github/scripts/fix_issue_169_core_test.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Apply deterministic core patch
        run: |
          python3 .github/scripts/apply_issue_169_core.py
          python3 .github/scripts/fix_issue_169_core_test.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/domain/local_live_trade_models.dart lib/features/auto_trade/data/local_live_preferences_store.dart lib/features/auto_trade/application/local_live_trade_service.dart lib/features/owner_alpha/application/owner_alpha_controller.dart test/local_live_issue_169_core_test.dart

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze

      - name: Run focused issue 169 core tests
        working-directory: src/client/quantara_app
        run: flutter test test/local_live_issue_169_core_test.dart test/local_live_multi_position_service_source_test.dart test/local_live_trade_models_test.dart

      - name: Commit core implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/domain/local_live_trade_models.dart \
                  src/client/quantara_app/lib/features/auto_trade/data/local_live_preferences_store.dart \
                  src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
                  src/client/quantara_app/lib/features/owner_alpha/application/owner_alpha_controller.dart \
                  src/client/quantara_app/test/local_live_issue_169_core_test.dart
          git commit -m "feat: add multi-strategy Local Live core (#169)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
