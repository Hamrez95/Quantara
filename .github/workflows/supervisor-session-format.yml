name: Supervisor session formatter

on:
  push:
    branches:
      - feat/446-supervisor-session-controller

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'apply exact session formatter') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Apply exact formatter output
        run: |
          set -euo pipefail
          cd src/client/quantara_app
          dart format lib/features/ai_supervisor/application/supervisor_read_only_session_controller.dart test/ai_supervisor_read_only_session_controller_test.dart
          cd ../../..
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/ai_supervisor/application/supervisor_read_only_session_controller.dart src/client/quantara_app/test/ai_supervisor_read_only_session_controller_test.dart
          git commit -m 'chore(AI): apply exact session formatter'
          git push origin HEAD:feat/446-supervisor-session-controller
