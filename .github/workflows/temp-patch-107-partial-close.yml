name: Temporary partial close patch

on:
  push:
    branches:
      - fix/107-confirm-partial-close

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/107-confirm-partial-close
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply patch
        run: |
          python3 .github/scripts/patch_partial_close.py
      - name: Format patch
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_trade_service.dart lib/features/auto_trade/application/partial_fill_close_confirmation.dart test/partial_fill_close_confirmation_test.dart
      - name: Commit patch
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart src/client/quantara_app/lib/features/auto_trade/application/partial_fill_close_confirmation.dart src/client/quantara_app/test/partial_fill_close_confirmation_test.dart
          git commit -m "fix(auto-trade): confirm partial fill close with exchange truth"
          git push origin HEAD:fix/107-confirm-partial-close
