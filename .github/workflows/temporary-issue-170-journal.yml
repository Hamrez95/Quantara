name: Temporary issue 170 journal fix

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-issue-170-journal.yml
      - .github/scripts/fix_issue_170_journal.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Apply issue 170 patch
        run: python3 .github/scripts/fix_issue_170_journal.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/trading_journal/application/trading_journal_exchange_backfill.dart
          lib/features/trading_journal/domain/trading_journal_projection.dart
          lib/features/auto_trade/application/local_live_diagnostic_bundle.dart
          lib/features/owner_alpha/presentation/owner_alpha_page.dart
          lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart
          test/trading_journal_exchange_backfill_test.dart
          test/local_live_diagnostic_bundle_test.dart

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze

      - name: Run issue 170 and journal regressions
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/issue_170_journal_closure_test.dart
          test/eth_stop_hotfix_regression_test.dart
          test/trading_journal_exchange_backfill_test.dart
          test/trading_journal_exchange_truth_regression_test.dart
          test/trading_journal_foreground_merge_test.dart
          test/trading_journal_ledger_test.dart
          test/trading_journal_store_test.dart
          test/trading_pnl_projection_test.dart
          test/bitunix_pnl_reconciliation_test.dart
          test/bitunix_pnl_position_identity_test.dart
          test/local_live_multi_position_service_source_test.dart
          test/local_live_diagnostic_bundle_test.dart

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_journal/application/trading_journal_exchange_backfill.dart \
                  src/client/quantara_app/lib/features/trading_journal/domain/trading_journal_projection.dart \
                  src/client/quantara_app/lib/features/auto_trade/application/local_live_diagnostic_bundle.dart \
                  src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
                  src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart \
                  src/client/quantara_app/test/trading_journal_exchange_backfill_test.dart \
                  src/client/quantara_app/test/local_live_diagnostic_bundle_test.dart
          git commit -m "fix: harden journal backfill and diagnostics (#170)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
