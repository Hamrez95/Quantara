name: Temporary feature 163 portfolio budget status

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: feat-163-budget-status
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply portfolio budget status
        run: python3 .github/scripts/feat163_budget_status.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format patch
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze patch
        working-directory: src/client/quantara_app
        run: flutter analyze
      - name: Run portfolio budget and physical regression tests
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/local_live_portfolio_budget_status_test.dart
          test/local_live_portfolio_risk_runtime_test.dart
          test/physical_canary_regression_source_test.dart
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'feat: expose Local Live portfolio risk and margin budget (#163)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
