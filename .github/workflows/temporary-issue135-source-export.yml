name: Temporary Issue 135 source export

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archive exact branch source
        shell: bash
        run: git archive --format=zip --output=quantara-issue135-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue135-source
          path: quantara-issue135-source.zip
          if-no-files-found: error
          retention-days: 1
