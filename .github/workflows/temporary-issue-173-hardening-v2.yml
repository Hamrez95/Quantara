name: Temporary Issue 173 Exact-Lot Hardening V2

on:
  push:
    branches:
      - automation/issue-173-hardening-v2

permissions:
  contents: write

concurrency:
  group: issue-173-hardening-v2
  cancel-in-progress: true

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve helper and switch to PR source
        shell: bash
        run: |
          cp tools/issue173_harden.py "$RUNNER_TEMP/issue173_harden.py"
          git fetch origin feat/163-portfolio-budgeted-local-live
          git checkout -B feat/163-portfolio-budgeted-local-live origin/feat/163-portfolio-budgeted-local-live

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply safety hardening
        run: python3 "$RUNNER_TEMP/issue173_harden.py"

      - name: Format changed Dart
        working-directory: src/client/quantara_app
        run: |
          dart format \
            lib/features/auto_trade/domain/remaining_target_protection_policy.dart \
            lib/features/auto_trade/application/local_live_trade_service.dart \
            lib/features/trading_journal/application/local_live_journal_observer.dart \
            test/issue_173_post_reinstall_regression_test.dart

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --no-pub

      - name: Run focused regressions
        working-directory: src/client/quantara_app
        run: |
          flutter test --no-pub \
            test/issue_173_post_reinstall_regression_test.dart \
            test/issue_173_physical_qa_regression_test.dart \
            test/remaining_target_protection_policy_test.dart \
            test/trading_journal_view_test.dart

      - name: Run full Flutter suite
        working-directory: src/client/quantara_app
        run: flutter test --no-pub

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hamidreza Pakpour"
          git config user.email "136631329+Hamrez95@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/features/auto_trade/domain/remaining_target_protection_policy.dart \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
            src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart \
            src/client/quantara_app/test/issue_173_post_reinstall_regression_test.dart
          git diff --cached --check
          git commit -m "fix: harden exact-lot TP reconciliation"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
