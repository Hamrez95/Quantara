name: Strategy source snapshot

on:
  push:
    branches:
      - feat/52-strategy-engine-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Format source snapshot
        working-directory: src/client/quantara_app
        run: dart format lib test

      - name: Upload strategy source
        uses: actions/upload-artifact@v4
        with:
          name: quantara-strategy-source
          path: |
            src/client/quantara_app/lib
            src/client/quantara_app/test
            src/client/quantara_app/pubspec.yaml
          if-no-files-found: error
          retention-days: 1
