name: Temporary issue 166 orphan recovery

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: feat-166-orphan-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Relax sequential replacement helper
        run: >-
          sed -i
          "s/if old not in text or text.count(old) != 1:/if old not in text:/"
          .github/scripts/feat166_status_ui_patch.py
      - name: Apply exchange-authoritative status and UI
        run: python3 .github/scripts/feat166_status_ui_patch.py
      - name: Apply atomic risk and journal recovery
        run: python3 .github/scripts/feat166_risk_journal_patch.py
      - name: Apply foreground-service recovery
        run: python3 .github/scripts/feat166_service_patch.py
      - name: Wire recovery types and execution guard
        run: python3 .github/scripts/feat166_compile_fix.py
      - name: Wire recovered position direction
        run: python3 .github/scripts/feat166_direction_fix.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format patch
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze patch
        working-directory: src/client/quantara_app
        run: flutter analyze
      - name: Run orphan recovery and safety regressions
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/local_live_orphan_recovery_test.dart
          test/local_live_status_exchange_truth_test.dart
          test/local_live_orphan_recovery_source_test.dart
          test/local_live_portfolio_risk_runtime_test.dart
          test/trading_journal_foreground_merge_test.dart
          test/database_trading_journal_store_test.dart
          test/bitunix_pnl_mapper_physical_canary_test.dart
          test/physical_canary_regression_source_test.dart
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'fix: recover protected Quantara positions after reinstall (#166)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
