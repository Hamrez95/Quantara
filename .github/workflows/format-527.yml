name: Format 527 sources

on:
  push:
    branches:
      - feat/527-setup-performance-reporting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/527-setup-performance-reporting
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply Dart formatter
        run: |
          cd src/client/quantara_app
          dart format \
            lib/features/owner_alpha/domain/setup_performance_reporting.dart \
            lib/features/owner_alpha/presentation/setup_performance_report.dart \
            test/setup_performance_report_widget_test.dart \
            test/setup_performance_reporting_test.dart
      - name: Self-clean and commit formatting
        run: |
          rm .github/workflows/format-527.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(setups): apply dart format"
          git push origin HEAD:feat/527-setup-performance-reporting
