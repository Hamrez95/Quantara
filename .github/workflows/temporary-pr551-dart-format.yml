name: Temporary PR 551 Dart format

on:
  push:
    branches:
      - perf/543-bounded-signal-inbox-render-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/543-bounded-signal-inbox-render-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Canonical Dart format
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/application/signal_inbox_query.dart lib/features/owner_alpha/presentation/owner_alpha_signals.dart test/signal_inbox_bounded_render_test.dart
      - name: Remove temporary workflow and commit canonical formatting
        run: |
          git rm .github/workflows/temporary-pr551-dart-format.yml
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/owner_alpha/application/signal_inbox_query.dart
          git add src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart
          git add src/client/quantara_app/test/signal_inbox_bounded_render_test.dart
          git commit -m "style(perf): apply canonical Dart formatting"
          git push origin HEAD:perf/543-bounded-signal-inbox-render-v2
