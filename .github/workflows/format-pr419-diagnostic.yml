name: PR 419 formatter diagnostic

on:
  push:
    branches:
      - feat/360-windows-management-control-ui

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Print exact formatter diff
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          dart --version
          dart format lib/features/windows_desktop/presentation/windows_service_status_pill.dart test/features/windows_desktop/windows_service_status_pill_test.dart
          git diff --unified=2 -- lib/features/windows_desktop/presentation/windows_service_status_pill.dart test/features/windows_desktop/windows_service_status_pill_test.dart
