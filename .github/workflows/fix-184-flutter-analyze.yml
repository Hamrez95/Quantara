name: Fix 184 Flutter Analyze

on:
  push:
    branches:
      - feature/184-chatgpt-readonly-mcp-v2
    paths:
      - .github/workflows/fix-184-flutter-analyze.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/184-chatgpt-readonly-mcp-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Fix State boundary and redundant null check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auto_path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          auto = auto_path.read_text()
          class_marker = 'class _LocalLiveTradeControlCardState\n    extends State<_LocalLiveTradeControlCard> {'
          class_pos = auto.find(class_marker)
          if class_pos < 0:
              raise SystemExit('Local Live State class anchor not found')
          method_anchor = '  String _t(String fa, String en) => _fa ? fa : en;\n'
          method_pos = auto.find(method_anchor, class_pos)
          if method_pos < 0:
              raise SystemExit('State translation method anchor not found')
          insertion = method_anchor + '\n  void _supervisorSetState(VoidCallback callback) => setState(callback);\n'
          if '_supervisorSetState(VoidCallback callback)' not in auto[class_pos:]:
              auto = auto[:method_pos] + auto[method_pos:].replace(method_anchor, insertion, 1)
          auto_path.write_text(auto)

          tools_path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart')
          tools = tools_path.read_text()
          extension_marker = '// AI Supervisor support-session transport — Issue #184.'
          pos = tools.find(extension_marker)
          if pos < 0:
              raise SystemExit('Supervisor extension marker not found')
          prefix, extension = tools[:pos], tools[pos:]
          extension = extension.replace('if (active && remote != null)', 'if (active)')
          extension = extension.replace('setState(', '_supervisorSetState(')
          tools_path.write_text(prefix + extension)
          PY
          dart format \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart
      - name: Commit corrections
        run: |
          git config user.name "Quantara CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart
          git diff --cached --check
          git commit -m "fix(supervisor): keep Flutter state mutations inside State"
          git push origin HEAD:feature/184-chatgpt-readonly-mcp-v2
