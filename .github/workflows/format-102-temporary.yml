name: Temporary format issue 102

on:
  push:
    branches:
      - feat/102-high-coverage-discovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/102-high-coverage-discovery
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Flutter sources
        run: |
          cd src/client/quantara_app
          dart format lib test
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "style: format issue 102"
          git push origin HEAD:feat/102-high-coverage-discovery
