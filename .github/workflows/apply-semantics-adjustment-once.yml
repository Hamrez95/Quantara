name: Apply semantics adjustment once

on:
  push:
    branches:
      - feat/29-flutter-cockpit-foundation
    paths:
      - scripts/adjust_flutter_semantics.py
      - .github/workflows/apply-semantics-adjustment-once.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/29-flutter-cockpit-foundation
      - name: Apply focused UI semantics adjustment
        run: python3 scripts/adjust_flutter_semantics.py
      - name: Remove one-time files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/adjust_flutter_semantics.py .github/workflows/apply-semantics-adjustment-once.yml
          git add src/client/quantara_app/lib/features/cockpit/presentation/cockpit_page.dart
          git commit -m "refactor: remove inactive market-card affordance"
          git push origin HEAD:feat/29-flutter-cockpit-foundation
