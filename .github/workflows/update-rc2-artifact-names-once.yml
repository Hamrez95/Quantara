name: Update rc2 artifact names once

on:
  push:
    branches:
      - release/1.2.0-rc.2
    paths:
      - '.github/workflows/update-rc2-artifact-names-once.yml'
      - 'docs/releases/1.2.0-rc.2-trigger.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.2.0-rc.2
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Flutter artifact identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/flutter-ci.yml')
          text = path.read_text()
          text = text.replace('RC_VERSION: 1.2.0-rc.1', 'RC_VERSION: 1.2.0-rc.2')
          text = text.replace('ANDROID_RC_ARTIFACT: quantara-android-1.2.0-rc.1', 'ANDROID_RC_ARTIFACT: quantara-android-1.2.0-rc.2')
          path.write_text(text)
          PY

      - name: Remove one-shot files
        run: |
          rm .github/workflows/update-rc2-artifact-names-once.yml
          rm docs/releases/1.2.0-rc.2-trigger.md

      - name: Commit clean release configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: name Flutter artifacts for 1.2.0-rc.2'
          git push origin HEAD:release/1.2.0-rc.2
