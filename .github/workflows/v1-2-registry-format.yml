name: v1.2 registry formatter snapshot

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          dart format
          lib/features/owner_alpha/domain/realtime_market_event_models.dart
          lib/features/owner_alpha/data/realtime_candidate_registry.dart
          test/realtime_candidate_registry_test.dart
          test/realtime_candidate_registry_reconciliation_safety_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: v1-2-formatted-registry-files
          path: |
            src/client/quantara_app/lib/features/owner_alpha/domain/realtime_market_event_models.dart
            src/client/quantara_app/lib/features/owner_alpha/data/realtime_candidate_registry.dart
            src/client/quantara_app/test/realtime_candidate_registry_test.dart
            src/client/quantara_app/test/realtime_candidate_registry_reconciliation_safety_test.dart
          if-no-files-found: error
          retention-days: 1
