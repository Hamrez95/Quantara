name: Dow format autofix

on:
  push:
    branches:
      - feat/534-dow-gates

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/534-dow-gates
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Dow files and remove temporary workflow
        shell: bash
        run: |
          dart format \
            src/client/quantara_app/lib/features/market_analysis/data/dow_structure_engine.dart \
            src/client/quantara_app/lib/features/market_analysis/domain/dow_structure_models.dart \
            src/client/quantara_app/lib/features/owner_alpha/data/dow_candidate_gate.dart \
            src/client/quantara_app/lib/features/owner_alpha/data/trade_idea_factory.dart \
            src/client/quantara_app/test/dow_candidate_gate_test.dart \
            src/client/quantara_app/test/dow_structure_engine_test.dart \
            src/client/quantara_app/test/dow_trade_idea_factory_integration_test.dart
          git rm .github/workflows/dow-format-autofix.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(dow): apply pinned Dart formatter'
          git push origin HEAD:feat/534-dow-gates
