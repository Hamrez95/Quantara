name: Temporary #109 custom-window fix

on:
  push:
    branches:
      - feat/109-periodic-performance-attribution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/109-periodic-performance-attribution
          fetch-depth: 0
      - name: Patch custom-window validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/trading_journal/domain/trading_performance_reporting.dart')
          text = path.read_text(encoding='utf-8')
          old = """      TradingPerformancePeriod.custom => TradingPerformanceFilter(\n        startedAtUtc: customStartedAtUtc,\n        endedAtUtc: customEndedAtUtc,\n      ),\n"""
          new = """      TradingPerformancePeriod.custom => _custom(\n        customStartedAtUtc,\n        customEndedAtUtc,\n      ),\n"""
          if old not in text:
              raise SystemExit('expected custom-window block not found')
          text = text.replace(old, new, 1)
          marker = """  static TradingPerformanceFilter _weekly(DateTime anchorUtc) {\n"""
          helper = """  static TradingPerformanceFilter _custom(\n    DateTime? startedAtUtc,\n    DateTime? endedAtUtc,\n  ) {\n    if (startedAtUtc == null || endedAtUtc == null) {\n      throw ArgumentError(\n        'Custom performance window requires both start and end.',\n      );\n    }\n    return TradingPerformanceFilter(\n      startedAtUtc: startedAtUtc,\n      endedAtUtc: endedAtUtc,\n    );\n  }\n\n"""
          if marker not in text:
              raise SystemExit('expected weekly helper marker not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/analytics-custom-window-109-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_journal/domain/trading_performance_reporting.dart
          git commit -m "fix(analytics): require complete custom report windows"
          git push origin HEAD:feat/109-periodic-performance-attribution
