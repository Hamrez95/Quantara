name: Temporary indicator snapshot patch

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - '.github/workflows/temporary-indicator-snapshot-patch.yml'
      - '.github/scripts/patch_issue170_indicator_snapshot.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_issue170_indicator_snapshot.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format changed Dart
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/domain/owner_alpha_models.dart lib/features/owner_alpha/data/advanced_strategy_engine.dart lib/features/trading_journal/domain/trading_journal_models.dart lib/features/trading_journal/application/local_live_journal_observer.dart lib/features/trading_journal/domain/trading_journal_evidence_packet.dart test/decision_indicator_snapshot_test.dart
      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos
      - name: Targeted regressions
        working-directory: src/client/quantara_app
        run: flutter test test/decision_indicator_snapshot_test.dart test/advanced_strategy_engine_test.dart test/trading_journal_ledger_test.dart test/trading_journal_evidence_packet_test.dart test/trading_journal_exchange_history_recovery_test.dart test/bitunix_history_pagination_source_test.dart test/android_preview_signing_source_test.dart
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/owner_alpha/domain/owner_alpha_models.dart \
                  src/client/quantara_app/lib/features/owner_alpha/data/advanced_strategy_engine.dart \
                  src/client/quantara_app/lib/features/trading_journal/domain/trading_journal_models.dart \
                  src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart \
                  src/client/quantara_app/lib/features/trading_journal/domain/trading_journal_evidence_packet.dart \
                  src/client/quantara_app/test/decision_indicator_snapshot_test.dart
          git commit -m 'feat: persist decision-time technical indicators in Journal (#170)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
