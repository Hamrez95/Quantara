name: Temporary Issue 137 format export

on:
  push:
    paths:
      - .github/workflows/temporary-issue137-format-export.yml

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/137-encrypted-recovery-database
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Format source and tests
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib test
      - name: Package formatted tree
        run: tar -czf issue137-formatted.tar.gz src/client/quantara_app
      - name: Upload formatted tree
        uses: actions/upload-artifact@v4
        with:
          name: issue137-formatted-tree
          path: issue137-formatted.tar.gz
          retention-days: 1
