name: Format chart slice once

on:
  push:
    branches:
      - feat/36-multitimeframe-chart-analysis
    paths:
      - .github/workflows/format-chart-slice-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/36-multitimeframe-chart-analysis
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart sources and tests
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib test
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-chart-slice-once.yml
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "chore: format multi-timeframe chart slice"
          git push origin HEAD:feat/36-multitimeframe-chart-analysis
