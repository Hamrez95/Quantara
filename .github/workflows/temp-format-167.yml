name: Temporary format adaptive TP UI

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: temp-format-167
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format changed Flutter files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/presentation/tp_allocation_editor.dart test/configurable_tp_allocation_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'style: format adaptive TP controls (#167)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
