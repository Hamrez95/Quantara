name: Temporary PR 540 Dart formatter

on:
  push:
    branches:
      - feat/540-manual-setup-execution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/540-manual-setup-execution
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format Dart sources
        working-directory: src/client/quantara_app
        run: dart format lib test tool
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- src/client/quantara_app; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "chore: apply Dart formatter for PR 540"
          git push origin HEAD:feat/540-manual-setup-execution
