name: Temporary Issue 172 final Android payload

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-issue-172-final-android.yml

permissions:
  contents: read

concurrency:
  group: issue-172-final-android
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  SOURCE_SHA: e0674b86e2d5905b0e26e5bcf339fab85bc6aa3a
  ANDROID_PACKAGE: com.quantara.quantara_app.alpha
  ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify final source and assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fxq 'version: 1.2.0-rc.2+122' src/client/quantara_app/pubspec.yaml
          test -f src/client/quantara_app/assets/fonts/Vazirmatn-Regular.ttf
          test -f src/client/quantara_app/assets/fonts/Vazirmatn-SemiBold.ttf
          test -f src/client/quantara_app/assets/fonts/Vazirmatn-Bold.ttf
          test -f src/client/quantara_app/assets/fonts/cryptocurrency-icons.ttf
          ! grep -Fq 'Vazirmatn-Medium.ttf' src/client/quantara_app/pubspec.yaml
      - name: Prepare isolated unsigned Preview transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/quantara_app/android/app/build.gradle.kts')
          s = p.read_text()
          marker = "                else -> {\n                    throw GradleException("
          start = s.find(marker)
          if start < 0:
              raise SystemExit('fail-closed release marker not found')
          end_marker = "\n                }\n"
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('fail-closed release block end not found')
          end += len(end_marker)
          i16 = ' ' * 16
          i20 = ' ' * 20
          replacement = (
              f'{i16}else -> {{\n'
              f'{i20}// One-shot offline-signing transport; not committed to product code.\n'
              f'{i20}applicationIdSuffix = ".alpha"\n'
              f'{i20}versionNameSuffix = "-preview"\n'
              f'{i20}signingConfig = null\n'
              f'{i16}}}\n'
          )
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check
          grep -Fq 'signingConfig = null' src/client/quantara_app/android/app/build.gradle.kts
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Build final unsigned Universal payload once
        working-directory: src/client/quantara_app
        run: flutter build apk --release
      - name: Verify payload and prepare offline signing plus smoke APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/tools/lib smoke
          unsigned="$(find src/client/quantara_app/build/app/outputs/flutter-apk -maxdepth 1 -type f \( -name 'app-release.apk' -o -name 'app-release-unsigned.apk' \) -print -quit)"
          test -n "$unsigned" && test -f "$unsigned"
          cp "$unsigned" transport/quantara-issue172-build122-universal-unsigned.apk
          apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$apkanalyzer_path" && test -x "$apksigner_path" && test -x "$zipalign_path"
          "$apkanalyzer_path" manifest application-id "$unsigned" | grep -Fxq "$ANDROID_PACKAGE"
          "$zipalign_path" -c -P 16 -v 4 "$unsigned" >/dev/null
          if "$apksigner_path" verify "$unsigned" >/dev/null 2>&1; then
            echo 'Offline payload unexpectedly has a valid signer' >&2
            exit 1
          fi
          cp "$apksigner_path" transport/tools/apksigner
          cp "$(dirname "$apksigner_path")/lib/apksigner.jar" transport/tools/lib/apksigner.jar
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/smoke.jks" -storepass smoke-pass-172 -keypass smoke-pass-172 -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Quantara Issue172 Smoke,O=Quantara,C=US' >/dev/null 2>&1
          "$apksigner_path" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-key-alias smoke --ks-pass pass:smoke-pass-172 --key-pass pass:smoke-pass-172 --out smoke/app-release.apk "$unsigned"
          "$apksigner_path" verify --verbose smoke/app-release.apk >/dev/null
          "$zipalign_path" -c -P 16 -v 4 smoke/app-release.apk >/dev/null
          printf '%s\n' "$SOURCE_SHA" > transport/SOURCE_SHA.txt
          printf '%s\n' '1.2.0-rc.2+122' > transport/VERSION.txt
          sha256sum transport/quantara-issue172-build122-universal-unsigned.apk > transport/UNSIGNED-SHA256SUMS.txt
      - name: Upload final offline-signing payload
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue172-build122-offline-signing-payload
          path: transport
          if-no-files-found: error
          retention-days: 2
      - name: Upload exact runtime smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue172-build122-runtime-smoke-apk
          path: smoke/app-release.apk
          if-no-files-found: error
          retention-days: 2

  android-launch:
    name: Android ${{ matrix.api-level }} cold-start smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: quantara-issue172-build122-runtime-smoke-apk
          path: apk
      - name: Resolve smoke APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find apk -type f -name 'app-release.apk' -print -quit)"
          test -n "$apk_path" && test -f "$apk_path"
          echo "ANDROID_RC_APK_PATH=$apk_path" >> "$GITHUB_ENV"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and verify cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-cold-start-smoke.sh "$ANDROID_RC_APK_PATH"
      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue172-build122-api-${{ matrix.api-level }}-diagnostics
          path: |
            android-start.txt
            android-pid.txt
            android-pid-after-settle.txt
            android-logcat.txt
            android-jobscheduler.txt
          if-no-files-found: ignore
          retention-days: 2
