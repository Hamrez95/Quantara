name: One-shot Android 0.13.0 smoke

on:
  push:
    branches:
      - feat/74-local-guarded-live
    paths:
      - '.github/workflows/one-shot-android-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-android-smoke.yml'

permissions:
  actions: read
  contents: read

jobs:
  android-smoke:
    name: Android ${{ matrix.api-level }} candidate smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    env:
      ANDROID_PACKAGE: com.quantara.quantara_app.alpha
      ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity
    steps:
      - name: Download validated Android candidate
        uses: actions/download-artifact@v4
        with:
          name: quantara-android-0.13.0-local-live-canary
          path: apk
          repository: Hamrez95/Quantara
          run-id: 30608516198
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot emulator and verify cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -eu
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell am force-stop "$ANDROID_PACKAGE"
            launched=false
            for attempt in 1 2 3; do
              set +e
              timeout 60s adb shell am start -W -n "$ANDROID_PACKAGE/$ANDROID_ACTIVITY" > android-start.txt 2>&1
              set -e
              cat android-start.txt
              sleep 12
              if adb shell pidof "$ANDROID_PACKAGE" > android-pid.txt && test -s android-pid.txt; then
                launched=true
                break
              fi
              adb shell am force-stop "$ANDROID_PACKAGE" || true
              sleep 4
            done
            test "$launched" = true
            sleep 15
            adb shell pidof "$ANDROID_PACKAGE" > android-pid-after-settle.txt
            test -s android-pid-after-settle.txt
            adb logcat -d > android-logcat.txt
            ! grep -Eq "FATAL EXCEPTION|Process: $ANDROID_PACKAGE|Unable to instantiate application|WorkManager is not initialized properly|ForegroundServiceStartNotAllowedException|SecurityException" android-logcat.txt

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-android-api-${{ matrix.api-level }}-diagnostics
          path: |
            android-start.txt
            android-pid.txt
            android-pid-after-settle.txt
            android-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
