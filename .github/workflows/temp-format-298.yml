name: Temporary format PR 298

on:
  push:
    branches:
      - feat/81-profile-app-update-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/81-profile-app-update-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Format changed Dart files with project toolchain
        working-directory: src/client/quantara_app
        run: dart format lib/features/app_update/presentation/app_update_card.dart test/app_update_card_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/app_update/presentation/app_update_card.dart src/client/quantara_app/test/app_update_card_test.dart
          git commit -m "style(updates): format with pinned Flutter toolchain"
          git push
