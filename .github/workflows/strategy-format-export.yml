name: Strategy formatter export

on:
  push:
    branches:
      - feat/52-strategy-engine-v2

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Format strategy sources
        working-directory: src/client/quantara_app
        run: dart format lib test

      - name: Upload formatted strategy engine
        uses: actions/upload-artifact@v4
        with:
          name: formatted-advanced-strategy
          path: src/client/quantara_app/lib/features/owner_alpha/data/advanced_strategy_engine.dart
          if-no-files-found: error
          retention-days: 1
