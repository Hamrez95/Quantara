name: Temporary Issue 139 source export

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Package source
        shell: bash
        run: tar --exclude=.git -czf /tmp/quantara-issue139-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue139-source
          path: /tmp/quantara-issue139-source.tar.gz
          retention-days: 1
          if-no-files-found: error
