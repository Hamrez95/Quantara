name: Temporary Issue 173 Exact-Lot Protection Hardening

on:
  push:
    branches:
      - automation/issue-173-post-reinstall-fix

permissions:
  contents: write

concurrency:
  group: issue-173-post-reinstall-source-fix
  cancel-in-progress: true

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR source branch
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Harden exact-lot protection and recovered journal evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          policy = 'src/client/quantara_app/lib/features/auto_trade/domain/remaining_target_protection_policy.dart'
          replace_once(
              policy,
              '    final pending = pendingProtection.toList(growable: false);',
              '    final comparisonTolerance = quantityTolerance / 2;\n    final pending = pendingProtection.toList(growable: false);',
          )
          replace_once(policy, 'filled > planned + quantityTolerance', 'filled > planned + comparisonTolerance')
          replace_once(policy, 'filled > quantityTolerance', 'filled > comparisonTolerance')
          replace_once(policy, 'if (remaining <= quantityTolerance) continue;', 'if (remaining <= comparisonTolerance) continue;')
          replace_once(
              policy,
              '            item.quantity.isFinite &&\n            item.quantity + quantityTolerance >= remaining,',
              '            item.quantity.isFinite &&\n            item.quantity > 0 &&\n            item.quantity + comparisonTolerance >= remaining,',
          )

          service = 'src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart'
          replace_once(
              service,
              """    for (var index = 0; index < 3; index++) {
                final id = targetOrderIds[index].trim();
                final planned = targetQuantities[index];
                if (planned <= 0) continue;
          """,
              """    final comparisonTolerance = quantityTolerance / 2;
              for (var index = 0; index < 3; index++) {
                final id = targetOrderIds[index].trim();
                final planned = targetQuantities[index];
                if (planned <= 0) continue;
          """,
          )
          replace_once(
              service,
              """            item.takeProfitPrice > 0 &&
                  item.takeProfitQuantity + quantityTolerance >=
                      targetQuantities[index],
          """,
              """            item.takeProfitPrice > 0 &&
                  item.takeProfitQuantity.isFinite &&
                  item.takeProfitQuantity > 0 &&
                  item.takeProfitQuantity + comparisonTolerance >= planned,
          """,
          )

          observer_path = Path('src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart')
          observer = observer_path.read_text()
          old_r = '(target) => riskPerUnit <= 0'
          if observer.count(old_r) != 2:
              raise SystemExit(f'Expected two expected-R lambdas, found {observer.count(old_r)}')
          observer = observer.replace(old_r, '(target) => target <= 0 || riskPerUnit <= 0')
          if 'confirmed-three-target-ladder' not in observer:
              raise SystemExit('Expected legacy target-ladder evidence label')
          observer = observer.replace('confirmed-three-target-ladder', 'confirmed-active-target-ladder')
          if "1.2.0-rc.2+121" not in observer:
              raise SystemExit('Expected legacy observer app version')
          observer = observer.replace('1.2.0-rc.2+121', '1.2.0-rc.2+124')
          observer_path.write_text(observer)

          regression = Path('src/client/quantara_app/test/issue_173_post_reinstall_regression_test.dart')
          regression.write_bytes(base64.b64decode(''))
          PY

      - name: Format changed Dart sources
        working-directory: src/client/quantara_app
        run: |
          dart format \
            lib/features/auto_trade/domain/remaining_target_protection_policy.dart \
            lib/features/auto_trade/application/local_live_trade_service.dart \
            lib/features/trading_journal/application/local_live_journal_observer.dart \
            test/issue_173_post_reinstall_regression_test.dart

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --no-pub

      - name: Run Issue 173 exact-lot regressions
        working-directory: src/client/quantara_app
        run: |
          flutter test --no-pub \
            test/issue_173_post_reinstall_regression_test.dart \
            test/issue_173_physical_qa_regression_test.dart \
            test/remaining_target_protection_policy_test.dart \
            test/trading_journal_view_test.dart \
            test/release_1_2_0_rc_2_source_test.dart

      - name: Run full Flutter suite
        working-directory: src/client/quantara_app
        run: flutter test --no-pub

      - name: Commit validated hardening to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hamidreza Pakpour"
          git config user.email "136631329+Hamrez95@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/features/auto_trade/domain/remaining_target_protection_policy.dart \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
            src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart \
            src/client/quantara_app/test/issue_173_post_reinstall_regression_test.dart
          git diff --cached --check
          git commit -m "fix: verify exact-lot TP protection safely"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
