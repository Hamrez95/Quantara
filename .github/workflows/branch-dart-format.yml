name: Branch Dart Format

on:
  push:
    branches:
      - feat/80-windows-status-indicator

permissions:
  contents: write

concurrency:
  group: branch-dart-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/80-windows-status-indicator
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Dart sources
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'quantara-ci'
          git config user.email 'quantara-ci@users.noreply.github.com'
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m 'style: apply canonical Dart formatting'
          git push origin HEAD:feat/80-windows-status-indicator
