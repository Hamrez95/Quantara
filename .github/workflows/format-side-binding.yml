name: Temporary Dart format capture

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/private_truth_coordinator.dart test/private_truth_fill_side_policy_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: side-binding-formatted
          path: |
            src/client/quantara_app/lib/features/auto_trade/application/private_truth_coordinator.dart
            src/client/quantara_app/test/private_truth_fill_side_policy_test.dart
