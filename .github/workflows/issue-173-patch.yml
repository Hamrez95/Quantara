name: Issue 173 Physical QA Patch

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - '.github/scripts/issue_173_patch.py'
      - '.github/workflows/issue-173-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-173-one-shot
  cancel-in-progress: false

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Apply fail-closed Issue 173 patch
        run: python3 .github/scripts/issue_173_patch.py

      - name: Remove one-shot patch machinery
        run: rm -f .github/scripts/issue_173_patch.py .github/workflows/issue-173-patch.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib test

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos

      - name: Target Issue 173 regressions
        working-directory: src/client/quantara_app
        run: flutter test test/issue_173_physical_qa_regression_test.dart --reporter expanded

      - name: Full Flutter tests
        working-directory: src/client/quantara_app
        run: flutter test --reporter expanded

      - name: PWA release compile
        working-directory: src/client/quantara_app
        run: flutter build web --release

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantara-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile live AAVE truth and journal context (#173)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
