name: Temporary PR153 controller fixture fix

on:
  push:
    branches:
      - feat/152-professional-strategy-pack

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/152-professional-strategy-pack
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Apply actionable parent fixture and production freshness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_test = Path('src/client/quantara_app/test/owner_alpha_controller_test.dart')
          text = controller_test.read_text()
          replacements = [
            (
              'final analysis = _actionableAnalysis(signalTime);',
              "final analysis = _actionableAnalysis(signalTime);\n    final parentAnalysis = _actionableAnalysis(\n      signalTime,\n      timeframe: '4h',\n    );",
            ),
            (
              "analysesByTimeframe: {'1h': analysis},",
              "analysesByTimeframe: {\n        '1h': analysis,\n        '4h': parentAnalysis,\n      },",
            ),
            (
              "timeframeDirections: {'1h': analysis.direction},",
              "timeframeDirections: {\n        '1h': analysis.direction,\n        '4h': parentAnalysis.direction,\n      },",
            ),
            (
              'TimeframeChartAnalysis _actionableAnalysis(DateTime generatedAt) {',
              "TimeframeChartAnalysis _actionableAnalysis(\n  DateTime generatedAt, {\n  String timeframe = '1h',\n}) {\n  final interval = timeframe == '4h'\n      ? const Duration(hours: 4)\n      : const Duration(hours: 1);",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing controller marker: {old}')
            text = text.replace(old, new, 1)
          old_candles = """  final candles = List.generate(60, (index) {
    final open = 100 + index * 0.5;
    return ChartCandle(
      openTime: generatedAt.subtract(Duration(hours: 60 - index)),
      open: open,
      high: open + 1.2,
      low: open - 1,
      close: open + 0.5,
      volume: 1000 + index.toDouble(),
    );
  });"""
          new_candles = """  final candles = List.generate(60, (index) {
    final open = 100 + index * 0.2;
    final last = index == 59;
    final close = open + (last ? 0.8 : 0.35);
    return ChartCandle(
      openTime: generatedAt.subtract(interval * (60 - index)),
      open: open,
      high: close + (last ? 0.1 : 0.45),
      low: open - (last ? 0.1 : 0.45),
      close: close,
      volume: last ? 1400 : 1000 + index.toDouble(),
    );
  });"""
          if old_candles not in text:
            raise SystemExit('missing candle fixture block')
          text = text.replace(old_candles, new_candles, 1)
          if "timeframe: '1h',\n    candles: candles," not in text:
            raise SystemExit('missing fixture timeframe marker')
          text = text.replace(
            "timeframe: '1h',\n    candles: candles,",
            "timeframe: timeframe,\n    candles: candles,",
            1,
          )
          text = text.replace(
            "fingerprint: 'controller-actionable-fixture',",
            "fingerprint: 'controller-actionable-fixture-$timeframe',",
            1,
          )
          controller_test.write_text(text)

          controller = Path('src/client/quantara_app/lib/features/owner_alpha/application/owner_alpha_controller.dart')
          text = controller.read_text()
          import_marker = "import '../data/bitunix_owner_alpha_repository.dart';\n"
          freshness_import = "import '../data/professional_strategy_engine.dart';\n"
          if freshness_import not in text:
            if import_marker not in text:
              raise SystemExit('missing controller import marker')
            text = text.replace(import_marker, import_marker + freshness_import, 1)
          cadence_marker = "      cadence: _cadence,\n    );\n  }"
          cadence_replacement = "      cadence: _cadence,\n      professionalContext: ProfessionalStrategyContext(\n        evaluatedAt: DateTime.now().toUtc(),\n      ),\n    );\n  }"
          if cadence_marker not in text:
            raise SystemExit('missing rebuild cadence marker')
          text = text.replace(cadence_marker, cadence_replacement, 1)
          controller.write_text(text)
          PY
          cd src/client/quantara_app
          dart format lib test
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "fix: enforce fresh parent-aligned controller rebuilds"
          git push origin HEAD:feat/152-professional-strategy-pack
