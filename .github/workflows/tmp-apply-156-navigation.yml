name: Temporary apply issue 156 navigation

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/156-home-navigation-simplification
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Apply focused product navigation changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          page_path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          page = page_path.read_text()

          for line in [
              "import '../../strategy_lab/data/strategy_lab_runner.dart';\n",
              "import '../../strategy_lab/data/platform_strategy_lab_session_store.dart';\n",
              "import '../../strategy_lab/domain/strategy_lab_models.dart';\n",
          ]:
              if line not in page:
                  raise SystemExit(f'missing Strategy Lab import: {line}')
              page = page.replace(line, '', 1)

          page = replace_exact(
              page,
              "part 'owner_alpha_dashboard.dart';\n",
              "part 'owner_alpha_dashboard.dart';\npart 'owner_alpha_home.dart';\n",
              'home part',
          )
          page = replace_exact(
              page,
              "part 'owner_alpha_strategy_lab.dart';\n",
              '',
              'remove lab part',
          )
          page = replace_exact(
              page,
              "    required this.onLocaleChanged,\n    this.realtimeMonitor,\n",
              "    required this.onLocaleChanged,\n    required this.onOpenPortfolioRisk,\n    this.realtimeMonitor,\n",
              'page constructor risk callback',
          )
          page = replace_exact(
              page,
              "  final ValueChanged<Locale> onLocaleChanged;\n  final ValueListenable<RealtimeMarketMonitorSnapshot>? realtimeMonitor;\n",
              "  final ValueChanged<Locale> onLocaleChanged;\n  final VoidCallback onOpenPortfolioRisk;\n  final ValueListenable<RealtimeMarketMonitorSnapshot>? realtimeMonitor;\n",
              'page field risk callback',
          )
          page = replace_exact(
              page,
              "            onOpenAnalysis: _openAnalysis,\n            onAddSymbol: _showAddSymbolDialog,\n            onOpenStrategyLab: () => setState(() => _destination = 4),\n            showTopBar: desktop,\n",
              "            onOpenAnalysis: _openAnalysis,\n            onAddSymbol: _showAddSymbolDialog,\n            onOpenPortfolioRisk: widget.onOpenPortfolioRisk,\n            onNavigate: (value) => setState(() => _destination = value),\n            showTopBar: desktop,\n",
              'body navigation callbacks',
          )
          page = replace_exact(
              page,
              "                    selectedIndex: _destination,\n                    onDestinationSelected: (value) {\n                      setState(() => _destination = value);\n                    },\n",
              "                    selectedIndex:\n                        _desktopDestinationIndexes.contains(_destination)\n                        ? _desktopDestinationIndexes.indexOf(_destination)\n                        : 0,\n                    onDestinationSelected: (value) {\n                      setState(\n                        () => _destination =\n                            _desktopDestinationIndexes[value],\n                      );\n                    },\n",
              'desktop selected mapping',
          )
          page = replace_exact(
              page,
              "                    destinations: _destinations.indexed\n                        .map(\n                          (item) => NavigationRailDestination(\n                            icon: Icon(item.$2.icon),\n                            selectedIcon: Icon(item.$2.selectedIcon),\n                            label: Text(_destinationLabel(strings, item.$1)),\n                          ),\n                        )\n                        .toList(growable: false),\n",
              "                    destinations: _desktopDestinationIndexes\n                        .map(\n                          (index) => NavigationRailDestination(\n                            icon: Icon(_destinations[index].icon),\n                            selectedIcon: Icon(\n                              _destinations[index].selectedIcon,\n                            ),\n                            label: Text(_destinationLabel(strings, index)),\n                          ),\n                        )\n                        .toList(growable: false),\n",
              'desktop destination mapping',
          )
          page = replace_exact(
              page,
              "              selectedIndex: _mobileDestinationIndexes.contains(_destination)\n                  ? _mobileDestinationIndexes.indexOf(_destination)\n                  : 2,\n",
              "              selectedIndex: _mobileDestinationIndexes.contains(_destination)\n                  ? _mobileDestinationIndexes.indexOf(_destination)\n                  : 0,\n",
              'mobile fallback selection',
          )
          page = replace_exact(
              page,
              "const _destinations = [\n  _Destination(Icons.radar_outlined, Icons.radar_rounded),\n",
              "const _destinations = [\n  _Destination(Icons.home_outlined, Icons.home_rounded),\n",
              'home destination icon',
          )
          page = replace_exact(
              page,
              "const _mobileDestinationIndexes = [0, 1, 2, 3, 5, 6, 7];\n",
              "const _desktopDestinationIndexes = [0, 1, 2, 3, 5, 6, 7];\nconst _mobileDestinationIndexes = [0, 1, 5, 7];\n",
              'destination index sets',
          )
          page = replace_exact(
              page,
              "  _ => strings.radar,\n};\n",
              "  _ => strings.t('خانه', 'Home'),\n};\n",
              'home destination label',
          )
          page = replace_exact(
              page,
              "    required this.onAddSymbol,\n    required this.onOpenStrategyLab,\n    required this.showTopBar,\n",
              "    required this.onAddSymbol,\n    required this.onOpenPortfolioRisk,\n    required this.onNavigate,\n    required this.showTopBar,\n",
              'body constructor callbacks',
          )
          page = replace_exact(
              page,
              "  final VoidCallback onAddSymbol;\n  final VoidCallback onOpenStrategyLab;\n  final bool showTopBar;\n",
              "  final VoidCallback onAddSymbol;\n  final VoidCallback onOpenPortfolioRisk;\n  final ValueChanged<int> onNavigate;\n  final bool showTopBar;\n",
              'body callback fields',
          )
          page = replace_exact(
              page,
              "                      2 => Column(\n                        crossAxisAlignment: CrossAxisAlignment.stretch,\n                        children: [\n                          OutlinedButton.icon(\n                            onPressed: onOpenStrategyLab,\n                            icon: const Icon(Icons.science_outlined),\n                            label: Text(AppStrings.of(context).openStrategyLab),\n                          ),\n                          const SizedBox(height: 14),\n                          _AlphaAnalysisView(\n                            controller: controller,\n                            snapshot: controller.snapshot!,\n                          ),\n                        ],\n                      ),\n",
              "                      2 => _AlphaAnalysisView(\n                        controller: controller,\n                        snapshot: controller.snapshot!,\n                      ),\n",
              'remove lab action from analysis',
          )
          page = replace_exact(
              page,
              "                      4 => _StrategyLabView(\n                        controller: controller,\n                        snapshot: controller.snapshot!,\n                      ),\n                      _ => _RadarDashboard(\n                        controller: controller,\n                        snapshot: controller.snapshot!,\n                        onOpenAnalysis: onOpenAnalysis,\n                      ),\n",
              "                      _ => _HomeDashboard(\n                        controller: controller,\n                        snapshot: controller.snapshot!,\n                        onOpenAnalysis: onOpenAnalysis,\n                        onNavigate: onNavigate,\n                        onOpenPortfolioRisk: onOpenPortfolioRisk,\n                      ),\n",
              'home destination body',
          )
          page_path.write_text(page)

          app_path = Path('src/client/quantara_app/lib/app/quantara_app.dart')
          app = app_path.read_text()
          app = replace_exact(
              app,
              "  Future<void> _savePreferences() {\n    return _preferencesStore.save(\n      AppPreferences(languageCode: _locale.languageCode, themeMode: _themeMode),\n    );\n  }\n\n  @override\n",
              "  Future<void> _savePreferences() {\n    return _preferencesStore.save(\n      AppPreferences(languageCode: _locale.languageCode, themeMode: _themeMode),\n    );\n  }\n\n  Future<void> _showPortfolioRisk(BuildContext context) {\n    return showModalBottomSheet<void>(\n      context: context,\n      isScrollControlled: true,\n      useSafeArea: true,\n      showDragHandle: true,\n      builder: (context) => FractionallySizedBox(\n        heightFactor: 0.94,\n        child: SingleChildScrollView(\n          padding: const EdgeInsets.fromLTRB(12, 0, 12, 24),\n          child: const PortfolioRiskPanel(),\n        ),\n      ),\n    );\n  }\n\n  @override\n",
              'portfolio risk modal method',
          )
          old_home = """      home: _QuantaraHome(\n        locale: _locale,\n        child: OwnerAlphaPage(\n          repository: _repository,\n          settingsStore: _settingsStore,\n          opportunityStateStore: _opportunityStateStore,\n          notificationGateway:\n              widget.notificationGateway ??\n              const PlatformSetupNotificationGateway(),\n          backgroundScanGateway:\n              widget.backgroundScanGateway ??\n              (widget.repository == null\n                  ? const WorkmanagerBackgroundScanGateway()\n                  : const NoopBackgroundScanGateway()),\n          themeMode: _themeMode,\n          locale: _locale,\n          onToggleTheme: _toggleTheme,\n          onLocaleChanged: _setLocale,\n          realtimeMonitor: _realtimeMarketHost,\n        ),\n      ),\n"""
          new_home = """      home: OwnerAlphaPage(\n        repository: _repository,\n        settingsStore: _settingsStore,\n        opportunityStateStore: _opportunityStateStore,\n        notificationGateway:\n            widget.notificationGateway ??\n            const PlatformSetupNotificationGateway(),\n        backgroundScanGateway:\n            widget.backgroundScanGateway ??\n            (widget.repository == null\n                ? const WorkmanagerBackgroundScanGateway()\n                : const NoopBackgroundScanGateway()),\n        themeMode: _themeMode,\n        locale: _locale,\n        onToggleTheme: _toggleTheme,\n        onLocaleChanged: _setLocale,\n        onOpenPortfolioRisk: () => _showPortfolioRisk(context),\n        realtimeMonitor: _realtimeMarketHost,\n      ),\n"""
          app = replace_exact(app, old_home, new_home, 'direct app home')
          marker = '\nfinal class _QuantaraHome extends StatelessWidget {'
          if app.count(marker) != 1:
              raise SystemExit('QuantaraHome wrapper marker mismatch')
          app = app.split(marker, 1)[0].rstrip() + '\n'
          app_path.write_text(app)

          panel_path = Path('src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart')
          panel = panel_path.read_text()
          panel = replace_exact(
              panel,
              "                    'ورود واقعی سخت‌افزاری غیرفعال است. این بخش فقط تصمیم، رزرو و بازیابی بودجه را شبیه‌سازی می‌کند.',\n                    'Real entry is hard-disabled. This panel only simulates decisions, reservations, and recovery.',\n",
              "                    'این صفحه بودجه ریسک را نمایش می‌دهد و خودش هیچ سفارشی ارسال نمی‌کند. شروع ترید واقعی فقط از صفحه ترید خودکار و پس از کنترل حساب انجام می‌شود.',\n                    'This page visualizes the risk budget and sends no orders itself. Real trading starts only from Auto Trade after account checks.',\n",
              'risk panel notice',
          )
          panel = replace_exact(
              panel,
              "              _t('بودجه ریسک پرتفوی', 'Portfolio risk budget'),\n",
              "              _t('کنترل ریسک معاملات', 'Trading risk control'),\n",
              'risk panel title',
          )
          panel = replace_exact(
              panel,
              "                'ظرفیت هم‌زمان بر اساس ریسک روزانه و مارجین آزاد است، نه تعداد ثابت پوزیشن.',\n                'Concurrent capacity is based on daily risk and free margin, not a fixed position count.',\n",
              "                'قبل از ورود جدید، زیان احتمالی کل و مارجین رزروشده با سقف امن مقایسه می‌شود.',\n                'Before a new entry, aggregate potential loss and reserved margin are checked against the safety budget.',\n",
              'risk panel subtitle',
          )
          panel = replace_exact(
              panel,
              "        avatar: const Icon(Icons.science_outlined, size: 18),\n        label: Text(_t('شبیه‌سازی', 'Simulation')),\n",
              "        avatar: const Icon(Icons.shield_outlined, size: 18),\n        label: Text(_t('نمایش بودجه', 'Budget view')),\n",
              'risk panel chip',
          )
          panel_path.write_text(panel)
          PY
      - name: Format product sources
        working-directory: src/client/quantara_app
        run: dart format lib/app/quantara_app.dart lib/features/owner_alpha/presentation/owner_alpha_page.dart lib/features/owner_alpha/presentation/owner_alpha_home.dart lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
      - name: Commit product navigation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/app/quantara_app.dart src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_home.dart src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: simplify navigation and add Home"
          git push origin HEAD:feat/156-home-navigation-simplification
