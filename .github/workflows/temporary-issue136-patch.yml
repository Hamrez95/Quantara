name: Temporary Issue 136 patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify and apply Issue 136 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/temporary/issue136.patch.part00.b64 \
            .github/temporary/issue136.patch.part01.b64 \
            .github/temporary/issue136.patch.part02.b64 \
            .github/temporary/issue136.patch.part03.b64 \
            .github/temporary/issue136.patch.part04.b64 \
            > /tmp/issue136.patch.gz.b64
          test "$(wc -c < /tmp/issue136.patch.gz.b64)" -eq 32212
          echo 'd463ce6ac1578fdef74b5d498db8853e4388b4ceaacfd7417028f46161784493  /tmp/issue136.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/issue136.patch.gz.b64 | gzip --decompress > /tmp/issue136.patch
          echo '019a4eb0c2bae64dee18998e3073087c0bd204061e8780d4fb85bbe404194b2e  /tmp/issue136.patch' | sha256sum --check
          git apply --check /tmp/issue136.patch
          git apply /tmp/issue136.patch
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          service = service_path.read_text()
          service = service.replace(
              """          decision: decision,
          priceTolerance: priceTolerance,""",
              """          decision: decision,
          previousStop: currentStop,
          priceTolerance: priceTolerance,""",
          )
          signature = """    required int stage,
    required ProfitLockStopDecision decision,
    required double priceTolerance,"""
          assert signature in service
          service = service.replace(
              signature,
              """    required int stage,
    required ProfitLockStopDecision decision,
    required double previousStop,
    required double priceTolerance,""",
              1,
          )
          service = service.replace(
              """        previousStop: decision.proposedStop,
        proposedStop: decision.proposedStop,""",
              """        previousStop: previousStop,
        proposedStop: decision.proposedStop,""",
              1,
          )
          duplicate = """      await _journalObserver.recordStopMove(
        managed: finalized,
        stage: stage,
        previousStop: current.originalStopLoss,
        proposedStop: decision.proposedStop,
        confirmed: true,
        reason: decision.reason,
        orderId: execution.orderId ?? finalized.stopOrderId,
      );
"""
          assert duplicate in service
          service = service.replace(duplicate, '', 1)
          service = service.replace(
              """      previousStop: current.profitLockProgress.pendingProposedStop ??
          current.originalStopLoss,
      proposedStop: decision.proposedStop,""",
              """      previousStop: previousStop,
      proposedStop: decision.proposedStop,""",
              1,
          )
          confirmed_anchor = """      final finalized = pending.copyWith(
        stopOrderId: execution.orderId ?? pending.stopOrderId,
        profitLockProgress: pending.profitLockProgress.copyWith(
          confirmedStage: stage,
          clearPendingStage: true,
          clearPendingStop: true,
          clearWarning: true,
        ),
      );
      _auditEvent("""
          assert confirmed_anchor in service
          service = service.replace(
              confirmed_anchor,
              """      final finalized = pending.copyWith(
        stopOrderId: execution.orderId ?? pending.stopOrderId,
        profitLockProgress: pending.profitLockProgress.copyWith(
          confirmedStage: stage,
          clearPendingStage: true,
          clearPendingStop: true,
          clearWarning: true,
        ),
      );
      await _journalObserver.recordStopMove(
        managed: finalized,
        stage: stage,
        previousStop: previousStop,
        proposedStop: decision.proposedStop,
        confirmed: true,
        reason: decision.reason,
        orderId: execution.orderId ?? finalized.stopOrderId,
      );
      _auditEvent(""",
              1,
          )
          service_path.write_text(service)

          observer_path = Path('src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart')
          observer = observer_path.read_text()
          observer = observer.replace(
              'final remaining = math.max(0, managed.initialQuantity - cumulative);',
              'final remaining = math.max(0, managed.initialQuantity - cumulative).toDouble();',
          )
          observer = observer.replace(
              "if (warning != null) 'warning': warning,",
              "'warning': warning,",
          )
          observer_path.write_text(observer)

          controller_path = Path('src/client/quantara_app/lib/features/trading_journal/application/trading_journal_controller.dart')
          controller = controller_path.read_text()
          controller = controller.replace(
              'TradingJournalController({required TradingJournalStore store}) : _store = store;',
              'TradingJournalController({required this.store});',
          )
          controller = controller.replace(
              'final TradingJournalStore _store;',
              'final TradingJournalStore store;',
          )
          controller = controller.replace('_store.', 'store.')
          controller_path.write_text(controller)
          PY
          rm -f .github/workflows/temporary-issue136-patch.yml
          rm -f .github/workflows/temporary-issue136-source-export.yml
          rm -rf .github/temporary

      - name: Format, analyze and run focused journal gates
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded \
            test/trading_journal_ledger_test.dart \
            test/trading_journal_store_test.dart \
            test/trading_journal_statistics_test.dart \
            test/trading_journal_view_test.dart \
            test/trading_journal_encrypted_export_test.dart \
            test/trading_journal_source_safety_test.dart \
            test/trading_pnl_projection_test.dart \
            test/exchange_confirmed_profit_lock_test.dart \
            test/local_live_v1_0_1_source_test.dart \
            test/auto_trade_readonly_source_test.dart

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add durable event-sourced trading journal and timeline'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
