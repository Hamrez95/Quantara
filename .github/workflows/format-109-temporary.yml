name: Temporary format #109

on:
  push:
    branches:
      - feat/109-periodic-performance-attribution

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/109-periodic-performance-attribution
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: |
          dart format \
            lib/features/trading_journal/domain/trading_performance_analytics.dart \
            lib/features/trading_journal/domain/trading_performance_reporting.dart \
            test/trading_performance_analytics_test.dart
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/format-109-temporary.yml
          if git diff --quiet --cached && git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_journal/domain/trading_performance_analytics.dart
          git add src/client/quantara_app/lib/features/trading_journal/domain/trading_performance_reporting.dart
          git add src/client/quantara_app/test/trading_performance_analytics_test.dart
          git commit -m "style(analytics): apply canonical Dart formatting"
          git push origin HEAD:feat/109-periodic-performance-attribution
