name: Temporary format update foundation

on:
  push:
    branches:
      - feat/81-release-manifest-foundation-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/81-release-manifest-foundation-v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format update foundation
        working-directory: src/client/quantara_app
        run: dart format lib/features/app_update test/app_update_manifest_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/app_update src/client/quantara_app/test/app_update_manifest_test.dart
          git commit -m "style(updates): apply canonical Dart formatting"
          git push
