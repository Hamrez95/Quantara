name: Temporary patch issue 102

on:
  push:
    branches:
      - feat/102-high-coverage-discovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/102-high-coverage-discovery
      - name: Apply exact analyzer fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/owner_alpha/data/opportunity_discovery_universe.dart')
          text = path.read_text()
          replacements = [
              ("required http.Client client,\n", "required this._client,\n"),
              (") : _client = client,\n       _now = now ?? DateTime.now,", ") : _now = now ?? DateTime.now,"),
              ("final class OpportunityDiscoveryRealtimeAnalyzer\n", "final class _OpportunityDiscoveryRealtimeAnalyzer\n"),
              ("  OpportunityDiscoveryRealtimeAnalyzer({\n", "  _OpportunityDiscoveryRealtimeAnalyzer({\n"),
              ("      final analyzer = OpportunityDiscoveryRealtimeAnalyzer(\n", "      final analyzer = _OpportunityDiscoveryRealtimeAnalyzer(\n"),
              ("    if (eligible.isEmpty) {\n      throw StateError(\n        'No Bitunix Futures symbols passed discovery eligibility.',\n      );\n    }", "    if (eligible.length < policy.targetSymbolCount) {\n      throw StateError(\n        'Only ${eligible.length}/${policy.targetSymbolCount} Bitunix Futures symbols passed discovery eligibility.',\n      );\n    }"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected replacement: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format Flutter sources
        run: |
          cd src/client/quantara_app
          dart format lib test
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "fix(discovery): satisfy analyzer and coverage invariants"
          git push origin HEAD:feat/102-high-coverage-discovery
