name: Temporary Supervisor Formatter

on:
  push:
    branches:
      - 'feature/182-system-wide-supervisor-observability-v2'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/182-system-wide-supervisor-observability-v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format Supervisor files
        run: |
          dart format \
            src/client/quantara_app/lib/features/ai_supervisor \
            src/client/quantara_app/test/ai_supervisor_*.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/ai_supervisor src/client/quantara_app/test/ai_supervisor_*.dart
          git commit -m 'style(supervisor): apply pinned Dart formatter'
          git push origin HEAD:feature/182-system-wide-supervisor-observability-v2
