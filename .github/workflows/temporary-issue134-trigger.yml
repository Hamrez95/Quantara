name: Temporary Issue 134 trigger

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify and apply Issue 134 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/temporary/issue134.part00 \
              .github/temporary/issue134.part01 \
              .github/temporary/issue134.part02 \
              .github/temporary/issue134.part03 > /tmp/issue134.patch.gz.b64
          test "$(wc -c < /tmp/issue134.patch.gz.b64)" -eq 15064
          echo '11330162615ce42ddbffc259ae12d91370122e69a3d9e5b812514dcf126f87d0  /tmp/issue134.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/issue134.patch.gz.b64 | gzip --decompress > /tmp/issue134.patch
          echo '3726fe3f1df60f4cdf2dc9629dabf29ad8d3a5ee4274f69cbf156ff9692d22b0  /tmp/issue134.patch' | sha256sum --check
          git apply --check /tmp/issue134.patch
          git apply /tmp/issue134.patch

          git fetch origin dev --depth=1
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          rm .github/workflows/temporary-source-export.yml
          rm .github/workflows/temporary-issue134-trigger.yml
          rm -rf .github/temporary

          cd src/client/quantara_app
          flutter pub get
          dart format lib test
          cd "$GITHUB_WORKSPACE"

          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add authoritative private-account reconciliation'
          git archive --format=zip --output=/tmp/quantara-issue134-formatted.zip HEAD
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload formatted source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue134-formatted
          path: /tmp/quantara-issue134-formatted.zip
          if-no-files-found: error
          retention-days: 1
