name: Scaffold Flutter app once

on:
  push:
    branches:
      - feat/29-flutter-cockpit-foundation
    paths:
      - .github/workflows/scaffold-flutter-once.yml

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/29-flutter-cockpit-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create mobile and web project
        run: |
          flutter create \
            --platforms=android,ios,web \
            --org=com.quantara \
            --project-name=quantara_app \
            --description="Quantara explainable trading research and paper cockpit" \
            src/client/quantara_app
      - name: Remove one-time workflow and commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scaffold-flutter-once.yml
          git add src/client/quantara_app
          git commit -m "feat: scaffold Flutter mobile and PWA client"
          git push origin HEAD:feat/29-flutter-cockpit-foundation
