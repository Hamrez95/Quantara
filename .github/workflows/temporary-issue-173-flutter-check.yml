name: Temporary Issue 173 Flutter checks

on:
  push:
    branches:
      - fix/173-journal-live-context
    paths:
      - src/client/quantara_app/**
      - .github/workflows/temporary-issue-173-flutter-check.yml

permissions:
  contents: write

concurrency:
  group: issue-173-flutter-check
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/173-journal-live-context
          fetch-depth: 0
      - name: Apply issue 173 integration fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_view.dart
          python3 - <<'PY'
          from pathlib import Path
          live = Path('src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_live_positions.dart')
          text = live.read_text()
          text = text.replace("import 'package:flutter/foundation.dart';\n", '')
          text = text.replace('builder: (context, _, __) => Column(', 'builder: (context, liveContexts, child) => Column(')
          live.write_text(text)

          release_test = Path('src/client/quantara_app/test/release_1_2_0_rc_2_source_test.dart')
          release_test.write_text(release_test.read_text().replace('version: 1.2.0-rc.2+121', 'version: 1.2.0-rc.2+123'))

          observer = Path('src/client/quantara_app/lib/features/trading_journal/application/local_live_journal_observer.dart')
          observer.write_text(observer.read_text().replace('1.2.0-rc.2+121', '1.2.0-rc.2+123'))

          service = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          service_text = service.read_text()
          import_anchor = "import '../domain/local_live_portfolio_admission.dart';\n"
          protection_import = "import '../domain/local_live_protection_gate.dart';\n"
          if protection_import not in service_text:
              service_text = service_text.replace(import_anchor, import_anchor + protection_import)
          old_snapshot = "final allOpenPositionsProtected =\n              _managed.length ==\n                  positions.where((item) => item.quantity > 0).length &&\n              _managed.every((item) => item.profitLockProgress.warning == null);"
          new_snapshot = "final allOpenPositionsProtected =\n              LocalLiveProtectionGate.allManagedPositionsFullyProtected(\n                account: account,\n                managed: _managed,\n              );"
          if old_snapshot not in service_text:
              raise SystemExit('snapshot protection gate anchor not found')
          service_text = service_text.replace(old_snapshot, new_snapshot, 1)
          old_reservation = "final existingExposureProtected =\n            _managed.length ==\n                exchangePositions.where((item) => item.quantity > 0).length &&\n            _managed.every((item) => item.profitLockProgress.warning == null);"
          new_reservation = "final existingExposureProtected =\n            LocalLiveProtectionGate.allManagedPositionsFullyProtected(\n              account: account,\n              managed: _managed,\n            );"
          if old_reservation not in service_text:
              raise SystemExit('reservation protection gate anchor not found')
          service.write_text(service_text.replace(old_reservation, new_reservation, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --no-pub
      - name: Run all tests
        working-directory: src/client/quantara_app
        run: flutter test --no-pub
      - name: Compile debug Android smoke payload
        working-directory: src/client/quantara_app
        run: flutter build apk --debug --no-pub
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-issue-173-flutter-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Hamrez95@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'fix: complete issue 173 live journal and protection gate'
          git push origin HEAD:fix/173-journal-live-context
