name: Temporary Issue 173 Flutter checks

on:
  push:
    branches:
      - fix/173-journal-live-context
    paths:
      - src/client/quantara_app/**
      - .github/workflows/temporary-issue-173-flutter-check.yml

permissions:
  contents: read

concurrency:
  group: issue-173-flutter-check
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Verify formatting
        working-directory: src/client/quantara_app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --no-pub
      - name: Run widget and safety tests
        working-directory: src/client/quantara_app
        run: flutter test --no-pub
      - name: Compile debug Android smoke payload
        working-directory: src/client/quantara_app
        run: flutter build apk --debug --no-pub
