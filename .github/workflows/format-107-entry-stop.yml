name: Format 107 entry stop patch

on:
  push:
    branches:
      - fix/107-entry-stop-coverage
    paths:
      - .github/workflows/format-107-entry-stop.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/107-entry-stop-coverage
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'
          cache: true
      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
            src/client/quantara_app/lib/features/auto_trade/domain/full_position_stop_policy.dart \
            src/client/quantara_app/test/full_position_stop_policy_test.dart
      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/format-107-entry-stop.yml
          git config user.name "quantara-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart src/client/quantara_app/lib/features/auto_trade/domain/full_position_stop_policy.dart src/client/quantara_app/test/full_position_stop_policy_test.dart .github/workflows/format-107-entry-stop.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No formatting change produced"; exit 1; }
          git commit -m "style(auto-trade): format full-position stop patch"
          git push origin HEAD:fix/107-entry-stop-coverage
