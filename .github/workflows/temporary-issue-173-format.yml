name: Temporary Issue 173 source formatter

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - src/client/quantara_app/lib/features/market_analysis/application/live_trade_context_registry.dart
      - src/client/quantara_app/lib/features/owner_alpha/data/trade_idea_factory.dart
      - src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_view.dart
      - src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_live_positions.dart
      - src/client/quantara_app/test/issue_173_journal_live_context_test.dart
      - .github/workflows/temporary-issue-173-format.yml

permissions:
  contents: write

concurrency:
  group: issue-173-source-formatter
  cancel-in-progress: true

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format issue 173 Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            src/client/quantara_app/lib/features/market_analysis/application/live_trade_context_registry.dart \
            src/client/quantara_app/lib/features/owner_alpha/data/trade_idea_factory.dart \
            src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_view.dart \
            src/client/quantara_app/lib/features/trading_journal/presentation/trading_journal_live_positions.dart \
            src/client/quantara_app/test/issue_173_journal_live_context_test.dart
      - name: Remove temporary formatter and push formatted source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-issue-173-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'style: format issue 173 journal live context'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
