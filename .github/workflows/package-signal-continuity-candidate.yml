name: Package signal continuity candidate

on:
  push:
    branches:
      - feat/89-91-signal-continuity
    paths:
      - .github/workflows/package-signal-continuity-candidate.yml

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/89-91-signal-continuity
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and build release APK
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          flutter build apk --release

      - id: apk_sha
        name: Calculate APK SHA-256
        run: |
          value="$(sha256sum src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: upload
        name: Upload Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: quantara-signal-continuity-android-candidate
          path: src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record candidate metadata and clean workflow
        run: |
          mkdir -p docs/validation
          cat > docs/validation/signal-continuity-candidate.md <<EOF
          # Signal continuity Android candidate

          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run ID: \`${GITHUB_RUN_ID}\`
          - Artifact name: \`quantara-signal-continuity-android-candidate\`
          - Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`
          - Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          - APK SHA-256: \`${{ steps.apk_sha.outputs.value }}\`
          - Retention: 14 days
          - Status: draft candidate for physical Samsung validation; not a stable release
          EOF
          rm .github/workflows/package-signal-continuity-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: record signal continuity Android candidate"
          git pull --rebase origin feat/89-91-signal-continuity
          git push origin HEAD:feat/89-91-signal-continuity
