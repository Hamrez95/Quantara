name: Flutter client CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  ANDROID_PACKAGE: com.quantara.quantara_app.alpha
  ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity
  PREVIEW_ARTIFACT: quantara-android-1.0.0-preview

jobs:
  apply-analysis-context:
    name: Apply realtime analysis context once
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/101-realtime-analysis-context' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-analysis-context
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply product changes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/client/quantara_app/lib/features/owner_alpha/data/realtime_market_application.dart')
          app = app_path.read_text()
          gateway = """abstract interface class RealtimeMarketAnalysisGateway {
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandlePipelineUpdate update,
            );
          }
          """
          synchronizer = gateway + """
          abstract interface class RealtimeMarketAnalysisSynchronizer {
            Future<void> synchronize(RealtimeCandlePipelineUpdate update);
          }
          """
          if 'abstract interface class RealtimeMarketAnalysisSynchronizer' not in app:
              if gateway not in app:
                  raise SystemExit('analysis gateway marker not found')
              app = app.replace(gateway, synchronizer, 1)

          old_handler = """    _metrics.recordPipelineUpdate(update);
              if (!update.allowsCandidatePreparation) return;

              late final RealtimeCandidateAnalysisBatch batch;
          """
          new_handler = """    _metrics.recordPipelineUpdate(update);
              final gateway = analysisGateway;
              if (gateway is RealtimeMarketAnalysisSynchronizer) {
                try {
                  await gateway.synchronize(update);
                } on Object catch (error) {
                  _metrics.recordFault(
                    message: 'Realtime analysis synchronization failed: $error',
                    occurredAtUtc: _clock(),
                  );
                  rethrow;
                }
              }
              if (!update.allowsCandidatePreparation) return;

              late final RealtimeCandidateAnalysisBatch batch;
          """
          if 'Realtime analysis synchronization failed' not in app:
              if old_handler not in app:
                  raise SystemExit('pipeline handler marker not found')
              app = app.replace(old_handler, new_handler, 1)
          app_path.write_text(app)

          data_path = Path('src/client/quantara_app/lib/features/owner_alpha/data/realtime_contextual_market_analysis.dart')
          data_path.write_text(r'''import '../../market_analysis/domain/market_chart_models.dart';
          import '../domain/realtime_candle_pipeline_models.dart';
          import '../domain/realtime_market_runtime_models.dart';
          import 'realtime_market_application.dart';

          final class RealtimeCandleAnalysisContext {
            RealtimeCandleAnalysisContext({
              required this.update,
              required this.snapshot,
            }) {
              if (update.key != snapshot.key) {
                throw ArgumentError(
                  'The analysis update and snapshot must use the same stream.',
                );
              }
              if (!update.streamTrusted || !snapshot.trusted) {
                throw StateError(
                  'Untrusted candle state cannot enter realtime analysis.',
                );
              }
              if (update.workingCandle?.openTime !=
                  snapshot.workingCandle?.openTime) {
                throw StateError(
                  'The analysis snapshot does not match the event working candle.',
                );
              }
            }

            final RealtimeCandlePipelineUpdate update;
            final RealtimeCandleStreamSnapshot snapshot;

            RealtimeCandleStreamKey get key => update.key;
            RealtimeCandlePipelineDisposition get disposition =>
                update.disposition;
            List<ChartCandle> get closedCandles => snapshot.closedCandles;
            List<ChartCandle> get eventClosedCandles => update.closedCandles;
            ChartCandle? get workingCandle => snapshot.workingCandle;
            DateTime get exchangeTimestampUtc => update.exchangeTimestampUtc;
            DateTime get receivedAtUtc => update.receivedAtUtc;
            DateTime get processedAtUtc => update.processedAtUtc;
            bool get triggersClosedCandleAnalysis =>
                update.triggersClosedCandleAnalysis;
          }

          abstract interface class RealtimeContextualMarketAnalyzer {
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandleAnalysisContext context,
            );
          }

          final class SnapshottingRealtimeMarketAnalysisGateway
              implements
                  RealtimeMarketAnalysisGateway,
                  RealtimeMarketAnalysisSynchronizer {
            SnapshottingRealtimeMarketAnalysisGateway({
              required this.analyzer,
              this.maximumStreams = 2000,
              this.maximumClosedCandlesPerStream = 500,
            }) {
              if (maximumStreams < 1) {
                throw ArgumentError.value(maximumStreams, 'maximumStreams');
              }
              if (maximumClosedCandlesPerStream < 20) {
                throw ArgumentError.value(
                  maximumClosedCandlesPerStream,
                  'maximumClosedCandlesPerStream',
                );
              }
            }

            final RealtimeContextualMarketAnalyzer analyzer;
            final int maximumStreams;
            final int maximumClosedCandlesPerStream;
            final Map<RealtimeCandleStreamKey, _AnalysisStreamState> _states = {};

            @override
            Future<void> synchronize(RealtimeCandlePipelineUpdate update) async {
              switch (update.disposition) {
                case RealtimeCandlePipelineDisposition.bootstrapped:
                  _storeBootstrap(update);
                  return;
                case RealtimeCandlePipelineDisposition.gapDetected:
                case RealtimeCandlePipelineDisposition.blockedByGap:
                  final state = _requireState(update.key);
                  state.gap = update.gap;
                  return;
                case RealtimeCandlePipelineDisposition.reconciled:
                  final state = _requireState(update.key);
                  _appendClosed(state, update.closedCandles);
                  state.workingCandle = update.workingCandle;
                  state.gap = null;
                  state.lastUpdate = update;
                  return;
                case RealtimeCandlePipelineDisposition.candleClosed:
                  final state = _requireState(update.key);
                  _appendClosed(state, update.closedCandles);
                  state.workingCandle = update.workingCandle;
                  state.lastUpdate = update;
                  return;
                case RealtimeCandlePipelineDisposition.workingUpdated:
                  final state = _requireState(update.key);
                  if (state.gap != null) {
                    throw StateError(
                      'A working candle cannot update while a gap is active.',
                    );
                  }
                  state.workingCandle = update.workingCandle;
                  state.lastUpdate = update;
                  return;
                case RealtimeCandlePipelineDisposition.duplicate:
                case RealtimeCandlePipelineDisposition.outOfOrder:
                  return;
              }
            }

            @override
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandlePipelineUpdate update,
            ) async {
              final state = _requireState(update.key);
              if (!identical(state.lastUpdate, update)) {
                throw StateError(
                  'Realtime analysis requires the synchronized event instance.',
                );
              }
              if (state.gap != null || !update.streamTrusted) {
                throw StateError(
                  'Untrusted candle state cannot enter realtime analysis.',
                );
              }
              return analyzer.analyze(
                RealtimeCandleAnalysisContext(
                  update: update,
                  snapshot: RealtimeCandleStreamSnapshot(
                    key: update.key,
                    closedCandles: state.closedCandles,
                    workingCandle: state.workingCandle,
                    gap: state.gap,
                  ),
                ),
              );
            }

            void _storeBootstrap(RealtimeCandlePipelineUpdate update) {
              if (update.closedCandles.length < 20 ||
                  update.workingCandle != null ||
                  update.gap != null) {
                throw StateError('Invalid realtime bootstrap snapshot.');
              }
              if (!_states.containsKey(update.key) &&
                  _states.length >= maximumStreams) {
                throw StateError(
                  'Realtime analysis stream capacity was exceeded.',
                );
              }
              final retained = update.closedCandles.length <=
                      maximumClosedCandlesPerStream
                  ? update.closedCandles
                  : update.closedCandles.sublist(
                      update.closedCandles.length -
                          maximumClosedCandlesPerStream,
                    );
              _states[update.key] = _AnalysisStreamState(
                closedCandles: retained,
                lastUpdate: update,
              );
            }

            _AnalysisStreamState _requireState(RealtimeCandleStreamKey key) {
              final state = _states[key];
              if (state == null) {
                throw StateError(
                  'Realtime analysis must be bootstrapped before use.',
                );
              }
              return state;
            }

            void _appendClosed(
              _AnalysisStreamState state,
              List<ChartCandle> candles,
            ) {
              for (final candle in candles) {
                final last = state.closedCandles.isEmpty
                    ? null
                    : state.closedCandles.last;
                if (last != null) {
                  if (last.openTime == candle.openTime) {
                    state.closedCandles[state.closedCandles.length - 1] = candle;
                    continue;
                  }
                  if (!candle.openTime.isAfter(last.openTime)) {
                    throw StateError(
                      'Closed candle history cannot move backwards.',
                    );
                  }
                }
                state.closedCandles.add(candle);
                if (state.closedCandles.length >
                    maximumClosedCandlesPerStream) {
                  state.closedCandles.removeAt(0);
                }
              }
            }
          }

          final class _AnalysisStreamState {
            _AnalysisStreamState({
              required List<ChartCandle> closedCandles,
              required this.lastUpdate,
            }) : closedCandles = List.of(closedCandles);

            final List<ChartCandle> closedCandles;
            ChartCandle? workingCandle;
            RealtimeCandleGap? gap;
            RealtimeCandlePipelineUpdate lastUpdate;
          }
          ''')

          test_path = Path('src/client/quantara_app/test/realtime_contextual_market_analysis_test.dart')
          test_path.write_text(r'''import 'package:flutter_test/flutter_test.dart';
          import 'package:quantara_app/features/market_analysis/domain/market_chart_models.dart';
          import 'package:quantara_app/features/owner_alpha/data/realtime_contextual_market_analysis.dart';
          import 'package:quantara_app/features/owner_alpha/domain/bitunix_public_stream_models.dart';
          import 'package:quantara_app/features/owner_alpha/domain/realtime_candle_pipeline_models.dart';
          import 'package:quantara_app/features/owner_alpha/domain/realtime_market_runtime_models.dart';

          void main() {
            final key = RealtimeCandleStreamKey(
              symbol: 'BTCUSDT',
              interval: BitunixKlineInterval.fifteenMinutes,
            );
            final history = [
              for (var index = 0; index < 20; index++)
                _candle(
                  DateTime.utc(2026, 8, 2, 7).add(
                    Duration(minutes: index * 15),
                  ),
                  100 + index.toDouble(),
                ),
            ];

            test('passes a full immutable trusted snapshot to analysis', () async {
              final analyzer = _RecordingAnalyzer();
              final gateway = SnapshottingRealtimeMarketAnalysisGateway(
                analyzer: analyzer,
              );
              await gateway.synchronize(_bootstrap(key, history));
              final working = _candle(DateTime.utc(2026, 8, 2, 12), 121);
              final update = _update(
                key: key,
                disposition:
                    RealtimeCandlePipelineDisposition.workingUpdated,
                working: working,
              );

              await gateway.synchronize(update);
              final result = await gateway.analyze(update);

              expect(result.isEmpty, isTrue);
              expect(analyzer.contexts, hasLength(1));
              final context = analyzer.contexts.single;
              expect(context.closedCandles, hasLength(20));
              expect(context.workingCandle, same(working));
              expect(context.eventClosedCandles, isEmpty);
              expect(
                () => context.closedCandles.add(working),
                throwsUnsupportedError,
              );
            });

            test('appends rollover and keeps the snapshot bounded', () async {
              final analyzer = _RecordingAnalyzer();
              final gateway = SnapshottingRealtimeMarketAnalysisGateway(
                analyzer: analyzer,
                maximumClosedCandlesPerStream: 20,
              );
              await gateway.synchronize(_bootstrap(key, history));
              final closed = _candle(DateTime.utc(2026, 8, 2, 12), 121);
              final working = _candle(DateTime.utc(2026, 8, 2, 12, 15), 122);
              final update = _update(
                key: key,
                disposition: RealtimeCandlePipelineDisposition.candleClosed,
                working: working,
                closed: [closed],
              );

              await gateway.synchronize(update);
              await gateway.analyze(update);

              final context = analyzer.contexts.single;
              expect(context.closedCandles, hasLength(20));
              expect(context.closedCandles.last.openTime, closed.openTime);
              expect(context.closedCandles.first.openTime, history[1].openTime);
              expect(context.triggersClosedCandleAnalysis, isTrue);
            });

            test('blocks analysis while a stream gap is active', () async {
              final analyzer = _RecordingAnalyzer();
              final gateway = SnapshottingRealtimeMarketAnalysisGateway(
                analyzer: analyzer,
              );
              await gateway.synchronize(_bootstrap(key, history));
              final gap = RealtimeCandleGap(
                fromOpenTimeUtc: DateTime.utc(2026, 8, 2, 12),
                toOpenTimeExclusiveUtc: DateTime.utc(2026, 8, 2, 12, 30),
                observedWorkingOpenTimeUtc: DateTime.utc(2026, 8, 2, 12, 30),
              );
              await gateway.synchronize(
                _update(
                  key: key,
                  disposition: RealtimeCandlePipelineDisposition.gapDetected,
                  working: null,
                  gap: gap,
                ),
              );
              final working = _candle(DateTime.utc(2026, 8, 2, 12, 30), 123);
              final update = _update(
                key: key,
                disposition:
                    RealtimeCandlePipelineDisposition.workingUpdated,
                working: working,
              );

              await expectLater(
                gateway.synchronize(update),
                throwsStateError,
              );
              expect(analyzer.contexts, isEmpty);
            });

            test('requires bootstrap and the exact synchronized event', () async {
              final gateway = SnapshottingRealtimeMarketAnalysisGateway(
                analyzer: _RecordingAnalyzer(),
              );
              final working = _candle(DateTime.utc(2026, 8, 2, 12), 121);
              final update = _update(
                key: key,
                disposition:
                    RealtimeCandlePipelineDisposition.workingUpdated,
                working: working,
              );
              await expectLater(gateway.synchronize(update), throwsStateError);

              await gateway.synchronize(_bootstrap(key, history));
              await gateway.synchronize(update);
              final equivalent = _update(
                key: key,
                disposition:
                    RealtimeCandlePipelineDisposition.workingUpdated,
                working: working,
              );
              await expectLater(gateway.analyze(equivalent), throwsStateError);
            });
          }

          final class _RecordingAnalyzer
              implements RealtimeContextualMarketAnalyzer {
            final List<RealtimeCandleAnalysisContext> contexts = [];

            @override
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandleAnalysisContext context,
            ) async {
              contexts.add(context);
              return RealtimeCandidateAnalysisBatch();
            }
          }

          RealtimeCandlePipelineUpdate _bootstrap(
            RealtimeCandleStreamKey key,
            List<ChartCandle> history,
          ) => RealtimeCandlePipelineUpdate(
            key: key,
            disposition: RealtimeCandlePipelineDisposition.bootstrapped,
            workingCandle: null,
            closedCandles: history,
            gap: null,
            exchangeTimestampUtc: DateTime.utc(2026, 8, 2, 12),
            receivedAtUtc: DateTime.utc(2026, 8, 2, 12),
            processedAtUtc: DateTime.utc(2026, 8, 2, 12, 0, 0, 100),
          );

          RealtimeCandlePipelineUpdate _update({
            required RealtimeCandleStreamKey key,
            required RealtimeCandlePipelineDisposition disposition,
            required ChartCandle? working,
            List<ChartCandle> closed = const [],
            RealtimeCandleGap? gap,
          }) => RealtimeCandlePipelineUpdate(
            key: key,
            disposition: disposition,
            workingCandle: working,
            closedCandles: closed,
            gap: gap,
            exchangeTimestampUtc: DateTime.utc(2026, 8, 2, 12, 1),
            receivedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 100),
            processedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 200),
          );

          ChartCandle _candle(DateTime openTime, double close) => ChartCandle(
            openTime: openTime,
            open: close - 1,
            high: close + 1,
            low: close - 2,
            close: close,
            volume: 10,
          );
          ''')

          source_test = Path('src/client/quantara_app/test/realtime_analysis_sync_source_test.dart')
          source_test.write_text(r'''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('runtime synchronizes every pipeline update before analysis gate', () {
              final source = File(
                'lib/features/owner_alpha/data/realtime_market_application.dart',
              ).readAsStringSync();
              final synchronize = source.indexOf(
                'gateway is RealtimeMarketAnalysisSynchronizer',
              );
              final candidateGate = source.indexOf(
                'if (!update.allowsCandidatePreparation) return;',
              );

              expect(synchronize, greaterThanOrEqualTo(0));
              expect(candidateGate, greaterThan(synchronize));
              expect(
                source,
                contains('Realtime analysis synchronization failed'),
              );
            });
          }
          ''')

          docs_path = Path('docs/v1.2/realtime-analysis-context.md')
          docs_path.write_text('''# Realtime analysis context\n\nThe realtime runtime synchronizes every candle-pipeline event into a bounded, read-only per-stream snapshot before candidate preparation.\n\n## Contract\n\n- REST bootstrap establishes at least 20 contiguous closed candles.\n- Working updates mutate only the working snapshot.\n- Rollover and reconciliation append closed candles with a bounded retention limit.\n- Gap or blocked-by-gap state is fail-closed for discovery.\n- Strategy analysis receives immutable full history plus the original event delta and separate exchange, receive and process timestamps.\n- The decorator implements the existing analysis gateway, so the public runtime remains isolated from private exchange and order authority.\n\n## Remaining issue #101 work\n\nProduction strategy/projection adapters, settings-derived foreground lifecycle wiring and the health/latency dashboard remain separate reviewable slices.\n''')
          PY

          cd src/client/quantara_app
          dart format \
            lib/features/owner_alpha/data/realtime_market_application.dart \
            lib/features/owner_alpha/data/realtime_contextual_market_analysis.dart \
            test/realtime_contextual_market_analysis_test.dart \
            test/realtime_analysis_sync_source_test.dart
          cd ../../..

          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          rm -f \
            .github/workflows/add-realtime-analysis-context-once.yml \
            .github/workflows/execute-analysis-context-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'quantara-ci'
          git config user.email 'quantara-ci@users.noreply.github.com'
          git commit -m 'feat: provide bounded realtime analysis snapshots'
          git push origin HEAD:feat/101-realtime-analysis-context

  flutter:
    name: Flutter format, analyze, test, and build
    if: github.event_name != 'push' || github.ref != 'refs/heads/feat/101-realtime-analysis-context' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display tool versions
        run: |
          flutter --version
          dart --version

      - name: Restore packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > flutter-analyze.log 2>&1
          status=$?
          cat flutter-analyze.log
          exit $status

      - name: Run widget and safety tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics-1.0.0
          path: |
            src/client/quantara_app/flutter-analyze.log
            src/client/quantara_app/flutter-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile API-configured web PWA
        run: >-
          flutter build web --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Compile API-configured Android preview
        run: >-
          flutter build apk --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Build offline-first web PWA
        run: flutter build web --release

      - name: Build universal Android preview APK
        run: flutter build apk --release

      - name: Verify preview identity and manifest safety declarations
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$apkanalyzer_path"
          "$apkanalyzer_path" manifest application-id build/app/outputs/flutter-apk/app-release.apk | grep -Fxq "$ANDROID_PACKAGE"
          "$apkanalyzer_path" manifest print build/app/outputs/flutter-apk/app-release.apk > merged-manifest.xml
          grep -Fq "com.pravera.flutter_foreground_task.service.ForegroundService" merged-manifest.xml
          grep -Fq "android.permission.FOREGROUND_SERVICE_SPECIAL_USE" merged-manifest.xml
          grep -Eq 'android:foregroundServiceType="(specialUse|0x40000000)"' merged-manifest.xml
          grep -Fq "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" merged-manifest.xml
          ! grep -Fq "android.permission.RECEIVE_BOOT_COMPLETED" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RebootReceiver" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RestartReceiver" merged-manifest.xml

      - name: Upload merged Android manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-merged-manifest-1.0.0-preview
          path: src/client/quantara_app/merged-manifest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify universal APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Build ABI-split Android preview APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify arm64 APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: quantara-web-1.0.0-preview
          path: src/client/quantara_app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android 1.0 preview candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREVIEW_ARTIFACT }}
          path: |
            src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
            src/client/quantara_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  android-launch:
    name: Android ${{ matrix.api-level }} cold-start smoke
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android preview candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREVIEW_ARTIFACT }}
          path: apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot hardware-accelerated emulator and verify cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-cold-start-smoke.sh apk/app-release.apk

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-diagnostics-1.0.0-preview
          path: |
            android-start.txt
            android-pid.txt
            android-pid-after-settle.txt
            android-logcat.txt
            android-jobscheduler.txt
          if-no-files-found: ignore
          retention-days: 14
