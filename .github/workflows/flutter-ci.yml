name: Flutter client CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    name: Canonicalize performance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/198-platform-performance-evidence
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Canonicalize Dart evidence files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/release_acceptance/domain/performance_release_evidence.dart
          test/performance_release_evidence_test.dart
          tool/hot_path_benchmark.dart

      - name: Restore intended CI and publish formatter-only commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout a973aa71c9504adc9188b9c09ab5870f4b86bf9a -- .github/workflows/flutter-ci.yml
          allowed="$(mktemp)"
          changed="$(mktemp)"
          printf '%s\n' \
            .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/release_acceptance/domain/performance_release_evidence.dart \
            src/client/quantara_app/test/performance_release_evidence_test.dart \
            src/client/quantara_app/tool/hot_path_benchmark.dart | sort > "$allowed"
          git diff HEAD --name-only | sort > "$changed"
          test -s "$changed"
          test -z "$(comm -23 "$changed" "$allowed")"
          grep -Fxq '.github/workflows/flutter-ci.yml' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/release_acceptance/domain/performance_release_evidence.dart \
            src/client/quantara_app/test/performance_release_evidence_test.dart \
            src/client/quantara_app/tool/hot_path_benchmark.dart
          git commit -m 'style(perf): apply canonical evidence formatting'
          git push origin HEAD:agent/198-platform-performance-evidence
