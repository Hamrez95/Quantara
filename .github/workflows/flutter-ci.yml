name: Flutter client CI

on:
  push:
    branches:
      - feat/99-signal-inbox-profit-protection
    paths:
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - fix/97-local-live-persistence-scalp
    paths:
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: issue-99-allocation-fix-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch:
    name: Apply and validate TP allocation fix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/99-signal-inbox-profit-protection
          fetch-depth: 0

      - name: Apply deterministic allocation fix
        run: python3 scripts/apply_issue_99_allocation_fix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib test

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos

      - name: Test profit protection and local-live safety
        working-directory: src/client/quantara_app
        run: |
          flutter test test/profit_protection_policy_test.dart
          flutter test test/local_live_v1_0_1_source_test.dart
          flutter test test/local_live_trade_models_test.dart
          flutter test test/signal_outcome_evaluator_test.dart

      - name: Commit implementation
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git diff --cached --check
          git commit -m "fix: allocate staged-exit rounding residual to TP1"
          git push origin HEAD:feat/99-signal-inbox-profit-protection
