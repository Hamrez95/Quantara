name: Temporary portfolio panel ergonomics repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Remove infinite loading animation and navigation overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          panel = Path('src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart')
          panel_text = panel.read_text()
          old_loading = """                if (_controller.loading && snapshot == null) ...[
                  const SizedBox(height: 20),
                  const Center(child: CircularProgressIndicator()),
                ] else if (snapshot != null) ...[
"""
          new_loading = """                if (_controller.loading && snapshot == null) ...[
                  const SizedBox(height: 20),
                  _messageBox(
                    icon: Icons.hourglass_top_rounded,
                    text: _t(
                      'در حال خواندن دفتر ریسک؛ تا تکمیل بازیابی، ورود جدید مسدود است.',
                      'Reading the risk ledger; new entries remain blocked until recovery completes.',
                    ),
                    tone: Theme.of(context).colorScheme.secondary,
                  ),
                ] else if (snapshot != null) ...[
"""
          if old_loading not in panel_text:
              raise SystemExit('portfolio loading anchor changed')
          panel.write_text(panel_text.replace(old_loading, new_loading, 1))

          app = Path('src/client/quantara_app/lib/app/quantara_app.dart')
          app_text = app.read_text()
          marker = 'final class _QuantaraHome extends StatelessWidget {'
          if marker not in app_text:
              raise SystemExit('app shell marker changed')
          prefix = app_text.split(marker, 1)[0]
          replacement = r'''final class _QuantaraHome extends StatelessWidget {
  const _QuantaraHome({required this.locale, required this.child});

  final Locale locale;
  final Widget child;

  bool get _persian => locale.languageCode != 'en';

  @override
  Widget build(BuildContext context) {
    return Column(
      children: [
        Material(
          color: Theme.of(context).colorScheme.surfaceContainer,
          child: SafeArea(
            bottom: false,
            child: SizedBox(
              height: 44,
              child: Align(
                alignment: AlignmentDirectional.centerEnd,
                child: TextButton.icon(
                  onPressed: () => _showPortfolioRisk(context),
                  icon: const Icon(
                    Icons.account_balance_wallet_outlined,
                    size: 20,
                  ),
                  label: Text(_persian ? 'ریسک پرتفوی' : 'Portfolio risk'),
                ),
              ),
            ),
          ),
        ),
        Expanded(child: child),
      ],
    );
  }

  Future<void> _showPortfolioRisk(BuildContext context) {
    return showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      useSafeArea: true,
      showDragHandle: true,
      builder: (context) => FractionallySizedBox(
        heightFactor: 0.94,
        child: SingleChildScrollView(
          padding: const EdgeInsets.fromLTRB(12, 0, 12, 24),
          child: const PortfolioRiskPanel(),
        ),
      ),
    );
  }
}
'''
          app.write_text(prefix + replacement)
          PY
      - name: Restore packages and format
        working-directory: src/client/quantara_app
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/app/quantara_app.dart lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
      - name: Commit repaired UI
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/app/quantara_app.dart \
            src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): avoid infinite loading ticker and nav overlay'
          git push origin HEAD:feat/150-portfolio-risk-budget
