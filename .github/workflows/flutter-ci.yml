name: Temporary atomic portfolio formatter

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get --enforce-lockfile

      - name: Format atomic portfolio sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/core/persistence/quantara_durable_database.dart
          lib/features/portfolio_risk
          test/portfolio_risk_*.dart

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/core/persistence/quantara_durable_database.dart \
            src/client/quantara_app/lib/features/portfolio_risk \
            src/client/quantara_app/test/portfolio_risk_*.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(portfolio-risk): format atomic ledger changes'
          git push origin HEAD:feat/150-portfolio-risk-budget
