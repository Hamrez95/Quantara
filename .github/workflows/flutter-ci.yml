name: Flutter client CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  ANDROID_PACKAGE: com.quantara.quantara_app.alpha
  ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity
  RC_VERSION: 1.2.0-rc.2
  ANDROID_RC_ARTIFACT: quantara-android-1.2.0-rc.2

jobs:
  portfolio-finalize:
    name: Temporary finalize issue 150 portfolio risk
    if: github.event_name == 'push' && github.ref_name == 'feat/150-portfolio-risk-budget' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply reviewed composition fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          owner = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          owner_text = owner.read_text()
          import_anchor = "import '../../market_analysis/presentation/tradingview_lightweight_chart.dart';\n"
          portfolio_import = "import '../../portfolio_risk/presentation/portfolio_risk_panel.dart';\n"
          if portfolio_import not in owner_text:
              if import_anchor not in owner_text:
                  raise SystemExit('Owner Alpha import anchor changed.')
              owner_text = owner_text.replace(import_anchor, import_anchor + portfolio_import)
          owner.write_text(owner_text)

          auto = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          auto_text = auto.read_text()
          old = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          new = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            const PortfolioRiskPanel(),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          if new not in auto_text:
              if old not in auto_text:
                  raise SystemExit('Auto Trade panel anchor changed.')
              auto_text = auto_text.replace(old, new)
          auto.write_text(auto_text)

          coordinator = Path('src/client/quantara_app/lib/features/portfolio_risk/application/portfolio_risk_coordinator.dart')
          coordinator_text = coordinator.read_text()
          coordinator_text = coordinator_text.replace(
              'snapshot: ledger.snapshot(_withLedgerReservations(account, ledger)),',
              'snapshot: ledger.snapshot(account),',
          )
          coordinator_text = coordinator_text.replace(
              'return ledger.snapshot(_withLedgerReservations(account, ledger));',
              'return ledger.snapshot(account);',
          )
          coordinator.write_text(coordinator_text)

          models = Path('src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart')
          models_text = models.read_text()
          old_math = """    final maximumLoss = PortfolioRiskMath.maximumLoss(
      side: candidate.side,
      entryPrice: candidate.entryPrice,
      stopPrice: candidate.stopPrice,
      quantity: candidate.plannedQuantity,
      contractMultiplier: candidate.contractMultiplier,
      entryFeeRate: candidate.entryFeeRate,
      exitFeeRate: candidate.exitFeeRate,
      slippageRate: candidate.slippageRate,
      fundingReserve: candidate.fundingReserve,
    );
"""
          new_math = """    late final double maximumLoss;
    try {
      maximumLoss = PortfolioRiskMath.maximumLoss(
        side: candidate.side,
        entryPrice: candidate.entryPrice,
        stopPrice: candidate.stopPrice,
        quantity: candidate.plannedQuantity,
        contractMultiplier: candidate.contractMultiplier,
        entryFeeRate: candidate.entryFeeRate,
        exitFeeRate: candidate.exitFeeRate,
        slippageRate: candidate.slippageRate,
        fundingReserve: candidate.fundingReserve,
      );
    } on FormatException {
      return blocked(PortfolioEntryBlockReason.invalidInput);
    }
"""
          if new_math not in models_text:
              if old_math not in models_text:
                  raise SystemExit('Portfolio risk math anchor changed.')
              models_text = models_text.replace(old_math, new_math)
          models.write_text(models_text)
          PY

      - name: Restore locked packages
        working-directory: src/client/quantara_app
        run: flutter pub get --enforce-lockfile

      - name: Format reviewed files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/portfolio_risk
          lib/features/owner_alpha/presentation/owner_alpha_page.dart
          lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
          test/portfolio_risk_policy_test.dart
          test/portfolio_risk_panel_test.dart
          test/portfolio_risk_source_safety_test.dart

      - name: Analyze focused slice
        working-directory: src/client/quantara_app
        run: >-
          flutter analyze --fatal-infos
          lib/features/portfolio_risk
          test/portfolio_risk_policy_test.dart
          test/portfolio_risk_panel_test.dart
          test/portfolio_risk_source_safety_test.dart

      - name: Run focused tests
        working-directory: src/client/quantara_app
        run: >-
          flutter test --reporter expanded
          test/portfolio_risk_policy_test.dart
          test/portfolio_risk_panel_test.dart
          test/portfolio_risk_source_safety_test.dart

      - name: Commit finalized slice
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/features/portfolio_risk \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/test/portfolio_risk_policy_test.dart \
            src/client/quantara_app/test/portfolio_risk_panel_test.dart \
            src/client/quantara_app/test/portfolio_risk_source_safety_test.dart
          if git diff --cached --quiet; then
            echo 'Portfolio risk slice is already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(portfolio-risk): finalize safe simulation slice'
          git push origin HEAD:feat/150-portfolio-risk-budget

  flutter:
    name: Flutter format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display tool versions
        run: |
          flutter --version
          dart --version

      - name: Restore packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > flutter-analyze.log 2>&1
          status=$?
          cat flutter-analyze.log
          exit $status

      - name: Run widget and safety tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics-${{ env.RC_VERSION }}
          path: |
            src/client/quantara_app/flutter-analyze.log
            src/client/quantara_app/flutter-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile API-configured web PWA
        run: >-
          flutter build web --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Compile API-configured Android RC
        run: >-
          flutter build apk --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Build offline-first web PWA
        run: flutter build web --release

      - name: Build universal Android RC APK
        run: flutter build apk --release

      - name: Verify RC identity and manifest safety declarations
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$apkanalyzer_path"
          "$apkanalyzer_path" manifest application-id build/app/outputs/flutter-apk/app-release.apk | grep -Fxq "$ANDROID_PACKAGE"
          "$apkanalyzer_path" manifest print build/app/outputs/flutter-apk/app-release.apk > merged-manifest.xml
          grep -Fq "com.pravera.flutter_foreground_task.service.ForegroundService" merged-manifest.xml
          grep -Fq "android.permission.FOREGROUND_SERVICE_SPECIAL_USE" merged-manifest.xml
          grep -Eq 'android:foregroundServiceType="(specialUse|0x40000000)"' merged-manifest.xml
          grep -Fq "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" merged-manifest.xml
          ! grep -Fq "android.permission.RECEIVE_BOOT_COMPLETED" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RebootReceiver" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RestartReceiver" merged-manifest.xml

      - name: Upload merged Android manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-merged-manifest-${{ env.RC_VERSION }}
          path: src/client/quantara_app/merged-manifest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify universal APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Build ABI-split Android RC APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify arm64 APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload PWA release candidate
        uses: actions/upload-artifact@v4
        with:
          name: quantara-pwa-${{ env.RC_VERSION }}
          path: src/client/quantara_app/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_RC_ARTIFACT }}
          path: |
            src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
            src/client/quantara_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  android-launch:
    name: Android ${{ matrix.api-level }} cold-start smoke
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android release candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANDROID_RC_ARTIFACT }}
          path: apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot hardware-accelerated emulator and verify cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-cold-start-smoke.sh apk/app-release.apk

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-diagnostics-${{ env.RC_VERSION }}
          path: |
            android-start.txt
            android-pid.txt
            android-pid-after-settle.txt
            android-logcat.txt
            android-jobscheduler.txt
          if-no-files-found: ignore
          retention-days: 14
