name: Flutter client CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - 'scripts/apply_issue_99_patch.py'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'scripts/android-cold-start-smoke.sh'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  ANDROID_PACKAGE: com.quantara.quantara_app.alpha
  ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity
  PREVIEW_ARTIFACT: quantara-android-1.0.2-preview

jobs:
  flutter:
    name: Flutter format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout stacked feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/99-signal-inbox-profit-protection
          fetch-depth: 0

      - name: Apply issue 99 source patch once
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          generated='src/client/quantara_app/lib/features/owner_alpha/application/signal_inbox_query.dart'
          if [[ ! -f "$generated" ]]; then
            python3 scripts/apply_issue_99_patch.py
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display tool versions
        run: |
          flutter --version
          dart --version

      - name: Restore packages
        run: flutter pub get

      - name: Format source and tests
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > flutter-analyze.log 2>&1
          status=$?
          cat flutter-analyze.log
          exit $status

      - name: Run widget and safety tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Commit issue 99 implementation
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app .github/workflows/flutter-ci.yml
          git diff --cached --check
          git commit -m "feat: organize signal inbox and adapt profit protection"
          git push origin HEAD:feat/99-signal-inbox-profit-protection

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics-1.0.2
          path: |
            src/client/quantara_app/flutter-analyze.log
            src/client/quantara_app/flutter-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile API-configured web PWA
        run: >-
          flutter build web --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Compile API-configured Android preview
        run: >-
          flutter build apk --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Build offline-first web PWA
        run: flutter build web --release

      - name: Build universal Android preview APK
        run: flutter build apk --release

      - name: Verify preview identity and manifest safety declarations
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$apkanalyzer_path"
          "$apkanalyzer_path" manifest application-id build/app/outputs/flutter-apk/app-release.apk | grep -Fxq "$ANDROID_PACKAGE"
          "$apkanalyzer_path" manifest print build/app/outputs/flutter-apk/app-release.apk > merged-manifest.xml
          grep -Fq "com.pravera.flutter_foreground_task.service.ForegroundService" merged-manifest.xml
          grep -Fq "android.permission.FOREGROUND_SERVICE_SPECIAL_USE" merged-manifest.xml
          grep -Eq 'android:foregroundServiceType="(specialUse|0x40000000)"' merged-manifest.xml
          grep -Fq "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" merged-manifest.xml
          ! grep -Fq "android.permission.RECEIVE_BOOT_COMPLETED" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RebootReceiver" merged-manifest.xml
          ! grep -Fq "com.pravera.flutter_foreground_task.service.RestartReceiver" merged-manifest.xml

      - name: Upload merged Android manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-merged-manifest-1.0.2-preview
          path: src/client/quantara_app/merged-manifest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify universal APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Build ABI-split Android preview APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify arm64 APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: quantara-web-1.0.2-preview
          path: src/client/quantara_app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android 1.0.2 preview candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREVIEW_ARTIFACT }}
          path: |
            src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
            src/client/quantara_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  android-launch:
    name: Android ${{ matrix.api-level }} cold-start smoke
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/99-signal-inbox-profit-protection

      - name: Download Android preview candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREVIEW_ARTIFACT }}
          path: apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot hardware-accelerated emulator and verify cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-cold-start-smoke.sh apk/app-release.apk

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-diagnostics-1.0.2-preview
          path: |
            android-start.txt
            android-pid.txt
            android-pid-after-settle.txt
            android-logcat.txt
            android-jobscheduler.txt
          if-no-files-found: ignore
          retention-days: 14
