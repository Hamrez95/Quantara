name: Flutter client CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    name: Canonicalize allocator evidence links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/194-evidence-links
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Canonicalize evidence-link files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/capital_allocator/application/portfolio_allocation_planner.dart
          lib/features/capital_allocator/domain/portfolio_allocation_evidence_link.dart
          test/portfolio_allocation_planner_test.dart

      - name: Restore canonical CI and publish formatter-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          allowed="$(mktemp)"
          changed="$(mktemp)"
          printf '%s\n' \
            .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_planner.dart \
            src/client/quantara_app/lib/features/capital_allocator/domain/portfolio_allocation_evidence_link.dart \
            src/client/quantara_app/test/portfolio_allocation_planner_test.dart | sort > "$allowed"
          git diff HEAD --name-only | sort > "$changed"
          test -s "$changed"
          test -z "$(comm -23 "$changed" "$allowed")"
          grep -Fxq '.github/workflows/flutter-ci.yml' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_planner.dart \
            src/client/quantara_app/lib/features/capital_allocator/domain/portfolio_allocation_evidence_link.dart \
            src/client/quantara_app/test/portfolio_allocation_planner_test.dart
          git commit -m 'style(allocator): apply canonical evidence formatting'
          git push origin HEAD:agent/194-evidence-links
