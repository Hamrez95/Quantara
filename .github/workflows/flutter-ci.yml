name: Temporary portfolio control layout repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Reorder portfolio controls for mobile accessibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart')
          text = path.read_text()
          old = """                ] else if (snapshot != null) ...[
                  const SizedBox(height: 16),
                  _budgetGrid(snapshot),
                  const SizedBox(height: 16),
                  _status(snapshot),
                  const SizedBox(height: 16),
                  _actions(),
                  const SizedBox(height: 16),
                  _positions(snapshot),
                ],
"""
          new = """                ] else if (snapshot != null) ...[
                  const SizedBox(height: 16),
                  _actions(),
                  const SizedBox(height: 12),
                  _status(snapshot),
                  const SizedBox(height: 16),
                  _budgetGrid(snapshot),
                  const SizedBox(height: 16),
                  _positions(snapshot),
                ],
"""
          if old not in text:
              raise SystemExit('portfolio content order anchor changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Restore packages and format
        working-directory: src/client/quantara_app
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
      - name: Commit layout repair
        shell: bash
        run: |
          set -euo pipefail
          git add src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): keep simulation controls in mobile viewport'
          git push origin HEAD:feat/150-portfolio-risk-budget
