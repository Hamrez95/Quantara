name: Flutter client CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    name: Canonicalize allocator branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/194-runtime-allocation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart
          lib/features/capital_allocator/application/portfolio_allocation_planner.dart
          test/local_live_portfolio_risk_preview_test.dart
          test/portfolio_allocation_planner_test.dart

      - name: Restore canonical CI and publish formatter-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_planner.dart \
            src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart \
            src/client/quantara_app/test/portfolio_allocation_planner_test.dart | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_planner.dart \
            src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart \
            src/client/quantara_app/test/portfolio_allocation_planner_test.dart
          git commit -m 'style(allocator): apply canonical Dart formatting'
          git push origin HEAD:agent/194-runtime-allocation
