name: Flutter client CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  patch-preview-authority:
    name: Patch advisory preview authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/194-runtime-allocation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Patch preview authority and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart')
          text = runtime.read_text()
          old = """    return PortfolioReservationOutcome(\n      decision: evaluation.decision,\n      ledger: ledger,\n      snapshot: ledger.snapshot(account),\n      guardianDecision: evaluation.guardianDecision,\n    );\n  }\n\n  Future<PortfolioReservationOutcome> reserve({\n"""
          new = """    final advisoryDecision = _asAdvisoryDecision(evaluation.decision);\n    return PortfolioReservationOutcome(\n      decision: advisoryDecision,\n      ledger: ledger,\n      snapshot: ledger.snapshot(account),\n      guardianDecision: evaluation.guardianDecision,\n    );\n  }\n\n  Future<PortfolioReservationOutcome> reserve({\n"""
          if text.count(old) != 1:
              raise SystemExit('preview return snippet mismatch')
          text = text.replace(old, new)

          marker = """  void _validateConfiguration() {\n"""
          helper = """  PortfolioEntryDecision _asAdvisoryDecision(\n    PortfolioEntryDecision decision,\n  ) {\n    if (!decision.allowed || !decision.liveExecutionAllowed) return decision;\n    return PortfolioEntryDecision(\n      allowed: true,\n      liveExecutionAllowed: false,\n      reason: decision.reason,\n      maximumLoss: decision.maximumLoss,\n      requiredMargin: decision.requiredMargin,\n      availableRiskBefore: decision.availableRiskBefore,\n      availableRiskAfter: decision.availableRiskAfter,\n      availableMarginAfter: decision.availableMarginAfter,\n    );\n  }\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('configuration marker mismatch')
          text = text.replace(marker, helper + marker)
          runtime.write_text(text)

          test = Path('src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart')
          text = test.read_text()
          old = """    expect(preview.decision.allowed, isTrue);\n    expect(preview.ledger.activeReservations, isEmpty);\n"""
          new = """    expect(preview.decision.allowed, isTrue);\n    expect(preview.decision.liveExecutionAllowed, isFalse);\n    expect(preview.ledger.activeReservations, isEmpty);\n"""
          if text.count(old) != 1:
              raise SystemExit('preview assertion snippet mismatch')
          text = text.replace(old, new)
          old = """    expect(reserved.decision.allowed, isTrue);\n    expect((await store.load())?.activeReservations, hasLength(1));\n"""
          new = """    expect(reserved.decision.allowed, isTrue);\n    expect(reserved.decision.liveExecutionAllowed, isTrue);\n    expect((await store.load())?.activeReservations, hasLength(1));\n"""
          if text.count(old) != 1:
              raise SystemExit('reserve assertion snippet mismatch')
          test.write_text(text.replace(old, new))
          PY
          cd src/client/quantara_app
          dart format \
            lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart \
            test/local_live_portfolio_risk_preview_test.dart

      - name: Restore canonical CI and publish safety patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          allowed="$(mktemp)"
          changed="$(mktemp)"
          printf '%s\n' \
            .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart \
            src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart | sort > "$allowed"
          git diff HEAD --name-only | sort > "$changed"
          test -s "$changed"
          test -z "$(comm -23 "$changed" "$allowed")"
          grep -Fxq '.github/workflows/flutter-ci.yml' "$changed"
          grep -Fxq 'src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart' "$changed"
          grep -Fxq 'src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart \
            src/client/quantara_app/test/local_live_portfolio_risk_preview_test.dart
          git commit -m 'fix(allocator): keep risk preview advisory'
          git push origin HEAD:agent/194-runtime-allocation
