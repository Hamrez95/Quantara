name: Temporary idempotent portfolio initialization UX repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Keep controls visible while initialization is pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart')
          text = path.read_text()

          error_marker = '                if (_controller.error != null) ...['
          always_actions = '                const SizedBox(height: 12),\n                _actions(),\n'
          before_error = text.split(error_marker, 1)[0]
          if '_actions(),' not in before_error:
              if error_marker not in text:
                  raise SystemExit('error marker changed')
              text = text.replace(error_marker, always_actions + error_marker, 1)

          snapshot_pattern = re.compile(
              r"(\] else if \(snapshot != null\) \.\.\.\[\s+const SizedBox\(height: 16\),)\s+_actions\(\),\s+const SizedBox\(height: 12\),",
              re.S,
          )
          text = snapshot_pattern.sub(r"\1", text, count=1)

          method_pattern = re.compile(
              r"  Widget _actions\(\)\s*=>\s*Wrap\(.*?(?=\n  Widget _positions\()",
              re.S,
          )
          new_method = """  Widget _actions() {
    final disabled = _controller.loading && _controller.snapshot != null;
    return Wrap(
      spacing: 8,
      runSpacing: 8,
      children: [
        FilledButton.tonalIcon(
          onPressed: disabled ? null : () => _controller.reserveExample(3),
          icon: const Icon(Icons.add_chart_rounded),
          label: Text(_t('رزرو ۳ USDT', 'Reserve 3 USDT')),
        ),
        FilledButton.tonalIcon(
          onPressed: disabled ? null : () => _controller.reserveExample(4),
          icon: const Icon(Icons.add_chart_rounded),
          label: Text(_t('رزرو ۴ USDT', 'Reserve 4 USDT')),
        ),
        OutlinedButton.icon(
          onPressed: disabled ? null : () => _controller.reserveExample(8),
          icon: const Icon(Icons.rule_rounded),
          label: Text(_t('آزمون Reject با ۸', 'Try rejected 8')),
        ),
        OutlinedButton.icon(
          onPressed: disabled ? null : _controller.toggleFreshness,
          icon: Icon(
            _controller.accountFresh
                ? Icons.cloud_off_outlined
                : Icons.cloud_done_outlined,
          ),
          label: Text(
            _controller.accountFresh
                ? _t('شبیه‌سازی داده Stale', 'Simulate stale data')
                : _t('بازگردانی داده Fresh', 'Restore fresh data'),
          ),
        ),
        TextButton.icon(
          onPressed: disabled ? null : _controller.reset,
          icon: const Icon(Icons.restart_alt_rounded),
          label: Text(_t('بازنشانی مثال', 'Reset example')),
        ),
      ],
    );
  }
"""
          text, count = method_pattern.subn(new_method, text, count=1)
          if count != 1 and 'final disabled = _controller.loading' not in text:
              raise SystemExit('actions method pattern changed')

          path.write_text(text)
          PY

      - name: Restore packages and format
        working-directory: src/client/quantara_app
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/features/portfolio_risk/application/portfolio_risk_simulation_controller.dart \
            lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart

      - name: Commit initialization UX repair
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/features/portfolio_risk/application/portfolio_risk_simulation_controller.dart \
            src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
          if git diff --cached --quiet; then
            echo 'Initialization UX is already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): keep controls available during initialization'
          git push origin HEAD:feat/150-portfolio-risk-budget
