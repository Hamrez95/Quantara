name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  patch:
    name: Apply accessibility patch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make safety chips responsive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade_support.dart')
          source = path.read_text()
          old = '''      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(icon, size: 16, color: QuantaraColors.cyan),
          const SizedBox(width: 6),
          Text(label, style: Theme.of(context).textTheme.labelMedium),
        ],
      ),'''
          new = '''      child: Row(
        mainAxisSize: MainAxisSize.min,
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Padding(
            padding: const EdgeInsets.only(top: 2),
            child: Icon(icon, size: 16, color: QuantaraColors.cyan),
          ),
          const SizedBox(width: 6),
          Flexible(
            child: Text(
              label,
              softWrap: true,
              style: Theme.of(context).textTheme.labelMedium,
            ),
          ),
        ],
      ),'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one safety-chip block')
          path.write_text(source.replace(old, new))
          PY

      - name: Format patched source
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Run formatter
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/presentation/owner_alpha_auto_trade_support.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade_support.dart
          git commit -m "fix: let auto-trade safety chips wrap at large text"
          git push origin "HEAD:${GITHUB_REF_NAME}"
