name: Temporary portfolio panel wiring

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Wire portfolio panel into Auto Trade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          text = page.read_text()
          anchor = "import '../../market_analysis/presentation/tradingview_lightweight_chart.dart';\n"
          addition = "import '../../portfolio_risk/presentation/portfolio_risk_panel.dart';\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('owner alpha import anchor changed')
              text = text.replace(anchor, anchor + addition, 1)
          page.write_text(text)

          auto = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          text = auto.read_text()
          old = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          new = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            const PortfolioRiskPanel(),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('auto trade panel anchor changed')
              text = text.replace(old, new, 1)
          auto.write_text(text)
          PY

      - name: Restore packages and format
        working-directory: src/client/quantara_app
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/features/owner_alpha/presentation/owner_alpha_page.dart lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart

      - name: Commit panel wiring
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
          if git diff --cached --quiet; then
            echo 'Panel is already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(portfolio-risk): expose risk panel in Auto Trade'
          git push origin HEAD:feat/150-portfolio-risk-budget
