name: Temporary portfolio review test formatter

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get --enforce-lockfile
      - name: Format review tests
        working-directory: src/client/quantara_app
        run: >-
          dart format
          test/portfolio_risk_atomic_rollback_test.dart
          test/portfolio_risk_review_regression_test.dart
      - name: Commit formatted tests
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/test/portfolio_risk_atomic_rollback_test.dart \
            src/client/quantara_app/test/portfolio_risk_review_regression_test.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(portfolio-risk): format review regression tests'
          git push origin HEAD:feat/150-portfolio-risk-budget
