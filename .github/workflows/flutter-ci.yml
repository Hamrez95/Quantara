name: Flutter client CI

on:
  push:
    branches:
      - feat/74-local-guarded-live
    paths:
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: pr75-entry-reconciliation-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/74-local-guarded-live
          fetch-depth: 0

      - name: Apply safety patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/pr75_safety_patch.py')
          source = path.read_text()
          old = "    expect(source, isNot(contains('if (detail.hasFill && position != null)')));"
          new = "    expect(source.contains('if (detail.hasFill && position != null)'), isFalse);"
          if old not in source:
              raise SystemExit('Regression-test correction anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 .github/scripts/pr75_safety_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format, analyze, and run focused tests
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib/features/auto_trade/application/local_live_trade_service.dart \
            lib/features/auto_trade/data/bitunix_local_live_api_client.dart \
            test/bitunix_local_live_api_client_test.dart
          flutter analyze --fatal-infos
          flutter test test/bitunix_local_live_api_client_test.dart --reporter expanded

      - name: Commit validated patch and restore standard CI
        run: |
          set -euo pipefail
          git checkout 361f85517aca5ea3983491f228b177c691ab0ce7 -- .github/workflows/flutter-ci.yml
          git rm -f .github/scripts/pr75_safety_patch.py
          git rm -f .github/workflows/pr75-safety-patch.yml
          git rm -f .github/workflows/pr75-safety-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart
          git add src/client/quantara_app/lib/features/auto_trade/data/bitunix_local_live_api_client.dart
          git add src/client/quantara_app/test/bitunix_local_live_api_client_test.dart
          git add .github/workflows/flutter-ci.yml
          git commit -m 'fix: fail closed on unresolved Bitunix entry fills'
          git push origin HEAD:feat/74-local-guarded-live
