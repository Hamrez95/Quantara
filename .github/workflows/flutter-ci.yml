name: Flutter client CI

on:
  push:
    branches:
      - fix/issue-106-local-live-atomic-guardian

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  canonical-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-106-local-live-atomic-guardian
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Canonical format and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format src/client/quantara_app/lib src/client/quantara_app/test
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          rm -f .github/workflows/tmp-format-local-live-guardian.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test .github/workflows/flutter-ci.yml .github/workflows/tmp-format-local-live-guardian.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(risk): apply canonical Local Live formatting"
          git push origin HEAD:fix/issue-106-local-live-atomic-guardian
