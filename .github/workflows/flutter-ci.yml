name: Flutter client CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  ANDROID_PACKAGE: com.quantara.quantara_app.alpha
  ANDROID_ACTIVITY: com.quantara.quantara_app.SafeMainActivity

jobs:
  flutter:
    name: Flutter format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display tool versions
        run: |
          flutter --version
          dart --version

      - name: Restore packages
        run: flutter pub get

      - name: Patch compact setup layout and reversal coverage
        if: github.event_name == 'push' && github.ref_name == 'release/0.11.0-strategy-engine'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          strategy = Path('lib/features/owner_alpha/data/advanced_strategy_engine.dart')
          strategy_text = strategy.read_text()
          strategy_text = strategy_text.replace('indicators.atr14 * 1.25,', 'indicators.atr14 * 2.25,')
          strategy.write_text(strategy_text)

          dashboard = Path('lib/features/owner_alpha/presentation/owner_alpha_dashboard.dart')
          dashboard_text = dashboard.read_text()
          old = '''          Row(
            children: [
              Expanded(
                child: CheckboxListTile(
                  contentPadding: EdgeInsets.zero,
                  dense: true,
                  controlAffinity: ListTileControlAffinity.leading,
                  value: taken,
                  onChanged: (value) => onTakenChanged(value ?? false),
                  title: Text(strings.taken),
                  subtitle: Text(strings.markTaken),
                ),
              ),
              const SizedBox(width: 8),
              FilledButton.tonalIcon(
                onPressed: onTap,
                icon: const Icon(Icons.candlestick_chart_rounded),
                label: Text(strings.inspectChart),
              ),
            ],
          ),'''
          new = '''          LayoutBuilder(
            builder: (context, constraints) {
              final takenControl = InkWell(
                borderRadius: BorderRadius.circular(12),
                onTap: () => onTakenChanged(!taken),
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 6),
                  child: Row(
                    children: [
                      Checkbox(
                        value: taken,
                        onChanged: (value) => onTakenChanged(value ?? false),
                      ),
                      const SizedBox(width: 6),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(strings.taken),
                            Text(
                              strings.markTaken,
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
              final chartButton = FilledButton.tonalIcon(
                onPressed: onTap,
                icon: const Icon(Icons.candlestick_chart_rounded),
                label: Text(strings.inspectChart),
              );
              if (constraints.maxWidth < 520) {
                return Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    takenControl,
                    const SizedBox(height: 8),
                    Align(
                      alignment: AlignmentDirectional.centerEnd,
                      child: chartButton,
                    ),
                  ],
                );
              }
              return Row(
                children: [
                  Expanded(child: takenControl),
                  const SizedBox(width: 8),
                  chartButton,
                ],
              );
            },
          ),'''
          if old not in dashboard_text and new not in dashboard_text:
              raise SystemExit('setup card block not found')
          if old in dashboard_text:
              dashboard.write_text(dashboard_text.replace(old, new))
          PY
          dart format \
            lib/features/owner_alpha/data/advanced_strategy_engine.dart \
            lib/features/owner_alpha/presentation/owner_alpha_dashboard.dart

      - name: Commit deterministic release patch
        if: github.event_name == 'push' && github.ref_name == 'release/0.11.0-strategy-engine'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/owner_alpha/data/advanced_strategy_engine.dart \
            lib/features/owner_alpha/presentation/owner_alpha_dashboard.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix strategy coverage and compact setup layout"
            git push origin HEAD:release/0.11.0-strategy-engine
          fi

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          git diff -- lib test
          git diff --exit-code -- lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > flutter-analyze.log 2>&1
          status=$?
          cat flutter-analyze.log
          exit $status

      - name: Run widget tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            src/client/quantara_app/flutter-analyze.log
            src/client/quantara_app/flutter-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile API-configured web PWA
        run: >-
          flutter build web --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Compile API-configured Android release package
        run: >-
          flutter build apk --release
          --dart-define=QUANTARA_API_BASE_URL=https://api.example.com

      - name: Build stable offline-first web PWA
        run: flutter build web --release

      - name: Build universal Android release APK
        run: flutter build apk --release

      - name: Verify universal APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Build ABI-split Android release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify arm64 APK 16KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: quantara-web-preview-0.11.0
          path: src/client/quantara_app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android 0.11.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: quantara-android-0.11.0
          path: |
            src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
            src/client/quantara_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  android-launch:
    name: Android ${{ matrix.api-level }} cold-start smoke
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Download Android candidate
        uses: actions/download-artifact@v4
        with:
          name: quantara-android-0.11.0
          path: apk

      - name: Boot emulator and verify deferred background launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell am force-stop "$ANDROID_PACKAGE"
            adb shell am start -W -n "$ANDROID_PACKAGE/$ANDROID_ACTIVITY" > android-start.txt
            cat android-start.txt
            sleep 20
            adb shell pidof "$ANDROID_PACKAGE" > android-pid.txt
            cat android-pid.txt
            test -s android-pid.txt
            adb logcat -d > android-logcat.txt
            adb shell dumpsys jobscheduler "$ANDROID_PACKAGE" > android-jobscheduler.txt || true
            ! grep -Eq "FATAL EXCEPTION|Process: $ANDROID_PACKAGE|Unable to instantiate application|WorkManager is not initialized properly" android-logcat.txt

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-diagnostics
          path: |
            android-start.txt
            android-pid.txt
            android-logcat.txt
            android-jobscheduler.txt
          if-no-files-found: ignore
          retention-days: 14
