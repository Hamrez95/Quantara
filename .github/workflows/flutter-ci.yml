name: Temporary deterministic portfolio risk repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Apply exact reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          models = Path('src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart')
          text = models.read_text()
          replacements = [
              (
                  'final class PositionRiskReservation {\n  PositionRiskReservation({',
                  'final class PositionRiskReservation {\n  const PositionRiskReservation({',
              ),
              (
                  '    final result = math.max(0, priceRisk + costRisk);',
                  '    final result = math.max(0, priceRisk + costRisk).toDouble();',
              ),
              (
                  """    if (index < 0)
      return _copy(processedEventIds: {...processedEventIds, eventId});
""",
                  """    if (index < 0) {
      return _copy(processedEventIds: {...processedEventIds, eventId});
    }
""",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {old[:60]!r}')
              text = text.replace(old, new, 1)

          start = text.index('    final maximumLoss = PortfolioRiskMath.maximumLoss(')
          end = text.index('    if (maximumLoss > ledger.dailyRisk.available + 1e-9) {', start)
          old = text[start:end]
          new = """    late final double maximumLoss;
    try {
      maximumLoss = PortfolioRiskMath.maximumLoss(
        side: candidate.side,
        entryPrice: candidate.entryPrice,
        stopPrice: candidate.stopPrice,
        quantity: candidate.plannedQuantity,
        contractMultiplier: candidate.contractMultiplier,
        entryFeeRate: candidate.entryFeeRate,
        exitFeeRate: candidate.exitFeeRate,
        slippageRate: candidate.slippageRate,
        fundingReserve: candidate.fundingReserve,
      );
    } on FormatException {
      return blocked(PortfolioEntryBlockReason.invalidInput);
    }
"""
          text = text[:start] + new + text[end:]
          models.write_text(text)

          tests = Path('src/client/quantara_app/test/portfolio_risk_policy_test.dart')
          test_text = tests.read_text()
          marker = "  test('prior-day open risk continues after idempotent daily reset', () {\n"
          addition = """  test('wrong-side stop fails closed instead of throwing', () {
    final invalid = PortfolioEntryCandidate(
      reservationId: 'reservation-invalid-stop',
      journalTradeId: 'trade-invalid-stop',
      candidateId: 'candidate-invalid-stop',
      symbol: 'BTCUSDT',
      assetGroup: 'crypto',
      side: PortfolioSide.long,
      strategy: 'test-strategy',
      plannedQuantity: 1,
      entryPrice: 100,
      stopPrice: 101,
      contractMultiplier: 1,
      entryFeeRate: 0,
      exitFeeRate: 0,
      slippageRate: 0,
      fundingReserve: 0,
      requiredMargin: 5,
      leverage: 10,
      minimumQuantity: 0.001,
      minimumNotional: 1,
    );
    final decision = policy.evaluate(
      ledger: empty(),
      candidate: invalid,
      account: account(),
    );
    expect(decision.allowed, isFalse);
    expect(decision.reason, PortfolioEntryBlockReason.invalidInput);
  });

  test('coordinator snapshot counts reserved margin exactly once', () async {
    final store = _MemoryPortfolioRiskStore();
    final coordinator = PortfolioRiskCoordinator(
      store: store,
      policy: const PortfolioRiskPolicy(maximumDirectionRiskFraction: 1),
      defaultDailyRiskLimit: 10,
    );
    final truth = account(
      pendingMargin: 2,
      freeMargin: 100,
      safetyBuffer: 0,
      feeReserve: 0,
    );
    final outcome = await coordinator.reserve(
      candidate: candidate('btc-margin', 3, requiredMargin: 6),
      account: truth,
      now: now,
    );
    expect(outcome.decision.allowed, isTrue);
    expect(outcome.snapshot.margin.reservedMargin, 8);
    final refreshed = await coordinator.snapshot(account: truth, now: now);
    expect(refreshed.margin.reservedMargin, 8);
  });

"""
          if addition not in test_text:
              if marker not in test_text:
                  raise SystemExit('missing test marker')
              test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text)
          PY

      - name: Commit exact fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart \
                  src/client/quantara_app/test/portfolio_risk_policy_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): fail closed and correct reservation accounting'
          git push origin HEAD:feat/150-portfolio-risk-budget
