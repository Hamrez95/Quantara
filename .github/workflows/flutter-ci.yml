name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  patch:
    name: Patch deterministic analysis scrolling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Target the visible analysis ListView
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/test/widget_test.dart')
          source = path.read_text()
          old = "await tester.drag(find.byType(ListView), const Offset(0, -500));"
          new = "await tester.drag(\n        find.byKey(const ValueKey('owner-alpha-2')),\n        const Offset(0, -500),\n      );"
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one ambiguous drag, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format patched test
        working-directory: src/client/quantara_app
        run: dart format test/widget_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/test/widget_test.dart
          git commit -m "test: target the active analysis scroll view"
          git push origin "HEAD:${GITHUB_REF_NAME}"
