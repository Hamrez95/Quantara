name: Temporary issue 150 formatted sources

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  format-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Apply reviewed composition fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          owner = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart')
          owner_text = owner.read_text()
          import_anchor = "import '../../market_analysis/presentation/tradingview_lightweight_chart.dart';\n"
          portfolio_import = "import '../../portfolio_risk/presentation/portfolio_risk_panel.dart';\n"
          if portfolio_import not in owner_text:
              if import_anchor not in owner_text:
                  raise SystemExit('Owner Alpha import anchor changed.')
              owner_text = owner_text.replace(import_anchor, import_anchor + portfolio_import)
          owner.write_text(owner_text)

          auto = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          auto_text = auto.read_text()
          old = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          new = """            _LocalLiveTradeControlCard(
              controller: _localController,
              accountController: widget.controller,
              analysisController: widget.analysisController,
            ),
            const SizedBox(height: 16),
            const PortfolioRiskPanel(),
            const SizedBox(height: 16),
            _LockedServerModeCard(
"""
          if new not in auto_text:
              if old not in auto_text:
                  raise SystemExit('Auto Trade panel anchor changed.')
              auto_text = auto_text.replace(old, new)
          auto.write_text(auto_text)

          coordinator = Path('src/client/quantara_app/lib/features/portfolio_risk/application/portfolio_risk_coordinator.dart')
          coordinator_text = coordinator.read_text()
          coordinator_text = coordinator_text.replace(
              'snapshot: ledger.snapshot(_withLedgerReservations(account, ledger)),',
              'snapshot: ledger.snapshot(account),',
          )
          coordinator_text = coordinator_text.replace(
              'return ledger.snapshot(_withLedgerReservations(account, ledger));',
              'return ledger.snapshot(account);',
          )
          coordinator.write_text(coordinator_text)

          models = Path('src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart')
          models_text = models.read_text()
          old_math = """    final maximumLoss = PortfolioRiskMath.maximumLoss(
      side: candidate.side,
      entryPrice: candidate.entryPrice,
      stopPrice: candidate.stopPrice,
      quantity: candidate.plannedQuantity,
      contractMultiplier: candidate.contractMultiplier,
      entryFeeRate: candidate.entryFeeRate,
      exitFeeRate: candidate.exitFeeRate,
      slippageRate: candidate.slippageRate,
      fundingReserve: candidate.fundingReserve,
    );
"""
          new_math = """    late final double maximumLoss;
    try {
      maximumLoss = PortfolioRiskMath.maximumLoss(
        side: candidate.side,
        entryPrice: candidate.entryPrice,
        stopPrice: candidate.stopPrice,
        quantity: candidate.plannedQuantity,
        contractMultiplier: candidate.contractMultiplier,
        entryFeeRate: candidate.entryFeeRate,
        exitFeeRate: candidate.exitFeeRate,
        slippageRate: candidate.slippageRate,
        fundingReserve: candidate.fundingReserve,
      );
    } on FormatException {
      return blocked(PortfolioEntryBlockReason.invalidInput);
    }
"""
          if new_math not in models_text:
              if old_math not in models_text:
                  raise SystemExit('Portfolio risk math anchor changed.')
              models_text = models_text.replace(old_math, new_math)
          models.write_text(models_text)
          PY

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get --enforce-lockfile

      - name: Format reviewed sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/portfolio_risk
          lib/features/owner_alpha/presentation/owner_alpha_page.dart
          lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
          test/portfolio_risk_policy_test.dart
          test/portfolio_risk_panel_test.dart
          test/portfolio_risk_source_safety_test.dart

      - name: Upload formatted source set
        uses: actions/upload-artifact@v4
        with:
          name: issue-150-formatted-sources
          path: |
            src/client/quantara_app/lib/features/portfolio_risk
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
            src/client/quantara_app/test/portfolio_risk_policy_test.dart
            src/client/quantara_app/test/portfolio_risk_panel_test.dart
            src/client/quantara_app/test/portfolio_risk_source_safety_test.dart
          if-no-files-found: error
          retention-days: 1
