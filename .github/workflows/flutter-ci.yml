name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  formatter:
    name: Format final UI fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/owner_alpha/presentation/owner_alpha_home.dart
          lib/features/owner_alpha/presentation/owner_alpha_signals.dart

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_home.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart
          git commit -m "style: format final Home and signal UI fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
