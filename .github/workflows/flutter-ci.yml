name: Fix realtime analysis synchronizer once

on:
  push:
    branches:
      - feat/101-realtime-analysis-context
    paths:
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-analysis-context
          fetch-depth: 0
          persist-credentials: true
      - name: Apply explicit interface cast and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/owner_alpha/data/realtime_market_application.dart')
          source = path.read_text()
          old = """    final gateway = analysisGateway;
              if (gateway is RealtimeMarketAnalysisSynchronizer) {
                try {
                  await gateway.synchronize(update);
          """
          new = """    final synchronizer =
                  analysisGateway is RealtimeMarketAnalysisSynchronizer
                  ? analysisGateway as RealtimeMarketAnalysisSynchronizer
                  : null;
              if (synchronizer != null) {
                try {
                  await synchronizer.synchronize(update);
          """
          if old not in source:
              raise SystemExit('synchronizer block not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          git add -A
          git diff --cached --check
          git config user.name 'quantara-ci'
          git config user.email 'quantara-ci@users.noreply.github.com'
          git commit -m 'fix: use explicit realtime synchronizer interface'
          git push origin HEAD:feat/101-realtime-analysis-context
