name: Temporary diagnose and apply issue 158

on:
  push:
    branches:
      - fix/158-local-live-runtime-resilience
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: issue-158-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'fix/158-local-live-runtime-resilience' || '' }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Apply deterministic patch
        run: python3 scripts/tmp_issue158_patch.py

      - name: Format changed Dart sources
        run: |
          dart format \
            src/client/quantara_app/lib/features/auto_trade/domain/local_live_cycle_readiness.dart \
            src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
            src/client/quantara_app/lib/features/owner_alpha/data/realtime_production_runtime.dart \
            src/client/quantara_app/lib/features/owner_alpha/domain/realtime_market_runtime_models.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_page.dart \
            src/client/quantara_app/test/local_live_cycle_readiness_test.dart \
            src/client/quantara_app/test/local_live_runtime_resilience_source_test.dart \
            src/client/quantara_app/test/realtime_market_application_test.dart \
            src/client/quantara_app/test/realtime_production_runtime_test.dart
          git diff --check

      - name: Restore official workflow and commit product patch
        if: github.event_name == 'push'
        run: |
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          rm scripts/tmp_issue158_patch.py
          git config user.name "Quantara Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/flutter-ci.yml scripts src/client/quantara_app
          git commit -m "fix: stabilize Local Live and realtime recovery"
          git push origin HEAD:fix/158-local-live-runtime-resilience
