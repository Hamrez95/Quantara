name: Temporary simple portfolio risk repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Patch analyzer findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart')
          text = path.read_text()
          text = text.replace(
              'final class PositionRiskReservation {\n  PositionRiskReservation({',
              'final class PositionRiskReservation {\n  const PositionRiskReservation({',
              1,
          )
          text = text.replace(
              '    final result = math.max(0, priceRisk + costRisk);',
              '    final result = math.max(0, priceRisk + costRisk).toDouble();',
              1,
          )
          text = text.replace(
              "    if (index < 0)\n      return _copy(processedEventIds: {...processedEventIds, eventId});",
              "    if (index < 0) {\n      return _copy(processedEventIds: {...processedEventIds, eventId});\n    }",
              1,
          )
          old = """    final maximumLoss = PortfolioRiskMath.maximumLoss(
      side: candidate.side,
      entryPrice: candidate.entryPrice,
      stopPrice: candidate.stopPrice,
      quantity: candidate.plannedQuantity,
      contractMultiplier: candidate.contractMultiplier,
      entryFeeRate: candidate.entryFeeRate,
      exitFeeRate: candidate.exitFeeRate,
      slippageRate: candidate.slippageRate,
      fundingReserve: candidate.fundingReserve,
    );
"""
          new = """    late final double maximumLoss;
    try {
      maximumLoss = PortfolioRiskMath.maximumLoss(
        side: candidate.side,
        entryPrice: candidate.entryPrice,
        stopPrice: candidate.stopPrice,
        quantity: candidate.plannedQuantity,
        contractMultiplier: candidate.contractMultiplier,
        entryFeeRate: candidate.entryFeeRate,
        exitFeeRate: candidate.exitFeeRate,
        slippageRate: candidate.slippageRate,
        fundingReserve: candidate.fundingReserve,
      );
    } on FormatException {
      return blocked(PortfolioEntryBlockReason.invalidInput);
    }
"""
          if old not in text:
              raise SystemExit('maximum-loss block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit analyzer repairs
        shell: bash
        run: |
          set -euo pipefail
          git add src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): resolve analyzer findings'
          git push origin HEAD:feat/150-portfolio-risk-budget
