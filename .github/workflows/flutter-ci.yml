name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification
    paths:
      - 'src/client/quantara_app/**'
      - '.github/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/156-home-navigation-simplification
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Make setup controls responsive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart')
          source = path.read_text()
          source = replace_exact(
              source,
              """        DropdownButtonFormField<SignalInboxSort>(
          initialValue: _sort,
          decoration: InputDecoration(
            labelText: _t('مرتب‌سازی پیشنهادها', 'Sort setups'),
            prefixIcon: const Icon(Icons.sort_rounded),
          ),
          items: [
            for (final sort in SignalInboxSort.values)
              DropdownMenuItem(value: sort, child: Text(_sortLabel(sort))),
          ],
""",
              """        DropdownButtonFormField<SignalInboxSort>(
          initialValue: _sort,
          isExpanded: true,
          decoration: InputDecoration(
            labelText: _t('مرتب‌سازی پیشنهادها', 'Sort setups'),
            prefixIcon: const Icon(Icons.sort_rounded),
          ),
          selectedItemBuilder: (context) => [
            for (final sort in SignalInboxSort.values)
              Align(
                alignment: AlignmentDirectional.centerStart,
                child: Text(
                  _sortLabel(sort),
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                ),
              ),
          ],
          items: [
            for (final sort in SignalInboxSort.values)
              DropdownMenuItem(
                value: sort,
                child: Text(
                  _sortLabel(sort),
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                ),
              ),
          ],
""",
              'sort dropdown',
          )
          source = replace_exact(
              source,
              """          DropdownButtonFormField<AnalysisStrategy>(
            initialValue: controller.strategy,
            decoration: InputDecoration(
              labelText: _t(context, 'استراتژی', 'Strategy'),
              helperText: _t(
                context,
                'انتخابت روی اسکن بعدی و پیشنهادهای فعلی اعمال می‌شود.',
                'Your choice applies to current ideas and the next scan.',
              ),
            ),
            items: [
              for (final strategy in AnalysisStrategy.values)
                DropdownMenuItem(
                  value: strategy,
                  child: Text(_strategyLabel(context, strategy)),
                ),
            ],
""",
              """          DropdownButtonFormField<AnalysisStrategy>(
            initialValue: controller.strategy,
            isExpanded: true,
            decoration: InputDecoration(
              labelText: _t(context, 'استراتژی', 'Strategy'),
              helperText: _t(
                context,
                'انتخابت روی اسکن بعدی و پیشنهادهای فعلی اعمال می‌شود.',
                'Your choice applies to current ideas and the next scan.',
              ),
            ),
            selectedItemBuilder: (context) => [
              for (final strategy in AnalysisStrategy.values)
                Align(
                  alignment: AlignmentDirectional.centerStart,
                  child: Text(
                    _strategyLabel(context, strategy),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
                ),
            ],
            items: [
              for (final strategy in AnalysisStrategy.values)
                DropdownMenuItem(
                  value: strategy,
                  child: Text(
                    _strategyLabel(context, strategy),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
                ),
            ],
""",
              'strategy dropdown',
          )
          path.write_text(source)
          PY
      - name: Format responsive source
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/presentation/owner_alpha_signals.dart
      - name: Commit responsive source and remove temporary files
        run: |
          rm -f .github/workflows/tmp-fix-156-responsive.yml .github/tmp-156-responsive-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make setup filters responsive"
          git push origin HEAD:feat/156-home-navigation-simplification
