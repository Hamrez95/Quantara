name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  formatter:
    name: Export formatted navigation sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/core/theme/quantara_theme.dart
          lib/features/owner_alpha/presentation/owner_alpha_exchange.dart
          lib/features/owner_alpha/presentation/owner_alpha_home.dart
          lib/features/owner_alpha/presentation/owner_alpha_signals.dart
          test/widget_test.dart

      - name: Commit formatted sources
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/core/theme/quantara_theme.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_exchange.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_home.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart \
            src/client/quantara_app/test/widget_test.dart
          git commit -m "style: format issue 160 UI sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-issue-160
          path: |
            src/client/quantara_app/lib/core/theme/quantara_theme.dart
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_exchange.dart
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_home.dart
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart
            src/client/quantara_app/test/widget_test.dart
          if-no-files-found: error
          retention-days: 1
