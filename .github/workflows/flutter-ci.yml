name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  patch:
    name: Patch deterministic widget transitions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Advance transitions before interaction checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/test/widget_test.dart')
          source = path.read_text()
          old_drag = """await tester.drag(
        find.byKey(const ValueKey('owner-alpha-2')),
        const Offset(0, -500),
      );"""
          new_drag = """await tester.drag(
        find.byType(ListView).hitTestable().first,
        const Offset(0, -500),
      );"""
          old_pump = """await tester.tap(target.hitTestable());
  await tester.pump(const Duration(milliseconds: 650));"""
          new_pump = """await tester.tap(target.hitTestable());
  await tester.pump();
  await tester.pump(const Duration(milliseconds: 650));"""
          if source.count(old_drag) != 1:
              raise SystemExit(f'Expected one active-view drag, found {source.count(old_drag)}')
          if source.count(old_pump) != 1:
              raise SystemExit(f'Expected one bounded navigation pump, found {source.count(old_pump)}')
          source = source.replace(old_drag, new_drag).replace(old_pump, new_pump)
          path.write_text(source)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format patched test
        working-directory: src/client/quantara_app
        run: dart format test/widget_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/test/widget_test.dart
          git commit -m "test: advance destination transitions deterministically"
          git push origin "HEAD:${GITHUB_REF_NAME}"
