name: Temporary queued portfolio control repair

on:
  push:
    branches:
      - feat/150-portfolio-risk-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/150-portfolio-risk-budget

      - name: Keep queued controls enabled
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart')
          text = path.read_text()
          text = text.replace(
              '    final disabled = _controller.loading && _controller.snapshot != null;\n',
              '',
              1,
          )
          text = text.replace('disabled ? null : ', '')
          path.write_text(text)
          PY

      - name: Commit queued-control repair
        shell: bash
        run: |
          set -euo pipefail
          git add src/client/quantara_app/lib/features/portfolio_risk/presentation/portfolio_risk_panel.dart
          if git diff --cached --quiet; then
            echo 'Queued controls are already enabled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(portfolio-risk): keep queued controls enabled'
          git push origin HEAD:feat/150-portfolio-risk-budget
