name: Format realtime analysis synchronizer once

on:
  push:
    branches:
      - feat/101-realtime-analysis-context
    paths:
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-analysis-context
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cd src/client/quantara_app
          dart format lib/features/owner_alpha/data/realtime_market_application.dart
          cd ../../..
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          git add -A
          git diff --cached --check
          git config user.name 'quantara-ci'
          git config user.email 'quantara-ci@users.noreply.github.com'
          git commit -m 'style: format realtime synchronizer capability'
          git push origin HEAD:feat/101-realtime-analysis-context
