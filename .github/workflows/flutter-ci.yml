name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  formatter:
    name: Export formatted navigation sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/owner_alpha/presentation/owner_alpha_signals.dart
          test/widget_test.dart

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-issue-156
          path: |
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_signals.dart
            src/client/quantara_app/test/widget_test.dart
          if-no-files-found: error
          retention-days: 1
