name: Flutter client CI

on:
  push:
    branches:
      - feat/156-home-navigation-simplification

permissions:
  contents: write

jobs:
  patch:
    name: Apply resilient preferences patch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make local preferences loading fail safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          source = path.read_text()
          old = '''  Future<void> _restorePreferences() async {
    final value = await _preferencesStore.load(
      availableSymbols: widget.analysisController.symbols,
    );
    if (!mounted) return;
    setState(() {
      _enabledSymbols
        ..clear()
        ..addAll(value.symbols);
      _enabledTimeframes
        ..clear()
        ..addAll(value.timeframes);
      _leverage = value.leverage;
      _riskPercent = value.riskPercent;
      _dailyLossLimit = value.dailyLossLimitPercent;
      _tp1Percent = (value.targetAllocation.tp1Fraction * 100).round();
      _tp2Percent = (value.targetAllocation.tp2Fraction * 100).round();
      _tp3Percent = 100 - _tp1Percent - _tp2Percent;
      _preferencesLoaded = true;
    });
  }'''
          new = '''  Future<void> _restorePreferences() async {
    try {
      final value = await _preferencesStore
          .load(availableSymbols: widget.analysisController.symbols)
          .timeout(const Duration(seconds: 2));
      if (!mounted) return;
      setState(() {
        _enabledSymbols
          ..clear()
          ..addAll(value.symbols);
        _enabledTimeframes
          ..clear()
          ..addAll(value.timeframes);
        _leverage = value.leverage;
        _riskPercent = value.riskPercent;
        _dailyLossLimit = value.dailyLossLimitPercent;
        _tp1Percent = (value.targetAllocation.tp1Fraction * 100).round();
        _tp2Percent = (value.targetAllocation.tp2Fraction * 100).round();
        _tp3Percent = 100 - _tp1Percent - _tp2Percent;
        _preferencesLoaded = true;
      });
    } on Object {
      if (!mounted) return;
      setState(() => _preferencesLoaded = true);
    }
  }'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one preferences block')
          path.write_text(source.replace(old, new))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format patched source
        working-directory: src/client/quantara_app
        run: dart format lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart
          git commit -m "fix: fail safe when local preferences cannot load"
          git push origin "HEAD:${GITHUB_REF_NAME}"
