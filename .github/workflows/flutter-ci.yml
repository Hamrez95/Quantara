name: Flutter client CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/client/quantara_app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  replay-preflight:
    name: Preflight allocator replay batch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/194-policy-replay
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Apply replay review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_policy_replay.dart')
          text = path.read_text()
          replacements = {
              "math.max(0, -pnl)": "math.max(0.0, -pnl)",
              "math.max(0, configuration.totalRiskBudget - beforeRisk)": "math.max(0.0, configuration.totalRiskBudget - beforeRisk)",
              "math.max(\n        0,\n        configuration.totalMarginBudget - beforeMargin,\n      )": "math.max(\n        0.0,\n        configuration.totalMarginBudget - beforeMargin,\n      )",
              "math.max(0, configuration.totalRiskBudget - lockedRisk)": "math.max(0.0, configuration.totalRiskBudget - lockedRisk)",
              "math.max(\n        0,\n        configuration.totalMarginBudget - lockedMargin,\n      )": "math.max(\n        0.0,\n        configuration.totalMarginBudget - lockedMargin,\n      )",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old = """      var frameRegret = 0.0;\n      if (minimumActiveUtility != null && availableSlots == 0 || active.isNotEmpty) {\n        for (final proposal in ranked) {\n          if (selectedIds.contains(proposal.id) ||\n              !proposal.valid ||\n              !proposal.riskDecision.allowed ||\n              proposal.utility.score < configuration.minimumUtilityScore ||\n              minimumActiveUtility == null) {\n            continue;\n          }\n          frameRegret += math.max(0, proposal.utility.score - minimumActiveUtility);\n        }\n      }\n"""
          new = """      var frameRegret = 0.0;\n      if (minimumActiveUtility != null) {\n        final bucketLimit =\n            configuration.totalRiskBudget *\n            configuration.correlationPolicy.maximumBucketRiskFraction;\n        for (final proposal in ranked) {\n          if (selectedIds.contains(proposal.id) ||\n              !proposal.valid ||\n              !proposal.riskDecision.allowed ||\n              proposal.utility.score < configuration.minimumUtilityScore) {\n            continue;\n          }\n          final bucket = configuration.correlationPolicy.bucketFor(\n            symbol: proposal.candidate.symbol,\n            assetGroup: proposal.candidate.assetGroup,\n          );\n          final blockedByEarlierCapital =\n              availableSlots == 0 ||\n              proposal.requestedRisk > availableRisk + 1e-9 ||\n              proposal.requestedMargin > availableMargin + 1e-9 ||\n              activeSymbols.contains(proposal.symbol) ||\n              (bucketRisk[bucket] ?? 0) + proposal.requestedRisk >\n                  bucketLimit + 1e-9;\n          if (!blockedByEarlierCapital) continue;\n          frameRegret += math.max(\n            0.0,\n            proposal.utility.score - minimumActiveUtility,\n          );\n        }\n      }\n"""
          if text.count(old) != 1:
              raise SystemExit('regret review snippet mismatch')
          path.write_text(text.replace(old, new))
          PY
          cd src/client/quantara_app
          dart format \
            lib/features/capital_allocator/application/portfolio_allocation_policy_replay.dart \
            test/portfolio_allocation_policy_replay_test.dart

      - name: Analyze replay implementation
        working-directory: src/client/quantara_app
        run: flutter analyze --fatal-infos

      - name: Run focused replay tests
        working-directory: src/client/quantara_app
        run: flutter test --reporter expanded test/portfolio_allocation_policy_replay_test.dart

      - name: Restore canonical CI and publish verified preflight changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/flutter-ci.yml
          allowed="$(mktemp)"
          changed="$(mktemp)"
          printf '%s\n' \
            .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_policy_replay.dart \
            src/client/quantara_app/test/portfolio_allocation_policy_replay_test.dart | sort > "$allowed"
          git diff HEAD --name-only | sort > "$changed"
          test -s "$changed"
          test -z "$(comm -23 "$changed" "$allowed")"
          grep -Fxq '.github/workflows/flutter-ci.yml' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/flutter-ci.yml \
            src/client/quantara_app/lib/features/capital_allocator/application/portfolio_allocation_policy_replay.dart \
            src/client/quantara_app/test/portfolio_allocation_policy_replay_test.dart
          git commit -m 'fix(allocator): harden replay regret accounting'
          git push origin HEAD:agent/194-policy-replay
