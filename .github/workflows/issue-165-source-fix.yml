name: Remove temporary Issue 165 patch workflow

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - '.github/workflows/issue-165-source-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-165-source-fix.yml
          git commit -m 'chore: drop temporary issue 165 workflow'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
