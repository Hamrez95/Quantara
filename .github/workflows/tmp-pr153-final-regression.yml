name: Temporary PR153 final regression fixes

on:
  push:
    branches:
      - feat/152-professional-strategy-pack

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/152-professional-strategy-pack
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Apply minimum and freshness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          analyzer = Path('src/client/quantara_app/lib/features/market_analysis/data/chart_structure_analyzer.dart')
          text = analyzer.read_text()
          if 'candles.length < 24' not in text:
              raise SystemExit('analyzer minimum not found')
          analyzer.write_text(text.replace('candles.length < 24', 'candles.length < 30', 1))

          runner = Path('src/client/quantara_app/lib/features/strategy_lab/data/strategy_lab_runner.dart')
          text = runner.read_text()
          if 'if (aggregated.length < 24)' not in text:
              raise SystemExit('parent guard not found')
          runner.write_text(text.replace('if (aggregated.length < 24)', 'if (aggregated.length < 30)', 1))

          controller = Path('src/client/quantara_app/test/owner_alpha_controller_test.dart')
          text = controller.read_text()
          text = text.replace(
              'final result = base.radar.first;\n    final analysis = _actionableAnalysis(base.generatedAt);',
              'final result = base.radar.first;\n    final signalTime = DateTime.now().toUtc();\n    final analysis = _actionableAnalysis(signalTime);',
          )
          text = text.replace('candleClosedAt: base.generatedAt,', 'candleClosedAt: signalTime,')
          text = text.replace('generatedAt: base.generatedAt,\n    );\n  }\n}', 'generatedAt: signalTime,\n    );\n  }\n}', 1)
          controller.write_text(text)
          PY
          cd src/client/quantara_app
          dart format lib test
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "fix: close structure and signal freshness regressions"
          git push origin HEAD:feat/152-professional-strategy-pack
