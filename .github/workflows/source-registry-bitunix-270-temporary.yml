name: Temporary Bitunix registry review #270

on:
  push:
    branches:
      - chore/270-renew-source-registry-review

permissions:
  contents: write

jobs:
  update-bitunix-terms:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/270-renew-source-registry-review
          fetch-depth: 0
      - name: Update Bitunix reviewed terms link
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/research/source-registry.v1.yaml')
          registry = json.loads(path.read_text(encoding='utf-8'))
          source = next(item for item in registry['sources'] if item['id'] == 'bitunix-official-futures-api')
          source['terms_urls'] = [
            'https://www.bitunix.com/hub/helpcenter/article/bitunix-user-agreement?id=144',
            'https://www.bitunix.com/hub/helpcenter/article/risk-disclosure?id=149'
          ]
          source['revision_policy'] = 'Review current OpenAPI documentation, User Agreement, and risk disclosures before each production release or after a published revision.'
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/source-registry-bitunix-270-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/source-registry.v1.yaml
          git commit -m "docs(research): refresh Bitunix policy links for #270"
          git push origin HEAD:chore/270-renew-source-registry-review
