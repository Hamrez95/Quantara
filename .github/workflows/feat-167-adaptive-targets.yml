name: Temporary issue 167 adaptive targets

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

concurrency:
  group: feat-167-adaptive-targets
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Apply adaptive target patch
        run: python3 .github/scripts/feat167_adaptive_targets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format
        working-directory: src/client/quantara_app
        run: dart format lib test
      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze
      - name: Run adaptive TP and Local Live safety tests
        working-directory: src/client/quantara_app
        run: >-
          flutter test
          test/adaptive_tp_allocation_test.dart
          test/adaptive_tp_source_test.dart
          test/profit_protection_policy_test.dart
          test/profit_lock_stop_policy_test.dart
          test/remaining_target_protection_policy_test.dart
          test/local_live_orphan_recovery_test.dart
          test/local_live_orphan_recovery_source_test.dart
          test/local_live_portfolio_risk_runtime_test.dart
          test/physical_canary_regression_source_test.dart
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app
          git commit -m 'feat: adapt Local Live to one-to-three TP orders (#167)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
