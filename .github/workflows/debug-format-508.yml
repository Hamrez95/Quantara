name: Debug format 508
on:
  push:
    branches: [feat/484-evaluation-archive-retention]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Format and show diff
        working-directory: src/client/quantara_app
        run: |
          dart format test/durable_strategy_evaluation_archive_test.dart
          git diff -- test/durable_strategy_evaluation_archive_test.dart
