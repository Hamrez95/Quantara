name: Temporary generate PR 149 lockfile

on:
  push:
    branches:
      - feat/137-encrypted-recovery-database
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve deterministic dependencies
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format changed recovery tests
        working-directory: src/client/quantara_app
        run: >-
          dart format
          test/encrypted_recovery_package_test.dart
          test/recovery_source_safety_test.dart
      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: pr-149-generated-sources
          path: |
            src/client/quantara_app/pubspec.lock
            src/client/quantara_app/test/encrypted_recovery_package_test.dart
            src/client/quantara_app/test/recovery_source_safety_test.dart
          if-no-files-found: error
          retention-days: 1
