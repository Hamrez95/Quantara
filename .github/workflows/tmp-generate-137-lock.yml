name: Temporary generate PR 149 sources

on:
  push:
    branches:
      - feat/137-encrypted-recovery-database

permissions:
  contents: write

jobs:
  generate-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/137-encrypted-recovery-database
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve deterministic dependencies
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Format reviewed recovery sources
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/core/persistence/quantara_durable_database.dart
          lib/features/recovery/domain/exchange_reinstall_recovery.dart
          test/encrypted_recovery_package_test.dart
          test/recovery_database_migration_test.dart
          test/recovery_source_safety_test.dart
          test/reinstall_exchange_recovery_test.dart
      - name: Commit generated sources
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/quantara_app/pubspec.lock \
            src/client/quantara_app/lib/core/persistence/quantara_durable_database.dart \
            src/client/quantara_app/lib/features/recovery/domain/exchange_reinstall_recovery.dart \
            src/client/quantara_app/test/encrypted_recovery_package_test.dart \
            src/client/quantara_app/test/recovery_database_migration_test.dart \
            src/client/quantara_app/test/recovery_source_safety_test.dart \
            src/client/quantara_app/test/reinstall_exchange_recovery_test.dart
          if git diff --cached --quiet; then
            echo 'Generated files are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(recovery): commit generated lockfile and formatting'
          git push origin HEAD:feat/137-encrypted-recovery-database
