name: Temporary ETH stop reconciliation hotfix

on:
  push:
    branches:
      - 'feat/163-portfolio-budgeted-local-live'
    paths:
      - '.github/workflows/temporary-eth-stop-hotfix.yml'
      - '.github/scripts/apply_eth_stop_hotfix.py'
      - '.github/scripts/prepare_eth_stop_hotfix.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 'feat/163-portfolio-budgeted-local-live'
          fetch-depth: 0

      - name: Prepare audited patch script
        run: python3 .github/scripts/prepare_eth_stop_hotfix.py

      - name: Apply audited source patch
        run: python3 .github/scripts/apply_eth_stop_hotfix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format and run focused regression suite
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          dart format lib test
          flutter test --reporter expanded \
            test/bitunix_pnl_mapper_physical_canary_test.dart \
            test/eth_stop_hotfix_regression_test.dart \
            test/local_live_eth_stop_source_test.dart \
            test/trading_journal_exchange_backfill_test.dart \
            test/trading_journal_foreground_merge_test.dart

      - name: Commit hotfix source
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git diff --cached --check
          git commit -m 'fix: reconcile stopped ETH positions and repair journal replay conflicts'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
