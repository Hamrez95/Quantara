name: Temporary final format

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - '.github/workflows/temporary-final-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format final changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/data/bitunix_private_api_client.dart test/android_preview_signing_source_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/quantara_app/lib/features/auto_trade/data/bitunix_private_api_client.dart src/client/quantara_app/test/android_preview_signing_source_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format final recovery and signing gates (#170 #171)'
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
