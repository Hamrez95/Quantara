name: v1.2 formatter snapshot

on:
  push:
    branches:
      - feat/101-103-realtime-candidate-foundation

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart format lib/features/owner_alpha/domain/realtime_candidate_models.dart test/realtime_candidate_engine_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: v1-2-formatted-candidate-files
          path: |
            src/client/quantara_app/lib/features/owner_alpha/domain/realtime_candidate_models.dart
            src/client/quantara_app/test/realtime_candidate_engine_test.dart
          if-no-files-found: error
          retention-days: 1
