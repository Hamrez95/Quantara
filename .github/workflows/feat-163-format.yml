name: Temporary feature 163 formatter

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[feat163-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format feature files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart
          lib/features/auto_trade/domain/local_live_portfolio_admission.dart
          test/local_live_portfolio_admission_test.dart
          test/local_live_portfolio_risk_runtime_test.dart

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "style: format portfolio-budgeted Local Live [feat163-formatted]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
