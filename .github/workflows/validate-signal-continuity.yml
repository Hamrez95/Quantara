name: Validate signal continuity slice

on:
  push:
    branches:
      - feat/89-91-signal-continuity
    paths:
      - .github/workflows/validate-signal-continuity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/89-91-signal-continuity
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Check formatting
        working-directory: src/client/quantara_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze

      - name: Test
        working-directory: src/client/quantara_app
        run: flutter test

      - name: Build release APK
        working-directory: src/client/quantara_app
        run: flutter build apk --release

      - name: Record successful validation
        run: |
          mkdir -p docs/validation
          cat > docs/validation/signal-continuity.md <<EOF
          # Signal continuity validation

          - Branch: \`feat/89-91-signal-continuity\`
          - Validated source commit: \`${GITHUB_SHA}\`
          - Flutter: 3.44.8 stable
          - Gates: dependency resolution, format, analyze, full Flutter tests, release APK build
          - Result: passed in GitHub Actions
          EOF
          rm .github/workflows/validate-signal-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: record signal continuity validation"
          git push origin HEAD:feat/89-91-signal-continuity
