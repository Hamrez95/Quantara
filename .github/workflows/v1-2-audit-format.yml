name: v1.2 audit ledger formatter

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: v1-2-audit-format-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format-and-commit:
    if: github.head_ref == 'feat/108-112-durable-audit-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/108-112-durable-audit-ledger
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          dart format
          lib/features/owner_alpha/domain/candidate_audit_models.dart
          lib/features/owner_alpha/data/candidate_audit_codec.dart
          lib/features/owner_alpha/data/durable_candidate_audit_store.dart
          lib/features/owner_alpha/data/platform_candidate_audit_store.dart
          test/candidate_audit_codec_test.dart
          test/durable_candidate_audit_store_test.dart
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name 'quantara-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test
          git commit -m 'style: apply canonical audit ledger formatting'
          git push origin HEAD:feat/108-112-durable-audit-ledger
