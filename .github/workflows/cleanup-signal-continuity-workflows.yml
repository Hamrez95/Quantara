name: Clean temporary signal workflows

on:
  push:
    branches:
      - feat/89-91-signal-continuity
    paths:
      - .github/workflows/cleanup-signal-continuity-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/89-91-signal-continuity
          fetch-depth: 0

      - name: Remove one-shot workflows
        run: |
          rm -f .github/workflows/package-signal-continuity-candidate.yml
          rm -f .github/workflows/cleanup-signal-continuity-workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove temporary signal workflows"
          git pull --rebase origin feat/89-91-signal-continuity
          git push origin HEAD:feat/89-91-signal-continuity
