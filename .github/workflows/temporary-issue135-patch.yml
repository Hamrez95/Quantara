name: Temporary Issue 135 patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify and apply Issue 135 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/temporary/issue135.patch.gz.b64)" -eq 14360
          echo 'fb032f92b8817365bcfb0132d4fd70a7aa2da93288c1973d159c33761b52280c  .github/temporary/issue135.patch.gz.b64' | sha256sum --check
          base64 --decode .github/temporary/issue135.patch.gz.b64 | gzip --decompress > /tmp/issue135.patch
          echo '11b7cbedb82d671bc5ef960b7e9436b0d670a6b9cb17f493e35d55085b66b89d  /tmp/issue135.patch' | sha256sum --check
          git apply --check /tmp/issue135.patch
          git apply /tmp/issue135.patch
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'src/client/quantara_app/lib/features/auto_trade/domain/'
              'auto_trade_models.dart'
          )
          source = path.read_text()
          old = '''    final residualQuantity = math.max(
              0,
              position.quantity - totalTakeProfitQuantity,
            );'''
          new = '''    final residualQuantity = math.max(
              0,
              position.quantity - totalTakeProfitQuantity,
            ).toDouble();'''
          if old not in source:
              raise SystemExit('Expected residual quantity expression not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-issue135-patch.yml
          rm -rf .github/temporary

      - name: Format, analyze, and run focused safety tests
        working-directory: src/client/quantara_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded \
            test/bitunix_position_protection_reconciliation_test.dart \
            test/position_protection_summary_test.dart \
            test/auto_trade_account_reconciliation_controller_test.dart \
            test/auto_trade_readonly_source_test.dart \
            test/private_account_reconciliation_test.dart \
            test/private_account_reconciliation_banner_test.dart

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile Bitunix position protections'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
