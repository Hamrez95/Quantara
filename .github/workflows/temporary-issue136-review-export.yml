name: Temporary Issue 136 review export

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Package source
        shell: bash
        run: tar -czf /tmp/quantara-issue136-review.tar.gz --exclude=.git .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: quantara-issue136-review-source
          path: /tmp/quantara-issue136-review.tar.gz
          retention-days: 1
