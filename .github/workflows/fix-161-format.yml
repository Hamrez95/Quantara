name: Temporary fix 161 formatter

on:
  push:
    branches:
      - fix/161-local-live-armed-intent-resilience

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[fix161-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/161-local-live-armed-intent-resilience
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format fix files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/auto_trade/application/local_live_trade_controller.dart
          lib/features/auto_trade/domain/private_account_entry_block_policy.dart
          test/private_account_entry_block_policy_test.dart

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "style: format Local Live resilience fix [fix161-formatted]"
          git push origin HEAD:fix/161-local-live-armed-intent-resilience
