name: Temporary Dart format probe
on:
  push:
    branches:
      - alpha/0.4.0-android-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print canonical formatter patch
        run: |
          cd src/client/quantara_app
          dart format lib test
          git diff -- lib test
