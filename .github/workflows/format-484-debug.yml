name: Format 484 debug

on:
  push:
    branches:
      - feat/484-deterministic-evaluation-contract

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: |
          dart format test/strategy_evaluation_run_test.dart
          cat test/strategy_evaluation_run_test.dart
