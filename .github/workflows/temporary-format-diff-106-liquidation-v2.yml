name: Temporary format diff issue 106 liquidation v2

on:
  push:
    branches:
      - feat/issue-106-liquidation-cushion-clean

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Print formatter diff
        working-directory: src/client/quantara_app
        run: |
          dart format lib/features/portfolio_risk/domain/portfolio_liquidation_policy.dart
          git diff -- lib/features/portfolio_risk/domain/portfolio_liquidation_policy.dart
