name: Release readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    name: Release readiness score
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve immutable candidate SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            source_sha='${{ github.event.pull_request.head.sha }}'
          else
            source_sha="$GITHUB_SHA"
          fi
          test -n "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Require exact-SHA CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            workflow="$1"
            run_id="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=success&per_page=100" \
                --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_SHA\" and .conclusion == \"success\") | .id" \
                | sed -n '1p'
            )"
            if [ -z "$run_id" ]; then
              echo "No successful ${workflow} run certifies ${SOURCE_SHA}." >&2
              exit 1
            fi
            echo "${workflow} certified by run ${run_id}."
          }
          require_success ci.yml
          require_success flutter-ci.yml
          require_success windows-desktop-ci.yml

      - name: Require versioned release notes and rollback plan
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)(\+[0-9]+)?[[:space:]]*$/\1/p' src/client/quantara_app/pubspec.yaml)"
          test -n "$source_version"
          test -s "docs/releases/${source_version}.md"
          test -s docs/release-rollback.md
          grep -Fq 'Production/store publication' "docs/releases/${source_version}.md"
          grep -Fq 'forward recovery' docs/release-rollback.md

      - name: Test readiness validator
        run: python -m unittest tests.scripts.test_release_readiness -v

      - name: Calculate fail-closed quality score
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-readiness.json" <<'JSON'
          {
            "repository_integrity": true,
            "flutter_android_upgrade": true,
            "windows_build": true,
            "release_notes": true,
            "rollback_plan": true,
            "safety_regression": true
          }
          JSON
          python scripts/release/release_readiness.py "$RUNNER_TEMP/release-readiness.json" --minimum-score 90

      - name: State evidence boundary
        run: |
          echo 'This score certifies software/release-engineering evidence only.'
          echo 'It does not certify physical-device, exchange, profitability, production or store-publication evidence.'
