name: Temporary Dart format probe

on:
  push:
    branches:
      - codex/issue-194-allocation-invariants

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Show canonical formatter diff
        shell: bash
        run: |
          cd src/client/quantara_app
          dart format test/portfolio_capital_allocator_invariants_test.dart
          git diff -- test/portfolio_capital_allocator_invariants_test.dart
