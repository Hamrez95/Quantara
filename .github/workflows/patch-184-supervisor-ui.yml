name: Patch 184 Supervisor UI

on:
  push:
    branches:
      - feature/184-chatgpt-readonly-mcp-v2
    paths:
      - .github/workflows/patch-184-supervisor-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/184-chatgpt-readonly-mcp-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply focused patch
        run: python3 tools/patch_184_supervisor_ui.py
      - name: Format changed Dart files
        run: |
          dart format \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart
      - name: Commit patch
        run: |
          git config user.name "Quantara CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_local_live_tools.dart
          git diff --cached --check
          git commit -m "feat(supervisor): wire Flutter support-session controls"
          git push origin HEAD:feature/184-chatgpt-readonly-mcp-v2
