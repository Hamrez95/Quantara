name: Temporary format issue 133

on:
  push:
    branches:
      - fix/133-local-live-realtime-universe
    paths:
      - '.github/workflows/format-133-temporary.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/133-local-live-realtime-universe
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'style: apply Dart formatter for issue 133'
          git push origin HEAD:fix/133-local-live-realtime-universe
