name: Temporary #484 formatter

on:
  push:
    branches:
      - feat/484-single-strategy-evaluation
    paths:
      - .github/workflows/tmp-format-484-single-eval.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/484-single-strategy-evaluation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Format exact files
        working-directory: src/client/quantara_app
        run: |
          dart format \
            lib/features/trading_lab/application/trading_lab_strategy_identity.dart \
            test/trading_lab_strategy_identity_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/trading_lab/application/trading_lab_strategy_identity.dart src/client/quantara_app/test/trading_lab_strategy_identity_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(trading-lab): apply canonical evaluation formatting"
          git push origin HEAD:feat/484-single-strategy-evaluation
