name: Temporary Issue 134 lint fix

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace constructor with initializing formals
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_controller.dart')
          source = path.read_text()
          old = '''  LocalLiveTradeController({
              required AutoTradeController accountController,
              AutoTradeCredentialsStore credentialsStore =
                  const SecureAutoTradeCredentialsStore(),
              Duration accountPollInterval = const Duration(seconds: 20),
            }) : _accountController = accountController,
                 _credentialsStore = credentialsStore,
                 _accountPollInterval = accountPollInterval;
          '''
          new = '''  factory LocalLiveTradeController({
              required AutoTradeController accountController,
              AutoTradeCredentialsStore credentialsStore =
                  const SecureAutoTradeCredentialsStore(),
              Duration accountPollInterval = const Duration(seconds: 20),
            }) => LocalLiveTradeController._(
              accountController,
              credentialsStore,
              accountPollInterval,
            );

            LocalLiveTradeController._(
              this._accountController,
              this._credentialsStore,
              this._accountPollInterval,
            );
          '''
          if old not in source:
              raise SystemExit('Expected constructor not found')
          path.write_text(source.replace(old, new))
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-issue134-lint-fix.yml
          git config user.name 'Quantara Release Bot'
          git config user.email 'quantara-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy strict constructor lint'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
