name: Android Owner Alpha candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-owner-alpha
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'
  APP_DIR: src/client/quantara_app
  TAG_PREFIX: quantara-v

jobs:
  candidate:
    name: Build monotonic permanently signed Owner Alpha APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require workflow dispatch from current main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release planning helpers
        run: python -m unittest discover -s scripts/release -p 'test_release_version.py' -v

      - name: Calculate monotonic QA version and build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)(\+[0-9]+)?[[:space:]]*$/\1/p' "$APP_DIR/pubspec.yaml")"
          test -n "$source_version"

          versions_file="$RUNNER_TEMP/quantara-owner-alpha-versions.txt"
          assets_file="$RUNNER_TEMP/quantara-owner-alpha-assets.txt"
          : > "$versions_file"
          : > "$assets_file"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
            | while IFS= read -r tag; do
                case "$tag" in
                  "$TAG_PREFIX"*) printf '%s\n' "${tag#$TAG_PREFIX}" ;;
                esac
              done >> "$versions_file"
          git tag --list "${TAG_PREFIX}*" \
            | while IFS= read -r tag; do printf '%s\n' "${tag#$TAG_PREFIX}"; done >> "$versions_file"

          version_args=(
            --previous "$source_version"
            --release-type patch
            --channel beta
            --prefix "$TAG_PREFIX"
          )
          while IFS= read -r published; do
            [ -n "$published" ] && version_args+=(--published "$published")
          done < <(sort -u "$versions_file" | sed '/^$/d')

          version_output="$(python scripts/release/release_version.py "${version_args[@]}")"
          version="$(printf '%s\n' "$version_output" | sed -n 's/^version=//p')"
          test -n "$version"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].name' > "$assets_file"
          git_candidate="$(git rev-list --count HEAD)"
          build_output="$(python scripts/release/release_manifest.py next-build --candidate "$git_candidate" < "$assets_file")"
          build_number="$(printf '%s\n' "$build_output" | sed -n 's/^build_number=//p')"
          previous_build="$(printf '%s\n' "$build_output" | sed -n 's/^previous_build=//p')"
          test -n "$build_number"
          test "$build_number" -gt "$previous_build"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "previous_build=$previous_build" >> "$GITHUB_OUTPUT"
          echo "Owner Alpha candidate: version=$version build=$build_number previous_build=$previous_build source=$GITHUB_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate source and tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Decode owner-managed Stable keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUANTARA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/quantara-owner-alpha.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/owner-alpha-keystore.txt"
          grep -q 'SHA256:' "$RUNNER_TEMP/owner-alpha-keystore.txt"
          echo "QUANTARA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Owner Alpha APKs
        working-directory: ${{ env.APP_DIR }}
        env:
          QUANTARA_STABLE_RELEASE: 'true'
          QUANTARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEYSTORE_PASSWORD }}
          QUANTARA_ANDROID_KEY_ALIAS: ${{ secrets.QUANTARA_ANDROID_KEY_ALIAS }}
          QUANTARA_ANDROID_KEY_PASSWORD: ${{ secrets.QUANTARA_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ steps.version.outputs.build_number }}'
          flutter build apk --release --split-per-abi \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ steps.version.outputs.build_number }}'

      - name: Verify production identity, signer, version and alignment
        id: integrity
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          arm64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          apkanalyzer="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          zipalign="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$apkanalyzer"
          test -x "$apksigner"
          test -x "$zipalign"
          "$apkanalyzer" manifest application-id "$apk" | grep -Fxq 'com.quantara.quantara_app'
          "$apkanalyzer" manifest version-name "$apk" | grep -Fxq '${{ steps.version.outputs.version }}'
          "$apkanalyzer" manifest version-code "$apk" | grep -Fxq '${{ steps.version.outputs.build_number }}'
          "$apksigner" verify --verbose --print-certs "$apk" | tee owner-alpha-signing.txt
          signer="$(grep -m1 'certificate SHA-256 digest:' owner-alpha-signing.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test -n "$signer"
          "$zipalign" -c -P 16 -v 4 "$apk"
          "$zipalign" -c -P 16 -v 4 "$arm64"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          echo "apk_sha256=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "signing_identity=$signer" >> "$GITHUB_OUTPUT"
          sha256sum build/app/outputs/flutter-apk/*.apk | tee SHA256SUMS.txt

      - name: Require signer continuity with latest published beta
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_IDENTITY: ${{ steps.integrity.outputs.signing_identity }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[]? | select(.draft == false and .prerelease == true) | .assets[]? | select(.name == "release-manifest.json") | .browser_download_url][0] // ""'
          )"
          if [ -z "$manifest_url" ]; then
            echo 'No published beta release manifest exists to prove Android signing continuity.' >&2
            exit 1
          fi
          curl --fail --location --proto '=https' --tlsv1.2 "$manifest_url" \
            --output "$RUNNER_TEMP/previous-release-manifest.json"
          python ../../../scripts/release/release_manifest.py guard-identity \
            --previous-manifest "$RUNNER_TEMP/previous-release-manifest.json" \
            --android-package-id com.quantara.quantara_app \
            --android-signing-identity "$SIGNING_IDENTITY"

      - name: Write auditable candidate metadata
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          PREVIOUS_BUILD: ${{ steps.version.outputs.previous_build }}
          APK_SHA256: ${{ steps.integrity.outputs.apk_sha256 }}
          SIGNING_IDENTITY: ${{ steps.integrity.outputs.signing_identity }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "schemaVersion": 1,
              "purpose": "owner-alpha-physical-qa",
              "sourceSha": os.environ["GITHUB_SHA"],
              "version": os.environ["VERSION"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "previousPublishedBuild": int(os.environ["PREVIOUS_BUILD"]),
              "packageId": "com.quantara.quantara_app",
              "apkSha256": os.environ["APK_SHA256"],
              "signingIdentitySha256": os.environ["SIGNING_IDENTITY"],
              "published": False,
          }
          Path("owner-alpha-candidate.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload signed Owner Alpha candidate only
        uses: actions/upload-artifact@v4
        with:
          name: quantara-owner-alpha-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build_number }}-${{ github.sha }}
          path: |
            src/client/quantara_app/build/app/outputs/flutter-apk/app-release.apk
            src/client/quantara_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            src/client/quantara_app/SHA256SUMS.txt
            src/client/quantara_app/owner-alpha-signing.txt
            src/client/quantara_app/owner-alpha-candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: State publication boundary
        run: |
          echo 'Owner Alpha artifact created for physical/live QA only.'
          echo 'No tag, GitHub Release, store publication, rollout, or update manifest was created.'
