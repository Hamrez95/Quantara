name: Temporary Dart format diagnostic

on:
  push:
    branches:
      - fix/447-flat-account-reconciliation-banner

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Print canonical Dart formatter diff
        shell: bash
        run: |
          dart format lib/features/auto_trade/presentation/private_account_reconciliation_banner.dart test/private_account_reconciliation_banner_test.dart
          git diff -- lib/features/auto_trade/presentation/private_account_reconciliation_banner.dart test/private_account_reconciliation_banner_test.dart
          test -n "$(git status --short -- lib/features/auto_trade/presentation/private_account_reconciliation_banner.dart test/private_account_reconciliation_banner_test.dart)"
