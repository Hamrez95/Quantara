name: Diagnose 192 analyze temporary
on:
  push:
    branches: [feat/192-economic-opportunity-ranking]
    paths: [.github/workflows/diagnose-192-analyze-temporary.yml]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/192-economic-opportunity-ranking
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply Local Live integration
        run: python3 .github/scripts/patch_192_local_live.py
      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        working-directory: src/client/quantara_app
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee /tmp/analyze-192-current.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-192-current-${{ github.run_id }}
          path: /tmp/analyze-192-current.log
          if-no-files-found: error
      - name: Enforce analyze
        if: steps.analyze.outcome != 'success'
        run: exit 1
