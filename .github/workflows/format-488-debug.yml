name: Format 488 debug

on:
  push:
    branches:
      - feat/488-guarded-auto-operational-state

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: |
          dart format lib/features/owner_alpha/application/guarded_auto_operational_state.dart lib/features/owner_alpha/data/durable_guarded_auto_operational_store.dart test/guarded_auto_operational_controller_test.dart
          printf '\n--- STATE ---\n'
          cat lib/features/owner_alpha/application/guarded_auto_operational_state.dart
          printf '\n--- STORE ---\n'
          cat lib/features/owner_alpha/data/durable_guarded_auto_operational_store.dart
          printf '\n--- TEST ---\n'
          cat test/guarded_auto_operational_controller_test.dart
