name: Add realtime analysis context once

on:
  push:
    branches:
      - feat/101-realtime-analysis-context

permissions:
  contents: write

jobs:
  edit-format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-analysis-context
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Add read-only analysis context and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          models_path = Path('src/client/quantara_app/lib/features/owner_alpha/domain/realtime_market_runtime_models.dart')
          models = models_path.read_text()
          import_marker = "import 'bitunix_public_stream_models.dart';\n"
          import_line = "import '../../market_analysis/domain/market_chart_models.dart';\n"
          if import_line not in models:
              if import_marker not in models:
                  raise SystemExit('runtime models import marker not found')
              models = models.replace(import_marker, import_line + import_marker, 1)

          class_marker = "final class RealtimeMarketHealthSnapshot {\n"
          context_class = """final class RealtimeCandleAnalysisContext {
            RealtimeCandleAnalysisContext({
              required this.update,
              required this.snapshot,
            }) {
              if (update.key != snapshot.key) {
                throw ArgumentError(
                  'The analysis update and snapshot must use the same stream key.',
                );
              }
              if (!update.streamTrusted || !snapshot.trusted) {
                throw StateError(
                  'Untrusted candle state cannot enter realtime analysis.',
                );
              }
              final eventWorking = update.workingCandle;
              final snapshotWorking = snapshot.workingCandle;
              if (eventWorking?.openTime != snapshotWorking?.openTime) {
                throw StateError(
                  'The analysis snapshot does not match the event working candle.',
                );
              }
            }

            final RealtimeCandlePipelineUpdate update;
            final RealtimeCandleStreamSnapshot snapshot;

            RealtimeCandleStreamKey get key => update.key;

            RealtimeCandlePipelineDisposition get disposition =>
                update.disposition;

            ChartCandle? get workingCandle => snapshot.workingCandle;

            List<ChartCandle> get closedCandles => snapshot.closedCandles;

            List<ChartCandle> get eventClosedCandles => update.closedCandles;

            RealtimeCandleGap? get gap => update.gap;

            DateTime get exchangeTimestampUtc => update.exchangeTimestampUtc;

            DateTime get receivedAtUtc => update.receivedAtUtc;

            DateTime get processedAtUtc => update.processedAtUtc;

            bool get streamTrusted => update.streamTrusted && snapshot.trusted;

            bool get allowsCandidatePreparation =>
                update.allowsCandidatePreparation && streamTrusted;

            bool get triggersClosedCandleAnalysis =>
                update.triggersClosedCandleAnalysis;
          }

          """
          if context_class not in models:
              if class_marker not in models:
                  raise SystemExit('health snapshot marker not found')
              models = models.replace(class_marker, context_class + class_marker, 1)
          models_path.write_text(models)

          app_path = Path('src/client/quantara_app/lib/features/owner_alpha/data/realtime_market_application.dart')
          app = app_path.read_text()
          old_gateway = """abstract interface class RealtimeMarketAnalysisGateway {
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandlePipelineUpdate update,
            );
          }
          """
          new_gateway = """abstract interface class RealtimeMarketAnalysisGateway {
            Future<RealtimeCandidateAnalysisBatch> analyze(
              RealtimeCandleAnalysisContext context,
            );
          }
          """
          if old_gateway not in app:
              raise SystemExit('analysis gateway marker not found')
          app = app.replace(old_gateway, new_gateway, 1)

          old_init = """    _metrics = _RealtimeMarketMetrics(maximumLatencySamples);
              _eventBus = RealtimeMarketEventBus(
          """
          new_init = """    _metrics = _RealtimeMarketMetrics(maximumLatencySamples);
              _candleAssembler = RealtimeCandleAssembler();
              _eventBus = RealtimeMarketEventBus(
          """
          if old_init not in app:
              raise SystemExit('runtime initialization marker not found')
          app = app.replace(old_init, new_init, 1)

          old_assembler = """    _candleCoordinator = RealtimeCandlePipelineCoordinator(
              assembler: RealtimeCandleAssembler(),
          """
          new_assembler = """    _candleCoordinator = RealtimeCandlePipelineCoordinator(
              assembler: _candleAssembler,
          """
          if old_assembler not in app:
              raise SystemExit('coordinator assembler marker not found')
          app = app.replace(old_assembler, new_assembler, 1)

          field_marker = """  late final _RealtimeMarketMetrics _metrics;
            late final RealtimeMarketEventBus _eventBus;
          """
          field_replacement = """  late final _RealtimeMarketMetrics _metrics;
            late final RealtimeCandleAssembler _candleAssembler;
            late final RealtimeMarketEventBus _eventBus;
          """
          if field_marker not in app:
              raise SystemExit('assembler field marker not found')
          app = app.replace(field_marker, field_replacement, 1)

          old_analyze = """    late final RealtimeCandidateAnalysisBatch batch;
              try {
                batch = await analysisGateway.analyze(update);
          """
          new_analyze = """    final context = RealtimeCandleAnalysisContext(
                update: update,
                snapshot: _candleAssembler.snapshotFor(update.key),
              );
              late final RealtimeCandidateAnalysisBatch batch;
              try {
                batch = await analysisGateway.analyze(context);
          """
          if old_analyze not in app:
              raise SystemExit('analysis invocation marker not found')
          app_path.write_text(app.replace(old_analyze, new_analyze, 1))

          for relative in [
              'src/client/quantara_app/test/realtime_market_application_test.dart',
              'src/client/quantara_app/test/realtime_market_application_e2e_test.dart',
          ]:
              path = Path(relative)
              text = path.read_text()
              old = 'RealtimeCandlePipelineUpdate update,'
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'no gateway signatures found in {relative}')
              path.write_text(text.replace(old, 'RealtimeCandleAnalysisContext update,'))

          test_path = Path('src/client/quantara_app/test/realtime_market_analysis_context_test.dart')
          test_path.write_text("""import 'package:flutter_test/flutter_test.dart';
          import 'package:quantara_app/features/market_analysis/domain/market_chart_models.dart';
          import 'package:quantara_app/features/owner_alpha/domain/bitunix_public_stream_models.dart';
          import 'package:quantara_app/features/owner_alpha/domain/realtime_candle_pipeline_models.dart';
          import 'package:quantara_app/features/owner_alpha/domain/realtime_market_runtime_models.dart';

          void main() {
            final key = RealtimeCandleStreamKey(
              symbol: 'BTCUSDT',
              interval: BitunixKlineInterval.fifteenMinutes,
            );
            final working = _candle(DateTime.utc(2026, 8, 2, 12), 120);
            final history = [
              for (var index = 0; index < 20; index++)
                _candle(
                  DateTime.utc(2026, 8, 2, 7).add(
                    Duration(minutes: index * 15),
                  ),
                  100 + index.toDouble(),
                ),
            ];

            test('exposes the full immutable stream snapshot to analysis', () {
              final context = RealtimeCandleAnalysisContext(
                update: _update(key: key, working: working),
                snapshot: RealtimeCandleStreamSnapshot(
                  key: key,
                  closedCandles: history,
                  workingCandle: working,
                  gap: null,
                ),
              );

              expect(context.key, key);
              expect(
                context.disposition,
                RealtimeCandlePipelineDisposition.workingUpdated,
              );
              expect(context.closedCandles, hasLength(20));
              expect(context.eventClosedCandles, isEmpty);
              expect(context.workingCandle, same(working));
              expect(context.streamTrusted, isTrue);
              expect(context.allowsCandidatePreparation, isTrue);
              expect(
                () => context.closedCandles.add(working),
                throwsUnsupportedError,
              );
            });

            test('rejects a snapshot from a different stream', () {
              final otherKey = RealtimeCandleStreamKey(
                symbol: 'ETHUSDT',
                interval: BitunixKlineInterval.fifteenMinutes,
              );

              expect(
                () => RealtimeCandleAnalysisContext(
                  update: _update(key: key, working: working),
                  snapshot: RealtimeCandleStreamSnapshot(
                    key: otherKey,
                    closedCandles: history,
                    workingCandle: working,
                    gap: null,
                  ),
                ),
                throwsArgumentError,
              );
            });

            test('rejects untrusted gap state before analysis', () {
              final gap = RealtimeCandleGap(
                fromOpenTimeUtc: working.openTime,
                toOpenTimeExclusiveUtc: working.openTime.add(
                  const Duration(minutes: 15),
                ),
                observedWorkingOpenTimeUtc: working.openTime.add(
                  const Duration(minutes: 15),
                ),
              );

              expect(
                () => RealtimeCandleAnalysisContext(
                  update: RealtimeCandlePipelineUpdate(
                    key: key,
                    disposition:
                        RealtimeCandlePipelineDisposition.gapDetected,
                    workingCandle: working,
                    closedCandles: const [],
                    gap: gap,
                    exchangeTimestampUtc: DateTime.utc(2026, 8, 2, 12, 1),
                    receivedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 100),
                    processedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 200),
                  ),
                  snapshot: RealtimeCandleStreamSnapshot(
                    key: key,
                    closedCandles: history,
                    workingCandle: working,
                    gap: gap,
                  ),
                ),
                throwsStateError,
              );
            });
          }

          RealtimeCandlePipelineUpdate _update({
            required RealtimeCandleStreamKey key,
            required ChartCandle working,
          }) => RealtimeCandlePipelineUpdate(
            key: key,
            disposition: RealtimeCandlePipelineDisposition.workingUpdated,
            workingCandle: working,
            closedCandles: const [],
            gap: null,
            exchangeTimestampUtc: DateTime.utc(2026, 8, 2, 12, 1),
            receivedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 100),
            processedAtUtc: DateTime.utc(2026, 8, 2, 12, 1, 0, 200),
          );

          ChartCandle _candle(DateTime openTime, double close) => ChartCandle(
            openTime: openTime,
            open: close - 1,
            high: close + 1,
            low: close - 2,
            close: close,
            volume: 10,
          );
          """)
          PY

          cd src/client/quantara_app
          dart format lib/features/owner_alpha/domain/realtime_market_runtime_models.dart lib/features/owner_alpha/data/realtime_market_application.dart test/realtime_market_application_test.dart test/realtime_market_application_e2e_test.dart test/realtime_market_analysis_context_test.dart
          cd ../../..
          git rm .github/workflows/add-realtime-analysis-context-once.yml
          git add src/client/quantara_app/lib/features/owner_alpha/domain/realtime_market_runtime_models.dart
          git add src/client/quantara_app/lib/features/owner_alpha/data/realtime_market_application.dart
          git add src/client/quantara_app/test/realtime_market_application_test.dart
          git add src/client/quantara_app/test/realtime_market_application_e2e_test.dart
          git add src/client/quantara_app/test/realtime_market_analysis_context_test.dart
          git diff --cached --check

      - name: Commit clean analysis context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantara-ci"
          git config user.email "quantara-ci@users.noreply.github.com"
          git commit -m "feat: provide full realtime analysis snapshots"
          git push origin HEAD:feat/101-realtime-analysis-context
