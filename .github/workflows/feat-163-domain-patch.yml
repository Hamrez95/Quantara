name: Temporary feature 163 domain patch

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[feat163-domain]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Add asset-group concentration and next-RC position cap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models_path = Path('src/client/quantara_app/lib/features/portfolio_risk/domain/portfolio_risk_models.dart')
          models = models_path.read_text()
          old_enum = '''  marginInsufficient,
  directionConcentration,
}'''
          new_enum = '''  marginInsufficient,
  directionConcentration,
  assetGroupConcentration,
}'''
          if models.count(old_enum) != 1:
              raise SystemExit('portfolio block enum anchor mismatch')
          models = models.replace(old_enum, new_enum)

          old_ctor = '''  const PortfolioRiskPolicy({
    this.emergencyTechnicalCeiling = 24,
    this.maximumDirectionRiskFraction = 0.75,
  });

  final int emergencyTechnicalCeiling;
  final double maximumDirectionRiskFraction;'''
          new_ctor = '''  const PortfolioRiskPolicy({
    this.emergencyTechnicalCeiling = 24,
    this.maximumDirectionRiskFraction = 0.75,
    this.maximumAssetGroupRiskFraction = 0.60,
  });

  final int emergencyTechnicalCeiling;
  final double maximumDirectionRiskFraction;
  final double maximumAssetGroupRiskFraction;'''
          if models.count(old_ctor) != 1:
              raise SystemExit('portfolio policy constructor anchor mismatch')
          models = models.replace(old_ctor, new_ctor)

          margin_anchor = '''    final margin = account.marginBudget;
    if (!margin.canReserve(candidate.requiredMargin)) {'''
          correlation = '''    final sameAssetGroupRisk = ledger.activeReservations
        .where((item) => item.assetGroup == candidate.assetGroup)
        .fold<double>(0, (sum, item) => sum + item.maximumLoss);
    if (sameAssetGroupRisk + maximumLoss >
        ledger.dailyRisk.limit * maximumAssetGroupRiskFraction + 1e-9) {
      return blocked(
        PortfolioEntryBlockReason.assetGroupConcentration,
        maximumLoss: maximumLoss,
        requiredMargin: candidate.requiredMargin,
      );
    }
    final margin = account.marginBudget;
    if (!margin.canReserve(candidate.requiredMargin)) {'''
          if models.count(margin_anchor) != 1:
              raise SystemExit('portfolio margin anchor mismatch')
          models = models.replace(margin_anchor, correlation)
          models_path.write_text(models)

          config_path = Path('src/client/quantara_app/lib/features/auto_trade/domain/local_live_trade_models.dart')
          config = config_path.read_text()
          old_validation = '''    if (maximumConcurrentPositions != 1) {
      throw const FormatException(
        'The first local live canary is limited to one concurrent position.',
      );
    }'''
          new_validation = '''    if (maximumConcurrentPositions < 1 ||
        maximumConcurrentPositions >
            LocalLivePortfolioAdmission.maximumSupportedConcurrentPositions) {
      throw const FormatException(
        'Local Live supports between one and three concurrent positions.',
      );
    }'''
          if config.count(old_validation) != 1:
              raise SystemExit('local live position validation anchor mismatch')
          config = config.replace(
              "import 'trading_pnl_projection.dart';",
              "import 'local_live_portfolio_admission.dart';\nimport 'trading_pnl_projection.dart';",
          )
          config = config.replace(old_validation, new_validation)
          config_path.write_text(config)
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format modified files
        working-directory: src/client/quantara_app
        run: >-
          dart format
          lib/features/portfolio_risk/domain/portfolio_risk_models.dart
          lib/features/auto_trade/domain/local_live_trade_models.dart
          lib/features/auto_trade/domain/local_live_portfolio_admission.dart
          lib/features/auto_trade/application/local_live_portfolio_risk_runtime.dart
          test/local_live_portfolio_admission_test.dart
          test/local_live_portfolio_risk_runtime_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app
          git commit -m "feat(portfolio-risk): enforce next-RC concurrency concentration gates [feat163-domain]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
