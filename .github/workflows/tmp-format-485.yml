name: Temporary format 485

on:
  push:
    branches:
      - feat/485-binding-observability

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format-485]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/quantara_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/485-binding-observability
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Format exact file
        run: dart format test/strategy_robot_binding_observability_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/test/strategy_robot_binding_observability_test.dart
          git commit -m "chore: apply Dart 3.12 formatter [skip format-485]"
          git push origin HEAD:feat/485-binding-observability
