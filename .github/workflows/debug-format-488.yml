name: Debug format 488
on:
  push:
    branches:
      - feat/488-global-pause-runtime-policy
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Print exact formatted test
        working-directory: src/client/quantara_app
        run: |
          dart format test/global_pause_runtime_policy_test.dart
          echo '---FORMATTED-START---'
          cat test/global_pause_runtime_policy_test.dart
          echo '---FORMATTED-END---'
