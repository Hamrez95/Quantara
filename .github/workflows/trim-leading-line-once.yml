name: Trim leading Dart line once

on:
  push:
    branches:
      - fix/33-mobile-stability-and-simplification
    paths:
      - .github/workflows/trim-leading-line-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/33-mobile-stability-and-simplification
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove leading blank and verify formatting
        working-directory: src/client/quantara_app
        run: |
          sed -i '1{/^$/d;}' lib/features/cockpit/presentation/stable_cockpit_page.dart
          dart format lib test
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trim-leading-line-once.yml
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "chore: finalize Dart formatting"
          git push origin HEAD:fix/33-mobile-stability-and-simplification
