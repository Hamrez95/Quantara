name: Apply PR28 registry metadata fix

on:
  push:
    branches:
      - feat/18-source-governance-registry
    paths:
      - scripts/apply-pr28-registry-metadata-fix.py

permissions:
  contents: write

jobs:
  apply-registry-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/18-source-governance-registry

      - name: Apply exact registry metadata replacement
        run: python3 scripts/apply-pr28-registry-metadata-fix.py

      - name: Validate registry and patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_source_registry.py
          git diff --check

      - name: Commit registry correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/source-registry.v1.yaml
          if git diff --cached --quiet; then
            echo "Expected registry correction was not produced." >&2
            exit 1
          fi
          git commit -m "fix(research): correct Murphy publisher reference"
          git push origin HEAD:feat/18-source-governance-registry
