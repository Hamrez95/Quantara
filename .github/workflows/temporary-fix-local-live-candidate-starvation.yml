name: Temporary Local Live candidate starvation fix

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live
    paths:
      - .github/workflows/temporary-fix-local-live-candidate-starvation.yml
      - .github/scripts/fix_local_live_candidate_starvation.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 .github/scripts/fix_local_live_candidate_starvation.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: dart format lib/features/auto_trade/application/local_live_trade_service.dart test/local_live_multi_position_service_source_test.dart

      - name: Analyze
        working-directory: src/client/quantara_app
        run: flutter analyze

      - name: Run candidate starvation regression
        working-directory: src/client/quantara_app
        run: flutter test test/local_live_multi_position_service_source_test.dart

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart \
                  src/client/quantara_app/test/local_live_multi_position_service_source_test.dart
          git commit -m "fix: evaluate fallback Local Live candidates (#168)"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
