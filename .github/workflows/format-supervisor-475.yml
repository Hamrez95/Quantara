name: Format Supervisor PR 475

on:
  push:
    branches:
      - fix/474-supervisor-setup-ux

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/474-supervisor-setup-ux
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply canonical formatter
        working-directory: src/client/quantara_app
        run: dart format lib/features/ai_supervisor/presentation/supervisor_connection_launcher.dart test/ai_supervisor_connection_launcher_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib/features/ai_supervisor/presentation/supervisor_connection_launcher.dart src/client/quantara_app/test/ai_supervisor_connection_launcher_test.dart
          git commit -m "style(flutter): apply canonical formatter"
          git push origin HEAD:fix/474-supervisor-setup-ux
