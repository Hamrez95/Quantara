name: Temporary feature 163 UI diagnostics

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[feat163-ui-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0

      - name: Inspect patch anchors
        run: |
          python3 - <<'PY' > .github/feat-163-ui-diagnostic.log
          from pathlib import Path

          model = Path('src/client/quantara_app/lib/features/auto_trade/domain/local_live_trade_models.dart').read_text()
          ui = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart').read_text()
          anchors = {
              'model_import': (model, "import 'profit_lock_stop_policy.dart';\nimport 'trading_pnl_projection.dart';"),
              'model_validation': (model, """    if (maximumConcurrentPositions != 1) {
              throw const FormatException(
                'The first local live canary is limited to one concurrent position.',
              );
            }"""),
              'state': (ui, '  double _dailyLossLimit = 1;\n  int _tp1Percent = 65;'),
              'restore': (ui, '        _dailyLossLimit = value.dailyLossLimitPercent;\n        _tp1Percent'),
              'current_prefs': (ui, '    dailyLossLimitPercent: _dailyLossLimit,\n    targetAllocation:'),
              'control': (ui, """                  TpAllocationEditor(
                    allocation: _targetAllocation,"""),
              'fa_boundary': (ui, 'این حالت می‌تواند سفارش واقعی فیوچرز ارسال کند. فقط یک پوزیشن هم‌زمان و Isolated مجاز است؛ ریسک قابل تنظیم تا ۲٪ و سقف ضرر روزانه تا ۱۰٪ باز شده، اما هر ورود همچنان باید با SL کامل و سه TP تأییدشده صرافی محافظت شود.'),
              'en_boundary': (ui, 'This mode can submit real futures orders. It remains isolated and limited to one concurrent position; risk is adjustable up to 2% and the daily cap up to 10%, while every entry still requires a full exchange-confirmed stop and three targets.'),
              'fa_dialog': (ui, 'Quantara استاپ را دورتر نمی‌کند، بعد از ضرر ریسک را بالا نمی‌برد و همچنان فقط یک پوزیشن Isolated باز می‌کند. ادامه می‌دهی؟'),
              'en_dialog': (ui, 'Quantara will not widen stops, increase risk after losses, or open more than one isolated position. Continue?'),
              'confirmation': (ui, """              Text(
                '${_t('تقسیم اهداف', 'Target allocation')}: TP1 $_tp1Percent% · TP2 $_tp2Percent% · TP3 $_tp3Percent%',"""),
              'config': (ui, '        maximumConcurrentPositions: 1,'),
              'status': (ui, "'${status.openPositionCount} پوزیشن باز',\n                  '${status.openPositionCount} open',"),
          }
          for name, (text, anchor) in anchors.items():
              print(f'{name}={text.count(anchor)}')
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/feat-163-ui-diagnostic.log
          git commit -m "chore: record feature 163 UI patch diagnostics [feat163-ui-diagnostic]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
