name: Temporary PR153 analyzed fix

on:
  push:
    branches:
      - feat/152-professional-strategy-pack

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/152-professional-strategy-pack
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Fix analyzed call sites
        run: |
          sed -i 's/_totalCostRate(config)/StrategyLabRunner._totalCostRate(config)/g' src/client/quantara_app/lib/features/strategy_lab/data/strategy_lab_runner.dart
          cd src/client/quantara_app
          dart format lib test
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/quantara_app/lib src/client/quantara_app/test
          git commit -m "fix: resolve strategy lab analyze errors"
          git push origin HEAD:feat/152-professional-strategy-pack
