name: Add realtime lifecycle regression once

on:
  push:
    branches:
      - feat/101-realtime-application-composition

permissions:
  contents: write

jobs:
  edit-format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/101-realtime-application-composition
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Add lifecycle and health regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/quantara_app/test/realtime_market_application_test.dart')
          text = path.read_text()

          marker = """    test(
                'runs public candle through analysis, audit, commit and projection',
          """
          test_block = """    test(
                'rebootstraps on resume and records reconnect health',
                () async {
                  final clock = _MutableClock(DateTime.utc(2026, 8, 2, 10, 59));
                  final source = _FakeBackfillSource(
                    recent: _candles(historyStart, 20, interval: key.interval.duration),
                  );
                  final fleetFactory = _FakeFleetFactory();
                  final projection = _FakeProjection();
                  final application = _application(
                    key: key,
                    source: source,
                    fleetFactory: fleetFactory,
                    projection: projection,
                    analysis: const _EmptyAnalysisGateway(),
                    clock: clock,
                  );

                  await application.start();
                  await _flushMicrotasks();
                  final firstFleet = fleetFactory.fleet;

                  await firstFleet.transition(BitunixPublicConnectionState.backingOff);
                  await firstFleet.transition(BitunixPublicConnectionState.live);
                  await firstFleet.emitFault(
                    BitunixPublicStreamFault(
                      kind: BitunixPublicStreamFaultKind.malformedPayload,
                      message: 'injected malformed payload',
                      occurredAtUtc: clock.now,
                      shardIndex: 0,
                    ),
                  );

                  expect(application.health.reconnectTransitions, 1);
                  expect(application.health.malformedPayloadFaults, 1);
                  expect(application.health.discoveryHealthy, isTrue);

                  await application.pause();
                  expect(application.state, RealtimeMarketRuntimeState.paused);
                  expect(firstFleet.stopCalls, 1);

                  await application.resume();
                  await _flushMicrotasks();

                  expect(source.recentRequests, 2);
                  expect(projection.restoreCalls, 1);
                  expect(fleetFactory.fleets, hasLength(2));
                  expect(fleetFactory.fleet, isNot(same(firstFleet)));
                  expect(application.state, RealtimeMarketRuntimeState.live);

                  await application.stop();
                },
              );

              test(
                'runs public candle through analysis, audit, commit and projection',
          """
          if marker not in text:
              raise SystemExit('lifecycle insertion marker not found')
          text = text.replace(marker, test_block, 1)

          factory_old = """  final List<String>? order;
            final bool failRunSynchronously;
            late final _FakeFleet fleet;
            List<BitunixPublicSubscription> subscriptions = const [];
          """
          factory_new = """  final List<String>? order;
            final bool failRunSynchronously;
            final List<_FakeFleet> fleets = [];
            List<BitunixPublicSubscription> subscriptions = const [];

            _FakeFleet get fleet => fleets.last;
          """
          if factory_old not in text:
              raise SystemExit('factory storage marker not found')
          text = text.replace(factory_old, factory_new, 1)

          build_old = """    fleet = _FakeFleet(
                onEvent: onEvent,
                onState: onState,
                failRunSynchronously: failRunSynchronously,
              );
              return fleet;
          """
          build_new = """    final fleet = _FakeFleet(
                onEvent: onEvent,
                onFault: onFault,
                onState: onState,
                failRunSynchronously: failRunSynchronously,
              );
              fleets.add(fleet);
              return fleet;
          """
          if build_old not in text:
              raise SystemExit('factory build marker not found')
          text = text.replace(build_old, build_new, 1)

          fleet_ctor_old = """  _FakeFleet({
              required this.onEvent,
              required this.onState,
              required this.failRunSynchronously,
            });

            final BitunixStreamEventHandler onEvent;
            final BitunixFleetStateHandler onState;
          """
          fleet_ctor_new = """  _FakeFleet({
              required this.onEvent,
              required this.onFault,
              required this.onState,
              required this.failRunSynchronously,
            });

            final BitunixStreamEventHandler onEvent;
            final BitunixStreamFaultHandler onFault;
            final BitunixFleetStateHandler onState;
          """
          if fleet_ctor_old not in text:
              raise SystemExit('fleet constructor marker not found')
          text = text.replace(fleet_ctor_old, fleet_ctor_new, 1)

          emit_marker = """  Future<void> emit(BitunixPublicStreamEvent event) async {
              await onEvent(event);
            }

            @override
          """
          emit_replacement = """  Future<void> emit(BitunixPublicStreamEvent event) async {
              await onEvent(event);
            }

            Future<void> emitFault(BitunixPublicStreamFault fault) async {
              await onFault(fault);
            }

            Future<void> transition(BitunixPublicConnectionState state) async {
              await onState(0, state);
            }

            @override
          """
          if emit_marker not in text:
              raise SystemExit('fleet helper marker not found')
          text = text.replace(emit_marker, emit_replacement, 1)

          projection_old = """  final List<String>? order;
            final List<CandidateRegistryAuditEvent> applied = [];

            @override
            Future<void> restore() async {
              order?.add('projection-restore');
            }
          """
          projection_new = """  final List<String>? order;
            final List<CandidateRegistryAuditEvent> applied = [];
            int restoreCalls = 0;

            @override
            Future<void> restore() async {
              restoreCalls++;
              order?.add('projection-restore');
            }
          """
          if projection_old not in text:
              raise SystemExit('projection marker not found')
          path.write_text(text.replace(projection_old, projection_new, 1))
          PY

          cd src/client/quantara_app
          dart format test/realtime_market_application_test.dart
          cd ../../..
          git rm .github/workflows/add-realtime-lifecycle-regression-once.yml
          git add src/client/quantara_app/test/realtime_market_application_test.dart
          git diff --cached --check

      - name: Commit clean lifecycle coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantara-ci"
          git config user.email "quantara-ci@users.noreply.github.com"
          git commit -m "test: cover realtime pause resume and health recovery"
          git push origin HEAD:feat/101-realtime-application-composition
