name: Temporary feature 163 service anchor diagnostics

on:
  push:
    branches:
      - feat/163-portfolio-budgeted-local-live

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[feat163-service-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/163-portfolio-budgeted-local-live
          fetch-depth: 0
      - name: Count integration anchors
        run: |
          python3 - <<'PY' > .github/feat-163-service-diagnostic.log
          from pathlib import Path
          text = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart').read_text()
          anchors = {
            'admission_import': "import '../domain/local_live_cycle_readiness.dart';\nimport '../domain/local_live_trade_models.dart';",
            'guard_import': "import 'profit_lock_promotion_executor.dart';",
            'guard_field': '  final LocalLiveJournalObserver _journalObserver = LocalLiveJournalObserver();',
            'session_reset': '          _sessionStartEquity = null;\n          _sessionPnlProjection = null;',
            'runtime_reconcile': '      await _reconcileManagedPositions(positions, account.authoritativePnl);\n      final lossPercent =',
            'scan_condition': '      if (_entriesEnabled &&\n          _managed.isEmpty &&\n          positions.isEmpty &&\n          account.estimatedEquity > 0) {\n        await _scanAndMaybeEnter(account);\n      }',
            'scan_signature': '  Future<void> _scanAndMaybeEnter(AutoTradeAccountSnapshot account) async {',
            'ideas': '      _lastScanAt = DateTime.now().toUtc();\n      final ideas = <TradeIdea>[',
            'ideas_filter': '].where((idea) => idea.isActionable).toList(growable: false);',
            'reservation': '      await exchange.ensureIsolatedMargin(\n        symbol: idea.symbol,\n        credentials: credentials,\n      );',
            'order_flag': "      final placed = await exchange.placeMarketEntry(\n        symbol: idea.symbol,\n        quantity: quantity,\n        long: idea.direction == TradeDirection.long,\n        clientId: clientId,\n        stopLoss: stopLoss,\n        credentials: credentials,\n      );\n      _auditEvent(",
            'cleanup': "          _executedSetupIds.add(idea.setupId);\n          await _persistState();\n          throw const LocalLiveTradeSafeException(",
            'record_fill': '      quantity = rules.roundQuantityDown(\n        math.min(detail.filledQuantity, position.quantity),\n      );',
            'confirm_stop': "      if (!protections.any((item) => item.stopLossPrice > 0)) {",
            'end': "      _auditEvent(\n        'position_protected',",
          }
          for name, anchor in anchors.items():
            print(f'{name}={text.count(anchor)}')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/feat-163-service-diagnostic.log
          git commit -m "chore: record service integration anchors [feat163-service-diagnostic]"
          git push origin HEAD:feat/163-portfolio-budgeted-local-live
