name: Temporary 106 capital dashboard patch

on:
  push:
    branches:
      - feat/106-capital-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/106-capital-dashboard
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Patch dashboard integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}')
              path.write_text(text.replace(old, new, 1))

          guard = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_portfolio_execution_guard.dart')
          replace_once(
              guard,
              """  final LocalLivePortfolioRiskRuntime _runtime;\n  final LocalLiveCapitalGuardianMonitor _capitalGuardianMonitor;\n""",
              """  final LocalLivePortfolioRiskRuntime _runtime;\n  final LocalLiveCapitalGuardianMonitor _capitalGuardianMonitor;\n  LocalLiveCapitalGuardianSnapshot? _lastCapitalGuardianSnapshot;\n\n  LocalLiveCapitalGuardianSnapshot? get lastCapitalGuardianSnapshot =>\n      _lastCapitalGuardianSnapshot;\n""",
          )
          replace_once(
              guard,
              """    await _capitalGuardianMonitor.refresh(\n      accountEquity: account.estimatedEquity,\n      now: now,\n    );\n""",
              """    _lastCapitalGuardianSnapshot = await _capitalGuardianMonitor.refresh(\n      accountEquity: account.estimatedEquity,\n      now: now,\n    );\n""",
          )

          models = Path('src/client/quantara_app/lib/features/auto_trade/domain/local_live_trade_models.dart')
          old_models = """final class LocalLivePortfolioBudgetStatus {\n  const LocalLivePortfolioBudgetStatus({\n    required this.asOf,\n    required this.riskLimit,\n    required this.riskConsumed,\n    required this.riskAvailable,\n    required this.openRisk,\n    required this.pendingRisk,\n    required this.ambiguousRisk,\n    required this.reservedMargin,\n    required this.spendableMargin,\n    required this.accountFresh,\n    required this.allPositionsProtected,\n    required this.liveExecutionAllowed,\n    required this.blockReason,\n  });\n\n  final DateTime asOf;\n  final double riskLimit;\n  final double riskConsumed;\n  final double riskAvailable;\n  final double openRisk;\n  final double pendingRisk;\n  final double ambiguousRisk;\n  final double reservedMargin;\n  final double spendableMargin;\n  final bool accountFresh;\n  final bool allPositionsProtected;\n  final bool liveExecutionAllowed;\n  final String blockReason;\n\n  Map<String, Object?> toJson() => {\n    'asOf': asOf.toUtc().toIso8601String(),\n    'riskLimit': riskLimit,\n    'riskConsumed': riskConsumed,\n    'riskAvailable': riskAvailable,\n    'openRisk': openRisk,\n    'pendingRisk': pendingRisk,\n    'ambiguousRisk': ambiguousRisk,\n    'reservedMargin': reservedMargin,\n    'spendableMargin': spendableMargin,\n    'accountFresh': accountFresh,\n    'allPositionsProtected': allPositionsProtected,\n    'liveExecutionAllowed': liveExecutionAllowed,\n    'blockReason': blockReason,\n  };\n\n  factory LocalLivePortfolioBudgetStatus.fromJson(Map<String, Object?> json) =>\n      LocalLivePortfolioBudgetStatus(\n        asOf:\n            DateTime.tryParse(json['asOf']?.toString() ?? '')?.toUtc() ??\n            DateTime.fromMillisecondsSinceEpoch(0, isUtc: true),\n        riskLimit: (json['riskLimit'] as num?)?.toDouble() ?? 0,\n        riskConsumed: (json['riskConsumed'] as num?)?.toDouble() ?? 0,\n        riskAvailable: (json['riskAvailable'] as num?)?.toDouble() ?? 0,\n        openRisk: (json['openRisk'] as num?)?.toDouble() ?? 0,\n        pendingRisk: (json['pendingRisk'] as num?)?.toDouble() ?? 0,\n        ambiguousRisk: (json['ambiguousRisk'] as num?)?.toDouble() ?? 0,\n        reservedMargin: (json['reservedMargin'] as num?)?.toDouble() ?? 0,\n        spendableMargin: (json['spendableMargin'] as num?)?.toDouble() ?? 0,\n        accountFresh: json['accountFresh'] == true,\n        allPositionsProtected: json['allPositionsProtected'] == true,\n        liveExecutionAllowed: json['liveExecutionAllowed'] == true,\n        blockReason: json['blockReason']?.toString() ?? 'unknown',\n      );\n}\n"""
          new_models = """final class LocalLivePortfolioBudgetStatus {\n  const LocalLivePortfolioBudgetStatus({\n    required this.asOf,\n    required this.riskLimit,\n    required this.riskConsumed,\n    required this.riskAvailable,\n    required this.openRisk,\n    required this.pendingRisk,\n    required this.ambiguousRisk,\n    required this.reservedMargin,\n    required this.spendableMargin,\n    required this.accountFresh,\n    required this.allPositionsProtected,\n    required this.liveExecutionAllowed,\n    required this.blockReason,\n    this.currentEquity,\n    this.peakEquity,\n    this.drawdownFraction,\n    this.drawdownTier,\n    this.riskMultiplier,\n  });\n\n  final DateTime asOf;\n  final double riskLimit;\n  final double riskConsumed;\n  final double riskAvailable;\n  final double openRisk;\n  final double pendingRisk;\n  final double ambiguousRisk;\n  final double reservedMargin;\n  final double spendableMargin;\n  final bool accountFresh;\n  final bool allPositionsProtected;\n  final bool liveExecutionAllowed;\n  final String blockReason;\n  final double? currentEquity;\n  final double? peakEquity;\n  final double? drawdownFraction;\n  final String? drawdownTier;\n  final double? riskMultiplier;\n\n  Map<String, Object?> toJson() => {\n    'asOf': asOf.toUtc().toIso8601String(),\n    'riskLimit': riskLimit,\n    'riskConsumed': riskConsumed,\n    'riskAvailable': riskAvailable,\n    'openRisk': openRisk,\n    'pendingRisk': pendingRisk,\n    'ambiguousRisk': ambiguousRisk,\n    'reservedMargin': reservedMargin,\n    'spendableMargin': spendableMargin,\n    'accountFresh': accountFresh,\n    'allPositionsProtected': allPositionsProtected,\n    'liveExecutionAllowed': liveExecutionAllowed,\n    'blockReason': blockReason,\n    'currentEquity': currentEquity,\n    'peakEquity': peakEquity,\n    'drawdownFraction': drawdownFraction,\n    'drawdownTier': drawdownTier,\n    'riskMultiplier': riskMultiplier,\n  };\n\n  factory LocalLivePortfolioBudgetStatus.fromJson(Map<String, Object?> json) =>\n      LocalLivePortfolioBudgetStatus(\n        asOf:\n            DateTime.tryParse(json['asOf']?.toString() ?? '')?.toUtc() ??\n            DateTime.fromMillisecondsSinceEpoch(0, isUtc: true),\n        riskLimit: (json['riskLimit'] as num?)?.toDouble() ?? 0,\n        riskConsumed: (json['riskConsumed'] as num?)?.toDouble() ?? 0,\n        riskAvailable: (json['riskAvailable'] as num?)?.toDouble() ?? 0,\n        openRisk: (json['openRisk'] as num?)?.toDouble() ?? 0,\n        pendingRisk: (json['pendingRisk'] as num?)?.toDouble() ?? 0,\n        ambiguousRisk: (json['ambiguousRisk'] as num?)?.toDouble() ?? 0,\n        reservedMargin: (json['reservedMargin'] as num?)?.toDouble() ?? 0,\n        spendableMargin: (json['spendableMargin'] as num?)?.toDouble() ?? 0,\n        accountFresh: json['accountFresh'] == true,\n        allPositionsProtected: json['allPositionsProtected'] == true,\n        liveExecutionAllowed: json['liveExecutionAllowed'] == true,\n        blockReason: json['blockReason']?.toString() ?? 'unknown',\n        currentEquity: (json['currentEquity'] as num?)?.toDouble(),\n        peakEquity: (json['peakEquity'] as num?)?.toDouble(),\n        drawdownFraction: (json['drawdownFraction'] as num?)?.toDouble(),\n        drawdownTier: json['drawdownTier']?.toString(),\n        riskMultiplier: (json['riskMultiplier'] as num?)?.toDouble(),\n      );\n}\n"""
          replace_once(models, old_models, new_models)

          service = Path('src/client/quantara_app/lib/features/auto_trade/application/local_live_trade_service.dart')
          replace_once(
              service,
              """          final snapshot = await _portfolioGuard!.snapshot(\n            account: account,\n            allOpenPositionsProtected: allOpenPositionsProtected,\n            now: now,\n          );\n          _portfolioBudget = LocalLivePortfolioBudgetStatus(\n            asOf: now,\n            riskLimit: snapshot.dailyRisk.limit,\n            riskConsumed: snapshot.dailyRisk.consumed,\n            riskAvailable: snapshot.dailyRisk.available,\n            openRisk: snapshot.dailyRisk.openRisk,\n            pendingRisk: snapshot.dailyRisk.pendingRisk,\n            ambiguousRisk: snapshot.dailyRisk.ambiguousRisk,\n            reservedMargin: snapshot.margin.reservedMargin,\n            spendableMargin: snapshot.margin.spendable,\n            accountFresh: snapshot.accountFresh,\n            allPositionsProtected: snapshot.allPositionsProtected,\n            liveExecutionAllowed: snapshot.liveExecutionAllowed,\n            blockReason: snapshot.blockReason.name,\n          );\n""",
              """          final snapshot = await _portfolioGuard!.snapshot(\n            account: account,\n            allOpenPositionsProtected: allOpenPositionsProtected,\n            now: now,\n          );\n          final guardian = _portfolioGuard!.lastCapitalGuardianSnapshot;\n          _portfolioBudget = LocalLivePortfolioBudgetStatus(\n            asOf: now,\n            riskLimit: snapshot.dailyRisk.limit,\n            riskConsumed: snapshot.dailyRisk.consumed,\n            riskAvailable: snapshot.dailyRisk.available,\n            openRisk: snapshot.dailyRisk.openRisk,\n            pendingRisk: snapshot.dailyRisk.pendingRisk,\n            ambiguousRisk: snapshot.dailyRisk.ambiguousRisk,\n            reservedMargin: snapshot.margin.reservedMargin,\n            spendableMargin: snapshot.margin.spendable,\n            accountFresh: snapshot.accountFresh,\n            allPositionsProtected: snapshot.allPositionsProtected,\n            liveExecutionAllowed: snapshot.liveExecutionAllowed,\n            blockReason: snapshot.blockReason.name,\n            currentEquity: guardian?.currentEquity,\n            peakEquity: guardian?.peakEquity,\n            drawdownFraction: guardian?.drawdownFraction,\n            drawdownTier: guardian?.drawdownTier.name,\n            riskMultiplier: guardian?.riskMultiplier,\n          );\n""",
          )
          replace_once(
              service,
              """              liveExecutionAllowed: false,\n              blockReason: 'unmanagedExchangeExposure',\n            );\n""",
              """              liveExecutionAllowed: false,\n              blockReason: 'unmanagedExchangeExposure',\n              currentEquity: _portfolioBudget!.currentEquity,\n              peakEquity: _portfolioBudget!.peakEquity,\n              drawdownFraction: _portfolioBudget!.drawdownFraction,\n              drawdownTier: _portfolioBudget!.drawdownTier,\n              riskMultiplier: _portfolioBudget!.riskMultiplier,\n            );\n""",
          )

          ui = Path('src/client/quantara_app/lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart')
          replace_once(
              ui,
              """  String _t(String fa, String en) => _fa ? fa : en;\n\n  void _supervisorSetState(VoidCallback callback) => setState(callback);\n""",
              """  String _t(String fa, String en) => _fa ? fa : en;\n\n  String _drawdownTierLabel(String? tier) => switch (tier) {\n    'normal' => _t('عادی', 'Normal'),\n    'soft' => _t('کاهش ریسک', 'Risk reduced'),\n    'hardStop' => _t('توقف سخت', 'Hard stop'),\n    'recovery' => _t('بازیابی محدود', 'Controlled recovery'),\n    _ => _t('نامشخص', 'Unknown'),\n  };\n\n  Color _drawdownTierColor(String? tier) => switch (tier) {\n    'normal' => QuantaraColors.success,\n    'soft' => QuantaraColors.warning,\n    'hardStop' => QuantaraColors.danger,\n    'recovery' => QuantaraColors.violet,\n    _ => QuantaraColors.warning,\n  };\n\n  void _supervisorSetState(VoidCallback callback) => setState(callback);\n""",
          )
          old_risk = """              if (status.portfolioBudget != null)\n                StatusPill(\n                  label: _t(\n                    'ریسک آزاد ${status.portfolioBudget!.riskAvailable.toStringAsFixed(3)} / ${status.portfolioBudget!.riskLimit.toStringAsFixed(3)} USDT',\n                    'Risk free ${status.portfolioBudget!.riskAvailable.toStringAsFixed(3)} / ${status.portfolioBudget!.riskLimit.toStringAsFixed(3)} USDT',\n                  ),\n                  color: status.portfolioBudget!.ambiguousRisk > 0\n                      ? QuantaraColors.danger\n                      : status.portfolioBudget!.riskAvailable > 0\n                      ? QuantaraColors.cyan\n                      : QuantaraColors.warning,\n                ),\n"""
          new_risk = """              if (status.portfolioBudget?.currentEquity != null &&\n                  status.portfolioBudget?.peakEquity != null)\n                StatusPill(\n                  label: _t(\n                    'سرمایه ${status.portfolioBudget!.currentEquity!.toStringAsFixed(2)} · اوج ${status.portfolioBudget!.peakEquity!.toStringAsFixed(2)} USDT',\n                    'Equity ${status.portfolioBudget!.currentEquity!.toStringAsFixed(2)} · Peak ${status.portfolioBudget!.peakEquity!.toStringAsFixed(2)} USDT',\n                  ),\n                  color: QuantaraColors.cyan,\n                  icon: Icons.account_balance_wallet_outlined,\n                ),\n              if (status.portfolioBudget?.drawdownFraction != null &&\n                  status.portfolioBudget?.drawdownTier != null &&\n                  status.portfolioBudget?.riskMultiplier != null)\n                StatusPill(\n                  label: _t(\n                    'افت سرمایه ${(status.portfolioBudget!.drawdownFraction! * 100).toStringAsFixed(2)}% · ${_drawdownTierLabel(status.portfolioBudget!.drawdownTier)} · ضریب ریسک ×${status.portfolioBudget!.riskMultiplier!.toStringAsFixed(2)}',\n                    'Drawdown ${(status.portfolioBudget!.drawdownFraction! * 100).toStringAsFixed(2)}% · ${_drawdownTierLabel(status.portfolioBudget!.drawdownTier)} · risk ×${status.portfolioBudget!.riskMultiplier!.toStringAsFixed(2)}',\n                  ),\n                  color: _drawdownTierColor(status.portfolioBudget!.drawdownTier),\n                  icon: Icons.health_and_safety_outlined,\n                ),\n              if (status.portfolioBudget != null)\n                StatusPill(\n                  label: _t(\n                    'ریسک باز ${status.portfolioBudget!.openRisk.toStringAsFixed(3)} · آزاد ${status.portfolioBudget!.riskAvailable.toStringAsFixed(3)} / ${status.portfolioBudget!.riskLimit.toStringAsFixed(3)} USDT',\n                    'Open risk ${status.portfolioBudget!.openRisk.toStringAsFixed(3)} · Free ${status.portfolioBudget!.riskAvailable.toStringAsFixed(3)} / ${status.portfolioBudget!.riskLimit.toStringAsFixed(3)} USDT',\n                  ),\n                  color: status.portfolioBudget!.ambiguousRisk > 0\n                      ? QuantaraColors.danger\n                      : status.portfolioBudget!.riskAvailable > 0\n                      ? QuantaraColors.cyan\n                      : QuantaraColors.warning,\n                ),\n"""
          replace_once(ui, old_risk, new_risk)

          test = Path('src/client/quantara_app/test/local_live_capital_dashboard_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\nimport 'package:quantara_app/features/auto_trade/domain/local_live_trade_models.dart';\n\nvoid main() {\n  test('capital dashboard status round-trip preserves Guardian truth', () {\n    final value = LocalLivePortfolioBudgetStatus(\n      asOf: DateTime.utc(2026, 8, 23, 10),\n      riskLimit: 10,\n      riskConsumed: 4,\n      riskAvailable: 6,\n      openRisk: 3,\n      pendingRisk: 1,\n      ambiguousRisk: 0,\n      reservedMargin: 20,\n      spendableMargin: 80,\n      accountFresh: true,\n      allPositionsProtected: true,\n      liveExecutionAllowed: true,\n      blockReason: 'none',\n      currentEquity: 940,\n      peakEquity: 1000,\n      drawdownFraction: 0.06,\n      drawdownTier: 'soft',\n      riskMultiplier: 0.5,\n    );\n\n    final restored = LocalLivePortfolioBudgetStatus.fromJson(value.toJson());\n    expect(restored.currentEquity, 940);\n    expect(restored.peakEquity, 1000);\n    expect(restored.drawdownFraction, closeTo(0.06, 1e-12));\n    expect(restored.drawdownTier, 'soft');\n    expect(restored.riskMultiplier, 0.5);\n\n    final legacyJson = Map<String, Object?>.from(value.toJson())\n      ..remove('currentEquity')\n      ..remove('peakEquity')\n      ..remove('drawdownFraction')\n      ..remove('drawdownTier')\n      ..remove('riskMultiplier');\n    final legacy = LocalLivePortfolioBudgetStatus.fromJson(legacyJson);\n    expect(legacy.currentEquity, isNull);\n    expect(legacy.peakEquity, isNull);\n    expect(legacy.drawdownFraction, isNull);\n    expect(legacy.drawdownTier, isNull);\n    expect(legacy.riskMultiplier, isNull);\n  });\n\n  test('capital dashboard stays wired to the existing Local Live card', () {\n    final guard = File(\n      'lib/features/auto_trade/application/local_live_portfolio_execution_guard.dart',\n    ).readAsStringSync();\n    final service = File(\n      'lib/features/auto_trade/application/local_live_trade_service.dart',\n    ).readAsStringSync();\n    final ui = File(\n      'lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart',\n    ).readAsStringSync();\n\n    expect(\n      guard,\n      contains(\n        '_lastCapitalGuardianSnapshot = await _capitalGuardianMonitor.refresh',\n      ),\n    );\n    expect(service, contains('currentEquity: guardian?.currentEquity'));\n    expect(service, contains('drawdownTier: guardian?.drawdownTier.name'));\n    expect(ui, contains('سرمایه \\${status.portfolioBudget!.currentEquity!'));\n    expect(ui, contains('Equity \\${status.portfolioBudget!.currentEquity!'));\n    expect(ui, contains('افت سرمایه \\${'));\n    expect(ui, contains('Drawdown \\${'));\n    expect(ui, contains('openRisk.toStringAsFixed(3)'));\n  });\n}\n""")
          PY
      - name: Format changed Dart files
        working-directory: src/client/quantara_app
        run: |
          dart format \
            lib/features/auto_trade/application/local_live_portfolio_execution_guard.dart \
            lib/features/auto_trade/domain/local_live_trade_models.dart \
            lib/features/auto_trade/application/local_live_trade_service.dart \
            lib/features/owner_alpha/presentation/owner_alpha_auto_trade.dart \
            test/local_live_capital_dashboard_test.dart
      - name: Run focused tests
        working-directory: src/client/quantara_app
        run: |
          flutter pub get
          flutter test test/local_live_capital_guardian_monitor_test.dart test/local_live_capital_dashboard_test.dart
      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-106-capital-dashboard.yml
          git add src/client/quantara_app/lib src/client/quantara_app/test/local_live_capital_dashboard_test.dart
          git commit -m "feat(risk): surface live capital drawdown dashboard for #106"
          git push origin HEAD:feat/106-capital-dashboard
