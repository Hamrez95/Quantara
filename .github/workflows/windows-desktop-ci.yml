name: Windows desktop build

on:
  push:
    branches:
      - dev
      - 'feat/**'
      - 'release/**'
    paths:
      - 'src/client/quantara_app/**'
      - 'src/native/execution/**'
      - 'src/windows_service/**'
      - 'installer/windows/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/build-windows-service.ps1'
      - 'scripts/manage-windows-service.ps1'
      - 'scripts/install-windows-local.ps1'
      - 'tests/scripts/test_windows_one_click_install.py'
      - 'Quantara.ps1'
      - '.github/workflows/windows-desktop-ci.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/client/quantara_app/**'
      - 'src/native/execution/**'
      - 'src/windows_service/**'
      - 'installer/windows/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/build-windows-service.ps1'
      - 'scripts/manage-windows-service.ps1'
      - 'scripts/install-windows-local.ps1'
      - 'tests/scripts/test_windows_one_click_install.py'
      - 'Quantara.ps1'
      - '.github/workflows/windows-desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  RC_VERSION: 1.2.0-rc.3
  QUANTARA_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  QUANTARA_SERVICE_NAME: QuantaraExecutionService

jobs:
  windows:
    name: Generate, test, and compile Windows desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for Windows install contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test one-click Windows prerequisite and safety contract
        shell: pwsh
        run: python tests/scripts/test_windows_one_click_install.py -v

      - name: Validate Windows PowerShell launcher syntax
        shell: pwsh
        run: |
          foreach ($script in @('.\Quantara.ps1', '.\scripts\install-windows-local.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Build fail-closed Windows service host
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipTests

      - name: Test Windows service host
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter service

      - name: Test Windows read-only status client
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter client

      - name: Test Windows credential vault
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter credential

      - name: Test Windows status response
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter response

      - name: Test Windows authenticated session
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter session

      - name: Test Windows read-only listener
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter listener

      - name: Test Windows network recovery
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter network

      - name: Prepare existing service for upgrade
        shell: powershell
        run: ./scripts/manage-windows-service.ps1 -Action PrepareUpgrade

      - name: Install service in stopped state
        shell: powershell
        run: |
          $serviceExe = (Resolve-Path 'build/windows-service/Release/quantara_windows_service.exe').Path
          ./scripts/manage-windows-service.ps1 -Action Install -ServiceExe $serviceExe

      - name: Verify service is stopped
        shell: powershell
        run: |
          $query = & sc.exe query $env:QUANTARA_SERVICE_NAME 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Installed service cannot be queried: $($query -join ' ')"
          }
          if (($query -join "`n") -notmatch 'STATE\s*:\s*1\s+STOPPED') {
            throw "Installer lifecycle must leave the service stopped/disarmed. Actual: $($query -join ' ')"
          }

      - name: Verify service configuration
        shell: powershell
        run: |
          $serviceExe = (Resolve-Path 'build/windows-service/Release/quantara_windows_service.exe').Path
          $config = & sc.exe qc $env:QUANTARA_SERVICE_NAME 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Installed service configuration cannot be queried: $($config -join ' ')"
          }
          $configText = $config -join "`n"
          if ($configText -notmatch 'START_TYPE\s*:\s*2\s+AUTO_START') {
            throw "Service is not configured for automatic boot startup. Actual: $configText"
          }
          if ($configText -notmatch [regex]::Escape($serviceExe)) {
            throw "Service executable path does not match the packaged host. Expected: $serviceExe Actual: $configText"
          }

      - name: Smoke authenticated read-only service status
        shell: powershell
        run: |
          $service = Get-Service -Name $env:QUANTARA_SERVICE_NAME -ErrorAction Stop
          Start-Service -Name $env:QUANTARA_SERVICE_NAME
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(15))

          $clientExe = (Resolve-Path 'build/windows-service/Release/quantara_windows_service_client.exe').Path
          $raw = & $clientExe --status
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticated Windows status client failed with exit code $LASTEXITCODE."
          }
          $snapshot = $raw | ConvertFrom-Json
          if ($snapshot.protocolVersion -ne 1 -or $snapshot.kind -ne 'statusSnapshot') {
            throw "Unexpected Windows service status protocol response: $raw"
          }
          if ($snapshot.payload.serviceState -ne 'disarmed' -or $snapshot.payload.entryAuthority -ne $false) {
            throw "Windows service did not start fail-closed: $raw"
          }

          Stop-Service -Name $env:QUANTARA_SERVICE_NAME
          $service.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(15))

      - name: Remove service after lifecycle smoke
        if: always()
        shell: powershell
        run: ./scripts/manage-windows-service.ps1 -Action Uninstall

      - name: Verify service removal
        if: always()
        shell: powershell
        run: |
          $service = Get-Service -Name $env:QUANTARA_SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            throw "Service remained registered after uninstall smoke with state $($service.Status)."
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display tool versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          cmake --version

      - name: Restore Flutter packages for profiling
        shell: pwsh
        working-directory: src/client/quantara_app
        run: flutter pub get

      - name: Run Windows hot-path software profiling
        shell: pwsh
        working-directory: src/client/quantara_app
        run: >-
          dart run tool/hot_path_benchmark.dart
          --output hot-path-performance-windows.json
          --build-commit "$env:QUANTARA_BUILD_COMMIT"

      - name: Build native Windows release candidate
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -GenerateRunner -PackageZip

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler is unavailable after installation.'
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Build unsigned internal installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $buildRoot = (Resolve-Path 'src/client/quantara_app/build/windows/x64/runner/Release').Path
          $serviceBuildRoot = (Resolve-Path 'build/windows-service/Release').Path
          $outputDir = Join-Path $PWD 'dist/windows'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc "/DMyAppVersion=$env:RC_VERSION" "/DMyAppBuildRoot=$buildRoot" "/DMyServiceBuildRoot=$serviceBuildRoot" "/DMyOutputDir=$outputDir" 'installer/windows/Quantara.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = Get-ChildItem -Path $outputDir -Filter 'QuantaraSetup-*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Unsigned Windows installer was not produced.'
          }
          Write-Host "Installer: $($installer.FullName)"

      - name: Smoke packaged Windows installer install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'dist/windows' -Filter 'QuantaraSetup-*.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Packaged Windows installer was not found for install smoke.'
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CLOSEAPPLICATIONS'
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Packaged Windows installer failed with exit code $($install.ExitCode)."
          }

          $appExe = Join-Path $env:ProgramFiles 'Quantara\quantara_app.exe'
          $serviceExe = Join-Path $env:ProgramFiles 'Quantara\service\quantara_windows_service.exe'
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "Installed Quantara app was not found: $appExe"
          }
          if (-not (Test-Path -LiteralPath $serviceExe -PathType Leaf)) {
            throw "Installed Quantara service was not found: $serviceExe"
          }

          $service = Get-Service -Name $env:QUANTARA_SERVICE_NAME -ErrorAction Stop
          $service.Refresh()
          if ($service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Stopped) {
            throw "Packaged installer must leave the service STOPPED/disarmed, got $($service.Status)."
          }

          $config = & sc.exe qc $env:QUANTARA_SERVICE_NAME 2>&1
          if ($LASTEXITCODE -ne 0 -or (($config -join [Environment]::NewLine) -notmatch [regex]::Escape($serviceExe))) {
            throw "Installed service configuration does not point at the packaged host: $($config -join ' ')"
          }

          $uninstaller = Join-Path $env:ProgramFiles 'Quantara\unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Quantara uninstaller was not found: $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Quantara uninstall smoke failed with exit code $($uninstall.ExitCode)."
          }

          Start-Sleep -Seconds 1
          if ($null -ne (Get-Service -Name $env:QUANTARA_SERVICE_NAME -ErrorAction SilentlyContinue)) {
            throw 'Quantara service remained registered after packaged uninstall smoke.'
          }

      - name: Upload Windows release candidate and profiling evidence
        uses: actions/upload-artifact@v4
        with:
          name: quantara-windows-${{ env.RC_VERSION }}
          path: |
            dist/windows/quantara-windows-release.zip
            dist/windows/QuantaraSetup-*.exe
            build/windows-service/Release/quantara_windows_service.exe
            build/windows-service/Release/quantara_windows_service_client.exe
            src/client/quantara_app/hot-path-performance-windows.json
          if-no-files-found: error
          retention-days: 14
