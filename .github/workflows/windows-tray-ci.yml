name: Windows tray status monitor

on:
  push:
    branches:
      - dev
      - 'feat/**'
      - 'release/**'
    paths:
      - 'src/windows_service/**'
      - 'scripts/build-windows-service.ps1'
      - '.github/workflows/windows-tray-ci.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/windows_service/**'
      - 'scripts/build-windows-service.ps1'
      - '.github/workflows/windows-tray-ci.yml'

permissions:
  contents: read

concurrency:
  group: windows-tray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tray:
    name: Build and test read-only Windows tray
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native Windows service payload
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipTests

      - name: Test fail-closed tray status monitor
        shell: pwsh
        run: ./scripts/build-windows-service.ps1 -Configuration Release -SkipBuild -TestFilter tray
