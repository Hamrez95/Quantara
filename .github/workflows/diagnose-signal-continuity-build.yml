name: Validate signal continuity release build

on:
  push:
    branches:
      - feat/89-91-signal-continuity
    paths:
      - .github/workflows/diagnose-signal-continuity-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/89-91-signal-continuity
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - id: pub
        name: Resolve dependencies
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter pub get

      - id: apk
        name: Build release APK
        continue-on-error: true
        working-directory: src/client/quantara_app
        run: flutter build apk --release

      - name: Persist release build result
        if: always()
        run: |
          mkdir -p docs/validation
          cat > docs/validation/signal-continuity-release-build.md <<EOF
          # Signal continuity release build

          - Source commit: \`${GITHUB_SHA}\`
          - Flutter: 3.44.8 stable
          - pub get: \`${{ steps.pub.outcome }}\`
          - release APK: \`${{ steps.apk.outcome }}\`
          EOF
          rm -f .github/workflows/diagnose-signal-continuity-build.yml
          rm -f .github/workflows/validate-signal-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: record signal continuity release build"
          git pull --rebase origin feat/89-91-signal-continuity
          git push origin HEAD:feat/89-91-signal-continuity

      - name: Fail when release build failed
        if: always()
        run: |
          test "${{ steps.pub.outcome }}" = success
          test "${{ steps.apk.outcome }}" = success
