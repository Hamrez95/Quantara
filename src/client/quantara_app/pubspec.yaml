name: quantara_app
description: Quantara explainable market research and guarded trading cockpit.
publish_to: 'none'
# Quantara 1.2.0 release candidate. Stable publication remains gated by physical-device, upgrade and permanent-signing validation.
version: 1.2.0-rc.1+120

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  crypto_icons: ^1.0.0
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.2.0
  flutter_foreground_task: ^10.0.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: CryptocurrencyIcons
      fonts:
        - asset: assets/fonts/cryptocurrency-icons.ttf
