name: quantara_app
description: Quantara explainable market research and guarded trading cockpit.
publish_to: 'none'
# Quantara 1.2.0 release candidate. Stable publication remains gated by physical-device, upgrade and permanent-signing validation.
version: 1.2.0-rc.3+126

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  crypto_icons: ^1.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  sqlite3: ^3.1.6
  sqlite3_flutter_libs: ^0.5.41
  workmanager: ^0.9.0+3
  path: ^1.9.1
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
